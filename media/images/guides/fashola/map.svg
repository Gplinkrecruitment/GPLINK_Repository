<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-label="From Perth CBD, the clinic is 40 minutes by train or 35 by car" font-size="13" font-family="Figtree, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<text x="24" y="28" font-size="15" font-weight="600" fill="#14324c">From Perth CBD, the clinic is 40 minutes by train or 35 by car</text>
<text x="24" y="46" font-size="11.5" fill="#64829b">Minutes in each box are the off-peak drive to the clinic. North is up; the map is schematic, not to scale.</text>
<g><path d="M50 62C40 150 62 240 50 330S42 520 52 650" fill="none" stroke="#94a3b8" stroke-width="1.25"/><text x="34" y="360" font-size="11.5" fill="#64829b" transform="rotate(-90 34 360)">Indian Ocean</text></g>
