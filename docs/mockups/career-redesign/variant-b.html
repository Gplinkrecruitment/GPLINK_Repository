<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career — Variant B · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563eb; --blue-deep:#1d4ed8; --blue-soft:#eff4ff; --blue-border:#d6e2fb; --sky:#4eb7f5;
  --ink:#0f172a; --text:#1f2b43; --muted:#64748b; --faint:#94a3b8;
  --border:#e3e9f4; --border-strong:#cbd7ea;
  --canvas:#f4f6fb; --surface:#fff; --sunken:#f8fafd;
  --navy0:#0b1322; --navy1:#14203a; --navy2:#0e1a30;
  --green:#16a34a; --green-soft:#eafaf0; --green-border:#c5ecd4; --green-ink:#166534;
  --amber-soft:#fdf3e1; --amber-ink:#92400e; --amber-border:#f4ddb0;
  --serif:"Source Serif 4",Georgia,serif; --sans:"DM Sans",-apple-system,sans-serif;
  --r-md:14px; --r-lg:18px; --r-xl:24px;
  --sh-sm:0 1px 2px rgba(15,23,42,.05),0 2px 10px -4px rgba(15,23,42,.08);
  --sh-md:0 10px 30px -18px rgba(15,23,42,.28);
  --sh-lg:0 24px 55px -24px rgba(2,6,23,.42);
  --ease:cubic-bezier(.22,.61,.21,1);
  --nav-clear:70px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--canvas);color:var(--text);font-size:15px;line-height:1.5;padding-bottom:calc(var(--nav-clear) + 24px)}
button{font-family:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:fadeUp .5s var(--ease) both}
.rv1{animation-delay:.04s}.rv2{animation-delay:.1s}.rv3{animation-delay:.16s}.rv4{animation-delay:.22s}

/* ————— Navy masthead ————— */
.mast{position:relative;background:linear-gradient(160deg,var(--navy0) 0%,var(--navy1) 55%,var(--navy2) 100%);color:#fff;padding:30px 0 58px;overflow:hidden}
.mast::before{content:"";position:absolute;right:-140px;top:-120px;width:420px;height:420px;background:radial-gradient(circle,rgba(78,183,245,.24),transparent 65%)}
.mast::after{content:"";position:absolute;left:-80px;bottom:-160px;width:340px;height:340px;background:radial-gradient(circle,rgba(37,99,235,.28),transparent 60%)}
.mast .wrap{position:relative;z-index:2}
.eyeb{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);display:flex;align-items:center;gap:8px}
.eyeb::before{content:"";width:16px;height:2px;background:var(--sky)}
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5.6vw,34px);letter-spacing:-.015em;line-height:1.15;margin-top:10px}
.mast .sub{color:#c2dbff;font-size:14px;margin-top:7px}
.stats{display:flex;gap:22px;margin-top:18px}
.stat b{font-family:var(--serif);font-size:22px;font-weight:700;display:block;letter-spacing:-.01em}
.stat span{font-size:11px;color:#9dc0f0;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* search floats over the seam */
.searchdock{position:relative;z-index:10;margin-top:-26px}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.6);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh-lg)}
.search svg{flex:none;color:var(--faint)}
.search input{border:0;outline:0;font:inherit;width:100%;color:var(--ink);background:none}
.search input::placeholder{color:var(--faint)}

/* segmented filters */
.filters{position:sticky;top:0;z-index:30;background:linear-gradient(var(--canvas) 82%,rgba(244,246,251,0));padding:12px 0 8px}
.seg{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:7px 13px;border-radius:10px;transition:all .16s var(--ease);display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px rgba(37,99,235,.6)}
.seg .cnt{font-size:10.5px;background:rgba(100,116,139,.12);border-radius:999px;padding:1px 6px}
.seg button.on .cnt{background:rgba(255,255,255,.22)}

/* ————— List cards (horizontal) ————— */
.list{display:grid;gap:12px;padding-top:6px}
.row{display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;box-shadow:var(--sh-sm);cursor:pointer;position:relative;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.row:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.thumb{flex:none;width:104px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(140deg,#16233f,#0b1322);align-self:stretch;min-height:104px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .st{position:absolute;left:6px;top:6px;background:rgba(11,19,34,.72);backdrop-filter:blur(4px);color:#cfe0ff;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 7px;z-index:2}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column}
.rtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.t{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:999px}
.t.dpa{background:var(--green-soft);color:var(--green-ink);border:1px solid var(--green-border)}
.t.bil{background:var(--blue-soft);color:var(--blue-deep);border:1px solid var(--blue-border)}
.t.bon{background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-border)}
.rtitle{font-family:var(--serif);font-weight:600;font-size:16.5px;color:var(--ink);line-height:1.25;letter-spacing:-.005em}
.rloc{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.rfoot{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:7px}
.minivault{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.minivault .mlock{flex:none;color:var(--faint)}
.minivault .mblur{flex:1;max-width:110px;height:9px;border-radius:4px;background:repeating-linear-gradient(90deg,#c9d4e8 0 22px,#dde5f3 22px 34px,#c9d4e8 34px 58px);filter:blur(3px);opacity:.85}
.minivault em{font-size:10px;color:var(--faint);font-style:normal;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.rsave{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--faint);border:1px solid var(--border);background:var(--surface);transition:all .16s var(--ease)}
.rsave.on{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-border)}
.rapplied{position:absolute;top:-7px;right:12px;background:var(--green);color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;box-shadow:var(--sh-sm)}
.empty{padding:56px 18px;text-align:center;color:var(--muted)}
.empty b{font-family:var(--serif);font-size:18px;color:var(--ink);display:block;margin-bottom:5px}

/* ————— Detail ————— */
.detail{display:none}
body.md .browse{display:none}
body.md .detail{display:block}
.dmast{position:relative;background:linear-gradient(160deg,var(--navy0),var(--navy1) 60%,var(--navy2));color:#fff;padding:14px 0 74px;overflow:hidden}
.dmast::before{content:"";position:absolute;right:-120px;top:-100px;width:380px;height:380px;background:radial-gradient(circle,rgba(78,183,245,.22),transparent 62%)}
.dmast .wrap{position:relative;z-index:2}
.dback{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:#cfe0ff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dt{font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#e5efff}
.dt.dpa{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:#a7f3c7}
.dmast h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,5.4vw,31px);letter-spacing:-.015em;line-height:1.17;margin-top:12px}
.dmast .dloc{color:#c2dbff;font-size:13.5px;margin-top:6px;display:flex;align-items:center;gap:6px}
.dphotowrap{position:relative;z-index:11;margin-top:-58px}
.dphoto{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-lg);aspect-ratio:16/8.4;background:#16233f}
.dphoto img{width:100%;height:100%;object-fit:cover}
.dphoto figcaption{position:absolute;left:12px;bottom:11px;background:rgba(11,19,34,.68);backdrop-filter:blur(6px);color:#e5efff;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.dcontent{padding-top:18px}
/* earnings banner */
.earnrow{display:flex;gap:10px}
.earnrow .cell{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh-sm)}
.cell b{font-family:var(--serif);font-size:17px;color:var(--ink);display:block;letter-spacing:-.01em;line-height:1.3}
.cell span{font-size:10.5px;color:var(--faint);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sech{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:24px 0 11px;display:flex;align-items:center;gap:10px}
.sech::after{content:"";flex:1;height:1px;background:var(--border)}
.intro{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);font-size:14.5px}
.intro em{font-family:var(--serif)}
.bene{display:grid;gap:9px}
.bene li{list-style:none;display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 13px;font-size:13.5px}
.bene .bi{flex:none;width:24px;height:24px;border-radius:8px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center}
/* vault — full banner */
.vault{position:relative;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(120deg,#0c2e66 0%,#0d5ee0 55%,#2b8ef0 100%);color:#fff;box-shadow:var(--sh-md)}
.vault::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(255,255,255,.22),transparent 45%)}
.vshine{position:absolute;top:0;bottom:0;width:70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 3.6s var(--ease) infinite}
@keyframes sweep{0%{left:-90px}55%,100%{left:110%}}
.vault-in{position:relative;padding:18px;display:flex;gap:13px;align-items:center}
.vlock{flex:none;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.vname{height:15px;border-radius:5px;max-width:220px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.65) 0 38px,rgba(255,255,255,.35) 38px 55px,rgba(255,255,255,.65) 55px 100px);filter:blur(4.5px);margin-bottom:8px}
.vcap{font-size:12.5px;color:#d6e7ff;line-height:1.45}
.vcap b{color:#fff}
.vault.shake{animation:vshake .4s var(--ease)}
@keyframes vshake{0%,100%{transform:none}25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
/* video */
.video{display:flex;gap:13px;align-items:center;background:var(--navy0);border-radius:var(--r-lg);padding:13px;color:#fff;cursor:pointer;box-shadow:var(--sh-md)}
.vthumb{flex:none;width:100px;aspect-ratio:16/10;border-radius:11px;overflow:hidden;position:relative}
.vthumb img{width:100%;height:100%;object-fit:cover;opacity:.62}
.vplay{position:absolute;inset:0;display:grid;place-items:center}
.vplay span{width:32px;height:32px;border-radius:999px;background:#fff;display:grid;place-items:center;color:var(--navy0)}
.video h4{font-size:14px;font-weight:700}
.video p{font-size:12px;color:#9dc0f0;margin-top:2px}
/* map */
.maphint{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);aspect-ratio:16/6.6;background:
 radial-gradient(circle at 50% 50%,rgba(37,99,235,.15),rgba(37,99,235,.04) 44%,transparent 62%),
 repeating-linear-gradient(0deg,#eef2f9 0 24px,#e8edf7 24px 25px),
 repeating-linear-gradient(90deg,#eef2f9 0 24px,#e8edf7 24px 25px)}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ring{width:64px;height:64px;border-radius:999px;border:2px dashed rgba(37,99,235,.5);display:grid;place-items:center;animation:pulse 2.6s var(--ease) infinite}
.dot{width:13px;height:13px;border-radius:999px;background:var(--blue);box-shadow:0 0 0 5px rgba(37,99,235,.18)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14);opacity:.55}}
.maphint figcaption{position:absolute;left:11px;bottom:9px;font-size:11.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.88);border-radius:999px;padding:4px 10px}
/* rso strip */
.rso{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg);padding:14px 15px}
.rso .ava{flex:none;width:38px;height:38px;border-radius:999px;background:linear-gradient(135deg,#2e6bf0,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.rso p{font-size:13px}
.rso b{color:var(--ink)}
/* apply bar */
.applybar{position:fixed;left:0;right:0;bottom:var(--nav-clear);z-index:50;padding:10px 16px 12px;background:linear-gradient(rgba(244,246,251,0),var(--canvas) 45%);display:none}
body.md .applybar{display:block}
.applybar .in{max-width:720px;margin:0 auto;display:flex;gap:9px}
.btn-apply{flex:1;background:linear-gradient(135deg,#2e6bf0,#1d4ed8);color:#fff;font-weight:800;font-size:15.5px;border-radius:var(--r-md);padding:15px;box-shadow:0 12px 28px -12px rgba(37,99,235,.55);transition:transform .16s var(--ease)}
.btn-apply:active{transform:scale(.98)}
.btn-apply.done{background:var(--green)}
.btn-save2{flex:none;width:52px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center}
.btn-save2.on{color:var(--blue);border-color:var(--blue-border);background:var(--blue-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--nav-clear) + 82px);z-index:80;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:11px 17px;border-radius:999px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .34s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.navmock{position:fixed;left:0;right:0;bottom:0;height:var(--nav-clear);background:rgba(255,255,255,.92);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid var(--border);display:flex;z-index:60}
.navmock button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint)}
.navmock button.on{color:var(--blue)}
</style>
</head>
<body>

<!-- ═══════ BROWSE ═══════ -->
<div class="browse">
  <header class="mast">
    <div class="wrap rv rv1">
      <div class="eyeb">Career · Live openings</div>
      <h1>Your next practice,<br>matched to you.</h1>
      <p class="sub">Confidential roles across Australia — vetted, DPA-checked, negotiated for you.</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <div class="wrap">
    <div class="searchdock rv rv2">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="q" type="search" placeholder="Search suburb, region or billing type…">
      </label>
    </div>
    <div class="filters rv rv3"><div class="seg" id="seg"></div></div>
    <main class="list" id="list"></main>
    <div class="empty" id="empty" style="display:none"><b>Nothing here — yet.</b>Many roles are matched privately before listing. Ask your RSO for a shortlist.</div>
  </div>
</div>

<!-- ═══════ DETAIL ═══════ -->
<div class="detail">
  <header class="dmast"><div class="wrap">
    <button class="dback" onclick="go('')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>All roles</button>
    <div id="dhead"></div>
  </div></header>
  <div class="wrap">
    <div class="dphotowrap rv rv1" id="dphoto"></div>
    <div class="dcontent" id="dbody"></div>
  </div>
</div>

<div class="applybar"><div class="in">
  <button class="btn-save2" id="dSave"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
  <button class="btn-apply" id="dApply">Apply — your RSO reviews first</button>
</div></div>

<div class="toast" id="toast"></div>

<nav class="navmock">
  <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Home</button>
  <button class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Career</button>
  <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Documents</button>
  <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Account</button>
</nav>

<script>
const S={jobs:[],f:'All',q:'',saved:new Set(JSON.parse(localStorage.vb_saved||'[]')),applied:new Set(JSON.parse(localStorage.vb_applied||'[]')),cur:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json').then(r=>r.json()).then(d=>{S.jobs=d;init()});
const stateOf=j=>(j.state||'').match(/NSW|New South/i)?'NSW':(j.state||'').match(/VIC|Victoria/i)?'VIC':(j.state||'').match(/QLD|Queensland/i)?'QLD':(j.state||'').match(/WA|Western/i)?'WA':'AU';
const suburbOf=j=>{const m=(j.title||'').match(/^(?:Non-)?DPA - ([^-]+?)(?: -|$)/);return m?m[1].trim():(j.suburb||'')};

function init(){
  const dpaN=S.jobs.filter(j=>j.dpa).length, states=new Set(S.jobs.map(stateOf));
  $('#stats').innerHTML=`<div class="stat"><b>${S.jobs.length}</b><span>Live roles</span></div>
    <div class="stat"><b>${dpaN}</b><span>DPA approved</span></div>
    <div class="stat"><b>${states.size}</b><span>States</span></div>`;
  paintSeg();
  $('#q').oninput=e=>{S.q=e.target.value.toLowerCase();render()};
  render();route();
}
function segCounts(){
  const c={All:S.jobs.length,Saved:S.saved.size};
  for(const st of ['NSW','VIC','QLD','WA'])c[st]=S.jobs.filter(j=>stateOf(j)===st).length;
  for(const b of ['Bulk Billing','Mixed Billing','Private Billing'])c[b]=S.jobs.filter(j=>j.billing===b).length;
  return c;
}
function paintSeg(){
  const c=segCounts();
  const F=['All','NSW','VIC','QLD','WA','Bulk Billing','Mixed Billing','Private Billing','Saved'];
  $('#seg').innerHTML=F.map(f=>`<button class="${f===S.f?'on':''}" data-f="${f}">${f==='Saved'?'♥ Saved':f}<span class="cnt">${c[f]||0}</span></button>`).join('');
  $('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.f=b.dataset.f;paintSeg();render()};
}
function filtered(){
  return S.jobs.map((j,i)=>i).filter(i=>{const j=S.jobs[i];
    if(S.f==='Saved'&&!S.saved.has(i))return false;
    if(/Billing/.test(S.f)&&j.billing!==S.f)return false;
    if(/^(NSW|VIC|QLD|WA)$/.test(S.f)&&stateOf(j)!==S.f)return false;
    if(S.q&&!((j.title||'')+' '+(j.loc||'')).toLowerCase().includes(S.q))return false;
    return true});
}
function render(){
  const idx=filtered();
  $('#empty').style.display=idx.length?'none':'block';
  $('#list').innerHTML=idx.map((i,k)=>{const j=S.jobs[i];return `
  <article class="row rv rv${Math.min(k+1,4)}" onclick="go('job/${i}')">
    ${S.applied.has(i)?'<span class="rapplied">✓ APPLIED</span>':''}
    <div class="thumb"><span class="st">${stateOf(j)}</span><img src="${esc(j.hero)}" loading="lazy" onerror="this.remove()"></div>
    <div class="rbody">
      <div class="rtags">
        ${j.dpa?'<span class="t dpa">DPA</span>':''}
        ${j.billing?`<span class="t bil">${esc(j.billing.replace(' Billing',''))}</span>`:''}
        ${j.earnings?`<span class="t bon">${esc(j.earnings.length>20?j.earnings.slice(0,18)+'…':j.earnings)}</span>`:''}
      </div>
      <h2 class="rtitle">General Practice · ${esc(suburbOf(j))}</h2>
      <p class="rloc"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>${esc(j.loc)}</p>
      <div class="rfoot">
        <span class="minivault">
          <span class="mlock"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
          <span class="mblur"></span><em>ON ACCEPTANCE</em>
        </span>
        <button class="rsave${S.saved.has(i)?' on':''}" onclick="event.stopPropagation();toggleSave(${i})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${S.saved.has(i)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </div>
  </article>`}).join('');
}
function toggleSave(i){S.saved.has(i)?S.saved.delete(i):S.saved.add(i);localStorage.vb_saved=JSON.stringify([...S.saved]);paintSeg();render();if(S.cur===i)paintApply();toast(S.saved.has(i)?'Saved ♥':'Removed')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2100)}
function go(h){location.hash=h}
addEventListener('hashchange',route);
function route(){
  const m=location.hash.match(/^#job\/(\d+)/);
  if(m&&S.jobs[+m[1]]){S.cur=+m[1];renderDetail(S.jobs[S.cur]);document.body.classList.add('md');scrollTo(0,0)}
  else{S.cur=null;document.body.classList.remove('md')}
}
function renderDetail(j){
  const bene=(j.benefits||[]).slice(0,3);
  $('#dhead').innerHTML=`
    <div class="dtags">
      ${j.dpa?'<span class="dt dpa">✓ DPA approved</span>':''}
      ${j.billing?`<span class="dt">${esc(j.billing)}</span>`:''}
      <span class="dt">Permanent</span>
    </div>
    <h1>General Practice in ${esc(suburbOf(j))}</h1>
    <p class="dloc"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>${esc(j.loc)}</p>`;
  $('#dphoto').innerHTML=`<figure class="dphoto"><img src="${esc(j.hero)}" onerror="this.remove()"><figcaption>🔒 Confidential listing · area preview</figcaption></figure>`;
  $('#dbody').innerHTML=`
    ${j.earnings?`<div class="sech">The package</div>
    <div class="earnrow rv rv2">
      <div class="cell"><span>Headline</span><b>${esc(j.earnings)}</b></div>
      <div class="cell"><span>Structure</span><b>% of billings</b></div>
    </div>`:''}
    <div class="sech">About the role</div>
    <div class="intro rv rv2">${esc(j.intro||'A well-established practice partnered with GP Link. Structured onboarding, supportive team, and a stable patient base.')} <em>Full profile unlocks as your application progresses.</em></div>
    <div class="sech">Why GPs choose it</div>
    <ul class="bene rv rv3">${bene.map(b=>`<li><span class="bi"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span>${esc(b)}</li>`).join('')||'<li><span class="bi">✓</span>Structured onboarding and stable patient base.</li>'}</ul>
    <div class="sech">The practice</div>
    <div class="vault rv rv3" onclick="this.classList.remove('shake');void this.offsetWidth;this.classList.add('shake');toast('Unlocks when your application is accepted')">
      <span class="vshine"></span>
      <div class="vault-in">
        <span class="vlock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
        <div style="flex:1;min-width:0">
          <div class="vname"></div>
          <p class="vcap"><b>Identity protected while you decide.</b> Name, address &amp; team revealed the moment you're <b>accepted</b> — it keeps matching fair for you and the practice.</p>
        </div>
      </div>
    </div>
    <div class="sech">Meet them on video</div>
    <div class="video rv rv4" onclick="toast('Intro video plays here in the app')">
      <span class="vthumb"><img src="${esc(j.hero)}" onerror="this.remove()"><span class="vplay"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></span></span>
      <div><h4>Practice introduction · 2 min</h4><p>The team, the patient mix, your typical week — identity kept private.</p></div>
    </div>
    <div class="sech">The area</div>
    <figure class="maphint rv rv4">
      <span class="pin"><span class="ring"><span class="dot"></span></span></span>
      <figcaption>${esc(suburbOf(j))} area — exact address on acceptance</figcaption>
    </figure>
    <div class="sech">In your corner</div>
    <div class="rso rv rv4">
      <span class="ava">RS</span>
      <p><b>Your RSO reviews before the practice sees it</b> — and negotiates your terms. Free for doctors, always.</p>
    </div>`;
  paintApply();
}
function paintApply(){
  const i=S.cur;if(i==null)return;
  const a=$('#dApply'),s=$('#dSave');
  if(S.applied.has(i)){a.textContent='✓ Submitted — RSO reviewing';a.classList.add('done')}
  else{a.textContent='Apply — your RSO reviews first';a.classList.remove('done')}
  s.className='btn-save2'+(S.saved.has(i)?' on':'');
  a.onclick=()=>{if(S.applied.has(i))return toast('Already in — hang tight');
    S.applied.add(i);localStorage.vb_applied=JSON.stringify([...S.applied]);paintApply();render();toast('Sent ✓ Your RSO will be in touch')};
  s.onclick=()=>toggleSave(i);
}
</script>
</body>
</html>
