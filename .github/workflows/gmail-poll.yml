name: Gmail Poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll Gmail for new emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET not set — skipping"
            exit 0
          fi
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "https://app.mygplink.com.au/api/cron/process-gmail" || echo "Poll failed"
