name: Deploy to Vercel
# DISABLED: Deploy hook redeploys stale commits. Use Vercel CLI instead.
# See docs/deployment-pathway.md for the correct deploy process.
on:
  workflow_dispatch:  # Manual trigger only — do NOT re-enable push trigger

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set. Use Vercel CLI instead."
            exit 0
          fi
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
