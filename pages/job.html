  <style>
    /* ════════════════════════════════════════════════════════════════════
       ATLAS DETAIL LAYER (Phase 2 Task 3)
       Job detail experience per docs/mockups/career-redesign/variant-b.html
       (the detail/pre-offer view). Shares the visual system with the Atlas
       browse layer in pages/career.html: same at-* tokens, same scenery
       motif, same DM Sans + Source Serif 4 pairing.
       ════════════════════════════════════════════════════════════════════ */
    :root {
      --at-navy0: #0b1322;
      --at-navy1: #14203a;
      --at-navy2: #0e1a30;
      --at-sky: #4eb7f5;
      --at-ease: cubic-bezier(.22, .61, .21, 1);
    }

    :focus-visible { outline: none; box-shadow: var(--gp-focus-ring); }
    button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--gp-font-body, "DM Sans", -apple-system, sans-serif);
      background: var(--gp-canvas, #f4f6fb);
      color: var(--gp-text, #1f2b43);
      font-size: 15px;
      line-height: 1.5;
      padding: 0;
    }
    button, input { font: inherit; }
    img { display: block; max-width: 100%; }

    @keyframes atFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .at-rv { animation: atFadeUp .46s var(--at-ease) both; }
    .at-rv1 { animation-delay: .04s; }
    .at-rv2 { animation-delay: .09s; }
    .at-rv3 { animation-delay: .14s; }
    .at-rv4 { animation-delay: .19s; }

    /* ── Detail masthead (navy) ── */
    .at-dmast {
      position: relative;
      background: linear-gradient(160deg, var(--at-navy0), var(--at-navy1) 60%, var(--at-navy2));
      color: #fff;
      padding: 14px 0 70px;
      overflow: hidden;
    }
    .at-dmast::before {
      content: "";
      position: absolute;
      right: -120px;
      top: -100px;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(78, 183, 245, .2), transparent 63%);
    }
    .at-dmast--revealed::before { background: radial-gradient(circle, rgba(34, 197, 94, .28), transparent 60%); }
    .at-dwrap { max-width: 720px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 2; }
    .at-dnav { display: flex; align-items: center; gap: 8px; }
    .at-dback {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      color: #cfe0ff;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      padding: 8px 14px;
      text-decoration: none;
      cursor: pointer;
      transition: background .16s var(--at-ease);
    }
    .at-dback:hover { background: rgba(255, 255, 255, .16); }
    .at-dback svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .at-dshare {
      margin-left: auto;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      cursor: pointer;
      display: grid;
      place-items: center;
      color: #cfe0ff;
      transition: background .16s var(--at-ease);
    }
    .at-dshare:hover { background: rgba(255, 255, 255, .16); }
    .at-dshare svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .at-dhtags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; align-items: center; }
    .at-dpill {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .03em;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(34, 197, 94, .16);
      border: 1px solid rgba(34, 197, 94, .36);
      color: #a7f3c7;
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }
    .at-dpill svg { width: 11px; height: 11px; }
    .at-dmeta { color: #c2dbff; font-size: 12.5px; font-weight: 600; }
    .at-dtitle {
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-weight: 700;
      font-size: clamp(23px, 5.2vw, 30px);
      letter-spacing: -.015em;
      line-height: 1.18;
      margin: 12px 0 0;
      color: #fff;
    }
    .at-dloc { color: #c2dbff; font-size: 13.5px; margin: 6px 0 0; display: flex; align-items: center; gap: 6px; }
    .at-dloc svg { flex: none; }

    /* ── Content column ── */
    .at-dcontent {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px calc(160px + env(safe-area-inset-bottom, 0px) + var(--gp-shell-bottom-clearance, 0px));
    }

    /* ── Hero photo / scenery (overlaps the masthead) ── */
    .at-dphotowrap { position: relative; z-index: 11; margin-top: -54px; }
    .at-dphoto {
      position: relative;
      margin: 0;
      border-radius: var(--gp-r-xl, 24px);
      overflow: hidden;
      box-shadow: var(--gp-shadow-lg);
      aspect-ratio: 16/8.2;
      background: var(--at-navy1);
    }
    .at-dphoto-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .at-dphoto figcaption {
      position: absolute;
      left: 12px;
      bottom: 11px;
      z-index: 3;
      background: rgba(11, 19, 34, .66);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e5efff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .at-dphoto figcaption svg { flex: none; }

    /* Photo-less scenery motif — identical to career.html's .at-scene */
    .at-scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 78% 12%, rgba(78, 183, 245, .16), transparent 55%),
        linear-gradient(158deg, var(--at-navy1), var(--at-navy0) 82%);
    }
    .at-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .5;
      background:
        repeating-linear-gradient(0deg, rgba(148, 183, 240, .09) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(90deg, rgba(148, 183, 240, .09) 0 1px, transparent 1px 22px);
    }
    .at-scene::after {
      content: "";
      position: absolute;
      left: -30%;
      bottom: -60%;
      width: 160%;
      height: 150%;
      border-radius: 44%;
      background: radial-gradient(circle, rgba(37, 99, 235, .28), transparent 60%);
    }
    .at-spin {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      z-index: 2;
      color: #cfe0ff;
      opacity: .9;
    }
    .at-slabel {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 2;
      color: #fff;
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -.01em;
      text-shadow: 0 1px 8px rgba(2, 6, 23, .5);
    }
    .at-scode {
      position: absolute;
      right: 9px;
      top: 9px;
      z-index: 2;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #bcd4f5;
      background: rgba(11, 19, 34, .5);
      border: 1px solid rgba(148, 183, 240, .28);
      border-radius: 6px;
      padding: 2px 6px;
    }

    /* ── "Application received" confirmation moment ── */
    .at-received {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
      background: var(--gp-green-soft, #eafaf0);
      border: 1px solid var(--gp-green-border, #c5ecd4);
      border-radius: var(--gp-r-lg, 18px);
      padding: 14px 15px;
    }
    .at-received-ico {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: var(--gp-green, #16a34a);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 22px -10px rgba(22, 163, 74, .7);
    }
    .at-received b { font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif); color: var(--gp-green-ink, #166534); font-size: 15.5px; display: block; }
    .at-received p { margin: 2px 0 0; font-size: 12.5px; color: var(--gp-text, #1f2b43); }

    /* ── Urgency / priority panel ── */
    .at-priority {
      margin-top: 16px;
      background: var(--gp-surface, #fff);
      border: 1px solid var(--gp-border, #e3e9f4);
      border-radius: var(--gp-r-lg, 18px);
      padding: 16px;
      box-shadow: var(--gp-shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .at-priority::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(var(--gp-blue, #2563eb), var(--at-sky));
    }
    .at-ph { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 800; color: var(--gp-ink, #0f172a); }
    .at-ph .at-live { width: 8px; height: 8px; border-radius: 999px; background: #e0872a; animation: atPing 1.8s var(--at-ease) infinite; }
    @keyframes atPing {
      0% { box-shadow: 0 0 0 0 rgba(224, 135, 42, .45); }
      70% { box-shadow: 0 0 0 7px rgba(224, 135, 42, 0); }
      100% { box-shadow: 0 0 0 0 rgba(224, 135, 42, 0); }
    }
    .at-pcount {
      margin-left: auto;
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--gp-ink, #0f172a);
    }
    .at-pcount span { font-size: 11px; font-weight: 700; color: var(--gp-faint, #94a3b8); font-family: var(--gp-font-body, "DM Sans", sans-serif); letter-spacing: .04em; }
    .at-pbar { height: 6px; border-radius: 999px; background: var(--gp-hair, #eef2f9); margin: 12px 0 11px; overflow: hidden; }
    .at-pbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gp-blue, #2563eb), var(--at-sky)); width: 0; transition: width 1s var(--at-ease); }
    .at-pnote { font-size: 13px; color: var(--gp-text, #1f2b43); line-height: 1.5; margin: 0; }
    .at-pnote b { color: var(--gp-green-ink, #166534); }

    /* ── Section headers ── */
    .at-sech {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--gp-faint, #94a3b8);
      margin: 24px 0 11px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .at-sech::after { content: ""; flex: 1; height: 1px; background: var(--gp-border, #e3e9f4); }

    /* ── Package cells ── */
    .at-earnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .at-cell {
      background: var(--gp-surface, #fff);
      border: 1px solid var(--gp-border, #e3e9f4);
      border-radius: var(--gp-r-md, 14px);
      padding: 12px 14px;
      box-shadow: var(--gp-shadow-sm);
      min-width: 0;
    }
    .at-cell b {
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-size: 16px;
      color: var(--gp-ink, #0f172a);
      display: block;
      letter-spacing: -.01em;
      line-height: 1.3;
      overflow-wrap: break-word;
    }
    .at-cell span { font-size: 10px; color: var(--gp-faint, #94a3b8); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    /* ── About / intro ── */
    .at-intro {
      background: var(--gp-surface, #fff);
      border: 1px solid var(--gp-border, #e3e9f4);
      border-radius: var(--gp-r-lg, 18px);
      padding: 16px;
      box-shadow: var(--gp-shadow-sm);
      font-size: 14.5px;
    }
    .at-intro em { font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif); }

    /* ── Benefits ── */
    .at-bene { display: grid; gap: 9px; list-style: none; margin: 0; padding: 0; }
    .at-bene li {
      display: flex;
      gap: 10px;
      background: var(--gp-surface, #fff);
      border: 1px solid var(--gp-border, #e3e9f4);
      border-radius: var(--gp-r-md, 14px);
      padding: 11px 13px;
      font-size: 13.5px;
      align-items: flex-start;
    }
    .at-bi {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--gp-green-soft, #eafaf0);
      color: var(--gp-green-ink, #166534);
      display: grid;
      place-items: center;
      margin-top: 1px;
    }
    .at-bi svg { width: 12px; height: 12px; }

    /* ── Identity vault (pre-reveal) ── */
    .at-vault {
      position: relative;
      border-radius: var(--gp-r-lg, 18px);
      overflow: hidden;
      background: linear-gradient(120deg, #0c2e66 0%, #0d5ee0 55%, #2b8ef0 100%);
      color: #fff;
      box-shadow: var(--gp-shadow-md);
      cursor: pointer;
    }
    .at-vault::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .2), transparent 46%); }
    .at-vshine {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 64px;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .26), transparent);
      animation: atSweep 3.8s var(--at-ease) infinite;
    }
    @keyframes atSweep { 0% { left: -80px; } 55%, 100% { left: 110%; } }
    .at-vault-in { position: relative; padding: 18px; display: flex; gap: 13px; align-items: center; }
    .at-vlock {
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .3);
      display: grid;
      place-items: center;
    }
    /* Placeholder graphic ONLY — never real text under a blur. */
    .at-vname {
      height: 15px;
      border-radius: 5px;
      max-width: 210px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .62) 0 36px, rgba(255, 255, 255, .32) 36px 52px, rgba(255, 255, 255, .62) 52px 96px);
      filter: blur(4.5px);
      margin-bottom: 8px;
    }
    .at-vtag { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; color: #bfdcff; margin-bottom: 6px; }
    .at-vcap { font-size: 12.5px; color: #d6e7ff; line-height: 1.45; margin: 0; }
    .at-vcap b { color: #fff; }
    .at-vault.at-shake { animation: atVshake .4s var(--at-ease); }
    @keyframes atVshake {
      0%, 100% { transform: none; }
      25% { transform: translateX(-5px); }
      60% { transform: translateX(4px); }
    }

    /* ── Unlocked practice identity (revealed) ── */
    .at-unlocked {
      display: flex;
      gap: 14px;
      align-items: center;
      background: var(--gp-surface, #fff);
      border: 1px solid var(--gp-green-border, #c5ecd4);
      border-radius: var(--gp-r-lg, 18px);
      padding: 16px;
      box-shadow: var(--gp-shadow-sm);
    }
    .at-ua {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--gp-green-soft, #eafaf0);
      color: var(--gp-green-ink, #166534);
      display: grid;
      place-items: center;
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-weight: 700;
      font-size: 19px;
    }
    .at-uname { font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif); font-weight: 700; font-size: 17px; color: var(--gp-ink, #0f172a); letter-spacing: -.01em; }
    .at-uaddr { font-size: 13px; color: var(--gp-muted, #64748b); margin-top: 2px; }
    .at-ubadge {
      margin-left: auto;
      flex: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--gp-green-ink, #166534);
      background: var(--gp-green-soft, #eafaf0);
      border: 1px solid var(--gp-green-border, #c5ecd4);
      border-radius: 999px;
      padding: 4px 9px;
    }

    /* ── Intro video ── */
    .at-video-embed {
      position: relative;
      border-radius: var(--gp-r-lg, 18px);
      overflow: hidden;
      background: var(--at-navy0);
      box-shadow: var(--gp-shadow-md);
      aspect-ratio: 16/9;
    }
    .at-video-embed iframe,
    .at-video-embed video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--at-navy0);
    }
    .at-video-note { font-size: 12px; color: var(--gp-muted, #64748b); margin: 8px 2px 0; }
    .at-video-link {
      display: flex;
      gap: 13px;
      align-items: center;
      background: var(--at-navy0);
      border-radius: var(--gp-r-lg, 18px);
      padding: 13px;
      color: #fff;
      cursor: pointer;
      box-shadow: var(--gp-shadow-md);
      text-decoration: none;
    }
    .at-vthumb { flex: none; width: 100px; aspect-ratio: 16/10; border-radius: 11px; overflow: hidden; position: relative; }
    .at-vplay { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; }
    .at-vplay span { width: 32px; height: 32px; border-radius: 999px; background: #fff; display: grid; place-items: center; color: var(--at-navy0); }
    .at-video-link h4 { font-size: 14px; font-weight: 700; margin: 0; color: #fff; }
    .at-video-link p { font-size: 12px; color: #9dc0f0; margin: 2px 0 0; }

    /* ── Area map (fuzzy pre-reveal / exact post-reveal) ── */
    .at-map {
      position: relative;
      border-radius: var(--gp-r-lg, 18px);
      overflow: hidden;
      border: 1px solid var(--gp-border, #e3e9f4);
      aspect-ratio: 16/9;
      background: var(--gp-surface-sunken, #f8fafd);
      box-shadow: var(--gp-shadow-sm);
    }
    .at-map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .at-map-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .at-map-overlay.at-map-overlay--fuzzy { background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, .14), rgba(37, 99, 235, .04) 44%, transparent 62%); }
    .at-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .at-ring {
      width: 60px;
      height: 60px;
      border-radius: 999px;
      border: 2px dashed rgba(37, 99, 235, .55);
      display: grid;
      place-items: center;
      animation: atPulse 2.6s var(--at-ease) infinite;
      background: rgba(255, 255, 255, .08);
    }
    .at-ring.at-ring--exact { border-color: rgba(22, 163, 74, .6); animation: none; }
    .at-dotpin { width: 12px; height: 12px; border-radius: 999px; background: var(--gp-blue, #2563eb); box-shadow: 0 0 0 5px rgba(37, 99, 235, .18); }
    .at-dotpin.at-dotpin--exact { background: var(--gp-green, #16a34a); box-shadow: 0 0 0 5px rgba(22, 163, 74, .18); }
    @keyframes atPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); opacity: .55; }
    }
    .at-map-caption {
      position: absolute;
      left: 11px;
      bottom: 9px;
      z-index: 3;
      font-size: 11.5px;
      font-weight: 700;

    .at-map-address svg { flex: none; color: var(--gp-green, #16a34a); }

    /* ── Registration Support Officer strip ── */

    .at-bsave {

    .at-bapply {

    .at-bapply.at-bapply--done { background: var(--gp-green, #16a34a); box-shadow: 0 12px 28px -12px rgba(22, 163, 74, .5); }
    .at-bapply:disabled { cursor: default; transform: none; }
    .at-bapply.at-bapply--muted {
      background: var(--gp-surface, #fff);
      color: var(--gp-muted, #64748b);
      border: 1px solid var(--gp-border-strong, #cbd7ea);
      box-shadow: none;
    }

    /* ── Loading state ── */
    .page-loading { display: grid; place-items: center; min-height: 40vh; gap: 16px; padding: 40px 0; }
    .page-loading[hidden] { display: none !important; }
    .page-loading-text { font-size: 13px; font-weight: 600; color: var(--gp-muted, #64748b); margin: 0; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--gp-border, #e3e9f4);
      border-top-color: var(--gp-blue, #2563eb);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error state ── */
    .page-error { display: grid; place-items: center; min-height: 36vh; gap: 12px; text-align: center; padding: 40px 20px; }
    .page-error[hidden] { display: none !important; }
    .page-error-title {
      margin: 0;
      font-family: var(--gp-font-display, "Source Serif 4", Georgia, serif);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--gp-ink, #0f172a);

    .page-error-text { margin: 0; font-size: 13.5px; font-weight: 500; color: var(--gp-muted, #64748b); }
    .btn-secondary {

      justify-content: center;

    .btn-secondary:hover { background: var(--gp-surface-sunken, #f8fafd); border-color: var(--gp-blue, #2563eb); }

    /* ── Toast ── */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

    /* ── Dark mode ── */

    html.dark-mode body { background: var(--gp-canvas); color: var(--gp-text); }

<script src="/js/error-reporter.js?v=20260527a"></script>

  <!-- ═══════ Detail masthead ═══════ -->

<script>
(function () {
  "use strict";

  const CAREER_STATE_KEY = "gp_career_state";
  const ROLE_PREVIEW_SESSION_KEY = "gp_role_preview";
  const ROLE_LIST_CACHE_KEY = "gp_career_roles_cache";
  const ROLE_DETAIL_CACHE_PREFIX = "gp_career_role_detail:";
  const ROLE_CACHE_TTL_MS = 10 * 60 * 1000;

  function parseStorage(key) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
  }

  function readCachedRoles() {
    try {
      const raw = localStorage.getItem(ROLE_LIST_CACHE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      const fetchedAt = Date.parse(parsed && parsed.fetchedAt);
      const roles = Array.isArray(parsed && parsed.roles) ? parsed.roles.filter((role) => role && role.id) : [];
      if (!roles.length || !Number.isFinite(fetchedAt)) return [];
      return Date.now() - fetchedAt <= ROLE_CACHE_TTL_MS ? roles : [];
    } catch (err) {
      return [];
    }
  }

  function writeCachedRoles(roles) {
    try {
      const safeRoles = Array.isArray(roles) ? roles.filter((role) => role && role.id) : [];
      if (!safeRoles.length) return;
      localStorage.setItem(ROLE_LIST_CACHE_KEY, JSON.stringify({
        fetchedAt: new Date().toISOString(),
        roles: safeRoles
      }));
    } catch (err) {}
  }

  function readCachedRoleDetail(roleId) {
    try {
      const raw = localStorage.getItem(ROLE_DETAIL_CACHE_PREFIX + roleId);
      const parsed = raw ? JSON.parse(raw) : null;
      const fetchedAt = Date.parse(parsed && parsed.fetchedAt);
      if (!parsed || !parsed.role || !Number.isFinite(fetchedAt)) return null;
      return Date.now() - fetchedAt <= ROLE_CACHE_TTL_MS ? parsed.role : null;
    } catch (err) {
      return null;
    }
  }

  function writeCachedRoleDetail(roleId, role) {
    if (!roleId || !role || !role.id) return;
    try {
      localStorage.setItem(ROLE_DETAIL_CACHE_PREFIX + roleId, JSON.stringify({
        fetchedAt: new Date().toISOString(),
        role: role
      }));
    } catch (err) {}
  }

  function escapeHtml(value) {
    const str = String(value == null ? "" : value);
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function showToast(message) {
    const el = document.getElementById("jobToast");
    if (!el) return;
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  /* ── Career state helpers (shared with career.html) ── */
  function getCareerState() {
    const raw = parseStorage(CAREER_STATE_KEY);
    return raw && typeof raw === "object" ? raw : { savedJobs: [], applications: [] };
  }

  function persistCareerState(state) {
    state.updatedAt = new Date().toISOString();
    localStorage.setItem(CAREER_STATE_KEY, JSON.stringify(state));
    window.dispatchEvent(new Event("gp-career-updated"));
  }

  // Same snapshot shape as career.html's createSavedSnapshot so a save made
  // here shows up correctly in the career page's Saved tab.
  function createSavedSnapshot(role) {
    const benefits = Array.isArray(role.benefits) ? role.benefits.filter(Boolean) : [];
    const tags = Array.isArray(role.tags) ? role.tags.filter(Boolean) : [];
    return {
      id: role.id,
      practiceName: role.practiceName,
      location: role.location,
      billing: role.billing,
      earnings: role.earnings,
      tags: (benefits.length ? benefits : tags).slice(0, 2),
      summary: role.summary
    };
  }

  function createApplicationSnapshot(role) {
    return {
      roleId: role.id,
      practiceName: role.practiceName,
      location: role.location,
      status: "Under Review",
      tone: "review",
      meta: [
        { label: "Applied", value: "Just now" },
        { label: "Billing", value: String(role.billing || "To be confirmed").replace(" Billing", "") },
        { label: "Next step", value: "GP Link screening" }
      ]
    };
  }

  function isSaved(roleId) {
    const state = getCareerState();
    return Array.isArray(state.savedJobs) && state.savedJobs.some((job) => {
      if (typeof job === "string") return job === roleId;
      return !!(job && job.id === roleId);
    });
  }

  function isApplied(roleId) {
    const state = getCareerState();
    return Array.isArray(state.applications) && state.applications.some(
      (app) => app && (app.roleId === roleId || app.id === roleId)
    );
  }

  function recordApplication(role) {
    const state = getCareerState();
    if (!Array.isArray(state.applications)) state.applications = [];
    if (!state.applications.some((a) => a && a.roleId === role.id)) {
      state.applications.unshift(createApplicationSnapshot(role));
      persistCareerState(state);
    }
  }

  function toggleSaved(roleId) {
    const state = getCareerState();
    if (!Array.isArray(state.savedJobs)) state.savedJobs = [];
    const index = state.savedJobs.findIndex((job) => {
      if (typeof job === "string") return job === roleId;
      return !!(job && job.id === roleId);
    });
    if (index >= 0) {
      state.savedJobs.splice(index, 1);
      persistCareerState(state);
      return false;
    } else {
      if (!currentRole || currentRole.id !== roleId) return false;
      state.savedJobs.unshift(createSavedSnapshot(currentRole));
      persistCareerState(state);
      return true;
    }
  }

  /* ── DOM refs ── */
  const dmastEl = document.getElementById("dmast");
  const dheadEl = document.getElementById("dhead");
  const dphotoWrapEl = document.getElementById("dphotoWrap");
  const dphotoEl = document.getElementById("dphoto");
  const dbodyEl = document.getElementById("dbody");
  const loadingEl = document.getElementById("loadingState");
  const errorEl = document.getElementById("errorState");
  const errorTextEl = document.getElementById("errorText");
  const stickyEl = document.getElementById("stickyActions");
  const applyBtnEl = document.getElementById("applyBtn");
  const saveBtnEl = document.getElementById("saveBtn");

  let currentRole = null;
  let renderContext = { mode: "standard" };
  // Apply-bar state machine: idle | applying | applied | already_placed |
  // closed | not_qualified | onboarding. Disabled variants for outcomes where
  // re-tapping is pointless.
  let applyState = "idle";
  let heroImageLookupRequestId = 0;

  /* ── Get role ID from URL ── */
  function getRoleIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id") || "";
  }

  function readPreviewRole(roleId) {
    try {
      const raw = sessionStorage.getItem(ROLE_PREVIEW_SESSION_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return parsed && parsed.id === roleId ? parsed : null;
    } catch (err) {
      return null;
    }
  }

  function writePreviewRole(role) {
    if (!role || !role.id) return;
    try {
      sessionStorage.setItem(ROLE_PREVIEW_SESSION_KEY, JSON.stringify(role));
    } catch (err) {}
  }

  function clearPreviewRole(roleId) {
    try {
      const raw = sessionStorage.getItem(ROLE_PREVIEW_SESSION_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && (!roleId || parsed.id === roleId)) {
        sessionStorage.removeItem(ROLE_PREVIEW_SESSION_KEY);
      }
    } catch (err) {}
  }

  function setPageState(mode, message) {
    const isContent = mode === "content";
    loadingEl.hidden = mode !== "loading";
    errorEl.hidden = mode !== "error";
    dbodyEl.hidden = !isContent;
    dphotoWrapEl.hidden = !isContent;
    stickyEl.hidden = !isContent;
    dheadEl.hidden = !isContent;
    if (mode === "error" && message) errorTextEl.textContent = message;
  }

  /* ── Masked-field helpers (same rules as career.html's Atlas layer) ── */
  function getRoleSuburbLabel(role) {
    const masked = String((role && role.practiceName) || "");
    const match = masked.match(/^(?:non-?)?dpa\s*[-–]\s*([^-–]+?)(?:\s*[-–]|$)/i);
    if (match && match[1].trim()) return match[1].trim();
    return String((role && (role.mapLabel || role.nearest_city || role.majorCity || role.location)) || "Australia").trim();
  }

  function getRoleStateCode(role) {
    const raw = String((role && role.state) || "");
    if (/nsw|new south/i.test(raw)) return "NSW";
    if (/vic/i.test(raw)) return "VIC";
    if (/qld|queensland/i.test(raw)) return "QLD";
    if (/wa|western/i.test(raw)) return "WA";
    if (/sa|south australia/i.test(raw)) return "SA";
    if (/tas/i.test(raw)) return "TAS";
    if (/nt|northern/i.test(raw)) return "NT";
    if (/act|capital/i.test(raw)) return "ACT";
    return raw ? raw.toUpperCase().slice(0, 3) : "AU";
  }

  // Applicant count is ALWAYS the server's deterministic presentation band
  // (15-23) — never a real applicant count and never Math.random. Fallback
  // recomputes the identical band (same djb2 as server careerApplicantBand
  // and career.html getApplicantBand) so both pages show the same number.
  function getApplicantBand(role) {
    const explicit = role && role.applicantBand;
    if (Number.isInteger(explicit) && explicit >= 15 && explicit <= 23) return explicit;
    const s = String((role && role.id) || "");
    let h = 5381;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    }
    return 15 + (h % 9);
  }

  const AT_CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const AT_LOCK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const AT_PIN_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

  // Photo-less scenery: refined map motif — ported from career.html so the
  // two pages share one visual system.
  function buildRoleSceneHtml(role, options) {
    const opts = options || {};
    const suburb = opts.hideLabel ? "" : getRoleSuburbLabel(role);
    const pinSize = opts.large ? 30 : 22;
    return '<div class="at-scene" aria-hidden="true">' +
      '<span class="at-scode">' + escapeHtml(getRoleStateCode(role)) + '</span>' +
      '<span class="at-spin"><svg width="' + pinSize + '" height="' + pinSize + '" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>' +
      (suburb ? '<span class="at-slabel">' + escapeHtml(suburb) + '</span>' : "") +
      '</div>';
  }

  /* ── Masthead ── */
  function renderMast(role) {
    const revealed = !!(role && role.revealed && role.realPracticeName);
    dmastEl.classList.toggle("at-dmast--revealed", revealed);
    const suburb = getRoleSuburbLabel(role);
    const billing = String(role.billing || "Billing on request");
    const roleType = String(role.roleType || "Permanent");
    const headline = revealed ? role.realPracticeName : ("General Practice in " + suburb);
    const locText = revealed
      ? String(role.practiceAddress || role.locationLine || role.location || "")
      : String(role.locationLine || role.location || "Australia");
    dheadEl.innerHTML =
      '<div class="at-dhtags">' +
        '<span class="at-dpill">' + AT_CHECK_SVG + (revealed ? "Identity unlocked" : "Eligible for you") + '</span>' +
        '<span class="at-dmeta">' + escapeHtml(billing) + ' · ' + escapeHtml(roleType) + '</span>' +
      '</div>' +
      '<h1 class="at-dtitle">' + escapeHtml(headline) + '</h1>' +
      (locText ? '<p class="at-dloc">' + AT_PIN_SVG + escapeHtml(locText) + '</p>' : "");
  }

  /* ── Hero photo / scenery ── */
  function renderHeroImage(role) {
    // A practice-uploaded header image always wins over the AI-sourced
    // scenery photo — it's a real photo of the actual location.
    const imageUrl = String(role && (role.headerImageUrl || role.heroImageUrl) ? (role.headerImageUrl || role.heroImageUrl) : "").trim();
    const revealed = !!(role && role.revealed && role.realPracticeName);
    const suburb = getRoleSuburbLabel(role);
    const caption = revealed
      ? AT_CHECK_SVG.replace('viewBox', 'width="11" height="11" viewBox') + 'Identity unlocked · ' + escapeHtml(suburb)
      : AT_LOCK_SVG + 'Confidential listing · area preview';
    const media = imageUrl
      ? '<img class="at-dphoto-img" src="' + escapeHtml(imageUrl) + '" alt="Landscape view near ' + escapeHtml(suburb) + '" onerror="this.remove()" />' +
        buildRoleSceneHtml(role, { large: true, hideLabel: true }).replace('class="at-scene"', 'class="at-scene" style="z-index:-1"')
      : buildRoleSceneHtml(role, { large: true });
    dphotoEl.innerHTML = media + '<figcaption>' + caption + '</figcaption>';
    if (imageUrl) {
      // Keep the image above the fallback scene once it loads.
      const img = dphotoEl.querySelector(".at-dphoto-img");
      if (img) img.style.zIndex = "1";
    }
  }

  function buildHeroImageLookupParams(role) {
    const params = new URLSearchParams();
    if (!role) return params;
    if (role.id) params.set("roleId", role.id);
    if (role.mapLabel) params.set("mapLabel", role.mapLabel);
    if (role.locationLine) params.set("locationLine", role.locationLine);
    if (role.location) params.set("location", role.location);
    if (role.mapQuery) params.set("mapQuery", role.mapQuery);
    const stateMatch = String(role.locationLine || role.location || role.mapQuery || "").match(/\b(NSW|VIC|QLD|WA|SA|TAS|ACT|NT)\b/i);
    if (stateMatch) params.set("state", stateMatch[1].toUpperCase());
    params.set("country", "Australia");
    return params;
  }

  async function ensureHeroImage(role) {
    if (!role || role.headerImageUrl || role.heroImageUrl) return;
    const params = buildHeroImageLookupParams(role);
    const requestId = ++heroImageLookupRequestId;
    try {
      const res = await fetch("/api/career/hero-image?" + params.toString(), {
        credentials: "same-origin"
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true || !data.heroImageUrl) return;
      if (!currentRole || currentRole.id !== role.id || requestId !== heroImageLookupRequestId) return;
      currentRole = {
        ...currentRole,
        heroImageUrl: data.heroImageUrl,
        heroImageSourceUrl: data.heroImageSourceUrl || "",
        heroImageCredit: data.heroImageCredit || ""
      };
      writePreviewRole(currentRole);
      renderHeroImage(currentRole);
    } catch (err) {
      // Keep the scenery motif if lookup fails.
    }
  }

  /* ── Intro video (two-tier: only in the authenticated detail payload) ── */
  function buildIntroVideoHtml(role) {
    const raw = String((role && role.introVideoUrl) || "").trim();
    if (!raw) return "";
    let parsed;
    try { parsed = new URL(raw, window.location.href); } catch { return ""; }
    if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return "";
    const host = parsed.hostname.replace(/^www\./i, "").toLowerCase();

    let embedSrc = "";
    if (host === "youtube.com" || host === "m.youtube.com" || host === "youtube-nocookie.com") {
      let videoId = parsed.searchParams.get("v") || "";
      if (!videoId) {
        const pathMatch = parsed.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/);
        if (pathMatch) videoId = pathMatch[1];
      }
      if (videoId) embedSrc = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId);
    } else if (host === "youtu.be") {
      const videoId = parsed.pathname.replace(/^\//, "").split("/")[0];
      if (videoId) embedSrc = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId);
    } else if (host === "vimeo.com" || host === "player.vimeo.com") {
      const vimeoMatch = parsed.pathname.match(/\/(\d+)/);
      if (vimeoMatch) embedSrc = "https://player.vimeo.com/video/" + vimeoMatch[1];
    }

    let block = "";
    let note = '<p class="at-video-note">The team, the patient mix, your typical week — identity kept private until acceptance.</p>';
    if (embedSrc) {
      block = '<div class="at-video-embed"><iframe src="' + escapeHtml(embedSrc) + '" title="Practice introduction video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>';
    } else if (/\.(mp4|webm|m4v|mov|ogv)(?:[?#]|$)/i.test(parsed.pathname)) {
      block = '<div class="at-video-embed"><video controls playsinline preload="metadata" src="' + escapeHtml(parsed.href) + '"></video></div>';
    } else {
      block = '<a class="at-video-link" href="' + escapeHtml(parsed.href) + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="at-vthumb">' + buildRoleSceneHtml(role || {}, { hideLabel: true }) +
          '<span class="at-vplay"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></span>' +
        '</span>' +
        '<span><h4>Practice introduction</h4><p>The team, the patient mix, your typical week — identity kept private until acceptance.</p></span>' +
      '</a>';
      note = "";
    }
    return '<div class="at-sech">Meet them on video</div>' +
      '<div class="at-rv at-rv3">' + block + note + '</div>';
  }

  /* ── Area map: fuzzy pre-reveal, exact post-reveal ── */
  function buildMapHtml(role) {
    const revealed = !!(role && role.revealed && role.revealedMapQuery);
    const query = revealed ? role.revealedMapQuery : (role && role.mapQuery);
    if (!query) return "";
    const zoom = revealed ? 15 : 13;
    const src = "https://www.google.com/maps?q=" + encodeURIComponent(query) + "&z=" + zoom + "&output=embed";
    const suburb = getRoleSuburbLabel(role);
    const caption = revealed
      ? "Exact location" + (role.realPracticeName ? " · " + role.realPracticeName : "")
      : suburb + " area — exact address shared on acceptance";
    const overlay = revealed
      ? '<span class="at-map-overlay"><span class="at-pin"><span class="at-ring at-ring--exact"><span class="at-dotpin at-dotpin--exact"></span></span></span></span>'
      : '<span class="at-map-overlay at-map-overlay--fuzzy"><span class="at-pin"><span class="at-ring"><span class="at-dotpin"></span></span></span></span>';
    return '<div class="at-sech">The area</div>' +
      '<div class="at-rv at-rv4">' +
        '<figure class="at-map" style="margin:0">' +
          '<iframe src="' + escapeHtml(src) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Role area map"></iframe>' +
          overlay +
          '<figcaption class="at-map-caption">' + escapeHtml(caption) + '</figcaption>' +
        '</figure>' +
        (revealed && role.practiceAddress
          ? '<p class="at-map-address">' + AT_PIN_SVG + escapeHtml(role.practiceAddress) + '</p>'
          : "") +
      '</div>';
  }

  /* ── The practice: identity vault (pre-reveal) or unlocked card ── */
  function buildPracticeIdentityHtml(role) {
    const revealed = !!(role && role.revealed && role.realPracticeName);
    if (revealed) {
      const initials = (String(role.realPracticeName).match(/\b\w/g) || ["G", "P"]).slice(0, 2).join("").toUpperCase();
      return '<div class="at-sech">The practice</div>' +
        '<div class="at-unlocked at-rv at-rv3">' +
          '<span class="at-ua">' + escapeHtml(initials) + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="at-uname">' + escapeHtml(role.realPracticeName) + '</div>' +
            (role.practiceAddress ? '<div class="at-uaddr">' + escapeHtml(role.practiceAddress) + '</div>' : "") +
          '</div>' +
          '<span class="at-ubadge">&#10003; UNLOCKED</span>' +
        '</div>';
    }
    // Pre-reveal: placeholder graphic only (never real text under a blur).
    return '<div class="at-sech">The practice</div>' +
      '<div class="at-vault at-rv at-rv3" data-vault role="button" tabindex="0" aria-label="Practice identity is protected until acceptance">' +
        '<span class="at-vshine"></span>' +
        '<div class="at-vault-in">' +
          '<span class="at-vlock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="at-vtag">NAME ON ACCEPTANCE</div>' +
            '<div class="at-vname" aria-hidden="true"></div>' +
            '<p class="at-vcap"><b>Identity protected while you decide.</b> Name, address &amp; team are revealed the moment you’re <b>accepted</b> — keeping matching fair for you and the practice.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ── Detail body ── */
  function buildPackageCellsHtml(role) {
    const cells = [
      { label: "Earnings", value: role.earnings || "Package on request" },
      { label: "Billing", value: role.billing || "Billing on request" },
      { label: "Role type", value: role.roleType || "Permanent" },
      { label: "Location", value: role.locationLine || role.location || "Australia" }
    ];
    return '<div class="at-sech">The package</div>' +
      '<div class="at-earnrow at-rv at-rv2">' +
      cells.map((cell) =>
        '<div class="at-cell"><span>' + escapeHtml(cell.label) + '</span><b>' + escapeHtml(cell.value) + '</b></div>'
      ).join("") +
      '</div>';
  }

  function buildBenefitsHtml(role) {
    const items = (Array.isArray(role.benefits) ? role.benefits.filter(Boolean) : []).slice(0, 4);
    const lis = items.length
      ? items.map((benefit) =>
          '<li><span class="at-bi">' + AT_CHECK_SVG + '</span>' + escapeHtml(benefit) + '</li>'
        ).join("")
      : '<li><span class="at-bi">' + AT_CHECK_SVG + '</span>Structured onboarding, a supportive team and a stable patient base.</li>';
    return '<div class="at-sech">Why GPs choose it</div><ul class="at-bene at-rv at-rv3">' + lis + '</ul>';
  }

  function buildUrgencyHtml(role) {
    const band = getApplicantBand(role);
    // Band-driven, deterministic progress width (same formula as the mockup).
    const pct = Math.min(88, 50 + (band % 30));
    return '<section class="at-priority at-rv at-rv2" data-band-pct="' + pct + '">' +
      '<div class="at-ph"><span class="at-live"></span>High interest in this role' +
        '<span class="at-pcount">' + band + '<span> applied</span></span></div>' +
      '<div class="at-pbar"><i id="pbarFill"></i></div>' +
      '<p class="at-pnote">Doctors with a <b>complete CV and profile</b> are shortlisted first — the practice sees them before anyone else.</p>' +
    '</section>';
  }

  function buildReceivedHtml() {
    return '<div class="at-received at-rv" id="appliedBanner">' +
      '<span class="at-received-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span>' +
      '<div><b>Application received</b><p>In review — your Registration Support Officer checks it before the practice sees it.</p></div>' +
    '</div>';
  }

  function buildSupportHtml() {
    return '<div class="at-sech">In your corner</div>' +
      '<div class="at-support at-rv at-rv4"><span class="at-ava">GP</span>' +
      '<p><b>Your Registration Support Officer reviews every application before the practice sees it</b> — and negotiates your terms. Apply to the roles that genuinely fit; focused applications get championed. Free for doctors, always.</p></div>';
  }

  function renderBody(role, ctx) {
    const summary = String(role.summary || "A well-established practice partnered with GP Link. Structured onboarding, a supportive team and a stable patient base.");
    dbodyEl.innerHTML =
      (isApplied(role.id) ? buildReceivedHtml() : "") +
      buildUrgencyHtml(role) +
      buildPackageCellsHtml(role) +
      '<div class="at-sech">About the role</div>' +
      '<div class="at-intro at-rv at-rv3">' + escapeHtml(summary) + ' <em>The full profile unlocks as your application progresses.</em></div>' +
      buildBenefitsHtml(role) +
      buildPracticeIdentityHtml(role) +
      buildIntroVideoHtml(role) +
      buildMapHtml(role) +
      buildSupportHtml();
    requestAnimationFrame(() => {
      const fill = document.getElementById("pbarFill");
      const panel = dbodyEl.querySelector(".at-priority");
      if (fill && panel) fill.style.width = panel.getAttribute("data-band-pct") + "%";
    });
  }

  /* ── Single render entry point.
     ctx.mode: "standard" today; Task 4 adds "offer" (offer banner +
     interview scheduling) by branching here without restructuring. ── */
  function renderRole(role, ctx) {
    renderContext = ctx || renderContext || { mode: "standard" };
    // A blurred (non-qualifying) filler stub has no real practice details to
    // show — never render it as an openable job page.
    if (role && role.blurred) {
      currentRole = null;
      setPageState("error", "This role is unavailable — you don't currently qualify for it.");
      return;
    }
    currentRole = role;
    document.title = "Role Details - GP Link";
    setPageState("content");
    renderMast(role);
    renderHeroImage(role);
    ensureHeroImage(role);
    renderBody(role, renderContext);
    if (applyState !== "applying") {
      applyState = isApplied(role.id) ? "applied" : "idle";
    }
    paintApply();
    updateSaveButton();
  }

  /* ── Apply bar painting ── */
  function paintApply() {
    const states = {
      idle: {
        cls: "at-bapply",
        html: "Apply for this role<small>Your Registration Support Officer reviews it before the practice does</small>",
        disabled: false
      },
      applying: { cls: "at-bapply", html: "Applying…", disabled: true },
      applied: {
        cls: "at-bapply at-bapply--done",
        html: "✓ Submitted<small>Your Registration Support Officer is reviewing it</small>",
        disabled: true
      },
      already_placed: {
        cls: "at-bapply at-bapply--muted",
        html: "You're already placed<small>Contact your Registration Support Officer about any change</small>",
        disabled: true
      },
      closed: {
        cls: "at-bapply at-bapply--muted",
        html: "This position has been filled<small>Browse other roles — we'll help you find the right fit</small>",
        disabled: true
      },
      not_qualified: {
        cls: "at-bapply at-bapply--muted",
        html: "Not available for your pathway<small>This role needs a different eligibility profile</small>",
        disabled: true
      },
      onboarding: {
        cls: "at-bapply",
        html: "Finish onboarding to apply<small>It only takes a few minutes</small>",
        disabled: false
      }
    };
    const spec = states[applyState] || states.idle;
    applyBtnEl.className = spec.cls;
    applyBtnEl.innerHTML = spec.html;
    applyBtnEl.disabled = spec.disabled;
  }

  function updateSaveButton() {
    if (!currentRole) return;
    const saved = isSaved(currentRole.id);
    saveBtnEl.classList.toggle("on", saved);
    saveBtnEl.setAttribute("aria-label", saved ? "Remove saved job" : "Save for later");
    const icon = saveBtnEl.querySelector("svg path");
    if (icon) saveBtnEl.querySelector("svg").setAttribute("fill", saved ? "currentColor" : "none");
  }

  function mergeRoleData(baseRole, nextRole) {
    if (!baseRole) return nextRole;
    if (!nextRole) return baseRole;
    return {
      ...baseRole,
      ...nextRole,
      benefits: Array.isArray(nextRole.benefits) && nextRole.benefits.length ? nextRole.benefits : (baseRole.benefits || []),
      summary: nextRole.summary || baseRole.summary,
      support: nextRole.support || baseRole.support,
      locationSummary: nextRole.locationSummary || baseRole.locationSummary,
      mapQuery: nextRole.mapQuery || baseRole.mapQuery
    };
  }

  function showError(message) {
    setPageState("error", message);
  }

  /* ── Fetch role ── */
  async function loadRolePreview(roleId) {
    const cached = readCachedRoles().find((role) => role && role.id === roleId);
    if (cached) return cached;
    try {
      const res = await fetch("/api/career/roles", { credentials: "same-origin" });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true || !Array.isArray(data.roles)) {
        return null;
      }
      writeCachedRoles(data.roles);
      return data.roles.find((role) => role && role.id === roleId) || null;
    } catch (err) {
      return null;
    }
  }

  async function loadRoleDetail(roleId, timeoutMs) {
    const cached = readCachedRoleDetail(roleId);
    if (cached) return cached;
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch("/api/career/role?id=" + encodeURIComponent(roleId), {
        credentials: "same-origin",
        signal: controller.signal
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || data.ok !== true || !data.role) {
        return null;
      }
      writeCachedRoleDetail(roleId, data.role);
      return data.role;
    } catch (err) {
      return null;
    } finally {
      window.clearTimeout(timeout);
    }
  }

  /* ── Apply outcome handling — one explicit branch per server guard ── */
  function markAppliedLocally() {
    if (!currentRole) return;
    recordApplication(currentRole);
    applyState = "applied";
    paintApply();
    renderBody(currentRole, renderContext);
  }

  // Returns "success" | "cv_required" | one of the terminal guard states.
  function handleApplyOutcome(status, data, options) {
    const opts = options || {};
    if (data && data.ok) {
      // Confirmation moment: applied state + "Application received" banner.
      markAppliedLocally();
      showToast(opts.afterCvUpload
        ? "CV uploaded & application sent ✓ Your Registration Support Officer will be in touch shortly"
        : "Application sent ✓ Your Registration Support Officer will be in touch shortly");
      return "success";
    }
    if (data && data.requiresCv) {
      // Missing signed CV → the in-page CV upload modal.
      applyState = "idle";
      paintApply();
      if (!opts.afterCvUpload) openCvModal();
      return "cv_required";
    }
    if (data && data.code === "already_placed") {
      applyState = "already_placed";
      paintApply();
      showToast("You're already placed — your Registration Support Officer manages any change from here.");
      return "already_placed";
    }
    if (data && data.code === "job_closed") {
      applyState = "closed";
      paintApply();
      showToast(data.message || "This position is no longer open.");
      return "closed";
    }
    if (data && data.error === "not_qualified") {
      applyState = "not_qualified";
      paintApply();
      showToast("You don't currently qualify for this role — ask your Registration Support Officer about your options.");
      return "not_qualified";
    }
    if (status === 429) {
      // Gentle rate-limit toast; the button stays usable for later.
      applyState = "idle";
      paintApply();
      showToast("You're applying quickly — give it a few minutes and try again.");
      return "rate_limited";
    }
    if (status === 403) {
      // Onboarding incomplete: repurpose the button as the onboarding link.
      applyState = "onboarding";
      paintApply();
      showToast("Finish onboarding first — tap the button below to continue.");
      return "onboarding";
    }
    if (status === 409) {
      // Duplicate application — reflect the truth: it's already in.
      markAppliedLocally();
      showToast("You've already applied — your Registration Support Officer is on it.");
      return "duplicate";
    }
    applyState = "idle";
    paintApply();
    showToast((data && data.message) || "Could not apply. Try again.");
    return "error";
  }

  async function applyForRole() {
    if (!currentRole) return;
    if (applyState === "onboarding") {
      window.location.href = "onboarding";
      return;
    }
    if (applyState !== "idle") return;
    applyState = "applying";
    paintApply();
    try {
      const res = await fetch("/api/career/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ roleId: currentRole.id })
      });
      const data = await res.json().catch(() => null);
      handleApplyOutcome(res.status, data, {});
    } catch {
      applyState = "idle";
      paintApply();
      showToast("Network error. Please try again.");
    }
  }

  /* ── Event listeners ── */
  applyBtnEl.addEventListener("click", applyForRole);

  saveBtnEl.addEventListener("click", () => {
    if (!currentRole) return;
    const nowSaved = toggleSaved(currentRole.id);
    updateSaveButton();
    showToast(nowSaved ? "Saved to your shortlist" : "Removed from shortlist");
  });

  // Identity vault: tap → shake + explainer (mockup interaction).
  dbodyEl.addEventListener("click", (event) => {
    const vault = event.target.closest("[data-vault]");
    if (!vault) return;
    vault.classList.remove("at-shake");
    void vault.offsetWidth;
    vault.classList.add("at-shake");
    showToast("The practice name unlocks when your application is accepted");
  });
  dbodyEl.addEventListener("keydown", (event) => {
    if ((event.key === "Enter" || event.key === " ") && event.target.closest && event.target.closest("[data-vault]")) {
      event.preventDefault();
      event.target.closest("[data-vault]").click();
    }
  });

  const shareBtnEl = document.getElementById("shareBtn");
  if (shareBtnEl) {
    shareBtnEl.addEventListener("click", async () => {
      const shareData = {
        title: currentRole ? (currentRole.practiceName || "GP Role") + " - GP Link" : "GP Link Role",
        text: currentRole ? "Check out this GP role" + (currentRole.location ? " in " + currentRole.location : "") : "Check out this GP role on GP Link",
        url: window.location.href
      };
      if (window.gpShare) {
        window.gpShare(shareData);
      } else if (navigator.share) {
        try { await navigator.share(shareData); } catch {}
      } else {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Link copied to clipboard");
        } catch {
          showToast("Could not copy link");
        }
      }
    });
  }

  /* ── CV Upload Modal ── */
  var cvModal = document.getElementById("cvModal");
  var cvFileInput = document.getElementById("cvFileInput");
  var cvUploadArea = document.getElementById("cvUploadArea");
  var cvFilePreview = document.getElementById("cvFilePreview");
  var cvFileName = document.getElementById("cvFileName");
  var cvFileRemove = document.getElementById("cvFileRemove");
  var cvUploadBtn = document.getElementById("cvUploadBtn");
  var cvUploadStatus = document.getElementById("cvUploadStatus");
  var cvModalClose = document.getElementById("cvModalClose");
  var selectedCvFile = null;

  function openCvModal() {
    if (cvModal) cvModal.hidden = false;
  }

  function closeCvModal() {
    if (cvModal) cvModal.hidden = true;
    selectedCvFile = null;
    if (cvFileInput) cvFileInput.value = "";
    if (cvUploadArea) cvUploadArea.hidden = false;
    if (cvFilePreview) cvFilePreview.hidden = true;
    if (cvUploadBtn) { cvUploadBtn.disabled = true; cvUploadBtn.textContent = "Upload & Apply"; }
    if (cvUploadStatus) cvUploadStatus.textContent = "";
  }

  if (cvModalClose) cvModalClose.addEventListener("click", closeCvModal);
  if (cvModal) cvModal.addEventListener("click", function (e) { if (e.target === cvModal) closeCvModal(); });

  if (cvFileInput) {
    cvFileInput.addEventListener("change", function () {
      var file = cvFileInput.files && cvFileInput.files[0];
      if (!file) return;

      if (file.type !== "application/pdf") {
        cvUploadStatus.textContent = "Please select a PDF file.";
        cvFileInput.value = "";
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        cvUploadStatus.textContent = "File too large. Maximum 10 MB.";
        cvFileInput.value = "";
        return;
      }

      selectedCvFile = file;
      cvFileName.textContent = file.name;
      cvUploadArea.hidden = true;
      cvFilePreview.hidden = false;
      cvUploadBtn.disabled = false;
      cvUploadStatus.textContent = "";
    });
  }

  if (cvFileRemove) {
    cvFileRemove.addEventListener("click", function () {
      selectedCvFile = null;
      cvFileInput.value = "";
      cvUploadArea.hidden = false;
      cvFilePreview.hidden = true;
      cvUploadBtn.disabled = true;
      cvUploadStatus.textContent = "";
    });
  }

  if (cvUploadBtn) {
    cvUploadBtn.addEventListener("click", async function () {
      if (!selectedCvFile) return;
      cvUploadBtn.disabled = true;
      cvUploadBtn.textContent = "Uploading...";
      cvUploadStatus.textContent = "";

      try {
        // Read file as base64 data URL
        var dataUrl = await new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () { resolve(reader.result); };
          reader.onerror = function () { reject(new Error("Failed to read file")); };
          reader.readAsDataURL(selectedCvFile);
        });

        // Upload CV
        var uploadRes = await fetch("/api/career/upload-cv", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            fileName: selectedCvFile.name,
            fileDataUrl: dataUrl,
            mimeType: selectedCvFile.type
          })
        });
        var uploadData = await uploadRes.json();

        if (!uploadData.ok) {
          cvUploadStatus.textContent = uploadData.message || "Upload failed. Try again.";
          cvUploadBtn.disabled = false;
          cvUploadBtn.textContent = "Upload & Apply";
          return;
        }

        // CV uploaded, now retry the application through the same
        // guard-aware outcome handling as the main apply path.
        cvUploadBtn.textContent = "Applying...";

        var applyRes = await fetch("/api/career/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ roleId: currentRole.id })
        });
        var applyData = await applyRes.json().catch(function () { return null; });
        var outcome = handleApplyOutcome(applyRes.status, applyData, { afterCvUpload: true });

        if (outcome === "success" || outcome === "duplicate") {
          closeCvModal();
        } else {
          cvUploadStatus.textContent = (applyData && applyData.message) || "Application failed after upload.";
          cvUploadBtn.disabled = false;
          cvUploadBtn.textContent = "Upload & Apply";
        }
      } catch (err) {
        cvUploadStatus.textContent = "Network error. Please try again.";
        cvUploadBtn.disabled = false;
        cvUploadBtn.textContent = "Upload & Apply";
      }
    });
  }

  /* ── Init ── */
  async function init() {
    const roleId = getRoleIdFromUrl();
    if (!roleId) {
      showError("No role specified. Please select a role from the career page.");
      return;
    }

    document.title = "Role Details - GP Link";
    setPageState("loading");

    let previewRole = readPreviewRole(roleId);
    if (previewRole) {
      renderRole(previewRole, { mode: "standard" });
    }

    const previewPromise = previewRole ? Promise.resolve(previewRole) : loadRolePreview(roleId);
    const detailPromise = loadRoleDetail(roleId, 25000);

    const fastRole = await previewPromise;
    if (!currentRole && fastRole) {
      previewRole = fastRole;
      renderRole(fastRole, { mode: "standard" });
    }

    const enrichedRole = await detailPromise;
    if (enrichedRole) {
      renderRole(mergeRoleData(currentRole || previewRole, enrichedRole), { mode: "standard" });
      clearPreviewRole(roleId);
      return;
    }

    if (currentRole) {
      clearPreviewRole(roleId);
      return;
    }

    showError("Failed to load role details. Please try again.");
  }

  init();
})();
</script>
</body>
</html>
