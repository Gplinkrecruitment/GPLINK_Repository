    function loadLeadsTable() {
      var body = document.getElementById('leadsTableBody');
      if (!body) return;
      body.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">Loading leads…</div>';
      apiFetch('/api/admin/leads?q=' + encodeURIComponent(leadsState.q) + '&offset=' + leadsState.offset + '&limit=' + leadsState.limit).then(function (d) {
        body = document.getElementById('leadsTableBody');
        if (!body) return;
        if (!d || !d.ok) { body.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">Could not load leads.</div>'; return; }
        leadsState.total = Number(d.total || 0);
        var rows = Array.isArray(d.leads) ? d.leads : [];
        if (!rows.length) {
          body.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">' + (leadsState.q ? 'No leads match that search.' : 'No leads captured yet.') + '</div>';
        } else {
          var t = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
            + '<tr style="color:var(--text-muted);text-align:left"><th style="padding:5px 8px 5px 0;font-weight:600">Name</th><th style="padding:5px 8px 5px 0;font-weight:600">Email</th><th style="padding:5px 8px 5px 0;font-weight:600">Phone</th><th style="padding:5px 8px 5px 0;font-weight:600">Source</th><th style="padding:5px 8px 5px 0;font-weight:600">Status</th><th style="padding:5px 0;font-weight:600">Added</th></tr>';
          rows.forEach(function (l) {
            t += '<tr style="border-top:1px solid var(--panel-border)">'
              + '<td style="padding:6px 8px 6px 0">' + esc(l.name || '—') + '</td>'
              + '<td style="padding:6px 8px 6px 0">' + esc(l.email || '') + '</td>'
              + '<td style="padding:6px 8px 6px 0">' + esc(l.phone || '—') + '</td>'
              + '<td style="padding:6px 8px 6px 0">' + esc(l.source || '') + '</td>'

        }

          ph += '<button id="leadsNextBtn" ' + (to >= leadsState.total ? 'disabled' : '') + ' style="background:transparent;color:var(--text-muted);border:1px solid var(--panel-border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">Next</button>';

        }
        var inboxes = {};

            + '<div class="ceo-tech-subkv">' + (!isNaN(exp) ? 'expires ' + new Date(exp).toLocaleString() : 'no expiry recorded') + ' · last update ' + (!isNaN(upd) ? new Date(upd).toLocaleString() : 'never') + '</div></div>';

                h += '<div class="ceo-tech-subrow">' + esc(String(m.from || '').slice(0, 44)) + ' ' + flags + '<div class="ceo-tech-subkv">' + esc(String(m.subject || '').slice(0, 56)) + ' · ' + esc(String(m.date || '').slice(0, 31)) + '</div></div>';

        h += '<div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'

          + '<button id="gmailWatchRefreshBtn" style="background:transparent;color:var(--text-muted);border:1px solid var(--panel-border);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer">Refresh</button>'

          + '<div class="ceo-tech-subkv" style="margin-top:8px">“Set up / Renew” reconnects each watched inbox with Google. “Pull recent emails now” fetches the latest messages directly (use if live detection seems delayed) — only allowlisted senders are processed.</div>';
        card.innerHTML = h;
        var b1 = document.getElementById('gmailSetupBtn'); if (b1) b1.onclick = runGmailSetup;

    function runGmailSetup() {
      var rs = document.getElementById('gmailSetupResult');
      var btn = document.getElementById('gmailSetupBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Setting up…'; }
      if (rs) { rs.style.color = 'var(--text-muted)'; rs.textContent = ''; }
      apiFetch('/api/admin/gmail/setup-watch', { method: 'POST' }).then(function(d){
        if (!d || !d.ok || !Array.isArray(d.results)) {
          if (rs) { rs.style.color = 'var(--red)'; rs.textContent = 'Failed: ' + ((d && d.message) || 'error'); }
          if (btn) { btn.disabled = false; btn.textContent = 'Set up / Renew watches'; }
          return;
        }
        var okCount = d.results.filter(function(r){ return r.success; }).length;
        var failed = d.results.filter(function(r){ return !r.success; });
        if (rs) { rs.style.color = failed.length ? 'var(--amber)' : 'var(--green)'; rs.textContent = okCount + ' inbox(es) registered' + (failed.length ? '; ' + failed.length + ' failed (' + esc(failed.map(function(r){ return r.email; }).join(', ')) + ')' : '') + '.'; }
        setTimeout(loadGmailWatchCard, 1200);
      }).catch(function(e){ if (rs) { rs.style.color = 'var(--red)'; rs.textContent = 'Error: ' + e.message; } if (btn) { btn.disabled = false; btn.textContent = 'Set up / Renew watches'; } });
    }

    // Fetch the two health summaries independently; a failure of either shows a
    // muted "unavailable" note in that strip rather than breaking the whole tab.
    function loadTechnicalHealth() {
      var bugStrip = document.getElementById('techBugsStrip');
      var errStrip = document.getElementById('techErrStrip');
      if (bugStrip) {
        gpSwr('/api/ceo/technical/system-bugs?status=open', function(d) {
          if (!bugStrip) return;
          if (!d || !d.ok || !d.summary) { bugStrip.innerHTML = '<span class="ceo-tech-strip-label">Open bugs</span> <span class="ceo-tech-strip-na">unavailable</span>'; return; }
          var s = d.summary;
          bugStrip.innerHTML = '<span class="ceo-tech-strip-label">Open bugs</span> <span class="ceo-tech-strip-val">' + (s.open || 0)
            + '</span> <span class="ceo-tech-strip-sub">(critical ' + (s.critical || 0) + ' / high ' + (s.high || 0) + ')</span>'
            + '<span class="ceo-tech-strip-go">View &rarr;</span>';
        }).catch(function() { if (bugStrip) bugStrip.innerHTML = '<span class="ceo-tech-strip-label">Open bugs</span> <span class="ceo-tech-strip-na">unavailable</span>'; });
      }
      if (errStrip) {
        gpSwr('/api/ceo/technical/client-errors?status=open', function(d) {
          if (!errStrip) return;
          if (!d || !d.ok || !d.summary) { errStrip.innerHTML = '<span class="ceo-tech-strip-label">Client errors</span> <span class="ceo-tech-strip-na">unavailable</span>'; return; }
          var s = d.summary;
          errStrip.innerHTML = '<span class="ceo-tech-strip-label">Client errors</span> <span class="ceo-tech-strip-val">open ' + (s.open || 0)
            + '</span> <span class="ceo-tech-strip-sub">/ 24h occurrences ' + (s.total_occurrences_24h || 0) + '</span>'
            + '<span class="ceo-tech-strip-go">View &rarr;</span>';
        }).catch(function() { if (errStrip) errStrip.innerHTML = '<span class="ceo-tech-strip-label">Client errors</span> <span class="ceo-tech-strip-na">unavailable</span>'; });
      }
      // Fixes waiting for approval. "unavailable" is deliberately NOT "0" — if the
      // proposals API cannot be read we must not imply there is nothing to approve.
      var fixStrip = document.getElementById('techFixStrip');
      if (fixStrip) {
        gpSwr('/api/ceo/error-fix-proposals?status=proposed', function(d) {
          if (!fixStrip) return;
          if (!d || !d.ok || !Array.isArray(d.proposals)) {
            fixStrip.innerHTML = '<span class="ceo-tech-strip-label">Fixes to approve</span> <span class="ceo-tech-strip-na">unavailable</span>';
            return;
          }
          var waiting = d.proposals.filter(function (p) { return String(p.status || 'proposed') === 'proposed'; });
          var review = waiting.filter(function (p) { return fixRiskOf(p) !== 'safe_auto'; }).length;
          fixStrip.innerHTML = '<span class="ceo-tech-strip-label">Fixes to approve</span> <span class="ceo-tech-strip-val">' + waiting.length
            + '</span>' + (review ? ' <span class="ceo-tech-strip-sub">(' + review + (review === 1 ? ' needs' : ' need') + ' a closer look)</span>' : '')
            + '<span class="ceo-tech-strip-go">View &rarr;</span>';
        }).catch(function() { if (fixStrip) fixStrip.innerHTML = '<span class="ceo-tech-strip-label">Fixes to approve</span> <span class="ceo-tech-strip-na">unavailable</span>'; });
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ERROR DETAIL VIEW (Technical tab)
       The two health strips used to be dead numbers. They now open this view,
       which lists every error the server already returns (up to 200 rows,
       collapsed to one row per bug by error_hash on the server), worst first,
       each with a plain-English summary and resolve / ignore / reopen buttons
       wired to the existing PUT /api/ceo/technical/client-errors/:id.
       ═══════════════════════════════════════════════════════════════════════ */
    var errView = { status: 'open', showNoise: false, groups: [], summary: null };

    function errTimeAgo(iso) {
      if (!iso) return 'unknown';
      var ms = Date.now() - new Date(iso).getTime();
      if (!isFinite(ms)) return 'unknown';
      if (ms < 0) ms = 0;
      var mins = Math.floor(ms / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
      var days = Math.floor(hrs / 24);
      if (days < 31) return days + (days === 1 ? ' day ago' : ' days ago');
      return new Date(iso).toLocaleDateString();
    }

    // Long UA strings mean nothing to a non-technical reader — name the browser.
    function errBrowserName(ua) {
      var u = String(ua || '');
      if (!u) return '';
      if (/Edg\//.test(u)) return 'Edge';
      if (/OPR\//.test(u)) return 'Opera';
      if (/Chrome\//.test(u) && !/Chromium/.test(u)) return /Mobile/.test(u) ? 'Chrome (mobile)' : 'Chrome';
      if (/Firefox\//.test(u)) return 'Firefox';
      if (/Safari\//.test(u)) return /iPhone|iPad/.test(u) ? 'Safari (iPhone/iPad)' : 'Safari';
      if (/node|axios|curl/i.test(u)) return 'Server';
      return 'Other browser';
    }

    function openClientErrorsView(status) {
      if (status) errView.status = status;
      var c = document.getElementById('techContent');
      if (!c) return;
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading errors…</div></div>';
      gpSwr('/api/ceo/technical/client-errors?status=' + encodeURIComponent(errView.status), function (d) {
        c = document.getElementById('techContent');
        if (!c) return;
        if (!d || !d.ok) {
          c.innerHTML = errViewHead('Errors') + '<div class="drilldown-empty">Could not load errors: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        // The server could not read the list. This is NOT "no errors" — saying
        // so on top of a counter reading 50 open is how a bad column name hid
        // every error. Say plainly that the list failed to load.
        if (d.fetch_failed) {
          c.innerHTML = errViewHead('Errors doctors are hitting')
            + '<div class="ceo-err-note" style="border-left:3px solid var(--red);padding-left:12px">'
            + '<b>The error list could not be loaded.</b><br>'
            + 'This does <b>not</b> mean there are no errors &mdash; the counter is read a different way and is still accurate. '
            + 'Something is wrong with the query itself, so nothing can be shown until it is fixed.<br>'
            + '<span class="mono" style="opacity:.75">' + esc(d.fetch_error || 'unknown') + '</span></div>';
          return;
        }
        errView.groups = Array.isArray(d.errors) ? d.errors : [];
        errView.summary = d.summary || {};
        renderClientErrorsView();
      }).catch(function (e) {
        var cc = document.getElementById('techContent');
        if (cc) cc.innerHTML = errViewHead('Errors') + '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    function errViewHead(title) {
      return '<div class="rso-detail-head"><span class="rso-detail-back" onclick="loadTechnical()">&#x2190; Technical</span>'
        + '<h2 style="font-size:16px;font-weight:700">' + esc(title) + '</h2></div>';
    }

    function renderClientErrorsView() {
      var c = document.getElementById('techContent');
      if (!c) return;
      var real = errView.groups.filter(function (g) { return !g.noise; });
      var noise = errView.groups.filter(function (g) { return g.noise; });
      var s = errView.summary || {};

      var html = errViewHead('Errors doctors are hitting');
      html += '<div class="ceo-err-note">'
        + 'One line per problem — the same fault reported fifty times is a single row here. Sorted worst-first '
        + '(how often it happens &times; how many people it touches). '
        + '“Affects at least N” is a floor, not an exact count: we only store the first person to report each fault.'
        + '</div>';

      html += '<div class="ceo-err-toolbar">';
      ['open', 'investigating', 'resolved', 'ignored', 'all'].forEach(function (st) {
        html += '<span class="ceo-err-filter' + (errView.status === st ? ' active' : '') + '" onclick="openClientErrorsView(\'' + st + '\')">'
          + esc(st.charAt(0).toUpperCase() + st.slice(1)) + '</span>';
      });
      html += '<span style="flex:1"></span>';
      html += '<span class="ceo-err-btn" onclick="sendErrorDigestNow(this)">Email me this now</span>';
      html += '</div>';

      html += '<div class="ceo-err-note" style="margin-bottom:16px">Showing <b>' + real.length + '</b> real problem'
        + (real.length === 1 ? '' : 's')
        + (noise.length ? ' and hiding <b>' + noise.length + '</b> known non-fault' + (noise.length === 1 ? '' : 's') : '')
        + ' &middot; ' + Number(s.total_occurrences_24h || 0) + ' occurrence(s) recorded across the whole table in the last 24h.</div>';

      if (!real.length) {
        html += '<div class="drilldown-empty">Nothing here — no ' + esc(errView.status === 'all' ? '' : errView.status) + ' problems to look at.</div>';
      } else {
        html += real.map(function (g) { return renderErrRow(g, errView.groups.indexOf(g)); }).join('');
      }

      if (noise.length) {
        html += '<div class="ceo-err-section-head">Not a real fault (' + noise.length + ') '
          + '<span class="ceo-err-filter" style="margin-left:8px" onclick="toggleErrNoise()">'
          + (errView.showNoise ? 'Hide' : 'Show') + '</span></div>';
        html += '<div class="ceo-err-note">Known non-bugs: developer tooling, browser quirks and leftover debug output. '
          + 'They are kept for the record but never counted as problems and never emailed to you.</div>';
        if (errView.showNoise) {
          html += noise.map(function (g) { return renderErrRow(g, errView.groups.indexOf(g)); }).join('');
        }
      }
      c.innerHTML = html;
    }

    function toggleErrNoise() { errView.showNoise = !errView.showNoise; renderClientErrorsView(); }

    function renderErrRow(g, idx) {
      var occ = Number(g.occurrence_count) || 1;
      var users = Number(g.affected_users) || 0;
      // Chip colour follows impact so the eye lands on the worst row first.
      var heat = g.noise ? '' : (occ >= 25 || users >= 5 ? ' hot' : (occ >= 5 || users >= 2 ? ' warm' : ' calm'));
      var browser = errBrowserName(g.browser_info);

      var h = '<div class="ceo-err-row' + (g.noise ? ' is-noise' : '') + '" id="errRow' + idx + '">';
      h += '<div class="ceo-err-plain">' + esc(g.plain_summary || g.error_message || 'Unknown error') + '</div>';

      h += '<div class="ceo-err-meta">';
      h += '<span class="ceo-err-chip' + heat + '">' + occ + '&times; seen</span>';
      h += '<span class="ceo-err-chip' + heat + '">' + (users > 0 ? 'at least ' + users + ' affected' : 'nobody identified') + '</span>';
      h += '<span class="ceo-err-chip">' + esc(String(g.source || 'client') === 'server' ? 'Server-side' : 'In the browser') + '</span>';
      h += '<span class="ceo-err-chip">first ' + esc(errTimeAgo(g.first_seen_at)) + '</span>';
      h += '<span class="ceo-err-chip">last ' + esc(errTimeAgo(g.last_seen_at)) + '</span>';
      if (browser) h += '<span class="ceo-err-chip">' + esc(browser) + '</span>';
      h += '<span class="ceo-err-chip">' + esc(g.status || 'open') + '</span>';
      h += '</div>';

      if (g.noise && g.noise_reason) {
        h += '<div class="ceo-err-noise-note">Why this is not a bug: ' + esc(g.noise_reason) + '</div>';
      }

      h += '<div class="ceo-err-tech"><b>Where:</b> ' + esc(g.page_url || 'unknown') + '</div>';
      h += '<div class="ceo-err-tech"><b>Technical message:</b> ' + esc(g.error_message || '—') + '</div>';
      if (g.user_context) h += '<div class="ceo-err-tech"><b>Context:</b> ' + esc(g.user_context) + '</div>';

      // Stack trace is noise for a non-technical reader — collapsed by default.
      if (g.error_stack) {
        h += '<details class="ceo-err-stack"><summary>Show the technical stack trace (for a developer)</summary>'
          + '<pre>' + esc(g.error_stack) + '</pre></details>';
      }

      h += '<div class="ceo-err-actions">';
      if (g.status !== 'investigating') h += '<span class="ceo-err-btn" onclick="triageErr(' + idx + ',\'investigating\',this)">Looking into it</span>';
      if (g.status !== 'resolved') h += '<span class="ceo-err-btn primary" onclick="triageErr(' + idx + ',\'resolved\',this)">Mark fixed</span>';
      if (g.status !== 'ignored') h += '<span class="ceo-err-btn" onclick="triageErr(' + idx + ',\'ignored\',this)">Ignore</span>';
      if (g.status !== 'open') h += '<span class="ceo-err-btn" onclick="triageErr(' + idx + ',\'open\',this)">Reopen</span>';
      h += '<span class="ceo-err-tech" id="errMsg' + idx + '" style="margin-top:0"></span>';
      h += '</div>';
      h += '</div>';
      return h;
    }

    // Uses the EXISTING triage endpoint. A grouped row can cover several DB rows
    // (same signature written twice), so every id in the group is sent.
    function triageErr(idx, status, btn) {
      var g = errView.groups[idx];
      if (!g || !g.id) return;
      var msgEl = document.getElementById('errMsg' + idx);
      if (btn) { btn.setAttribute('disabled', 'disabled'); btn.textContent = 'Saving…'; }
      apiFetch('/api/ceo/technical/client-errors/' + encodeURIComponent(g.id), {
        method: 'PUT',
        body: { status: status, ids: g.ids || [g.id] }
      }).then(function (d) {
        if (!d || !d.ok) {
          if (msgEl) msgEl.innerHTML = '<span style="color:var(--red)">Could not save: ' + esc((d && d.message) || 'unknown error') + '</span>';
          if (btn) { btn.removeAttribute('disabled'); btn.textContent = 'Retry'; }
          return;
        }
        g.status = status;
        // 'open'/'all' lists should drop a row that no longer matches the filter.
        if (errView.status !== 'all' && errView.status !== status) {
          errView.groups = errView.groups.filter(function (x) { return x !== g; });
        }
        renderClientErrorsView();
      }).catch(function (e) {
        if (msgEl) msgEl.innerHTML = '<span style="color:var(--red)">Error: ' + esc(e.message) + '</span>';
        if (btn) { btn.removeAttribute('disabled'); btn.textContent = 'Retry'; }
      });
    }

    function sendErrorDigestNow(btn) {
      if (btn) { btn.setAttribute('disabled', 'disabled'); btn.textContent = 'Sending…'; }
      apiFetch('/api/ceo/error-digest/send', { method: 'POST', body: {} }).then(function (d) {
        if (!btn) return;
        btn.removeAttribute('disabled');
        btn.textContent = (d && d.ok && d.sent) ? 'Sent — check your inbox'
          : 'Failed: ' + esc((d && d.message) || 'unknown');
      }).catch(function (e) {
        if (btn) { btn.removeAttribute('disabled'); btn.textContent = 'Failed: ' + e.message; }
      });
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FIXES TO APPROVE (Technical tab → AI fix proposals)
       Every 24h the app reads the open client errors, asks the AI what is wrong
       and how it would fix each one, and emails the owner a short summary with
       "Approve" and "Investigate further". "Investigate further" deep-links to
       THIS view (/pages/ceo-dashboard?tab=fixes), which shows the fuller write-up
       per bug with a per-bug tick box and one big "Approve all" button.
       Approving is what starts the automatic fix, so it always asks first.

       API (server.js + lib/error-fix-proposals.js, verified against that code):
         GET  /api/ceo/error-fix-proposals[?status=a,b]  -> { ok, proposals:[…] }
              failure -> 500/503 { ok:false, table_missing, message }
         POST /api/ceo/error-fix-proposals/approve { ids:[…] }
              -> { ok, approved, already, failed }   (counts, not rows)
         POST /api/ceo/error-fix-proposals/reject  { id, reason }
              -> ONE id per call, so a bulk reject is sent one at a time.
         POST /api/ceo/error-fix-proposals/run     -> analyse + email on demand.
       Row columns (per migration 20260720120000): id, error_hash, error_message,
       page_url, error_source, occurrence_count, affected_users, first_seen_at,
       last_seen_at, plain_explanation, technical_diagnosis, proposed_fix,
       suspect_files, ai_model, model_risk, risk_class(safe_auto|needs_review),
       risk_reason, risk_downgraded, status, approved_by/at, rejected_by/at,
       rejection_reason, branch_name, pr_url, execution_error, created_at.
       NOTE the names: risk_class (not "risk"), error_source (not "source"),
       pr_url/branch_name (not "branch_url"). There is no error_stack column.

       HONESTY RULE (same lesson as the errors view): a failed read must never be
       drawn as "nothing to approve". Every failure path below says so out loud.
       ═══════════════════════════════════════════════════════════════════════ */
    var fixView = { status: 'proposed', proposals: [], selected: {}, banner: null, busy: false, highlightId: null };
    var FIX_API = '/api/ceo/error-fix-proposals';

    var FIX_STATUS_TEXT = {
      proposed: { label: 'Waiting for your decision', cls: '' },
      approved: { label: 'Approved — fix in progress', cls: 'working' },
      in_progress: { label: 'Fix in progress', cls: 'working' },
      shipped: { label: 'Fixed and shipped', cls: 'good' },
      rejected: { label: 'You said no to this one', cls: '' },
      failed: { label: 'The automatic fix failed — a person needs to look', cls: 'bad' }
    };
    function fixStatusText(s) { return FIX_STATUS_TEXT[String(s || 'proposed')] || { label: String(s || 'unknown'), cls: '' }; }
    // Only a proposal still sitting at "proposed" can be approved or rejected.
    function fixIsPending(p) { return String((p && p.status) || 'proposed') === 'proposed'; }
    // The server column is risk_class; `risk` is tolerated in case the shape moves.
    function fixRiskOf(p) { return String((p && (p.risk_class || p.risk)) || 'needs_review'); }
    // Never show the raw enum to the owner.
    function fixRiskChip(risk) {
      return String(risk || '') === 'safe_auto'
        ? '<span class="ceo-err-chip risk-safe">Safe to fix automatically</span>'
        : '<span class="ceo-err-chip risk-review">Needs a closer look</span>';
    }
    // pr_url comes from the server but is rendered into an href — only ever allow
    // plain http(s) so a javascript: value can never become a live link.
    function fixSafeUrl(u) {
      var s = String(u == null ? '' : u).trim();
      return /^https?:\/\//i.test(s) ? s : '';
    }

    function openFixProposalsView(status, highlightId) {
      if (status) fixView.status = status;
      if (highlightId !== undefined) fixView.highlightId = highlightId == null ? null : String(highlightId);
      fixView.banner = null;
      var c = document.getElementById('techContent');
      if (!c) return;
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading the fixes waiting for you…</div></div>';
      // The server takes a comma-separated status list; 'all' means "send none".
      var qs = fixView.status && fixView.status !== 'all' ? '?status=' + encodeURIComponent(fixView.status) : '';
      apiFetch(FIX_API + qs).then(function (d) {
        c = document.getElementById('techContent');
        if (!c) return;
        if (!d || !d.ok) {
          c.innerHTML = fixLoadFailedHtml((d && d.message) || 'The server did not say why.', d && d.table_missing);
          return;
        }
        // Same guard as the errors view: the server read failed, so we know
        // nothing — say that instead of drawing a reassuring empty list.
        if (d.fetch_failed || !Array.isArray(d.proposals)) {
          c.innerHTML = fixLoadFailedHtml(d.fetch_error || d.message || 'The list came back in a form we do not understand.');
          return;
        }
        fixView.proposals = d.proposals;
        fixView.selected = {};
        renderFixProposalsView();
        fixScrollToHighlight();
      }).catch(function (e) {
        var cc = document.getElementById('techContent');
        if (cc) cc.innerHTML = fixLoadFailedHtml(e && e.message ? e.message : 'unknown error');
      });
    }

    // The ONLY place a load failure is rendered. Deliberately loud, and explicit
    // that this is not the same as "there is nothing to approve".
    function fixLoadFailedHtml(detail, tableMissing) {
      return errViewHead('Fixes to approve')
        + '<div class="ceo-err-note" style="border-left:3px solid var(--red);padding-left:12px">'
        + '<b>The list of fixes could not be loaded.</b><br>'
        + 'This does <b>not</b> mean there is nothing waiting for you — it means we could not read the list at all, '
        + 'so nothing can be shown or approved until that is fixed.'
        + (tableMissing
          ? ' The database table this feature needs has not been created yet, so the feature is not switched on.'
          : ' If this feature has only just been switched on, the approvals service may not be live yet.')
        + '<br><span class="mono" style="opacity:.75">' + esc(detail) + '</span></div>'
        + '<div class="ceo-err-toolbar"><span class="ceo-err-btn" onclick="openFixProposalsView()">Try again</span>'
        + '<span class="ceo-err-btn" onclick="loadTechnical()">Back to Technical</span></div>';
    }

    // Deep link from the email names one proposal — bring it into view and mark it.
    function fixScrollToHighlight() {
      if (!fixView.highlightId) return;
      var i = -1;
      (fixView.proposals || []).forEach(function (p, n) { if (p && String(p.id) === fixView.highlightId) i = n; });
      if (i < 0) return;
      var el = document.getElementById('fixRow' + i);
      if (!el) return;
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    }

    function renderFixProposalsView() {
      var c = document.getElementById('techContent');
      if (!c) return;
      var list = fixView.proposals || [];
      var pending = list.filter(fixIsPending);
      var selected = fixSelectedIds();

      var html = errViewHead('Fixes to approve');
      html += '<div class="ceo-err-note">'
        + 'Each card below is one problem the app found by itself, explained in plain words, with the fix it wants to make. '
        + 'Tick the ones you are happy with, or use <b>Approve all</b>. '
        + 'Approving is what actually starts the fix — nothing is changed until you do.'
        + '</div>';

      if (fixView.banner) {
        html += '<div class="ceo-fix-banner ' + esc(fixView.banner.kind || '') + '">' + esc(fixView.banner.text) + '</div>';
      }

      html += '<div class="ceo-err-toolbar">';
      ['proposed', 'approved', 'in_progress', 'shipped', 'rejected', 'failed', 'all'].forEach(function (st) {
        var labels = { proposed: 'Waiting', approved: 'Approved', in_progress: 'In progress', shipped: 'Shipped', rejected: 'Turned down', failed: 'Failed', all: 'All' };
        html += '<span class="ceo-err-filter' + (fixView.status === st ? ' active' : '') + '" onclick="openFixProposalsView(\'' + st + '\')">'
          + esc(labels[st]) + '</span>';
      });
      html += '<span style="flex:1"></span>';
      html += '<span class="ceo-err-btn" onclick="fixRunAnalysis(this)">Look for new problems now</span>';
      html += '<span class="ceo-err-btn" onclick="openClientErrorsView()">See the raw errors</span>';
      html += '</div>';

      if (pending.length) {
        var canAct = !fixView.busy && selected.length > 0;
        html += '<div class="ceo-fix-top">'
          + '<button type="button" class="ceo-fix-approve-all" id="fixApproveAllBtn"' + (fixView.busy ? ' disabled' : '')
          + ' onclick="fixApprove(\'all\')">' + (fixView.busy ? 'Working…' : 'Approve all (' + pending.length + ')') + '</button>'
          + '<span class="ceo-err-btn" id="fixApproveSelBtn"' + (canAct ? ' onclick="fixApprove(\'selected\')"' : ' disabled')
          + '>Approve selected (' + selected.length + ')</span>'
          + '<span class="ceo-err-btn" id="fixRejectSelBtn"' + (canAct ? ' onclick="fixReject(\'selected\')"' : ' disabled')
          + '>Turn down selected (' + selected.length + ')</span>'
          + '<span class="ceo-err-btn" id="fixTickAllBtn" onclick="fixSelectAll(' + (selected.length === pending.length ? 'false' : 'true') + ')">'
          + (selected.length === pending.length ? 'Clear ticks' : 'Tick all') + '</span>'
          + '</div>';
      }

      if (!list.length) {
        // Reached ONLY on a successful read that returned zero rows — the failure
        // paths above return before this point.
        html += '<div class="drilldown-empty">'
          + (fixView.status === 'proposed'
            ? 'Nothing is waiting for your approval right now. That is good news — the list loaded fine, it is simply empty.'
            : 'The list loaded fine — there is nothing in this category.')
          + '</div>';
      } else {
        html += list.map(function (p, i) { return renderFixRow(p, i); }).join('');
      }
      c.innerHTML = html;
    }

    function fixSelectedIds() {
      var out = [];
      (fixView.proposals || []).forEach(function (p) {
        if (p && p.id != null && fixView.selected[String(p.id)] && fixIsPending(p)) out.push(String(p.id));
      });
      return out;
    }

    function renderFixRow(p, idx) {
      var pending = fixIsPending(p);
      var occ = Number(p.occurrence_count) || 0;
      var users = Number(p.affected_users) || 0;
      var heat = (occ >= 25 || users >= 5) ? ' hot' : (occ >= 5 || users >= 2 ? ' warm' : ' calm');
      var st = fixStatusText(p.status);
      var checked = p.id != null && fixView.selected[String(p.id)] ? ' checked' : '';
      var isTarget = fixView.highlightId && String(p.id) === fixView.highlightId;

      var h = '<div class="ceo-err-row ceo-fix-row' + (isTarget ? ' is-target' : '') + '" id="fixRow' + idx + '">';
      if (isTarget) h += '<div class="ceo-fix-target-note">This is the one from your email.</div>';

      // 1. The plain explanation is the headline — the owner is not an engineer.
      h += '<div class="ceo-fix-head">';
      if (pending) {
        h += '<input type="checkbox" class="ceo-fix-check" id="fixChk' + idx + '"' + checked
          + ' onclick="fixToggle(' + idx + ',this.checked)" aria-label="Select this fix">';
      }
      h += '<div class="ceo-fix-plain">' + esc(p.plain_explanation || p.plain_summary || p.error_message || 'No explanation was written for this one.') + '</div>';
      h += '</div>';

      // 2. Who it hits and how often.
      h += '<div class="ceo-err-meta">';
      h += fixRiskChip(fixRiskOf(p));
      h += '<span class="ceo-err-chip' + heat + '">' + (occ ? occ + '&times; seen' : 'count unknown') + '</span>';
      h += '<span class="ceo-err-chip' + heat + '">' + (users > 0 ? 'at least ' + users + ' affected' : 'nobody identified') + '</span>';
      if (p.last_seen_at) h += '<span class="ceo-err-chip">last ' + esc(errTimeAgo(p.last_seen_at)) + '</span>';
      if (p.first_seen_at) h += '<span class="ceo-err-chip">first ' + esc(errTimeAgo(p.first_seen_at)) + '</span>';
      if (p.page_url) h += '<span class="ceo-err-chip">' + esc(p.page_url) + '</span>';
      if (p.error_source) h += '<span class="ceo-err-chip">' + esc(String(p.error_source) === 'server' ? 'Server-side' : 'In the browser') + '</span>';
      h += '<span class="ceo-err-chip">suggested ' + esc(errTimeAgo(p.created_at)) + '</span>';
      h += '</div>';

      // Why the app decided this is not automatically safe — the guardrail can
      // only ever downgrade the model's own claim, and the owner should see that.
      if (fixRiskOf(p) !== 'safe_auto' && p.risk_reason) {
        h += '<div class="ceo-err-noise-note">Why it needs a closer look: ' + esc(p.risk_reason)
          + (p.risk_downgraded ? ' (the AI called this safe; the app overruled it)' : '') + '</div>';
      }

      // 3. Where it stands right now, so a tap is never left in limbo.
      h += '<div class="ceo-fix-state ' + st.cls + '" id="fixState' + idx + '">' + esc(st.label);
      if (p.approved_by && String(p.status || '') !== 'proposed') h += ' &middot; approved by ' + esc(p.approved_by);
      if (p.rejected_by && String(p.status || '') === 'rejected') h += ' &middot; turned down by ' + esc(p.rejected_by);
      if (p.branch_name) h += ' &middot; branch <span class="mono">' + esc(p.branch_name) + '</span>';
      var url = fixSafeUrl(p.pr_url || p.branch_url);
      if (url) h += ' &middot; <a href="' + escAttr(url) + '" target="_blank" rel="noopener noreferrer">See the code change</a>';
      if (p.execution_error) h += '<br><span style="color:var(--red)">The fix run reported: ' + esc(p.execution_error) + '</span>';
      h += '</div>';

      // 4. Detail, collapsed by default — same idiom as the errors view.
      if (p.technical_diagnosis) {
        h += '<details class="ceo-err-stack"><summary>What the AI thinks is wrong (technical)</summary>'
          + '<pre>' + esc(p.technical_diagnosis) + '</pre></details>';
      }
      if (p.proposed_fix) {
        h += '<details class="ceo-err-stack"><summary>The fix it wants to make</summary>'
          + '<pre>' + esc(p.proposed_fix) + '</pre></details>';
      }
      if (p.error_message || p.error_stack) {
        h += '<details class="ceo-err-stack"><summary>The original error (for a developer)</summary>'
          + '<pre>' + esc(p.error_message || '') + (p.error_stack ? '\n\n' + esc(p.error_stack) : '') + '</pre></details>';
      }
      // suspect_files is JSONB — render defensively, it is model-influenced.
      if (p.suspect_files && p.suspect_files.length) {
        h += '<details class="ceo-err-stack"><summary>The files it looked at</summary><pre>';
        (Array.isArray(p.suspect_files) ? p.suspect_files : []).forEach(function (f) {
          if (f && typeof f === 'object') h += esc(String(f.file || '') + (f.startLine ? ':' + f.startLine + '-' + (f.endLine || f.startLine) : '')) + '\n';
          else h += esc(String(f)) + '\n';
        });
        h += '</pre>' + (p.ai_model ? '<div class="ceo-err-tech">Written by ' + esc(p.ai_model) + '</div>' : '') + '</details>';
      }

      h += '<div class="ceo-err-actions">';
      if (pending) {
        h += '<span class="ceo-err-btn primary" onclick="fixApprove(' + idx + ')">Approve this one</span>';
        h += '<span class="ceo-err-btn" onclick="fixReject(' + idx + ')">Not this one</span>';
      }
      h += '<span class="ceo-err-tech" id="fixMsg' + idx + '" style="margin-top:0"></span>';
      h += '</div>';
      h += '</div>';
      return h;
    }

    function fixToggle(idx, on) {
      var p = (fixView.proposals || [])[idx];
      if (!p || p.id == null) return;
      if (on) fixView.selected[String(p.id)] = true; else delete fixView.selected[String(p.id)];
      fixSyncToolbar();
    }

    function fixSelectAll(on) {
      fixView.selected = {};
      (fixView.proposals || []).forEach(function (p, i) {
        if (!fixIsPending(p) || p.id == null) return;
        if (on) fixView.selected[String(p.id)] = true;
        var box = document.getElementById('fixChk' + i);
        if (box) box.checked = !!on;
      });
      fixSyncToolbar();
    }

    // Patch the toolbar in place rather than re-rendering the whole list — a full
    // re-render would slam every open <details> shut under the owner's cursor.
    function fixSyncToolbar() {
      var pending = (fixView.proposals || []).filter(fixIsPending);
      var selected = fixSelectedIds();
      var canAct = !fixView.busy && selected.length > 0;
      var ap = document.getElementById('fixApproveSelBtn');
      var rj = document.getElementById('fixRejectSelBtn');
      var tick = document.getElementById('fixTickAllBtn');
      if (ap) {
        ap.textContent = 'Approve selected (' + selected.length + ')';
        if (canAct) { ap.removeAttribute('disabled'); ap.setAttribute('onclick', "fixApprove('selected')"); }
        else { ap.setAttribute('disabled', 'disabled'); ap.removeAttribute('onclick'); }
      }
      if (rj) {
        rj.textContent = 'Turn down selected (' + selected.length + ')';
        if (canAct) { rj.removeAttribute('disabled'); rj.setAttribute('onclick', "fixReject('selected')"); }
        else { rj.setAttribute('disabled', 'disabled'); rj.removeAttribute('onclick'); }
      }
      if (tick) {
        var allOn = pending.length > 0 && selected.length === pending.length;
        tick.textContent = allOn ? 'Clear ticks' : 'Tick all';
        tick.setAttribute('onclick', 'fixSelectAll(' + (allOn ? 'false' : 'true') + ')');
      }
    }

    // Resolve what the owner is acting on: a row index, 'selected', or 'all'.
    function fixTargets(scope) {
      var list = (fixView.proposals || []).filter(fixIsPending);
      if (scope === 'all') return list;
      if (scope === 'selected') {
        var ids = {};
        fixSelectedIds().forEach(function (id) { ids[id] = true; });
        return list.filter(function (p) { return ids[String(p.id)]; });
      }
      var one = (fixView.proposals || [])[scope];
      return (one && fixIsPending(one) && one.id != null) ? [one] : [];
    }

    // Approving starts REAL code changes to a live app, so it always confirms
    // first and always says how many, and how many are not automatically safe.
    function fixApprove(scope) {
      if (fixView.busy) return;
      var targets = fixTargets(scope);
      if (!targets.length) { fixView.banner = { kind: 'bad', text: 'Nothing was selected, so nothing was approved.' }; renderFixProposalsView(); return; }
      var risky = targets.filter(function (p) { return fixRiskOf(p) !== 'safe_auto'; });
      var msg = 'Approve ' + targets.length + ' fix' + (targets.length === 1 ? '' : 'es') + '?\n\n'
        + 'This starts real code changes to the live app.\n\n';
      if (risky.length) {
        msg += risky.length + ' of them ' + (risky.length === 1 ? 'is' : 'are') + ' marked "needs a closer look" — '
          + 'the AI is not confident ' + (risky.length === 1 ? 'it' : 'they') + ' can be fixed safely on ' + (risky.length === 1 ? 'its' : 'their') + ' own.\n\n';
      } else {
        msg += 'All of them are marked safe to fix automatically.\n\n';
      }
      msg += targets.slice(0, 5).map(function (p) { return '• ' + String(p.plain_explanation || p.error_message || 'Unnamed problem').slice(0, 110); }).join('\n');
      if (targets.length > 5) msg += '\n• …and ' + (targets.length - 5) + ' more';
      if (!window.confirm(msg)) return;
      fixSubmit('approve', targets, 'approved');
    }

    function fixReject(scope) {
      if (fixView.busy) return;
      var targets = fixTargets(scope);
      if (!targets.length) { fixView.banner = { kind: 'bad', text: 'Nothing was selected, so nothing was turned down.' }; renderFixProposalsView(); return; }
      if (!window.confirm('Turn down ' + targets.length + ' fix' + (targets.length === 1 ? '' : 'es') + '?\n\n'
        + 'No code will be changed. The underlying error stays on the errors list.')) return;
      fixSubmit('reject', targets, 'rejected');
    }

    function fixSubmit(action, targets, newStatus) {
      var ids = targets.map(function (p) { return String(p.id); });
      var n = ids.length;
      fixView.busy = true;
      fixView.banner = { kind: '', text: (action === 'approve' ? 'Approving ' : 'Turning down ') + n + ' fix' + (n === 1 ? '' : 'es') + '… please wait.' };
      renderFixProposalsView();

      // approve takes the whole batch; reject takes ONE id per call, so a bulk
      // turn-down is sent one at a time and the results are added up.
      var work = action === 'approve'
        ? apiFetch(FIX_API + '/approve', { method: 'POST', body: { ids: ids } }).then(function (d) {
            if (!d || !d.ok) return { ok: false, message: (d && d.message) || 'unknown error' };
            return { ok: true, done: Number(d.approved || 0) + Number(d.already || 0), failed: Number(d.failed || 0), okIds: ids };
          })
        : Promise.all(ids.map(function (id) {
            return apiFetch(FIX_API + '/reject', { method: 'POST', body: { id: id } })
              .then(function (d) { return { id: id, ok: !!(d && d.ok) }; })
              .catch(function () { return { id: id, ok: false }; });
          })).then(function (rs) {
            var good = rs.filter(function (r) { return r.ok; });
            return { ok: good.length > 0, done: good.length, failed: rs.length - good.length, okIds: good.map(function (r) { return r.id; }),
                     message: good.length ? '' : 'the server turned down every request' };
          });

      work.then(function (r) {
        fixView.busy = false;
        if (!r.ok) {
          fixView.banner = { kind: 'bad', text: 'Nothing was changed — the server rejected it: ' + (r.message || 'unknown error') };
          renderFixProposalsView();
          return;
        }
        // Reflect the new state inline so the owner can see the tap registered.
        var done = {};
        (r.okIds || []).forEach(function (id) { done[String(id)] = true; });
        (fixView.proposals || []).forEach(function (p) {
          if (p && p.id != null && done[String(p.id)]) p.status = newStatus;
        });
        fixView.selected = {};
        var verb = action === 'approve' ? 'approved' : 'turned down';
        var txt = r.done + ' fix' + (r.done === 1 ? '' : 'es') + ' ' + verb + '.';
        txt += action === 'approve'
          ? ' The fix' + (r.done === 1 ? '' : 'es') + ' will start automatically — this list shows the progress.'
          : ' Nothing was changed in the app.';
        // Never round a partial failure up into a clean success.
        if (r.failed) txt = r.done + ' of ' + n + ' ' + verb + ' — ' + r.failed + ' could not be saved. Re-open this page to see what actually stuck.';
        fixView.banner = { kind: r.failed ? 'bad' : 'good', text: txt };
        renderFixProposalsView();
      }).catch(function (e) {
        fixView.busy = false;
        fixView.banner = { kind: 'bad', text: 'We could not tell the server. Nothing has been confirmed as changed — check again before re-trying. (' + (e && e.message ? e.message : 'unknown error') + ')' };
        renderFixProposalsView();
      });
    }

    // On-demand version of the 24h job: analyse the open errors again and re-send
    // the summary email. Mirrors the errors view's "Email me this now" button.
    function fixRunAnalysis(btn) {
      if (!window.confirm('Look for new problems now?\n\nThis re-reads the open errors, asks the AI about them and emails you the summary. It does NOT change any code.')) return;
      if (btn) { btn.setAttribute('disabled', 'disabled'); btn.textContent = 'Looking…'; }

    /* Deep-link into this view. The daily bug email's "Investigate further"
       button sends /pages/ceo-dashboard?tab=technical&proposal=<id> (see
       sendErrorFixProposalEmail in server.js) — that is the contract that must
       work. ?tab=fixes and #fixes are accepted too as plain entry points.

       With a named proposal we load status=all, not just 'proposed': the owner may
       have already approved it from the email, and landing on "nothing here" after
       clicking a link about a specific bug would be misleading.

       The ATS master-tab switcher may still be initialising, and loadTechnical()'s
       own fetch would clobber us, so the Technical panel is opened WITHOUT its
       loader (setActiveTab skipLoad=true) and this view is rendered instead. */
    function openFixesDeepLink(proposalId, tries) {
      var n = typeof tries === 'number' ? tries : 60;
      if (window.ATS && typeof window.ATS.setActiveTab === 'function') {
        try { window.ATS.setActiveTab('technical', true); } catch (e) {}
        if (proposalId) openFixProposalsView('all', proposalId);
        else openFixProposalsView('proposed', null);
        return;
      }
      if (n > 0) setTimeout(function () { openFixesDeepLink(proposalId, n - 1); }, 50);
    }
    try {
      var _fixQs = new URLSearchParams(location.search);
      var _fixTabParam = _fixQs.get('tab');
      var _fixProposal = _fixQs.get('proposal');
      var _fixHash = ('' + (location.hash || '')).replace(/^#/, '');
      if (_fixProposal) openFixesDeepLink(_fixProposal);
      else if (_fixTabParam === 'fixes' || _fixTabParam === 'fix-proposals' || _fixHash === 'fixes') openFixesDeepLink(null);
      // The shared switcher ignores #fixes (it is not one of its master panels),
      // so handle later hash changes to it ourselves.
      window.addEventListener('hashchange', function () {
        if (('' + (location.hash || '')).replace(/^#/, '') === 'fixes') openFixesDeepLink(null);
      });
    } catch (e) {}

    /* ── Open bugs detail view ──
       Backed by the system_bugs table via GET /api/ceo/technical/system-bugs,
       with triage through the existing PUT .../system-bugs/:id.
       HONEST NOTE (shown in the UI too): nothing in this codebase WRITES to
       system_bugs automatically — the only writer is POST /api/ceo/technical/
       scan-results, which no cron or script currently calls. So this list is
       only ever populated by a manual scan upload, which is why it reads 0. */
    function openSystemBugsView(status) {
      var sbStatus = status || 'open';
      var c = document.getElementById('techContent');
      if (!c) return;
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading bugs…</div></div>';
      gpSwr('/api/ceo/technical/system-bugs?status=' + encodeURIComponent(sbStatus), function (d) {
        c = document.getElementById('techContent');
        if (!c) return;
        var html = errViewHead('Code-scan bugs');
        if (!d || !d.ok) {
          c.innerHTML = html + '<div class="drilldown-empty">Could not load bugs: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var bugs = Array.isArray(d.bugs) ? d.bugs : [];
        html += '<div class="ceo-err-note">These come from an automated code scan writing into the <code>system_bugs</code> table. '
          + '<b>Nothing currently runs that scan</b> — the upload endpoint exists but no scheduled job calls it, so this list stays empty '
          + 'unless a scan is uploaded by hand. The live problems doctors actually hit are under “Client errors”.</div>';
        html += '<div class="ceo-err-toolbar">';
        ['open', 'acknowledged', 'fixed', 'dismissed', 'all'].forEach(function (st) {
          html += '<span class="ceo-err-filter' + (sbStatus === st ? ' active' : '') + '" onclick="openSystemBugsView(\'' + st + '\')">'
            + esc(st.charAt(0).toUpperCase() + st.slice(1)) + '</span>';
        });
        html += '</div>';
        if (!bugs.length) {
          html += '<div class="drilldown-empty">No ' + esc(sbStatus === 'all' ? '' : sbStatus) + ' bugs recorded.</div>';
        } else {
          html += bugs.map(function (b) {
            var sev = String(b.severity || 'medium');
            var heat = (sev === 'critical' || sev === 'high') ? ' hot' : (sev === 'medium' ? ' warm' : ' calm');
            var s = '<div class="ceo-err-row">';
            s += '<div class="ceo-err-plain">' + esc(b.title || 'Untitled finding') + '</div>';
            s += '<div class="ceo-err-meta"><span class="ceo-err-chip' + heat + '">' + esc(sev) + '</span>'
              + '<span class="ceo-err-chip">' + esc(b.category || 'general') + '</span>'
              + '<span class="ceo-err-chip">' + esc(b.status || 'open') + '</span>'
              + '<span class="ceo-err-chip">found ' + esc(errTimeAgo(b.created_at)) + '</span></div>';
            if (b.description) s += '<div class="ceo-err-tech">' + esc(b.description) + '</div>';
            if (b.file_path) s += '<div class="ceo-err-tech"><b>Where in the code:</b> ' + esc(b.file_path) + (b.line_number ? ':' + esc(b.line_number) : '') + '</div>';
            if (b.suggestion) s += '<div class="ceo-err-tech"><b>Suggested fix:</b> ' + esc(b.suggestion) + '</div>';
            s += '<div class="ceo-err-actions">'
              + '<span class="ceo-err-btn" onclick="triageBug(\'' + esc(b.id) + '\',\'acknowledged\',this)">Acknowledge</span>'
              + '<span class="ceo-err-btn primary" onclick="triageBug(\'' + esc(b.id) + '\',\'fixed\',this)">Mark fixed</span>'
              + '<span class="ceo-err-btn" onclick="triageBug(\'' + esc(b.id) + '\',\'dismissed\',this)">Dismiss</span>'
              + '</div></div>';
            return s;
          }).join('');
        }
        c.innerHTML = html;
      }).catch(function (e) {
        var cc = document.getElementById('techContent');
        if (cc) cc.innerHTML = errViewHead('Code-scan bugs') + '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // DB stage progression (mirrors lib/ceo-metrics.js DB_STAGE_ORDER) used to order
    // the Tasks sub-tab groups; visa shares pbs's slot, complete sits above the funnel.
    var GP_TASK_STAGE_ORDER = { myintealth: 0, amc: 1, career: 2, ahpra: 3, pbs: 4, visa: 4, commencement: 5, complete: 6 };
    var GP_TASK_DONE_STATUSES = ['completed', 'cancelled'];

    // Pure mirror of lib/ceo-metrics.js gpTasksByStage (the authoritative, unit-tested
    // contract): filter completed/cancelled unless showAll, group by related_stage in
    // DB stage order (unknown stages after, no-stage bucket '__none__' last), preserving
    // input order within a group, annotating each task with an overdue flag.
    function gpTasksByStage(tasks, showAll) {
      var order = [];
      var groups = {};
      function bucket(key) { if (!groups[key]) { groups[key] = []; order.push(key); } return groups[key]; }
      (tasks || []).forEach(function(t) {
        if (!t) return;
        if (!showAll && GP_TASK_DONE_STATUSES.indexOf(t.status) !== -1) return;
        var key = t.related_stage ? String(t.related_stage) : '__none__';
        var due = opsDueIndicator(t.due_date);
        var isDone = GP_TASK_DONE_STATUSES.indexOf(t.status) !== -1;
        var row = {}; for (var k in t) { if (Object.prototype.hasOwnProperty.call(t, k)) row[k] = t[k]; }
        row.__overdue = !isDone && due.overdue && !!t.due_date;
        row.__dueLabel = due.label;
        bucket(key).push(row);
      });
      function rank(key) {
        if (key === '__none__') return [2, 0];
        if (GP_TASK_STAGE_ORDER[key] !== undefined) return [0, GP_TASK_STAGE_ORDER[key]];
        return [1, order.indexOf(key)];
      }
      return order.slice().sort(function(a, b) {
        var ra = rank(a), rb = rank(b);
        return ra[0] - rb[0] || ra[1] - rb[1];
      }).map(function(key) { return { stage: key, tasks: groups[key] }; });
    }

    function gpTaskStageLabel(stage) {
      if (stage === '__none__') return 'No stage';

    var STAGE_ORDER = ['onboarding', 'career', 'placement', 'myintealth', 'amc', 'ahpra', 'visa', 'pbs', 'commencement'];

    // Stage labels for the parity grouping (admin.html STEPS 1533–1541 + onboarding/other).
    // Independent of STAGE_LABELS (which keys on DB stages: 'career', '__none__').
    var PARITY_STAGE_LABELS = {
      career: 'Career', placement: 'Secure Placement', myintealth: 'MyIntealth', amc: 'AMC Portfolio',
      ahpra: 'AHPRA Registration', visa: 'Visa Application', pbs: 'PBS & Medicare',
      commencement: 'Commencement', onboarding: 'Onboarding', practice_contact: 'Medical Practice Contact', other: 'Other'
    };

    // Port of admin.html groupTasksByStage (2566–2584): bucket tasks by related_stage in
    // STAGE_ORDER, with everything off-stage collected into a trailing 'other' group.
    function groupTasksByStage(tasks) {
      var groups = new Map();
      var other = [];
      var practiceContact = [];
      (tasks || []).forEach(function(t) {
        // The supervised-practice document set — the practice pack (SPPA-00, Section G, Position
        // Description, Supervisor CV, Offer/Contract) and the alternate-supervisor CV tasks — is
        // part of the AHPRA application, so group it under AHPRA even though practice-pack tasks are
        // stamped 'career' at placement-secured time. (Mirrors admin.html groupTasksByStage.)
        var stage = (t && (t.task_type === 'practice_pack_child' || t.task_type === 'alt_supervisor_cv_request' || t.task_type === 'alt_supervisor_cv_review')) ? 'ahpra' : ((t && t.related_stage) || '');
        if (stage === 'practice_contact') {
          practiceContact.push(t);
        } else if (stage && STAGE_ORDER.indexOf(stage) !== -1) {
          if (!groups.has(stage)) groups.set(stage, []);
          groups.get(stage).push(t);
        } else {
          other.push(t);
        }
      });
      var result = [];
      // Practice correspondence is cross-cutting (not a registration stage) — surface it at
      // the top of the GP's task list, mirroring admin.html groupTasksByStage.
      if (practiceContact.length) result.push({ stage: 'practice_contact', tasks: practiceContact });
      STAGE_ORDER.forEach(function(s) {
        if (groups.has(s)) result.push({ stage: s, tasks: groups.get(s) });
      });
      if (other.length) result.push({ stage: 'other', tasks: other });
      return result;
    }

    // Qualification-document keys the GP uploads themselves — a "Review uploaded: X" task

      'primary_medical_degree', 'specialist_qualification', 'cct_certificate',
      'onboarding_primary_med_degree', 'onboarding_specialist_qualification', 'onboarding_cct_certificate',
      'mrcgp_certified', 'cct_certified', 'micgp_certified', 'cscst_certified', 'frnzcgp_certified',
      'icgp_confirmation_letter', 'rnzcgp_confirmation_letter',
      'certificate_good_standing', 'certificate_of_good_standing',
      'confirmation_training', 'confirmation_of_training',
      'mrcgp', 'cct', 'micgp', 'cscst', 'frnzcgp'

    function isQualDocReviewTask(t) {

    // Port of admin.html getGuidedAction (2608–2676): the per-task guided prompt + primary
    // action button. Reads only task fields (all present in gpDetailCache.tasks rows).
    function getGuidedAction(t) {
      var dk = t.related_document_key;
      var hasAttachment = !!(t.attachment_url || t.zoho_attachment_id);
      var hasHtml = !!t.document_html;

      if (t.task_type === 'flagged_doc') {
        return { prompt: 'Review the document, then approve or reject (the GP is emailed)', label: 'Review Document', action: 'reviewFlaggedDoc', taskId: t.id };
      }
      if (isQualDocReviewTask(t)) {
        return { prompt: 'Review the uploaded document, then approve or reject (the GP is emailed)', label: 'Review Document', action: 'reviewFlaggedDoc', taskId: t.id };
      }
      // Alternate-supervisor CV REQUEST tracker (carries related_document_key='sppa_00'):
      // intercept before the practice-doc branch so it is not mistaken for the SPPA-00 task
      // and wrongly offered a "Send SPPA" button. Read-only — status only, no action.
      if (t.task_type === 'alt_supervisor_cv_request') {
        if (t.status === 'completed') return { prompt: 'Alternate supervisor CV received', label: 'Done', action: null, taskId: t.id };
        return { prompt: 'Send the practice a request for the alternate supervisor’s CV', label: 'Waiting', action: null, taskId: t.id };
      }

        }
        // The practice has ALREADY replied (recorded by the inbound-mail path). Everything
        // below describes the state before they answered, so falling through would re-print
        // "Email the practice requesting X" and walk the user into sending a duplicate of an
        // email the practice already answered. Mirrors admin.html getGuidedAction.
        // An emailed document lands in task_documents, NOT task.attachment_url, so the
        // hasAttachment checks below never see it — practice_reply.has_document does.
        // Skipped once the task is back in a waiting_* status: we have already answered their
        // reply, so the waiting pill should win. A fresh reply flips it back to open server-side.
        var _prMeta = t.metadata; if (typeof _prMeta === 'string') { try { _prMeta = JSON.parse(_prMeta); } catch (e) { _prMeta = null; } }
        var _pr = (_prMeta && _prMeta.practice_reply) || null;

        }

          if (hasHtml) return { prompt: 'Review the generated position description and approve', label: 'Edit & Review', action: 'editPD', taskId: t.id };
          if (hasAttachment) return { prompt: 'Review the uploaded position description', label: 'Review Doc', action: 'previewDoc', taskId: t.id };
          if (t.status === 'waiting_on_practice') return { prompt: 'Waiting on practice to send the position description', label: 'Waiting', action: null, taskId: t.id };
          return { prompt: 'Email the practice requesting the Position Description', label: 'Email Practice', action: 'emailPractice', taskId: t.id, dk: dk };
        }
        if (hasAttachment && t.gmail_message_id) {

        }
        if (hasAttachment) {
          return { prompt: 'Review the uploaded document and approve', label: 'Review Doc', action: 'previewDoc', taskId: t.id };
        }
        if (t.status === 'waiting_on_practice') {
          return { prompt: 'Waiting on practice to send the document', label: 'Waiting', action: null, taskId: t.id };
        }
        var docLabel = dk === 'offer_contract' ? 'Contract' : 'Supervisor CV';
        return { prompt: 'Email the practice requesting the ' + docLabel, label: 'Email Practice', action: 'emailPractice', taskId: t.id, dk: dk };
      }
      if (t.task_type === 'verify') {
        return { prompt: 'Review the evidence and verify', label: 'Review', action: 'completeTask', taskId: t.id };
      }

      }
      if (t.task_type === 'blocker' || t.task_type === 'escalation') {

      }
      if (t.task_type === 'whatsapp_help') {

    // Port of admin.html extractEmailAddr / callSchedulableStageForTask / scheduleCallButtonHtml
    // (9302–9333). The "Schedule call?" button only shows for GP-originated assistance tasks
    // (whatsapp_help / GP-sender email_triage) in the myintealth/amc/ahpra stages. The onclick
    // target scheduleCallFromTask is wired in Task 3d.4.
    function extractEmailAddr(s) {
      if (!s) return '';
      var str = String(s);
      var m = str.match(/<([^>]+)>/);
      if (m) return m[1].trim().toLowerCase();
      var tok = str.split(/[\s,;]+/).find(function(x) { return x.indexOf('@') > -1; });
      return (tok || str).trim().toLowerCase();

    function callSchedulableStageForTask(t, gpEmail) {
      if (!t || !t.case_id) return null;
      if (t.task_type !== 'whatsapp_help' && t.task_type !== 'email_triage') return null;
      var stage = String(t.related_stage || '').toLowerCase();
      if (['myintealth', 'amc', 'ahpra'].indexOf(stage) === -1) return null;
      if (t.task_type === 'email_triage') {
        var sender = extractEmailAddr(t.email_sender || '');
        var gp = String(gpEmail || '').trim().toLowerCase();
        if (!sender || !gp || sender !== gp) return null;
      }
      return stage;
    }
    function scheduleCallButtonHtml(t, gpEmail) {
      var stage = callSchedulableStageForTask(t, gpEmail);
      if (!stage) return '';
      var label = ({ myintealth: 'MyIntealth', amc: 'AMC', ahpra: 'AHPRA' })[stage] || stage;
      return '<button type="button" class="st-schedule-call-btn" onclick="event.stopPropagation();scheduleCallFromTask(\'' + esc(t.id) + '\',\'' + esc(t.case_id) + '\',\'' + esc(stage) + '\')" title="Send this GP a Zoom booking link with a message that a call would best guide them through the ' + esc(label) + ' stage">📞 Schedule call?</button>';
    }

    // Minimal URL guards for the ••• dropdown's WhatsApp link (ports admin safeUrl/isDtUrl,
    // 1520–1532): only allow http(s)/whatsapp protocols, and only treat doubletick.io links
    // as WhatsApp conversation URLs. esc() the result for safe HTML-attribute interpolation.
    function ceoSafeUrl(u) {
      if (!u || typeof u !== 'string') return '#';
      var raw = u.trim();
      if (!raw || /[\x00-\x1f\x7f]/.test(raw)) return '#';
      var m = /^([a-z][a-z0-9+.-]*):/i.exec(raw);
      var proto = m ? m[1].toLowerCase() : '';
      if (['https', 'http', 'whatsapp'].indexOf(proto) === -1) return '#';
      return esc(raw);
    }
    function ceoIsDtUrl(u) {
      if (!u || typeof u !== 'string') return false;
      try { var h = new URL(u).hostname; return h === 'doubletick.io' || h.endsWith('.doubletick.io'); }
      catch (e) { return false; }
    }

    // Schedule-call control (port of admin scheduleCallFromTask): instead of POSTing the

    function scheduleCallFromTask(taskId, caseId, stage) {
      if (!caseId || !stage) { showToast('Cannot schedule: missing case or stage', 'error'); return; }
      var cs = (gpDetailCache && gpDetailCache.case) || {};
      var userId = cs.user_id || (gpDetailCache && gpDetailCache.userId) || '';
      openCeoZoomModal(caseId, userId, stage, { originTaskId: taskId, autoSuggestReason: true });

    // Render the cached tasks[] for the open GP file as an RSO-parity layout (admin.html

    // Statuses hidden from the GP-file Tasks tab by default (the "Show all" toggle reveals
    // them). Mirrors the RSO/admin view, which only loads active tasks (open / in_progress /
    // waiting* / escalated): completed + cancelled are history, and 'deferred' practice-pack
    // tasks (e.g. SPPA-00 + Section G, before the conflict scan activates them) are not yet
    // live — the RSO never surfaces them (/api/admin/tasks omits 'deferred'), so neither do we.
    var GP_PARITY_HIDDEN_STATUSES = ['complete', 'completed', 'cancelled', 'deferred'];

    function renderGpTasksTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var cs = (gpDetailCache && gpDetailCache.case) || {};
      var all = (gpDetailCache && gpDetailCache.tasks) || [];
      // Active tasks only by default (admin always hides done + deferred); Show-all reveals them.
      var tasks = all.filter(function(t) {
        return t && (gpTasksShowAll || GP_PARITY_HIDDEN_STATUSES.indexOf(t.status) === -1);
      });
      var stageGroups = groupTasksByStage(tasks);
      var shownCount = tasks.length;

      var html = '<div class="ceo-ops-section-head">Tasks <span class="count">' + shownCount + '</span>';
      html += '<button class="btn ceo-gp-tasks-toggle" id="gpTasksToggle" style="margin-left:auto">' + (gpTasksShowAll ? 'Hide completed' : 'Show all') + '</button>';
      html += '</div>';

      var currentStage = cs.stage || '';
      var currentIdx = STAGE_ORDER.indexOf(currentStage);
      var gpEmail = cs.gp_email || '';

      stageGroups.forEach(function(group) {

          var waitingDays = isWaiting && t.updated_at ? Math.floor((Date.now() - new Date(t.updated_at).getTime()) / 86400000) : 0;
          var needsNudge = isWaiting && waitingDays >= 7;

          var due = opsDueIndicator(t.due_date);
          var isOverdue = t.is_overdue || (!!t.due_date && due.overdue);
          var isNext = isFirstActiveTask;
          if (isNext) isFirstActiveTask = false;

          // Tasks with an interactive task-detail panel (Task 3d.6): clicking the row expands

          // practice_pack_child (except section_g) + AHPRA + alt-supervisor-CV.
          var hasDetailPanel = (t.task_type === 'practice_pack_child' && t.related_document_key && t.related_document_key !== 'section_g') || t.task_type === 'ahpra_correspondence' || t.task_type === 'ahpra_action_item' || t.task_type === 'alt_supervisor_cv_review' || t.task_type === 'alt_supervisor_cv_request' || t.task_type === 'ahpra_conflict_letter';
          html += '<div class="stage-task' + (isNext ? ' active-next' : '') + (t.task_type === 'email_triage' ? ' unlocked-email' : '') + (isWaiting ? ' st-waiting-state' : '') + '" data-task-row="' + esc(t.id) + '"' + (hasDetailPanel ? ' data-gp-expand-task="' + esc(t.id) + '" style="cursor:pointer"' : '') + '>';

          html += '<div class="st-body">';

          if (isUrgent) html += '<span class="urgent-badge">urgent</span>';
          if (isOverdue) html += '<span class="overdue-badge">overdue</span>';
          html += '</div>';

          if (t.attachment_url && t.attachment_filename) {
            var rawConf = (typeof t.ai_confidence === 'number') ? t.ai_confidence : t.ai_match_confidence;
            var conf = (typeof rawConf === 'number') ? Math.round(rawConf * 100) : 0;

          if (t.task_type === 'alt_supervisor_cv_request') {
            var _acrMeta = t.metadata; if (typeof _acrMeta === 'string') { try { _acrMeta = JSON.parse(_acrMeta); } catch (e) { _acrMeta = {}; } }

            html += '<div><span class="tp escalated" style="display:inline-flex;align-items:center;border-radius:4px;padding:2px 8px;width:auto;height:auto;font-size:0.75rem;">🚨 Escalated</span></div>';
          }

            var waitLabel = t.status === 'waiting_on_practice' ? 'Waiting on practice' : t.status === 'waiting_on_gp' ? 'Waiting on GP' : 'Waiting on external';

    // Hydrate zoom_call task placeholders on the Tasks pane with the rich call card
    // (renderGpCallCard) — parity with admin.html's fillZoomTaskCards (9276). Fetches the
    // case's calls and fills each placeholder with the most-recent call for that task.
    function fillCeoZoomTaskCards() {

    // Email-triage expanded panel markup (port of admin renderGpTasksPane 2797–2831, dark).

    function renderCeoEmailPanel(t, cs, openTaskCount) {

      if (gmailUrl) h += '<a class="btn sm" href="' + ceoSafeUrl(gmailUrl) + '" target="_blank" rel="noopener" style="margin-top:8px">🔗 Open in Gmail</a>';

      h += '<div class="et-section"><div class="et-section-title">GP Context</div>';

      // Notes the draft flagged for the RSO sit outside the textarea so they cannot be sent.
      h += '<div id="et-rso-notes-' + esc(t.id) + '" style="display:none;margin-bottom:6px;padding:8px 10px;border:1px solid #fcd34d;background:#fffbeb;border-radius:8px;font-size:12px;color:#78350f"></div>';

      h += '<span class="et-note">This is a suggestion — edit as needed before sending.</span></div>';
      h += '</div></div>';

      h += '<div class="et-resolve-error" id="et-error-' + esc(t.id) + '" style="display:none;color:var(--red);font-size:12px;font-weight:600;background:var(--red-dim);padding:6px 10px;border-radius:6px;margin-left:8px">No email reply found — please reply via Gmail before resolving.</div>';
