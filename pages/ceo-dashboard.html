<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO Command Centre - GP Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --bg-elevated: #13151e;
      --panel: #1a1d27;
      --panel-hover: #1f2233;
      --panel-border: rgba(255,255,255,0.06);
      --panel-border-hover: rgba(255,255,255,0.12);
      --text: #e2e8f0;
      --text-muted: rgba(255,255,255,0.5);
      --text-dim: rgba(255,255,255,0.3);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.15);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.12);
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 40px; }

    /* ═══ HEADER ═══ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(15,17,23,0.98), rgba(15,17,23,0.92));
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: grid; place-items: center;
      font-size: 14px; font-weight: 800; color: #fff;
      letter-spacing: -0.03em;
      box-shadow: 0 0 20px rgba(96,165,250,0.25);
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header-title span { color: var(--text-muted); font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .time-filter-bar { display: flex; align-items: center; gap: 6px; padding: 8px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--panel-border); }
    .time-filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-right: 4px; }
    .time-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--panel-border); background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .time-btn:hover { border-color: var(--blue); color: var(--text); }
    .time-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    /* ═══ STANDALONE TOP NAV ═══ */
    .ceo-topnav { display: flex; align-items: center; gap: 4px; padding: 0 24px; background: var(--bg-elevated); border-bottom: 1px solid var(--panel-border); position: sticky; top: 60px; z-index: 90; }
    .ceo-topnav a, .ceo-topnav .nav-item { padding: 11px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .ceo-topnav .nav-item:hover, .ceo-topnav a:hover { color: var(--text); }
    .ceo-topnav .nav-item.active { color: var(--text); border-bottom-color: var(--blue); }
    .ceo-topnav .nav-spacer { flex: 1; }
    .ceo-topnav .nav-back { color: var(--text-dim); font-weight: 500; }
    .escalation-badge {
      display: none;
      align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.3);
      font-size: 11px; font-weight: 700; color: var(--red);
      cursor: pointer;
      transition: all 0.15s;
      animation: pulse-red 2s ease-in-out infinite;
    }
    .escalation-badge.visible { display: inline-flex; }
    .escalation-badge:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .refresh-meta {
      font-size: 11px; color: var(--text-dim);
      font-family: var(--mono);
      display: flex; align-items: center; gap: 8px;
    }
    .refresh-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: blink-dot 3s ease-in-out infinite;
    }
    .refresh-dot.paused { background: var(--amber); animation: none; }
    @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .auto-toggle {
      appearance: none; -webkit-appearance: none;
      width: 32px; height: 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      position: relative; cursor: pointer;
      transition: all 0.2s;
    }
    .auto-toggle::after {
      content: '';
      position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%; background: var(--text-muted);
      transition: all 0.2s;
    }
    .auto-toggle:checked { background: var(--blue-dim); border-color: rgba(96,165,250,0.4); }
    .auto-toggle:checked::after { left: 16px; background: var(--blue); }

    /* ═══ CONTENT ═══ */
    .content { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

    /* ═══ KPI STRIP ═══ */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--panel-border);
      transition: background 0.2s;
    }
    .kpi-card:hover { border-color: var(--panel-border-hover); transform: translateY(-1px); }
    .kpi-card.accent-blue::before { background: var(--blue); }
    .kpi-card.accent-green::before { background: var(--green); }
    .kpi-card.accent-red::before { background: var(--red); }
    .kpi-card.accent-amber::before { background: var(--amber); }
    .kpi-card.accent-purple::before { background: var(--purple); }
    .kpi-card.highlight-red { border-color: rgba(239,68,68,0.3); background: linear-gradient(180deg, rgba(239,68,68,0.06), var(--panel)); }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .kpi-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi-trend {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .kpi-trend.up { color: var(--green); }
    .kpi-trend.down { color: var(--red); }
    .kpi-trend.flat { color: var(--text-dim); }

    /* ═══ ESCALATION BANNER ═══ */
    .escalation-banner {
      display: none;
      margin-bottom: 20px;
      background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.04));
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .escalation-banner.visible { display: block; }
    .escalation-banner:hover { border-color: rgba(239,68,68,0.35); background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(239,68,68,0.06)); }
    .escalation-banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .escalation-banner-left { display: flex; align-items: center; gap: 10px; }
    .esc-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--red-dim);
      display: grid; place-items: center;
      font-size: 14px;
    }
    .esc-count {
      font-size: 13px; font-weight: 700; color: var(--red);
    }
    .esc-names {
      font-size: 12px; color: var(--text-muted); font-weight: 500;
      max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .esc-expand-hint {
      font-size: 11px; color: var(--text-dim); font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .esc-expand-hint .arrow { transition: transform 0.2s; }
    .escalation-banner.expanded .esc-expand-hint .arrow { transform: rotate(180deg); }

    /* ═══ ESCALATION PANEL (expanded) ═══ */
    .escalation-panel {
      display: none;
      margin-top: 12px;
      border-top: 1px solid rgba(239,68,68,0.15);
      padding-top: 12px;
    }
    .escalation-banner.expanded .escalation-panel { display: block; }
    .esc-item {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .esc-item:hover { border-color: rgba(255,255,255,0.08); }
    .esc-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .esc-item-info { flex: 1; min-width: 200px; }
    .esc-item-gp { font-size: 13px; font-weight: 700; }
    .esc-item-title { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .esc-item-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
    .esc-item-meta span { display: flex; align-items: center; gap: 4px; }
    .esc-item-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    /* ═══ SECTION GRID ═══ */
    .section-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .section-grid .full-width { grid-column: 1 / -1; }

    /* ═══ SECTION CARD ═══ */
    .section-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.2s;
    }
    .section-card:hover { border-color: var(--panel-border-hover); }
    .section-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 0;
    }
    .section-card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px;
    }
    .section-card-title .icon {
      width: 20px; height: 20px;
      border-radius: 5px;
      display: grid; place-items: center;
      font-size: 11px;
    }
    .section-card-body { padding: 14px 18px 18px; }

    /* ═══ PIPELINE FUNNEL ═══ */
    .funnel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: -6px;
      margin-right: -6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .funnel-row:hover { background: rgba(255,255,255,0.03); }
    .funnel-row:last-child { margin-bottom: 0; }
    .funnel-label {
      width: 100px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .funnel-bar-wrap {
      flex: 1;
      height: 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      position: relative;
    }
    .funnel-bar {
      height: 100%;
      border-radius: 4px;
      min-width: 2px;
      transition: width 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
    }
    .funnel-bar.blue { background: linear-gradient(90deg, rgba(96,165,250,0.5), rgba(96,165,250,0.3)); }
    .funnel-bar.purple { background: linear-gradient(90deg, rgba(167,139,250,0.5), rgba(167,139,250,0.3)); }
    .funnel-bar.amber { background: linear-gradient(90deg, rgba(251,191,36,0.5), rgba(251,191,36,0.3)); }
    .funnel-bar.green { background: linear-gradient(90deg, rgba(52,211,153,0.5), rgba(52,211,153,0.3)); }
    .funnel-bar.red { background: linear-gradient(90deg, rgba(239,68,68,0.5), rgba(239,68,68,0.3)); }
    .funnel-count {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }
    .funnel-blocked {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      width: 24px;
      flex-shrink: 0;
    }

    /* ═══ BLOCKERS LIST ═══ */
    .blocker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--panel-border);
      gap: 8px;
    }
    .blocker-row:last-child { border-bottom: none; }
    .blocker-gp { font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .blocker-stage { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .blocker-days {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
    }
    .blocker-reason {
      font-size: 11px;
      color: var(--text-dim);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ═══ TASK HEALTH 2x2 ═══ */
    .task-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .task-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .task-cell-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .task-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ RSO WORKLOAD ═══ */
    .va-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .va-row:last-child { margin-bottom: 0; }
    .va-name { font-size: 12px; font-weight: 600; width: 80px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .va-bar-wrap {
      flex: 1; height: 18px; border-radius: 4px;
      background: rgba(255,255,255,0.04); overflow: hidden;
    }
    .va-bar {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      transition: width 0.5s;
    }
    .va-stats {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      width: 80px;
      text-align: right;
      flex-shrink: 0;
    }
    .va-stats .overdue { color: var(--red); }

    /* ═══ VELOCITY ═══ */
    .velocity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .velocity-row:last-child { border-bottom: none; }
    .velocity-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .velocity-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }
    .velocity-sample { font-size: 10px; color: var(--text-dim); margin-left: 6px; }

    /* ═══ PLACEMENTS 2x2 ═══ */
    .placements-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .placement-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .placement-cell:hover { border-color: var(--panel-border-hover); background: rgba(255,255,255,0.04); }
    .placement-cell-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .placement-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ GP ACTIVITY ═══ */
    .activity-buckets { display: flex; gap: 8px; }
    .activity-bucket {
      flex: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .activity-bucket:hover { border-color: var(--panel-border-hover); }
    .activity-bucket-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .activity-bucket-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .cold-list { margin-top: 10px; }
    .cold-gp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 11px;
      border-bottom: 1px solid var(--panel-border);
    }
    .cold-gp:last-child { border-bottom: none; }
    .cold-gp-name { font-weight: 600; }
    .cold-gp-days { font-family: var(--mono); font-weight: 700; color: var(--amber); }

    /* ═══ TICKETS ═══ */
    .tickets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ticket-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .ticket-cell-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .ticket-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ COMPLETIONS ═══ */
    .completions-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 12px;
    }
    .completion-stat {
      text-align: center;
    }
    .completion-stat-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      color: var(--green);
    }
    .completion-stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
    }
    .milestones-list { flex: 1; }
    .milestone-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .milestone-text { font-size: 12px; font-weight: 500; flex: 1; }
    .milestone-text strong { font-weight: 700; }
    .milestone-ago {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ═══ DRILLDOWN PANEL ═══ */
    .drilldown-panel {
      display: none;
      margin-top: 2px;
      border-top: 1px solid var(--panel-border);
      padding: 14px 18px;
      background: rgba(0,0,0,0.15);
      max-height: 400px;
      overflow-y: auto;
    }
    .drilldown-panel.open { display: block; }
    .drilldown-loading {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .drilldown-empty {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .dd-row {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .dd-row:hover { border-color: var(--panel-border-hover); }
    .dd-row:last-child { margin-bottom: 0; }
    .dd-row-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      gap: 8px;
    }
    .dd-row-name { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-row-pills { display: flex; gap: 4px; flex-shrink: 0; }
    .dd-row-expand { font-size: 10px; color: var(--text-dim); flex-shrink: 0; transition: transform 0.2s; }
    .dd-row.expanded .dd-row-expand { transform: rotate(180deg); }
    .dd-row-detail {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--panel-border);
    }
    .dd-row.expanded .dd-row-detail { display: block; }
    .dd-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .dd-field-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
    .dd-field-value { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .dd-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    /* ═══ BUTTONS ═══ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--sans);
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
    .btn.btn-blue { color: var(--blue); border-color: rgba(96,165,250,0.3); background: var(--blue-dim); }
    .btn.btn-blue:hover { background: rgba(96,165,250,0.2); }
    .btn.btn-red { color: var(--red); border-color: rgba(239,68,68,0.3); background: var(--red-dim); }
    .btn.btn-red:hover { background: rgba(239,68,68,0.2); }
    .btn.btn-green { color: var(--green); border-color: rgba(52,211,153,0.3); background: var(--green-dim); }
    .btn.btn-green:hover { background: rgba(52,211,153,0.2); }
    .btn.btn-amber { color: var(--amber); border-color: rgba(251,191,36,0.3); background: var(--amber-dim); }
    .btn.btn-amber:hover { background: rgba(251,191,36,0.2); }
    .btn.btn-purple { color: var(--purple); border-color: rgba(167,139,250,0.3); background: var(--purple-dim); }
    .btn.btn-purple:hover { background: rgba(167,139,250,0.2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ═══ PILL ═══ */
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .pill-blue { background: var(--blue-dim); color: var(--blue); }
    .pill-red { background: var(--red-dim); color: var(--red); }
    .pill-amber { background: var(--amber-dim); color: var(--amber); }
    .pill-green { background: var(--green-dim); color: var(--green); }
    .pill-purple { background: var(--purple-dim); color: var(--purple); }
    .pill-muted { background: rgba(255,255,255,0.06); color: var(--text-muted); }

    /* ═══ MODAL ═══ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .modal-field { margin-bottom: 12px; }
    .modal-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .modal-input, .modal-select, .modal-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 13px;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s;
    }
    .modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--blue); }
    .modal-select { appearance: auto; }
    .modal-textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* ═══ TOAST ═══ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }
    .toast {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toast-in 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      max-width: 320px;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--red); }
    .toast.info { border-left: 3px solid var(--blue); }
    .toast.removing { animation: toast-out 0.25s forwards; }
    @keyframes toast-in { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(40px); opacity: 0; } }

    /* ═══ LOADING STATE ═══ */
    .page-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
    }
    .page-loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-loading .loading-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ═══ RSO OVERSIGHT ═══ */
    .rso-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .rso-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; transition: all 0.15s; }
    .rso-card:hover { border-color: var(--panel-border-hover); transform: translateY(-1px); }
    .rso-card.inactive { opacity: 0.55; }
    .rso-card-name { font-size: 15px; font-weight: 700; }
    .rso-card-email { font-size: 12px; color: var(--text-dim); margin-top: 2px; word-break: break-all; }
    .rso-card-stats { display: flex; gap: 18px; margin-top: 14px; }
    .rso-card-stat { display: flex; flex-direction: column; }
    .rso-card-stat-value { font-size: 20px; font-weight: 700; font-family: var(--mono); }
    .rso-card-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
    .rso-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .rso-detail-back { font-size: 13px; color: var(--text-muted); cursor: pointer; }
    .rso-detail-back:hover { color: var(--text); }
    .rso-gp-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .rso-gp-row .name { font-weight: 600; flex: 1; }

    /* ═══ MEDICAL CENTRES (company-wide tab, read-only) ═══ */
    .ceo-mc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .ceo-mc-toggle { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); padding: 3px; }
    .ceo-mc-toggle-btn { padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-radius: 6px; cursor: pointer; transition: color 0.15s, background 0.15s; }
    .ceo-mc-toggle-btn:hover { color: var(--text); }
    .ceo-mc-toggle-btn.active { color: #fff; background: var(--blue); }
    .ceo-mc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .ceo-mc-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 18px; transition: border-color 0.15s, transform 0.15s; }
    .ceo-mc-card:hover { border-color: var(--panel-border-hover); transform: translateY(-1px); }
    .ceo-mc-name { font-size: 15px; font-weight: 700; }
    .ceo-mc-name a { color: var(--blue); text-decoration: none; }
    .ceo-mc-name a:hover { text-decoration: underline; }
    .ceo-mc-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .ceo-mc-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .ceo-mc-contact { font-size: 12px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; word-break: break-word; }
    .ceo-mc-contact-name { font-weight: 600; color: var(--text); }
    .ceo-mc-contact a { color: var(--text-muted); text-decoration: none; }
    .ceo-mc-contact a:hover { color: var(--text); text-decoration: underline; }
    .ceo-mc-stats { display: flex; gap: 18px; margin-top: 14px; }
    .ceo-mc-stat { display: flex; flex-direction: column; }
    .ceo-mc-stat-value { font-size: 20px; font-weight: 700; font-family: var(--mono); }
    .ceo-mc-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }

    /* ═══ PER-RSO OPS BOARD (under RSO Oversight) ═══ */
    .ceo-ops-section { margin-top: 22px; }
    .ceo-ops-section-head { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ceo-ops-section-head .count { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .ceo-ops-empty { padding: 14px 12px; font-size: 13px; color: var(--text-dim); border: 1px dashed var(--panel-border); border-radius: var(--radius-md, 8px); }
    .ceo-ops-group { border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); margin-bottom: 10px; overflow: hidden; background: var(--panel); }
    .ceo-ops-group-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; user-select: none; background: rgba(255,255,255,0.02); }
    .ceo-ops-group-head:hover { background: rgba(255,255,255,0.04); }
    .ceo-ops-group-caret { font-size: 11px; color: var(--text-muted); transition: transform 0.15s; }
    .ceo-ops-group.collapsed .ceo-ops-group-caret { transform: rotate(-90deg); }
    .ceo-ops-group-name { font-weight: 700; font-size: 13px; flex: 1; }
    .ceo-ops-group-count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .ceo-ops-group-body { border-top: 1px solid var(--panel-border); }
    .ceo-ops-group.collapsed .ceo-ops-group-body { display: none; }
    .ceo-ops-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .ceo-ops-row:last-child { border-bottom: none; }
    .ceo-ops-row-main { flex: 1; min-width: 0; }
    .ceo-ops-row-title { font-weight: 600; font-size: 13px; color: var(--text); }
    .ceo-ops-row-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ceo-ops-due { font-size: 11px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }
    .ceo-ops-due.overdue { color: var(--red); font-weight: 700; }
    .ceo-ops-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* ═══ PER-RSO SCHEDULED CALLS (matches .ceo-ops-* / .rso-gp-row) ═══ */
    .ceo-calls-section { margin-top: 22px; }
    .ceo-calls-section-head { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ceo-calls-section-head .count { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .ceo-calls-empty { padding: 14px 12px; font-size: 13px; color: var(--text-dim); border: 1px dashed var(--panel-border); border-radius: var(--radius-md, 8px); }
    .ceo-calls-group { border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); margin-bottom: 10px; overflow: hidden; background: var(--panel); }
    .ceo-calls-group-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.02); }
    .ceo-calls-group-name { font-weight: 700; font-size: 13px; flex: 1; }
    .ceo-calls-group-count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .ceo-calls-group-body { border-top: 1px solid var(--panel-border); }
    .ceo-calls-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .ceo-calls-row:last-child { border-bottom: none; }
    .ceo-calls-row-main { flex: 1; min-width: 0; }
    .ceo-calls-row-name { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ceo-calls-row-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ceo-calls-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }
    .ceo-calls-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ceo-calls-join { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #2D8CFF; color: #fff; border: 1px solid #2D8CFF; text-decoration: none; white-space: nowrap; }
    .ceo-calls-join:hover { background: #1f7ae0; }

    /* ═══ PER-RSO SUPPORT TICKETS (matches .ceo-ops-* / .ceo-calls-*) ═══ */
    .ceo-support-section { margin-top: 22px; }
    .ceo-support-section-head { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ceo-support-section-head .count { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .ceo-support-empty { padding: 14px 12px; font-size: 13px; color: var(--text-dim); border: 1px dashed var(--panel-border); border-radius: var(--radius-md, 8px); }
    .ceo-support-group { border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); margin-bottom: 10px; overflow: hidden; background: var(--panel); }
    .ceo-support-group-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.02); }
    .ceo-support-group-name { font-weight: 700; font-size: 13px; flex: 1; }
    .ceo-support-group-count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .ceo-support-group-body { border-top: 1px solid var(--panel-border); }
    .ceo-support-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .ceo-support-row:last-child { border-bottom: none; }
    .ceo-support-row-main { flex: 1; min-width: 0; }
    .ceo-support-row-title { font-weight: 600; font-size: 13px; color: var(--text); }
    .ceo-support-row-gp { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ceo-support-row-snippet { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
    .ceo-support-row-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
    .ceo-support-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; }
    .ceo-support-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* ═══ GP FILE (read-only) under an RSO ═══ */
    .rso-gp-row .name.gp-open-link { cursor: pointer; }
    .rso-gp-row .name.gp-open-link:hover { color: var(--blue); }
    .ceo-gp-detail-head { margin-bottom: 12px; }
    .ceo-gp-detail-back { font-size: 13px; }
    .ceo-gp-detail-profile { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; border: 1px solid var(--panel-border); border-radius: var(--radius-lg); background: var(--panel); }
    .ceo-gp-detail-id { flex: 1; min-width: 0; }
    .ceo-gp-detail-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .ceo-gp-detail-contact { font-size: 12px; color: var(--text-dim); margin-top: 4px; word-break: break-word; }
    .ceo-gp-detail-practice { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .ceo-gp-detail-pills { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
    .ceo-gp-detail-blocker { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border: 1px solid rgba(239,68,68,0.3); background: var(--red-dim); border-radius: var(--radius-md, 8px); }
    .ceo-gp-detail-blocker-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--red); }
    .ceo-gp-detail-blocker-reason { font-size: 13px; color: var(--text); }
    .ceo-gp-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .ceo-gp-detail-tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--panel-border); }
    .ceo-gp-detail-tab { padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: var(--sans); color: var(--text-muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; margin-bottom: -1px; }
    .ceo-gp-detail-tab:hover { color: var(--text); }
    .ceo-gp-detail-tab.active { color: var(--text); border-bottom-color: var(--blue); }
    .ceo-gp-detail-pane { margin-top: 16px; }
    .ceo-gp-detail-placeholder { padding: 14px 12px; }
    .ceo-gp-task-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ceo-gp-tasks-toggle { font-size: 11px; padding: 4px 10px; }
    .ceo-gp-detail-empty { padding: 14px 12px; font-size: 13px; color: var(--text-dim); border: 1px dashed var(--panel-border); border-radius: var(--radius-md, 8px); }
    /* Notes sub-tab */
    .ceo-gp-note { padding: 12px 14px; border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); background: var(--panel); margin-bottom: 8px; }
    .ceo-gp-note-body { font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-note-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--text-dim); }
    .ceo-gp-note-actor { font-weight: 600; color: var(--text-muted); }
    .ceo-gp-note-time { font-family: var(--mono); }
    /* Timeline sub-tab */
    .ceo-gp-tl-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .ceo-gp-tl-row:last-child { border-bottom: none; }
    .ceo-gp-tl-icon { flex-shrink: 0; font-size: 14px; line-height: 1.4; width: 18px; text-align: center; }
    .ceo-gp-tl-main { flex: 1; min-width: 0; }
    .ceo-gp-tl-title { font-weight: 600; font-size: 13px; color: var(--text); word-break: break-word; }
    .ceo-gp-tl-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-tl-who { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
    .ceo-gp-tl-time { font-size: 11px; color: var(--text-muted); font-family: var(--mono); white-space: nowrap; flex-shrink: 0; }
    /* Documents sub-tab */
    .ceo-gp-drive-link { font-size: 11px; color: var(--accent, #4a9eff); text-decoration: none; }
    .ceo-gp-drive-link:hover { text-decoration: underline; }
    .ceo-gp-doc-section { margin-top: 14px; }
    .ceo-gp-doc-section:first-of-type { margin-top: 8px; }
    .ceo-gp-doc-section-head { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
    .ceo-gp-doc-count { color: var(--text-dim); font-weight: 500; }
    .ceo-gp-doc-empty { padding: 8px 12px; font-size: 12px; color: var(--text-dim); }
    .ceo-gp-doc-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); background: var(--panel); margin-bottom: 6px; }
    .ceo-gp-doc-main { flex: 1; min-width: 0; }
    .ceo-gp-doc-label { font-weight: 600; font-size: 13px; color: var(--text); word-break: break-word; }
    .ceo-gp-doc-file { font-size: 11px; color: var(--text-dim); font-family: var(--mono); margin-top: 2px; word-break: break-all; }
    .ceo-gp-doc-view { font-size: 11px; padding: 4px 12px; flex-shrink: 0; }
    .ceo-gp-doc-noview { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .ceo-gp-doc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; flex-shrink: 0; }
    .ceo-gp-doc-actions .btn { font-size: 11px; padding: 4px 12px; }
    .ceo-doc-upload-btn { cursor: pointer; }

    .ceo-gp-call { padding: 12px 14px; border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); background: var(--panel); margin-bottom: 8px; }
    .ceo-gp-call-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ceo-gp-call-time { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
    .ceo-gp-call-join { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #2D8CFF; color: #fff; border: 1px solid #2D8CFF; text-decoration: none; white-space: nowrap; }
    .ceo-gp-call-join:hover { background: #1f7ae0; }
    .ceo-gp-call-rso { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    .ceo-gp-call-notes { margin-top: 6px; font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-call-summary { margin-top: 8px; padding: 8px 10px; font-size: 12px; color: var(--text); background: var(--panel-2, rgba(255,255,255,0.03)); border: 1px solid var(--panel-border); border-radius: var(--radius-sm, 6px); white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-call-summary-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .ceo-gp-call-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 1100px) {
      .section-grid { grid-template-columns: 1fr; }
      .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 680px) {
      .header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
      .content { padding: 14px; }
      .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .section-grid { gap: 12px; }
      .kpi-value { font-size: 22px; }
      .escalation-banner { padding: 10px 14px; }
      .placements-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
<script src="/js/error-reporter.js?v=20260615a"></script>
  <div class="page-wrap">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <div class="header-logo">GP</div>
        <div class="header-title">GP Link <span>Command Centre</span></div>
      </div>
      <div class="header-right">
        <div class="escalation-badge" id="headerEscBadge" title="Click to view escalations">
          <span>&#x26A0;</span>
          <span id="headerEscCount">0 escalations</span>
        </div>
        <div class="refresh-meta">
          <div class="refresh-dot" id="refreshDot"></div>
          <span id="refreshLabel">--</span>
        </div>
        <label title="Auto-refresh">
          <input type="checkbox" class="auto-toggle" id="autoRefreshToggle" checked />
        </label>
      </div>
    </header>

    <!-- STANDALONE TOP NAV -->
    <nav class="ceo-topnav" id="ceoTopNav">
      <div class="nav-item active" data-tab="overview">Overview</div>
      <div class="nav-item" data-tab="rsos">RSO Oversight</div>
      <a class="nav-item" href="/pages/admin?view=gps">GPs</a>
      <div class="nav-item" data-tab="medical">Medical Centres</div>
      <a class="nav-item" href="/pages/admin?view=support">Support</a>
      <a class="nav-item" href="/pages/admin?view=guide">Guide</a>
      <a class="nav-item" href="/pages/admin?view=scheduled_calls">Calls</a>
      <a class="nav-item" href="/pages/admin?view=technical">Technical</a>
    </nav>

    <!-- TIME FILTER -->
    <div class="time-filter-bar" id="timeFilterBar">
      <span class="time-filter-label">Period:</span>
      <button class="time-btn" data-period="current">Current</button>
      <button class="time-btn" data-period="7d">7 Days</button>
      <button class="time-btn" data-period="14d">14 Days</button>
      <button class="time-btn" data-period="30d">30 Days</button>
      <button class="time-btn active" data-period="all">All Time</button>
    </div>

    <!-- CONTENT -->
    <div class="content" id="mainContent">
      <div class="page-loading" id="pageLoading">
        <div class="spinner"></div>
        <div class="loading-text">Authenticating &amp; loading dashboard...</div>
      </div>
    </div>
    <div class="content" id="rsoContent" style="display:none"></div>
    <div class="content" id="mcContent" style="display:none"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       CEO COMMAND CENTRE — GP Link
       Single-file vanilla JS dashboard
       ═══════════════════════════════════════════════════════════════════ */

    /* ── Globals ── */
    var dashboardData = null;
    var trendsData = null;
    var autoRefresh = true;
    var lastRefreshAt = 0;
    var refreshTimerId = null;
    var trendTimerId = null;
    var refreshLabelTimerId = null;
    var activeDrilldown = null; // { section, param, cardEl }
    var currentPeriod = 'all';

    var STAGES = ['career', 'myintealth', 'amc', 'ahpra', 'pbs', 'commencement'];
    var STAGE_LABELS = { career: 'Secure Placement', myintealth: 'MyIntealth', amc: 'AMC Portfolio', ahpra: 'AHPRA Registration', pbs: 'PBS & Medicare', commencement: 'Commencement', complete: 'Complete', visa: 'Visa' };
    var STAGE_COLORS = { career: 'amber', myintealth: 'blue', amc: 'purple', ahpra: 'green', pbs: 'blue', commencement: 'purple', complete: 'green', visa: 'red' };

    /* ── Utilities ── */
    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(String(s)));
      return d.innerHTML;
    }

    function fmtNum(n) {
      if (n == null) return '--';
      return String(n);
    }

    function fmtDays(n) {
      if (n == null) return '--';
      return n + 'd';
    }

    function fmtHours(h) {
      if (h == null) return '--';
      if (h < 1) return '<1h';
      return h.toFixed(1) + 'h';
    }

    function relativeTime(iso) {
      if (!iso) return '--';
      var ms = Date.now() - new Date(iso).getTime();
      var days = Math.floor(ms / 86400000);
      if (days > 0) return days + 'd ago';
      var hours = Math.floor(ms / 3600000);
      if (hours > 0) return hours + 'h ago';
      var mins = Math.floor(ms / 60000);
      return mins + 'm ago';
    }

    function pillClass(stage) {
      var map = { myintealth: 'pill-blue', amc: 'pill-purple', career: 'pill-amber', ahpra: 'pill-green', visa: 'pill-red', pbs: 'pill-blue', commencement: 'pill-purple', complete: 'pill-green' };
      return map[stage] || 'pill-muted';
    }

    function priorityPill(p) {
      if (p === 'urgent') return '<span class="pill pill-red">urgent</span>';
      if (p === 'high') return '<span class="pill pill-amber">high</span>';
      if (p === 'low') return '<span class="pill pill-muted">low</span>';
      return '<span class="pill pill-muted">' + esc(p || 'normal') + '</span>';
    }

    function statusPill(s) {
      if (!s) return '';
      var c = 'pill-muted';
      var sl = (s || '').toLowerCase();
      if (sl === 'active' || sl === 'open' || sl === 'in_progress') c = 'pill-blue';
      else if (sl === 'blocked' || sl === 'escalated') c = 'pill-red';
      else if (sl === 'completed' || sl === 'complete' || sl === 'resolved') c = 'pill-green';
      else if (sl.indexOf('waiting') >= 0) c = 'pill-amber';
      return '<span class="pill ' + c + '">' + esc(s.replace(/_/g, ' ')) + '</span>';
    }

    /* ── API Helpers ── */
    function apiFetch(path, opts) {
      var o = opts || {};
      o.credentials = 'same-origin';
      if (o.body && typeof o.body === 'object' && !(o.body instanceof FormData)) {
        o.headers = o.headers || {};
        o.headers['Content-Type'] = 'application/json';
        o.body = JSON.stringify(o.body);
      }
      return fetch(path, o).then(function(r) { return r.json(); });
    }

    /* ── Auth Check ── */
    var isEmbedded = (window.self !== window.top);
    // Client-side check is defence-in-depth only; the server gate in server.js
    // (ceo-dashboard.html block) is authoritative and 302s to /pages/admin-signin.
    function checkAuth() {
      return apiFetch('/api/admin/auth/session').then(function(d) {
        if (!d.ok || !d.authenticated) {
          if (!isEmbedded) window.location.href = '/pages/admin-signin';
          return false;
        }
        var role = (d.profile && (d.profile.role || d.profile.adminRole)) || '';
        if (role !== 'super_admin') {
          if (!isEmbedded) window.location.href = '/pages/admin-signin';
          return false;
        }
        return true;
      }).catch(function() {
        if (!isEmbedded) window.location.href = '/pages/admin-signin';
        return false;
      });
    }

    /* ── Toast ── */
    function showToast(msg, type) {
      var c = document.getElementById('toastContainer');
      var t = document.createElement('div');
      t.className = 'toast ' + (type || 'info');
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(function() {
        t.classList.add('removing');
        setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
      }, 3000);
    }

    /* ── Modal ── */
    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('modalBox').innerHTML = '';
    }

    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    /* ── Render Dashboard ── */
    function renderDashboard(data) {
      dashboardData = data;
      var c = document.getElementById('mainContent');
      var html = '';

      // KPI Strip
      var kpi = data.kpi || {};
      var overdueHighlight = (kpi.overdue_tasks || 0) > 0 ? ' highlight-red' : '';
      html += '<div class="kpi-strip">';
      html += kpiCard('Total GPs', fmtNum(kpi.total_gps), 'accent-blue', 'total_gps');
      html += kpiCard('Placed', fmtNum(kpi.placed), 'accent-green', 'placed');
      html += kpiCard('Open Tasks', fmtNum(kpi.open_tasks), 'accent-blue', 'open_tasks');
      html += kpiCard('Overdue', fmtNum(kpi.overdue_tasks), 'accent-red' + overdueHighlight, 'overdue');
      html += kpiCard('Blocked', fmtNum(kpi.blocked_cases), 'accent-amber', 'blocked');
      html += kpiCard('Completed', fmtNum(kpi.completed_gps), 'accent-purple', 'completed');
      html += '</div>';

      // Escalation Banner
      var escs = data.escalations || [];
      html += renderEscalationBanner(escs);

      // Section Grid
      html += '<div class="section-grid">';
      html += renderPipelineSection(data.pipeline);
      html += renderBlockersSection(data.blockers);
      html += renderTaskHealthSection(data.task_health);
      html += renderRsoWorkloadSection(data.rso_workload || data.va_workload);
      html += renderVelocitySection(data.velocity);
      html += renderPlacementsSection(data.placements);
      html += renderActivitySection(data.gp_activity);
      html += renderTicketsSection(data.tickets);
      html += renderCompletionsSection(data.completions);
      html += '</div>';

      c.innerHTML = html;

      // Update header escalation badge
      var badge = document.getElementById('headerEscBadge');
      var badgeCount = document.getElementById('headerEscCount');
      if (escs.length > 0) {
        badge.classList.add('visible');
        badgeCount.textContent = escs.length + ' escalation' + (escs.length === 1 ? '' : 's');
      } else {
        badge.classList.remove('visible');
      }
    }

    // tile key -> { section, param, panel? } for the tiles that have a matching drilldown.
    // section = API drilldown section; panel (optional) = id suffix of the on-page
    // drilldown panel to render into when it differs from the section name.
    var kpiDrillMap = {
      placed: { section: 'placed', param: '', panel: 'placements' },
      open_tasks: { section: 'tasks', param: 'status=all_open' },
      overdue: { section: 'tasks', param: 'status=overdue' },
      blocked: { section: 'blockers', param: '' }
    };

    function kpiCard(label, value, accent, trendKey) {
      var trendHtml = '';
      if (trendsData && trendsData.weeks && trendsData.weeks.length >= 2) {
        var tw = trendsData.weeks[trendsData.weeks.length - 1];
        var lw = trendsData.weeks[trendsData.weeks.length - 2];
        var trendMap = {
          total_gps: 'new_gps',
          open_tasks: 'tasks_created',
          overdue: null,
          blocked: null,
          placed: 'placements_secured',
          completed: 'completions'
        };
        var field = trendMap[trendKey];
        if (field && tw && lw) {
          var cur = tw[field] || 0;
          var prev = lw[field] || 0;
          var diff = cur - prev;
          if (diff > 0) trendHtml = '<div class="kpi-trend up">&#x25B2; +' + diff + ' new this week</div>';
          else if (diff < 0) trendHtml = '<div class="kpi-trend down">&#x25BC; ' + diff + ' vs last week</div>';
          else trendHtml = '<div class="kpi-trend flat">&#x2014; unchanged</div>';
        }
      }
      var drill = kpiDrillMap[trendKey];
      var drillAttr = drill ? ' data-drilldown="' + drill.section + '" data-param="' + drill.param + '"' + (drill.panel ? ' data-panel="' + drill.panel + '"' : '') + ' style="cursor:pointer"' : '';
      return '<div class="kpi-card ' + accent + '"' + drillAttr + '>' +
        '<div class="kpi-label">' + esc(label) + '</div>' +
        '<div class="kpi-value">' + esc(value) + '</div>' +
        trendHtml +
        '</div>';
    }

    /* ── Escalation Banner ── */
    function renderEscalationBanner(escs) {
      if (!escs || escs.length === 0) return '';
      var names = escs.map(function(e) { return e.gp_name; }).join(', ');
      var html = '<div class="escalation-banner visible" id="escBanner" onclick="toggleEscBanner()">';
      html += '<div class="escalation-banner-row">';
      html += '<div class="escalation-banner-left">';
      html += '<div class="esc-icon">&#x1F6A8;</div>';
      html += '<span class="esc-count">' + escs.length + ' escalation' + (escs.length === 1 ? '' : 's') + ' require CEO attention</span>';
      html += '<span class="esc-names">' + esc(names) + '</span>';
      html += '</div>';
      html += '<div class="esc-expand-hint"><span class="arrow">&#x25BC;</span></div>';
      html += '</div>';

      html += '<div class="escalation-panel">';
      for (var i = 0; i < escs.length; i++) {
        var e = escs[i];
        html += '<div class="esc-item" data-task-id="' + esc(e.task_id) + '" data-case-id="' + esc(e.case_id) + '" data-user-id="' + esc(e.user_id) + '">';
        html += '<div class="esc-item-top">';
        html += '<div class="esc-item-info">';
        html += '<div class="esc-item-gp">' + esc(e.gp_name) + '</div>';
        html += '<div class="esc-item-title">' + esc(e.title) + '</div>';
        html += '<div class="esc-item-meta">';
        html += '<span><span class="pill ' + pillClass(e.stage) + '">' + esc(STAGE_LABELS[e.stage] || e.stage) + '</span></span>';
        html += '<span>' + priorityPill(e.priority) + '</span>';
        html += '<span>Escalated by ' + esc(e.escalated_by) + '</span>';
        html += '<span>' + relativeTime(e.escalated_at) + '</span>';
        if (e.reason) html += '<span style="color:var(--text-muted)">' + esc(e.reason) + '</span>';
        html += '</div>';
        html += '</div>';
        html += '</div>';
        html += '<div class="esc-item-actions">';
        html += '<button class="btn btn-green" onclick="resolveEscalation(\'' + esc(e.task_id) + '\')">Resolve</button>';
        html += '<button class="btn btn-blue" onclick="respondEscalation(\'' + esc(e.task_id) + '\', \'' + esc(e.gp_name) + '\')">Add Note &amp; Return</button>';
        html += '<button class="btn btn-amber" onclick="openReassignModal(\'' + esc(e.case_id) + '\')">Reassign</button>';
        html += '<button class="btn" onclick="openBlockerModal(\'' + esc(e.case_id) + '\')">Put On Hold</button>';
        html += '<button class="btn btn-purple" onclick="openNudgeModal(\'' + esc(e.user_id) + '\', \'' + esc(e.gp_name) + '\')">Send Nudge</button>';
        html += '</div>';
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';
      return html;
    }

    function toggleEscBanner() {
      var b = document.getElementById('escBanner');
      if (b) b.classList.toggle('expanded');
    }

    /* ── Pipeline Funnel ── */
    function renderPipelineSection(pipeline) {
      if (!pipeline) return '';
      // pipeline is now an array: [{key, label, count, blocked}, ...]
      var stages = Array.isArray(pipeline) ? pipeline : [];
      var maxCount = 1;
      for (var i = 0; i < stages.length; i++) {
        if (stages[i].count > maxCount) maxCount = stages[i].count;
      }
      var rows = '';
      for (var j = 0; j < stages.length; j++) {
        var sd = stages[j];
        var pct = maxCount > 0 ? Math.max(2, Math.round(sd.count / maxCount * 100)) : 2;
        if (sd.count === 0) pct = 0;
        var barColor = STAGE_COLORS[sd.key] || 'blue';
        rows += '<div class="funnel-row" data-drilldown="pipeline" data-param="stage=' + sd.key + '">';
        rows += '<span class="funnel-label">' + esc(sd.label || STAGE_LABELS[sd.key] || sd.key) + '</span>';
        rows += '<div class="funnel-bar-wrap"><div class="funnel-bar ' + barColor + '" style="width:' + pct + '%"></div></div>';
        rows += '<span class="funnel-count">' + sd.count + '</span>';
        rows += '<span class="funnel-blocked">' + (sd.blocked > 0 ? sd.blocked + '&#x1F6D1;' : '') + '</span>';
        rows += '</div>';
      }
      return sectionCard('pipeline', '&#x1F4CA;', 'Pipeline Funnel', rows);
    }

    /* ── Blockers ── */
    function renderBlockersSection(blockers) {
      if (!blockers) return '';
      var rows = '';
      if (blockers.length === 0) {
        rows = '<div style="padding:12px 0;font-size:12px;color:var(--text-dim)">No blockers right now</div>';
      } else {
        var list = blockers.slice(0, 8);
        for (var i = 0; i < list.length; i++) {
          var b = list[i];
          rows += '<div class="blocker-row">';
          rows += '<span class="blocker-gp">' + esc(b.gp_name) + '</span>';
          var bStage = b.stage === 'visa' ? 'pbs' : b.stage;
          rows += '<span class="blocker-stage">' + esc(STAGE_LABELS[bStage] || bStage) + '</span>';
          rows += '<span class="blocker-reason" title="' + esc(b.blocker_reason || b.blocker_status || '') + '">' + esc(b.blocker_reason || b.blocker_status || '--') + '</span>';
          rows += '<span class="blocker-days" title="Days blocked">' + fmtDays(b.days_blocked != null ? b.days_blocked : b.days_in_stage) + '</span>';
          rows += '</div>';
        }
        if (blockers.length > 8) {
          rows += '<div style="font-size:11px;color:var(--text-dim);margin-top:6px">+' + (blockers.length - 8) + ' more</div>';
        }
      }
      return sectionCard('blockers', '&#x1F6A7;', 'Blockers & Red Flags', rows);
    }

    /* ── Task Health ── */
    function renderTaskHealthSection(th) {
      if (!th) return '';
      var html = '<div class="task-grid">';
      html += taskCell(fmtNum(th.open), 'Open', 'var(--blue)');
      html += taskCell(fmtNum(th.in_progress), 'In Progress', 'var(--amber)');
      html += taskCell(fmtNum(th.completed_this_week), 'Done This Week', 'var(--green)');
      html += taskCell(fmtNum(th.overdue), 'Overdue', th.overdue > 0 ? 'var(--red)' : 'var(--text)');
      html += taskCell(th.avg_resolve_days != null ? th.avg_resolve_days.toFixed(1) + 'd' : '--', 'Avg Resolve', 'var(--text)');
      html += '</div>';
      return sectionCard('tasks', '&#x2705;', 'Task Health', html);
    }

    function taskCell(val, label, color) {
      return '<div class="task-cell">' +
        '<div class="task-cell-value" style="color:' + color + '">' + esc(val) + '</div>' +
        '<div class="task-cell-label">' + esc(label) + '</div></div>';
    }

    /* ── RSO Workload ── */
    function renderRsoWorkloadSection(rsos) {
      if (!rsos) return '';
      if (rsos.length === 0) return sectionCard('rso', '&#x1F464;', 'RSO Workload', '<div style="padding:12px 0;font-size:12px;color:var(--text-dim)">No RSOs assigned yet</div>');
      var maxCases = 1;
      for (var i = 0; i < rsos.length; i++) { if (rsos[i].case_count > maxCases) maxCases = rsos[i].case_count; }
      var html = '';
      for (var j = 0; j < rsos.length; j++) {
        var v = rsos[j];
        var pct = maxCases > 0 ? Math.round(v.case_count / maxCases * 100) : 0;
        html += '<div class="va-row" data-drilldown="rso" data-section="rso" data-param="rso_id=' + encodeURIComponent(v.rso_id || '') + '">';
        html += '<span class="va-name"' + (v.rso_email ? ' title="' + esc(v.rso_email) + '"' : '') + '>' + esc(v.rso_name) + '</span>';
        html += '<div class="va-bar-wrap"><div class="va-bar" style="width:' + pct + '%"></div></div>';
        html += '<span class="va-stats">' + v.case_count + ' cases' + (v.overdue_tasks > 0 ? ' <span class="overdue">' + v.overdue_tasks + ' OD</span>' : '') + '</span>';
        html += '</div>';
      }
      return sectionCard('rso', '&#x1F464;', 'RSO Workload', html);
    }

    /* ── Velocity ── */
    function renderVelocitySection(velocity) {

      if (keys.length === 0) {
        html = '<div style="padding:12px 0;font-size:12px;color:var(--text-dim)">No velocity data yet</div>';

        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = velocity[k];
          var label = v.label || k.replace(/_to_/g, ' \u2192 ').replace(/_/g, ' ');
          if (!v.label) label = label.charAt(0).toUpperCase() + label.slice(1);
          html += '<div class="velocity-row">';
          html += '<span class="velocity-label">' + esc(label) + '</span>';
          html += '<span class="velocity-val">' + (v.avg_days != null ? v.avg_days.toFixed(1) + ' days' : '--') + '<span class="velocity-sample">n=' + (v.sample_size || 0) + '</span></span>';
          html += '</div>';

      }
      return sectionCard('velocity', '&#x26A1;', 'Pipeline Velocity', html);

    /* ── Completions ── */
    function humanizeMilestone(text) {
      if (!text) return 'reached a milestone';
      // Map raw "Stage advanced to amc" / "amc" slugs to friendly stage labels
      var m = String(text).match(/(?:advanced to|reached|stage[:\s]+)\s*([a-z_]+)/i);
      var slug = m ? m[1].toLowerCase() : String(text).trim().toLowerCase();
      if (STAGE_LABELS[slug]) return 'reached ' + STAGE_LABELS[slug];
      if (slug === 'complete') return 'completed registration';
      return text; // already humanized server-side
    }

    function renderCompletionsSection(comp) {
      if (!comp) return '';
      var html = '<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">';
      html += '<div class="completions-header">';
      html += '<div class="completion-stat"><div class="completion-stat-value">' + fmtNum(comp.this_month) + '</div><div class="completion-stat-label">This Month</div></div>';
      html += '<div class="completion-stat"><div class="completion-stat-value" style="color:var(--text)">' + fmtNum(comp.total) + '</div><div class="completion-stat-label">Total</div></div>';
      html += '</div>';
      html += '<div class="milestones-list" style="flex:1;min-width:200px">';
      var milestones = comp.recent_milestones || [];
      if (milestones.length === 0) {
        html += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No recent milestones</div>';
      }
      for (var i = 0; i < Math.min(milestones.length, 6); i++) {
        var m = milestones[i];
        html += '<div class="milestone-row">';
        html += '<div class="milestone-dot"></div>';

        html += '<div class="milestone-ago">' + (m.days_ago != null ? m.days_ago + 'd ago' : relativeTime(m.date)) + '</div>';

      return sectionCard('completions', '&#x1F389;', 'Completions & Wins', html, true);

    /* ── Section Card Wrapper ── */
    function sectionCard(section, icon, title, bodyHtml, fullWidth) {
      var cls = fullWidth ? ' full-width' : '';
      return '<div class="section-card' + cls + '" data-section="' + section + '">' +
        '<div class="section-card-header">' +
        '<div class="section-card-title"><span class="icon">' + icon + '</span>' + esc(title) + '</div>' +
        '</div>' +
        '<div class="section-card-body">' + bodyHtml + '</div>' +
        '<div class="drilldown-panel" id="dd-' + section + '"></div>' +
        '</div>';
