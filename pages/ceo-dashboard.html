    /* ════════════════════════════════════════════════════════════════════════════
       Task-detail accordion (Task 3d.6) — dark port of admin.html's renderOps* views.

       The detail panel opens beneath document/AHPRA/SPPA/alt-supervisor-CV task rows.
       PARITY SCOPE (porting rule 2 + Task 3d.6 NOTE): admin's renderOps* renderers embed
       interactive composers (data-ops-send-email / data-ops-send-revision / data-ops-send-
       ahpra-email / data-ops-send-gp-email / data-ops-submit-drive / data-ops-upload-own,
       and SPPA state-machine buttons: openSppaReview, sppaOverrideQ7, sppaMarkReturned,
       openPdfEditor, _viewSppaDoc, _isPrereqDone, altCvSubmit, ahpraAcknowledge/Escalate,
       loadCcContacts). Those depend on admin-only handlers/state the CEO page does not have
       and that Phase 3d does NOT wire. So the CEO ports the cleanly-portable READ-ONLY views
       faithfully — original email / AHPRA request, response-type badge, conflict banner,
       practice-response banner, the message thread, the documents list, descriptions — and
       REUSES the CEO's existing document controls (Approve & send / Request revision / Upload
       new version) where they overlap, via the already-wired data-ceo-doc-* delegation. The
       send/compose/SPPA-edit actions are intentionally surfaced as a read-only note pointing
       to the RSO admin tooling rather than faked. Each gap is recorded in the task report.
       ──────────────────────────────────────────────────────────────────────────── */

    // Read-only display helpers — verbatim ports of admin opsSnippet/opsFormatDate/
    // opsRelativeTime/opsRenderThread/opsRenderDocs (admin 4723–4794), using esc + ceoSafeUrl.
    function ceoOpsSnippet(text, max) {
      if (!text) return '';
      var t = (text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      return t.length > max ? t.slice(0, max) + '…' : t;
    }
    function ceoOpsFormatDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    }
    function ceoOpsRelativeTime(iso) {
      if (!iso) return '';
      var diff = Date.now() - new Date(iso).getTime();
      var days = Math.floor(diff / 86400000);
      if (days > 0) return days + 'd ago';
      var hrs = Math.floor(diff / 3600000);
      if (hrs > 0) return hrs + 'h ago';
      var mins = Math.floor(diff / 60000);
      return (mins > 0 ? mins + 'm ago' : 'just now');
    }
    // Conversation thread (port of admin opsRenderThread 4743–4764): newest-first, in/out
    // direction badge, channel, sender, relative time, optional "Open in Gmail" link.
    function ceoOpsRenderThread(msgs) {
      if (!msgs || !msgs.length) return '';
      var sorted = msgs.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      var h = '<div class="ops-conversation-thread">';
      sorted.forEach(function(m) {
        var dirCls = m.direction === 'outbound' ? 'ops-msg-outbound' : 'ops-msg-inbound';
        var dirLabel = m.direction === 'outbound' ? 'Sent' : 'Received';
        var chLabel = (m.channel === 'whatsapp' ? 'WhatsApp' : 'Email');
        var gmailLink = m.gmail_message_id ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(m.gmail_message_id) : (m.gmail_thread_id ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(m.gmail_thread_id) : '');
        h += '<div class="ops-msg ' + dirCls + '">'
          + '<div class="ops-msg-header"><span class="ops-msg-dir">' + dirLabel + '</span><span class="ops-msg-channel">' + esc(chLabel) + '</span>';
        if (m.sender) h += '<span class="ops-msg-channel">· ' + esc(m.sender) + '</span>';
        h += '<span class="ops-msg-time">' + ceoOpsRelativeTime(m.created_at) + '</span>';
        if (gmailLink) h += '<a href="' + ceoSafeUrl(gmailLink) + '" target="_blank" rel="noopener" style="margin-left:auto;font-size:10px;color:var(--blue);font-weight:600;text-decoration:none">Open in Gmail ↗</a>';
        h += '</div>';
        if (m.subject) h += '<div class="ops-msg-subject">' + esc(m.subject) + '</div>';
        h += '<div class="ops-msg-body">' + esc(ceoOpsSnippet(m.body_text || m.body_html || '', 400)) + '</div>';
        h += '</div>';
      });
      h += '</div>';
      return h;
    }
    // Documents list (port of admin opsRenderDocs 4765–4794): icon, filename, size, current/
    // previous-version state, "View →" link. Inline data: URLs (no signed-preview flow on the
    // CEO page) are surfaced as a plain note rather than a broken preview button (porting rule 2).
    function ceoOpsRenderDocs(docs) {
      if (!docs || !docs.length) return '';
      var h = '<div class="ops-doc-preview">';
      docs.forEach(function(d) {
        var isCurrent = d.is_current !== false;
        var cls = isCurrent ? '' : 'ops-doc-version-old';
        var sizeStr = d.size_bytes ? (Math.round(d.size_bytes / 1024) + 'KB') : '';
        var icon = '📄';
        if (d.mime_type && d.mime_type.indexOf('pdf') > -1) icon = '📄';
        else if (d.mime_type && d.mime_type.indexOf('image') > -1) icon = '🖼';
        var previewUrl = d.google_drive_url || d.attachment_url || '';
        h += '<div class="' + cls + '">';
        h += '<div class="ops-doc-thumb">';
        h += '<div class="ops-doc-icon">' + icon + '</div>';
        h += '<div><div style="font-weight:700">' + esc(d.filename || 'Document') + '</div>';
        if (sizeStr) h += '<div style="font-size:10px;color:var(--muted)">' + sizeStr + '</div>';
        if (!isCurrent) h += '<div style="font-size:10px;color:var(--muted)">Previous version</div>';
        h += '</div>';
        if (previewUrl && !previewUrl.startsWith('data:')) {
          h += '<a href="' + ceoSafeUrl(previewUrl) + '" target="_blank" rel="noopener" style="margin-left:auto;font-size:10px;color:var(--blue);font-weight:700;text-decoration:none">View →</a>';
        } else if (previewUrl) {
          h += '<span style="margin-left:auto;font-size:10px;color:var(--muted)">stored file</span>';
        }
        h += '</div></div>';
      });
      h += '</div>';
      return h;
    }

    // Read-only note pointing the reviewer to the RSO admin tools for the interactive
    // compose/send/edit actions that the CEO page does not (yet) port. Keeps parity honest.
    function ceoOpsRsoToolNote(text) {
      return '<div style="font-size:11px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-top:10px">'
        + 'ℹ️ ' + esc(text || 'This send/compose action is performed from the RSO’s admin tools.')
        + '</div>';
    }

    // The CEO document controls (Approve & send / Request revision / Upload new version) reuse
    // the already-wired data-ceo-doc-* delegation (ceoDocApprove/ceoDocRequestRevision/
    // ceoDocUpload). Render them for a document task when there is a current uploaded doc.
    function ceoOpsDocControls(task, currentDocs) {
      if (!task || !task.id) return '';
      var h = '<div class="ops-action-row">';
      if (currentDocs && currentDocs.length) {
        h += '<button class="ops-btn-green" data-ceo-doc-action="approve" data-task="' + esc(task.id) + '">Approve &amp; Send to GP</button>';
        h += '<button class="ops-btn-danger" data-ceo-doc-action="revise" data-task="' + esc(task.id) + '">Request Revision</button>';
      }
      h += '<label class="ops-btn-secondary" style="display:inline-flex;align-items:center;cursor:pointer">Upload New Version'
        + '<input type="file" data-ceo-doc-upload="' + esc(task.id) + '" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" style="display:none"></label>';
      h += '</div>';
      return h;
    }

    // ── Practice Pack Child (read-only port of admin renderOpsPracticePackChild 5100) ──
    // Shows the practice response banner (+ AI match badge), the current document(s), the
    // thread, and the CEO document controls. Admin's send/revision email composers depend on
    // admin-only data-ops-send-* handlers and are surfaced as an RSO-tool note (Task 3d.6 NOTE).
    function renderCeoOpsPracticePackChild(task, msgs, docs) {
      var hasInbound = msgs.some(function(m) { return m.direction === 'inbound'; });
      var currentDocs = docs.filter(function(d) { return d.is_current !== false; });
      var hasDoc = currentDocs.length > 0;
      var lastInbound = msgs.filter(function(m) { return m.direction === 'inbound'; }).pop();
      var h = '<div class="ops-expand-section">';

      // State B: practice responded with a document — response banner + doc + controls.
      if (hasInbound && hasDoc) {
        var conf = lastInbound && typeof lastInbound.ai_match_confidence === 'number' ? Math.round(lastInbound.ai_match_confidence * 100) : '';
        var confCls = conf && conf < 70 ? 'low' : '';
        h += '<div class="ops-response-banner">';
        h += '<div class="ops-response-title">Practice Response';
        if (conf) h += ' <span class="ops-match-badge ' + confCls + '">' + conf + '% match</span>';
        h += '</div>';
        if (lastInbound) h += '<div class="ops-response-text">' + esc(ceoOpsSnippet(lastInbound.body_text || lastInbound.body_html || '', 300)) + '</div>';
        if (lastInbound) h += '<div class="ops-response-meta">From: ' + esc(lastInbound.sender || '—') + ' · ' + ceoOpsFormatDate(lastInbound.created_at) + '</div>';
        h += '</div>';
        h += ceoOpsRenderDocs(currentDocs);
        var diffNote = task.ai_match_reasoning || '';
        if (task.related_document_key === 'offer_contract' && diffNote) {
          h += '<div style="background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:var(--text)">';
          h += '<strong>⚠️ Contract analysis:</strong> ' + esc(diffNote);
          h += '</div>';
        }
        h += ceoOpsDocControls(task, currentDocs);
        if (msgs.length > 1) h += ceoOpsRenderThread(msgs);
        h += '</div>';
        return h;
      }

      // State C: waiting on practice — show thread + nudge indicator (read-only).
      if (task.status === 'waiting_on_practice' && !hasInbound) {
        h += '<div class="ops-expand-label">Waiting on practice</div>';
        h += ceoOpsRenderThread(msgs);
        if (!msgs.length) h += '<div style="font-size:12px;color:var(--muted)">Email sent to practice. Awaiting response.</div>';
        var lastOutbound = msgs.filter(function(m) { return m.direction === 'outbound'; }).pop();
        var daysSince = lastOutbound ? Math.floor((Date.now() - new Date(lastOutbound.created_at).getTime()) / 86400000) : 0;
        if (daysSince >= 7) h += '<div class="ops-nudge-indicator">⏰ ' + daysSince + ' days since last outreach — consider a follow-up</div>';
        h += ceoOpsRsoToolNote('Nudge the practice and send document requests from the RSO’s admin tools.');
        h += '</div>';
        return h;
      }

      // State A: no messages yet — describe what is needed; show any docs + controls.
      h += '<div class="ops-expand-label">Request document from practice</div>';
      h += '<div style="font-size:12px;color:var(--text)">' + esc(task.title || 'Document') + ' — awaiting request to ' + esc(task.practice_name || 'the practice') + '.</div>';
      if (docs.length) h += ceoOpsRenderDocs(currentDocs);
      h += ceoOpsDocControls(task, currentDocs);
      h += ceoOpsRsoToolNote('Email the practice to request this document from the RSO’s admin tools.');
      h += '</div>';
      return h;
    }

    // ── Alt Supervisor CV Review (read-only port of admin renderOpsAltSupervisorCvReview 5069) ──
    // Shows the matched-CV banner, the thread, and the CV documents. Submit / Review-SPPA
    // buttons depend on admin-only altCvSubmit/openSppaReview and are noted, not faked.
    function renderCeoOpsAltSupervisorCvReview(task, msgs, docs) {
      var meta = task.metadata || {};
      if (typeof meta === 'string') try { meta = JSON.parse(meta); } catch (e) { meta = {}; }
      var matchedCvs = Array.isArray(meta.matched_cvs) ? meta.matched_cvs : [];
      var h = '<div class="ops-expand-section">';
      h += '<div style="background:var(--blue-dim);border:1px solid rgba(96,165,250,0.4);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
      h += '<span style="color:var(--blue)">📄 Alternate supervisor CV(s) received from practice — review against SPPA-00</span>';
      h += '</div>';
      if (matchedCvs.length > 0) {
        h += '<div style="margin-bottom:10px">';
        matchedCvs.forEach(function(cv) {
          h += '<div style="font-size:12px;margin:4px 0;padding:6px 10px;background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);border-radius:6px;color:var(--text)">'
            + '<strong>' + esc(cv.cvName || '') + '</strong> → matched to SPPA-00 alt supervisor: <strong>' + esc(cv.matchedSupervisor || '') + '</strong>'
            + '<span style="margin-left:8px;font-size:10px;color:var(--muted)">(' + Math.round((cv.confidence || 0) * 100) + '% confidence)</span>'
            + '</div>';
        });

      }
      h += ceoOpsRenderThread(msgs);
      h += '<div style="font-weight:700;font-size:12px;margin:8px 0 4px;color:var(--text)">CV Documents</div>';
      h += ceoOpsRenderDocs(docs);
      h += ceoOpsRsoToolNote('Submit the alternate CV to the GP and review the SPPA-00 from the RSO’s admin tools.');
      h += '</div>';

    }

    // ── AHPRA Action Item (read-only port of admin renderOpsAhpraActionItem 5267) ──
    // Shows the response-type badge, the AHPRA officer request (or task description), the
    // document(s), and the thread. The reply/revision/escalation composers depend on admin-
    // only handlers and are surfaced as an RSO-tool note (Task 3d.6 NOTE).
    function renderCeoOpsAhpraActionItem(task, msgs, docs) {
      var gpName = task.gp_name || 'the GP';
      var meta = task.metadata || {};
      if (typeof meta === 'string') try { meta = JSON.parse(meta); } catch (e) { meta = {}; }
      var ahpraOfficerEmail = task.ahpra_officer_email || meta.ahpra_officer_email || '';
      var firstInbound = msgs.find(function(m) { return m.direction === 'inbound'; });
      var currentDocs = docs.filter(function(d) { return d.is_current !== false; });
      var hasDoc = currentDocs.length > 0;
      var gmailMsgId = task.source_gmail_message_id || '';
      var gmailLink = gmailMsgId ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(gmailMsgId) : '';
      var responseType = task.response_type || meta.response_type || 'request_from_gp';
      var taskCategory = task.category || meta.category || '';
      if (taskCategory === 'application_update' && responseType !== 'status_update') responseType = 'status_update';
      // GP-responded-with-document detection (port of admin's outbound-then-inbound logic).
      var hasGpResponse = false, outboundSent = false;
      msgs.forEach(function(m) {
        if (m.direction === 'outbound') outboundSent = true;
        if (outboundSent && m.direction === 'inbound') hasGpResponse = true;
      });
      var h = '<div class="ops-expand-section">';

      // Response-type badge (port of admin's rtBadge maps 5367–5369), dark-converted.
      var rtBadgeColor = { direct_reply: 'var(--green)', request_from_gp: 'var(--blue)', request_from_practice: 'var(--purple)', amend_document: 'var(--red)', status_update: 'var(--text-muted)', escalation: 'var(--red)' };
      var rtBadgeLabel = { direct_reply: 'Direct Reply', request_from_gp: 'Request from GP', request_from_practice: 'Request from Practice', amend_document: 'Amendment Needed', status_update: 'Status Update', escalation: 'Escalation Required' };
      h += '<div style="margin-bottom:8px"><span style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;color:#fff;background:' + (rtBadgeColor[responseType] || 'var(--text-muted)') + '">' + esc(rtBadgeLabel[responseType] || responseType) + '</span></div>';

      // AHPRA officer request (or task description) — read-only port of _ahpraOfficerEmailHtml.
      if (firstInbound) {
        h += '<div class="ops-original-email">';
        h += '<div class="ops-expand-label">AHPRA Officer Request</div>';
        h += '<div class="ops-email-from">' + esc(firstInbound.sender || ahpraOfficerEmail || '—') + ' · ' + ceoOpsFormatDate(firstInbound.created_at) + '</div>';
        h += '<div class="ops-email-content">' + esc(ceoOpsSnippet(firstInbound.body_text || firstInbound.body_html || '', 400)) + '</div>';
        if (gmailLink) h += '<a class="ops-action-link-inline" href="' + ceoSafeUrl(gmailLink) + '" target="_blank">Open full email →</a>';
        h += '</div>';
      } else if (task.description) {
        h += '<div class="ops-original-email">';
        h += '<div class="ops-expand-label">AHPRA Action Required</div>';
        h += '<div class="ops-email-content">' + esc(task.description) + '</div>';
        h += '</div>';
      }

      if (hasGpResponse && hasDoc) {
        h += ceoOpsRenderThread(msgs);
        h += ceoOpsRenderDocs(currentDocs);
        h += ceoOpsRsoToolNote('Reply to the AHPRA officer (with the document attached) from the RSO’s admin tools.');
      } else if (task.status === 'waiting_on_gp') {
        h += '<div class="ops-expand-label">Waiting on GP</div>';
        h += ceoOpsRenderThread(msgs);
        if (!msgs.length) h += '<div style="font-size:12px;color:var(--muted)">Message sent to GP for Dr ' + esc(gpName) + '. Awaiting response.</div>';
      } else {
        // State A — show what is needed (read-only). The interactive officer/GP/practice
        // composers and Acknowledge/Escalate buttons live in the RSO admin tools.
        h += '<div class="ops-action-item-box">';
        h += '<div class="ops-expand-label">Action Required</div>';
        h += '<div style="font-size:12px;font-weight:700;color:var(--text)">' + esc(task.title || '—') + '</div>';
        if (task.description) h += '<div style="font-size:12px;color:var(--text);margin-top:4px">' + esc(task.description) + '</div>';
        h += '</div>';
        if (currentDocs.length) h += ceoOpsRenderDocs(currentDocs);
        h += ceoOpsRsoToolNote('Reply to AHPRA, request from the GP/practice, or escalate from the RSO’s admin tools.');
      }
      h += '</div>';
      return h;
    }

    // ── SPPA-00 (read-only port of admin renderOpsSppa00 4797) ──
    // Shows the SPPA lifecycle state, conflict banner, thread, and documents. The SPPA state-
    // machine actions (Send to candidate, Preview/Override PDF, Mark returned, Resend) depend
    // on admin-only handlers (openSppaReview/sppaOverrideQ7/sppaMarkReturned/_isPrereqDone)
    // and are surfaced as an RSO-tool note (Task 3d.6 NOTE).
    function renderCeoOpsSppa00(task, msgs, docs) {
      var meta = task.metadata || {};
      if (typeof meta === 'string') try { meta = JSON.parse(meta); } catch (e) { meta = {}; }
      var sppaState = meta.sppa_state || '';
      var currentDocs = docs.filter(function(d) { return d.is_current !== false; });
      var h = '<div class="ops-expand-section">';

      if (!sppaState) {
        // Locked: prerequisite states are computed admin-side; show the gate read-only.
        h += '<div class="ops-expand-label">Waiting for prerequisites</div>';
        h += '<div style="font-size:12px;color:var(--muted);padding:8px 0">Supervisor CV and Offer / Contract must be on file before the SPPA-00 can be prepared.</div>';
        h += '</div>';
        return h;
      }

      var stateLabel = { ready_to_send: 'Ready to send to candidate', sent_to_candidate: 'Sent to candidate — awaiting return', gp_returned: 'GP returned — review and send to practice' };
      h += '<div class="ops-expand-label">' + esc(stateLabel[sppaState] || sppaState) + '</div>';

      // Conflict banner (port of admin conflictBanner 4821–4838), dark-converted.
      if (meta.is_conflict && meta.confidence !== 'low') {
        h += '<div style="background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">';
        h += '<b style="color:var(--amber)">⚠ AI detected conflict of interest:</b> Supervisor <b>' + esc(meta.supervisor_name || '') + '</b> is the practice owner/director. Q7 marked <b>YES</b>.';
        if (meta.reasoning) h += '<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--amber)">AI reasoning</summary><p style="margin:4px 0 0;color:var(--muted)">' + esc(meta.reasoning) + '</p></details>';
        h += '</div>';
      } else if (!meta.is_conflict && meta.confidence !== 'low') {
        h += '<div style="background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        h += '<span style="color:var(--green)">✓ No conflict of interest detected. Q7 marked <b>NO</b>.</span>';
        h += '</div>';
      } else {
        h += '<div style="background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        h += '<b style="color:var(--red)">⚠ AI could not determine with confidence. Manual review required.</b>';
        h += '</div>';
      }
      if (sppaState === 'sent_to_candidate' && meta.sent_to_candidate_at) {
        var days = Math.floor((Date.now() - new Date(meta.sent_to_candidate_at).getTime()) / 86400000);
        h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Sent ' + days + ' day' + (days === 1 ? '' : 's') + ' ago to ' + esc(meta.sent_to_candidate_email || '') + '</div>';
        if (days >= 7) h += '<div class="ops-nudge-indicator">⏰ ' + days + ' days since sent — consider a follow-up</div>';
      }
      h += ceoOpsRenderThread(msgs);
      if (currentDocs.length) h += ceoOpsRenderDocs(currentDocs);
      h += ceoOpsRsoToolNote('Send/preview the SPPA-00, override Q7, or mark it returned from the RSO’s admin tools.');
      h += '</div>';
      return h;
    }

    // ── Generic fallback (read-only port of admin renderOpsGeneric 5597) ──
    function renderCeoOpsGeneric(task, msgs, docs) {
      var h = '<div class="ops-expand-section">';
      if (task.description) h += '<div class="ops-expand-desc">' + esc(task.description) + '</div>';
      if (msgs.length) h += ceoOpsRenderThread(msgs);
      if (docs.length) h += ceoOpsRenderDocs(docs);
      var gmailMsgId = task.source_gmail_message_id || '';
      var gmailLink = gmailMsgId ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(gmailMsgId) : '';
      if (gmailLink) h += '<a class="ops-action-link-inline" href="' + ceoSafeUrl(gmailLink) + '" target="_blank">Open email thread →</a>';
      h += '</div>';
      return h;
    }

    // loadGpTaskDetail (port of admin 5762): fetch task messages + documents, then dispatch by
    // task_type to the dark renderOps* renderers. Mirrors admin's dispatch exactly: sppa_00
    // practice_pack_child -> SPPA; ahpra_correspondence/ahpra_action_item -> AHPRA;
    // alt_supervisor_cv_review -> alt-CV; everything else with a detail panel -> practice pack.
    function loadGpTaskDetail(taskId) {
      var container = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
      if (!container) return;
      container.innerHTML = '<div class="ops-loading-detail">Loading…</div>';
      var list = (gpDetailCache && gpDetailCache.tasks) || [];
      var task = null;
      for (var i = 0; i < list.length; i++) { if (list[i] && list[i].id === taskId) { task = list[i]; break; } }
      if (!task) { container.innerHTML = '<div style="padding:12px;color:var(--red)">Task not found</div>'; return; }
      var pc = task.practice_contact || {};
      var md = task.metadata || {};
      if (typeof md === 'string') try { md = JSON.parse(md); } catch (e) { md = {}; }
      var adapted = Object.assign({}, task, {
        practice_contact_email: pc.contactEmail || pc.email || task.practice_contact_email || '',
        practice_contact_name: pc.contactName || pc.name || task.practice_contact_name || '',
        practice_name: pc.practiceName || task.practice_name || '',
        ahpra_officer_name: task.ahpra_officer_name || md.ahpra_officer_name || '',
        ahpra_officer_email: task.ahpra_officer_email || md.ahpra_officer_email || '',
        response_type: task.response_type || md.response_type || 'request_from_gp',
        amend_target: task.amend_target || md.amend_target || null,
        on_file_documents: task.on_file_documents || md.on_file_documents || [],
        draft_response: task.draft_response || md.draft_response || null,
        source_gmail_message_id: task.source_gmail_message_id || md.source_gmail_message_id || ''
      });
      Promise.all([
        apiFetch('/api/admin/task/messages?taskId=' + encodeURIComponent(taskId)).catch(function() { return {}; }),
        apiFetch('/api/admin/task/documents?taskId=' + encodeURIComponent(taskId)).catch(function() { return {}; })
      ]).then(function(res) {
        var mRes = res[0] || {}, dRes = res[1] || {};
        var msgs = (mRes.ok && Array.isArray(mRes.messages)) ? mRes.messages : [];
        var docs = (dRes.ok && Array.isArray(dRes.documents)) ? dRes.documents : [];
        // Re-resolve the container in case the panel was re-rendered while fetching.
        var c2 = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
        if (!c2) return;
        var tt = adapted.task_type || '';
        if (adapted.related_document_key === 'sppa_00' && tt === 'practice_pack_child') {
          c2.innerHTML = renderCeoOpsSppa00(adapted, msgs, docs);
        } else if (tt === 'ahpra_correspondence' || tt === 'ahpra_action_item') {
          c2.innerHTML = renderCeoOpsAhpraActionItem(adapted, msgs, docs);
        } else if (tt === 'alt_supervisor_cv_review') {
          c2.innerHTML = renderCeoOpsAltSupervisorCvReview(adapted, msgs, docs);
        } else if (tt === 'practice_pack_child') {
          c2.innerHTML = renderCeoOpsPracticePackChild(adapted, msgs, docs);
        } else {
          c2.innerHTML = renderCeoOpsGeneric(adapted, msgs, docs);
        }
      }).catch(function(e) {
        var c3 = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
        if (c3) c3.innerHTML = '<div style="padding:12px;color:var(--red)">Failed to load detail: ' + esc((e && e.message) || 'Unknown error') + '</div>';
      });
    }

    // Re-fetch the open GP's case and refresh gpDetailCache, then re-render the Tasks
    // tab. Returns a promise; rejects (via reject in caller) only on hard error. Keeps
    // gpDetailCache.case/tasks/timeline consistent with GET /api/admin/case?id=.
    function refreshGpDetailTasks() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        if (gpDetailTab === 'tasks') renderGpTasksTab();
      });
    }

    // Re-fetch the open GP file (if any) after a header case action and re-render the
    // active sub-tab. Reuses the existing CEO action modals (openCreateTaskModal,
    // openNoteModal, openStageChangeModal, openBlockerModal, openNudgeModal): their
    // submit handlers call this on success so the GP file reflects the change. No-op
    // when no GP file is open (so it never alters the modals' dashboard-refresh path).
    function refreshGpDetailIfOpen() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      // Drop the timeline cache so a newly added note shows up in the Notes/Timeline tabs.
      gpTimelineCache = null;
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        renderGpDetailTab(gpDetailTab);
      });
    }

    // Drop the cached Documents payload so the next render re-fetches /api/admin/gp-documents.
    // If the Documents sub-tab is currently open, re-render it now (renderGpDocumentsTab
    // re-fetches via loadGpDocuments because the cache was just cleared).
    function refreshGpDocuments() {
      gpDocumentsCache = null;
      if (gpDetailTab === 'documents') renderGpDocumentsTab();
    }

    /* ── Profile-header case-management controls (3d.2) ── */

    // Toggle the expandable case-management panel under the profile bar (mirror admin's
    // data-pb-toggle behaviour: flip the panel's .open class).
    function toggleCaseMgmtPanel(btn) {
      var panel = document.getElementById('pbExpandPanel');
      if (panel) panel.classList.toggle('open');
    }

    // Save Status + VA Verified Stage from the case-management panel via PUT /api/admin/case
    // (the same allowed fields admin's saveCase sends). On success re-open the GP file so the
    // header pills + panel reflect the change. RSO reassignment is handled separately by the
    // Assigned RSO button (openReassignModal → /api/admin/case {assigned_rso} + thread transfer).
    function saveCaseMgmt(caseId, rsoId) {
      var statusEl = document.getElementById('caseMgmtStatus');
      var stageEl = document.getElementById('caseMgmtVerifiedStage');
      var btn = document.getElementById('caseMgmtSave');
      var body = {
        status: statusEl ? (statusEl.value || null) : null,
        gp_verified_stage: stageEl ? (stageEl.value || null) : null
      };
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId), { method: 'PUT', body: body }).then(function(d) {
        if (d && d.ok) {
          showToast('Case updated', 'success');
          refreshDashboard();
          // Full re-render so the header stage/status pills + panel selections reflect.
          if (gpDetailCache && gpDetailCache.caseId === caseId) openGpDetail(caseId, rsoId);
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Save failed'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
      });
    }

    // Minimal Zoom/call scheduler (admin parity for the profile-header Zoom button). The
    // /api/admin/calls/schedule endpoint requires case_id + a stage in {myintealth,amc,ahpra};
    // optional admin_notes. Sends a Calendly invite to the GP (no live send during build — this
    // only fires on an explicit click at runtime). Refreshes the open GP file on success.
    var CEO_ZOOM_STAGES = ['myintealth', 'amc', 'ahpra'];
    function openCeoZoomModal(caseId, userId, currentStage) {
      var defStage = CEO_ZOOM_STAGES.indexOf(currentStage) !== -1 ? currentStage : 'myintealth';
      var html = '<div class="modal-title">Schedule Call</div>';
      html += '<div class="modal-field"><label class="modal-label">Stage</label><select class="modal-select" id="mZoomStage">';
      for (var i = 0; i < CEO_ZOOM_STAGES.length; i++) {
        html += '<option value="' + CEO_ZOOM_STAGES[i] + '"' + (CEO_ZOOM_STAGES[i] === defStage ? ' selected' : '') + '>' + esc(STAGE_LABELS[CEO_ZOOM_STAGES[i]] || CEO_ZOOM_STAGES[i]) + '</option>';
      }
      html += '</select></div>';
      html += '<div class="modal-field"><label class="modal-label">Reason for the meeting (the GP will see this)</label><textarea class="modal-textarea" id="mZoomReason" placeholder="e.g. We&rsquo;d like to walk you through your AHPRA documents."></textarea></div>';
      html += '<div class="modal-field"><label class="modal-label">Assigned RSO</label><select class="modal-select" id="mZoomRso"><option value="">Default (GP Link)</option></select></div>';
      html += '<div class="modal-field"><label class="modal-label">Internal notes (the GP will NOT see this)</label><textarea class="modal-textarea" id="mZoomNotes" placeholder="Internal notes for this call..."></textarea></div>';
      html += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin:-4px 0 12px">Sends the GP a Calendly invite for the selected stage.</div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-blue" id="mZoomSubmit" onclick="submitCeoZoom(\'' + esc(caseId) + '\', \'' + esc(userId) + '\')">Send Invite</button></div>';
      openModal(html);
      // Populate the Assigned RSO dropdown from the /api/ceo/rsos roster (active only),
      // and best-effort pre-select the GP's current RSO. Never block on this.
      loadRsoRoster().then(function(rsos) {
        var sel = document.getElementById('mZoomRso');
        if (!sel || !Array.isArray(rsos)) return;
        // Work out the current GP's assigned RSO so we can pre-select. The case can carry
        // assigned_va (UUID) / assigned_rso (id) / assigned_rso_email / assigned_rso_name.
        var cs = (gpDetailCache && gpDetailCache.case) || {};
        var curId = cs.assigned_rso || cs.assigned_va || (gpDetailCache && gpDetailCache.rsoId) || '';
        var curEmail = (cs.assigned_rso_email || '').toLowerCase();
        var curName = (cs.assigned_rso_name || '').toLowerCase();
        var preEmail = '';
        var opts = '<option value="">Default (GP Link)</option>';
        for (var i = 0; i < rsos.length; i++) {
          var r = rsos[i];
          if (r.active === false) continue;
          if (!r.email) continue;
          opts += '<option value="' + esc(r.email) + '">' + esc(r.rso_name) + ' (' + esc(r.email) + ')</option>';
          // Match by rso_id / user_id, then email, then name (best-effort).
          var rEmail = (r.email || '').toLowerCase();
          if (!preEmail) {
            if (curId && (r.rso_id === curId || r.user_id === curId)) preEmail = r.email;
            else if (curEmail && rEmail === curEmail) preEmail = r.email;
            else if (curName && (r.rso_name || '').toLowerCase() === curName) preEmail = r.email;
          }
        }
        sel.innerHTML = opts;
        if (preEmail) sel.value = preEmail;
      }).catch(function() {});
    }

    function submitCeoZoom(caseId, userId) {
      var stageEl = document.getElementById('mZoomStage');
      var notesEl = document.getElementById('mZoomNotes');
      var reasonEl = document.getElementById('mZoomReason');
      var rsoEl = document.getElementById('mZoomRso');

      if (notesEl && notesEl.value.trim()) body.admin_notes = notesEl.value.trim();
      if (reasonEl && reasonEl.value.trim()) body.meeting_reason = reasonEl.value.trim();
      if (rsoEl && rsoEl.value) body.assigned_rso_email = rsoEl.value;
      if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
      apiFetch('/api/admin/calls/schedule', { method: 'POST', body: body }).then(function(d) {
        if (d && d.ok) {
          showToast('Calendly invite sent', 'success');
          closeModal();
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Schedule failed'), 'error');

        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Send Invite'; }

    // After a document action (upload/approve/request-revision) the underlying task state
    // changes (attachment_url, gmail_message_id, status), so refresh BOTH the cached task
    // rows (refreshGpDetailTasks) and the cached documents payload (refreshGpDocuments) so
    // the action buttons re-gate correctly on the next render.
    function refreshGpDocsAndTasks() {
      refreshGpDetailTasks();
      refreshGpDocuments();
    }

    // Per-task status action from the GP Tasks sub-tab. Reuses PUT /api/admin/task
    // (super-admin's requireAdminSession). On success: re-fetch case → refresh cache →
    // re-render. Failure shows a toast; checks both res.ok and the parsed { ok }.
    function ceoGpTaskAction(ev, taskId, status) {
      if (ev) { ev.stopPropagation(); }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: status }
      }).then(function(d) {
        if (d && d.ok) {
          var labels = { completed: 'completed', in_progress: 'started', waiting: 'set to waiting', waiting_on_external: 'set to waiting on external', waiting_on_gp: 'set to waiting on GP', waiting_on_practice: 'set to waiting on practice' };
          showToast('Task ' + (labels[status] || 'updated'), 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Escalate a GP task to the CEO. No existing CEO-page "escalate to CEO" flow exists
    // (resolveEscalation/respondEscalation handle the inbound direction), so use the
    // documented PUT /api/admin/task escalation shape: status escalated + escalated_to
    // 'CEO' + escalated_reason from a prompt. The server records escalated_by/_at.
    function ceoGpTaskEscalate(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var reason = prompt('Escalate this task to the CEO — reason:');
      if (reason === null) return; // cancelled
      reason = reason.trim();
      if (!reason) { showToast('A reason is required to escalate', 'error'); return; }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: 'escalated', escalated_to: 'CEO', escalated_reason: reason }
      }).then(function(d) {
        if (d && d.ok) {
          showToast('Task escalated to CEO', 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Resolve an email-triage task (port of admin's data-resolve-email handler, 6029–6056).
    // Checks for a Gmail reply first via POST /api/admin/email-triage/check-reply; only marks
    // the task complete when the GP/RSO has actually replied, otherwise surfaces the inline
    // "reply via Gmail before resolving" error. Reuses ceoGpTaskAction for the completion so the
    // refresh/re-render path is identical to every other task action. NO email is sent here.
    function ceoResolveEmailTask(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      // Either the et-panel "✓ Mark Resolved" button or the dropdown "✓ Mark Complete" item can
      // start this flow; capture whichever was clicked so its original label restores on failure.
      var resolveBtn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-resolve-email],[data-complete-task]') : null;
      var origText = resolveBtn ? resolveBtn.textContent : '';
      var errorEl = document.getElementById('et-error-' + taskId);
      if (resolveBtn) { resolveBtn.disabled = true; resolveBtn.textContent = 'Checking…'; }
      if (errorEl) errorEl.style.display = 'none';
      apiFetch('/api/admin/email-triage/check-reply', {
        method: 'POST',
        body: { taskId: taskId }
      }).then(function(d) {
        if (d && d.ok && d.replied) {
          // Replied — complete the task. ceoGpTaskAction handles toast + refresh/re-render.
          ceoGpTaskAction(ev, taskId, 'completed');
        } else {
          if (errorEl) errorEl.style.display = 'inline-block';
          if (resolveBtn) { resolveBtn.textContent = origText; resolveBtn.disabled = false; }
        }
      }).catch(function(e) {
        if (errorEl) errorEl.style.display = 'inline-block';
        if (resolveBtn) { resolveBtn.textContent = origText; resolveBtn.disabled = false; }
      });
    }

    // Generate an AI-suggested reply for an email-triage task (port of admin's data-generate-reply
    // handler, 5995–6026) via POST /api/admin/email-triage/suggest-reply. On success reveals the
    // reply textarea, fills it, and persists open+reply state in gpEmailPanels so a Tasks re-render
    // keeps the panel open with the generated text. NO email is sent — this only drafts a reply.
    function ceoGenerateEmailReply(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var btn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-generate-reply]') : null;
      if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
      apiFetch('/api/admin/email-triage/suggest-reply', {
        method: 'POST',
        body: { taskId: taskId }
      }).then(function(d) {
        if (d && d.ok && d.suggestedReply) {
          var replyWrap = document.getElementById('et-reply-wrap-' + taskId);
          var replyArea = document.getElementById('et-reply-' + taskId);
          if (replyWrap) replyWrap.style.display = 'block';
          if (replyArea) replyArea.value = d.suggestedReply;
          if (btn) btn.textContent = '✓ Reply Generated';
          if (!gpEmailPanels[taskId]) gpEmailPanels[taskId] = {};
          gpEmailPanels[taskId].open = true;
          gpEmailPanels[taskId].reply = d.suggestedReply;
        } else {
          if (btn) { btn.textContent = 'Failed — try again'; btn.disabled = false; }
        }
      }).catch(function(e) {
        if (btn) { btn.textContent = 'Error — try again'; btn.disabled = false; }
      });
    }

    // Copy the generated reply to the clipboard (port of admin's data-copy-reply handler,
    // 6059–6069). Flashes "✓ Copied!" on the button, then restores its label.
    function ceoCopyEmailReply(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var copyArea = document.getElementById('et-reply-' + taskId);
      var btn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-copy-reply]') : null;
      if (copyArea && copyArea.value && navigator.clipboard) {
        navigator.clipboard.writeText(copyArea.value).then(function() {
          if (btn) { btn.textContent = '✓ Copied!'; setTimeout(function() { btn.textContent = 'Copy to Clipboard'; }, 2000); }
        });
      }
    }

    // Pure mirrors of lib/ceo-metrics.js (the authoritative, unit-tested contracts).
    // gpNotesFromTimeline: notes = timeline entries with event_type 'note', newest first.
    function gpNotesFromTimeline(timeline) {
      return (timeline || [])
        .filter(function(e) { return e && e.event_type === 'note'; })
        .slice()
        .sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }
    // mergeGpTimeline: timeline events + comms messages into one newest-first stream,
    // each tagged with kind ('event' | 'message') for icon/layout selection.
    function mergeGpTimeline(timeline, messages) {
      var merged = [];
      (timeline || []).forEach(function(e) { if (e) merged.push(Object.assign({}, e, { kind: 'event' })); });
      (messages || []).forEach(function(m) { if (m) merged.push(Object.assign({}, m, { kind: 'message' })); });
      return merged.sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }

    // Render the cached note timeline entries for the open GP file (read-only).
    // Add-note input is deferred to Phase 3b.
    function renderGpNotesTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var notes = gpNotesFromTimeline((gpDetailCache && gpDetailCache.timeline) || []);
      var html = '<div class="ceo-ops-section-head">Notes <span class="count">' + notes.length + '</span></div>';
      // Inline "add a note" composer (files a case-level note via the same path as the
      // header Add Note button) — admin parity, so the CEO can jot a note in context.
      html += '<div style="display:flex;gap:8px;margin:10px 0 16px;align-items:flex-start">';
      html += '<textarea id="ceoNoteAddText" rows="2" placeholder="Add a note about this GP…" style="flex:1;background:var(--bg-elevated);border:1px solid var(--panel-border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;box-sizing:border-box;font-family:inherit"></textarea>';
      html += '<button class="btn btn-blue" id="ceoNoteAddBtn" onclick="ceoAddGpNote()">Add note</button>';
      html += '</div>';
      if (!notes.length) {
        html += '<div class="ceo-gp-detail-empty">No notes for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var body = n.detail || n.title || '';
        html += '<div class="ceo-gp-note">';
        html += '<div class="ceo-gp-note-body">' + esc(body) + '</div>';
        html += '<div class="ceo-gp-note-meta">';
        if (n.actor) html += '<span class="ceo-gp-note-actor">' + esc(n.actor) + '</span>';
        html += '<span class="ceo-gp-note-time">' + esc(fmtCallTime(n.created_at)) + '</span>';
        html += '</div>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Icon for a merged timeline entry, by message channel or event_type.
    function gpTimelineIcon(e) {
      if (e.kind === 'message') {
        var ch = (e.channel || '').toLowerCase();
        if (ch === 'sms') return '💬';        // speech balloon
        if (ch === 'whatsapp') return '📱';   // mobile phone
        if (ch === 'call' || ch === 'voice') return '📞'; // telephone receiver
        return '✉️';                           // envelope (email/default)
      }
      var et = (e.event_type || '').toLowerCase();
      if (et === 'note') return '📝';          // memo
      if (et === 'stage_change') return '🚩';  // triangular flag
      if (et === 'task_completed') return '✅';      // check mark
      if (et === 'task_created') return '➕';        // heavy plus
      if (et === 'blocker' || et === 'blocked') return '⛔'; // no entry
      return '•';                                   // bullet
    }

    // Render the merged GP timeline (events + comms messages), newest first (read-only).
    function renderGpTimelinePane(events) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var html = '<div class="ceo-ops-section-head">Timeline <span class="count">' + events.length + '</span></div>';
      if (!events.length) {
        html += '<div class="ceo-gp-detail-empty">No timeline activity for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < events.length; i++) {
        var e = events[i];
        var title, sub, who;
        if (e.kind === 'message') {
          var dir = (e.direction === 'inbound') ? 'In' : 'Out';
          title = (e.subject ? esc(e.subject) : esc((e.channel || 'message') + ' ' + dir.toLowerCase()));
          sub = e.body_text ? esc(String(e.body_text).slice(0, 160)) : '';
          who = e.sender || e.recipient || '';
        } else {
          title = esc(e.title || (e.event_type || 'event').replace(/_/g, ' '));
          sub = e.detail ? esc(e.detail) : '';
          who = e.actor || '';
        }
        html += '<div class="ceo-gp-tl-row">';
        html += '<span class="ceo-gp-tl-icon">' + gpTimelineIcon(e) + '</span>';
        html += '<div class="ceo-gp-tl-main">';
        html += '<div class="ceo-gp-tl-title">' + title + '</div>';
        if (sub) html += '<div class="ceo-gp-tl-sub">' + sub + '</div>';
        if (who) html += '<div class="ceo-gp-tl-who">' + esc(who) + '</div>';
        html += '</div>';
        html += '<span class="ceo-gp-tl-time">' + esc(fmtCallTime(e.created_at)) + '</span>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Timeline sub-tab: fetch the full case timeline + comms once (cached per GP file),
    // merge + sort newest-first, and render. Read-only.
    function renderGpTimelineTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpTimelineCache && gpTimelineCache.caseId === caseId) {
        renderGpTimelinePane(gpTimelineCache.events);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpTimeline(caseId);
    }

    // Fetch GET /api/admin/case/timeline?id=<caseId>, merge timeline[]+messages[], cache, render.
    function loadGpTimeline(caseId) {
      apiFetch('/api/admin/case/timeline?id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Failed to load timeline: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var events = mergeGpTimeline(d.timeline || [], d.messages || []);
        gpTimelineCache = { caseId: caseId, events: events };
        if (gpDetailTab === 'timeline') renderGpTimelinePane(events);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Pure mirror of lib/ceo-metrics.js gpDocumentSections (the authoritative,
    // unit-tested contract): normalize the four document categories into a fixed-order
    // list of { key, label, docs }, keeping empty categories, preserving doc order, and
    // normalizing each doc to { label, status, url, fileName, updatedAt } (primary field
    // then admin alias).
    var GP_DOCUMENT_CATEGORIES = [
      { key: 'directToAhpra', label: 'Direct to AHPRA' },
      { key: 'preparedByCandidate', label: 'Prepared by Candidate' },
      { key: 'preparedByGpLink', label: 'Prepared by GP LINK' },
      { key: 'otherFiles', label: 'Other Files' }
    ];
    function gpDocumentSections(documents) {
      var src = documents || {};
      return GP_DOCUMENT_CATEGORIES.map(function(cat) {
        var list = Array.isArray(src[cat.key]) ? src[cat.key] : [];
        var docs = list.filter(function(d) { return !!d; }).map(function(d) {
          return {
            key: (d.key != null && d.key !== '') ? d.key : (d.document_key || ''),
            label: (d.label != null && d.label !== '') ? d.label : (d.document_key || ''),
            status: (d.status != null && d.status !== '') ? d.status : (d.ops_status || null),
            url: d.file_url || d.webViewLink || null,
            fileName: d.file_name || d.name || null,
            updatedAt: d.updated_at || null
          };
        });
        return { key: cat.key, label: cat.label, docs: docs };
      });
    }

    // Inline mirrors of lib/ceo-metrics.js docTaskForKey + docActionsFor (3c.1).
    // The actionable practice-pack task for a document key (most recent non-terminal
    // one), or null. Tasks arrive created_at.desc, so the first non-completed/cancelled
    // match is the newest open task. Used to attach document controls to GP LINK doc rows.
    function docTaskForKey(tasks, docKey) {
      if (!docKey) return null;
      var matches = [];
      for (var i = 0; i < (tasks || []).length; i++) {
        var t = tasks[i];
        if (t && t.task_type === 'practice_pack_child' && t.related_document_key === docKey) matches.push(t);
      }
      if (!matches.length) return null;
      for (var j = 0; j < matches.length; j++) {
        var s = matches[j].status;
        if (s !== 'completed' && s !== 'cancelled') return matches[j];
      }
      return matches[0];
    }

    // Which document actions are available for a task, mirroring admin.html gating
    // (pages/admin.html ~1725). Upload is offered for the two uploadable pack docs;
    // approve when an attachment is present; request-revision for auto-received docs.
    function docActionsFor(task) {
      var key = task && task.related_document_key;
      var canUpload = key === 'offer_contract' || key === 'supervisor_cv';
      var hasAttachment = !!(task && (task.attachment_url || task.zoho_attachment_id));
      var autoReceived = !!(task && task.gmail_message_id && task.attachment_url);
      return { upload: canUpload, approve: hasAttachment, requestRevision: autoReceived };
    }

    // Attribute-safe escape (CEO esc() doesn't escape quotes; attribute values need it).
    function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
    // Document status label + small helpers (port of admin.html docStatusLabel/driveFileIcon/
    // formatFileSize/gpDocThumbError) so the CEO Documents tab matches the RSO/admin view.
    function docStatusLabel(status) {
      var map = { pending: 'Pending', requested: 'Requested', uploaded: 'Uploaded', under_review: 'Under Review', approved: 'Approved', accepted: 'Accepted', rejected: 'Rejected', action_required: 'Action Required', not_requested: 'Not Requested', awaiting_practice: 'Awaiting Practice', awaiting_gp: 'Awaiting GP', received: 'Received', needs_correction: 'Needs Correction', ready_for_gp: 'Ready', completed: 'Completed' };
      return map[status] || status || 'Pending';
    }
    function driveFileIcon(mime) {
      if (!mime) return '📄';
      if (mime.indexOf('pdf') > -1) return '📄';
      if (mime.indexOf('image') > -1) return '🖼️';
      if (mime.indexOf('spreadsheet') > -1 || mime.indexOf('excel') > -1 || mime.indexOf('csv') > -1) return '📊';
      if (mime.indexOf('document') > -1 || mime.indexOf('word') > -1) return '📃';
      return '📄';
    }
    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '';
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1048576) return Math.round(bytes / 1024) + 'KB';
      return (bytes / 1048576).toFixed(1) + 'MB';
    }
    // Thumbnail load failed (e.g. PDF has no inline image) → swap to a file icon.
    function gpDocThumbError(img) {
      if (!img || !img.parentNode) return;

      d.className = 'ceo-doc-thumb ceo-doc-thumb-icon';

    }

    // In-app document viewer (blob → modal), reusing the CEO modal. Used by clickable
    // candidate-document cards (data-doc-view-url).
    var _ceoDocViewerObjUrl = null;
    function ceoOpenDocViewer(fetchUrl, title) {

      html += '<div id="ceoDocViewerBox" style="min-height:140px;max-height:62vh;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;padding:8px"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div></div>';

      openModal(html);
      if (_ceoDocViewerObjUrl) { URL.revokeObjectURL(_ceoDocViewerObjUrl); _ceoDocViewerObjUrl = null; }
      fetch(fetchUrl, { credentials: 'same-origin' }).then(function(resp) {
        var box = document.getElementById('ceoDocViewerBox');
        if (!box) return;
        if (!resp.ok) { return resp.json().catch(function() { return {}; }).then(function(dj) { box.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:24px">' + esc(dj.message || 'No document is stored for this slot yet.') + '</div>'; }); }
        return resp.blob().then(function(blob) {

    // Drive file preview (Drive embed in the CEO modal). Used by Drive-backed cards
    // (data-drive-preview) — GP LINK pack docs + Other Files.
    function ceoOpenDrivePreview(fileId, name, mime, link) {

    // A "Prepared by Candidate" document card: thumbnail + status/flag badge, clickable to
    // open the uploaded file in-app (port of admin renderDocPlaceholderCard).
    function renderCeoCandidateDocCard(doc, caseId) {
      var status = doc.status;
      var viewable = caseId && (!!doc.file_url || ['approved', 'uploaded', 'under_review', 'rejected', 'accepted', 'received', 'needs_correction'].indexOf(status) >= 0);
      var previewUrl = viewable ? ('/api/admin/gp-document-preview?case_id=' + encodeURIComponent(caseId) + '&key=' + encodeURIComponent(doc.key)) : '';
      var viewAttrs = viewable ? (' data-doc-view-url="' + escAttr(previewUrl) + '" data-doc-view-label="' + escAttr(doc.label || 'Document') + '"') : '';
      var thumb = viewable ? ('<img src="' + escAttr(previewUrl) + '" class="ceo-doc-thumb" alt="" onerror="gpDocThumbError(this)">') : '<div class="ceo-doc-thumb ceo-doc-thumb-icon">📄</div>';
      var meta = '';

      if (doc.updated_at) meta += '<div class="ceo-doc-card-meta">' + esc(relativeTime(doc.updated_at)) + '</div>';
      var badge;
      if (doc.flag_reason === 'name_mismatch') badge = '<span class="ceo-doc-status s-rejected">Name mismatch</span>';

        '<div class="ceo-doc-card-info"><div class="ceo-doc-card-label" title="' + escAttr(doc.label || '') + '">' + esc(doc.label || '(untitled)') + '</div>' + badge + meta + '</div></div>';

    // A "Prepared by GP LINK" document card: Drive thumbnail + status, clickable to preview,
    // PLUS the CEO upload/approve/request-revision actions (gated on a matching task).
    function renderCeoGpLinkDocCard(doc) {

      if (df) { var size = df.size ? formatFileSize(Number(df.size)) : ''; meta = '<div class="ceo-doc-card-meta">' + esc(size) + (size ? ' • ' : '') + esc(df.modifiedTime ? relativeTime(df.modifiedTime) : '') + '</div>'; }
      var driveAttrs = df ? (' data-drive-preview="' + escAttr(df.id) + '" data-drive-name="' + escAttr(df.name) + '" data-drive-mime="' + escAttr(df.mimeType || '') + '" data-drive-link="' + escAttr(df.webViewLink || '') + '"') : '';

    // Render the four document categories for the open GP file, matching the admin/RSO view:

    function renderGpDocumentsPane(gpDocs, driveFolder) {

      gpDocs = gpDocs || {};

      var candidate = gpDocs.preparedByCandidate || [];
      var gplink = gpDocs.preparedByGpLink || [];
      var other = gpDocs.otherFiles || [];
      var total = ahpra.length + candidate.length + gplink.length + other.length;

      var html = '<div class="ceo-ops-section-head">Documents <span class="count">' + total + '</span>';
      if (docCaseId) html += '<label class="btn ceo-doc-upload-btn" style="margin-left:auto">Upload file…<input type="file" data-ceo-drive-upload="' + escAttr(docCaseId) + '" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.heic,.txt,.csv" style="display:none"></label>';
      if (driveFolder) html += '<a class="ceo-gp-drive-link" href="' + escAttr(driveFolder) + '" target="_blank" rel="noopener" style="margin-left:' + (docCaseId ? '12px' : 'auto') + '">Open Drive folder</a>';

      // Section 1 — Direct to AHPRA (checklist).

      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Direct to AHPRA</span><span class="ceo-doc-section-count">' + ahpraDone + ' / ' + ahpra.length + '</span></div>';
      if (!ahpra.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else {
        html += '<div class="ceo-doc-checklist">';
        ahpra.forEach(function(doc) {
          var done = doc.status !== 'pending';
          html += '<div class="ceo-doc-check-item"><div class="ceo-doc-check' + (done ? ' checked' : '') + '">✓</div>';
          html += '<span class="ceo-doc-check-label">' + esc(doc.label || doc.document_key || '');
          if (doc.key === 'criminal_history' && doc.referenceNumber) html += '<span class="ceo-doc-refno">' + esc(doc.referenceNumber) + '</span>';
          html += '</span><span class="ceo-doc-status s-' + (doc.status || 'pending') + '">' + docStatusLabel(doc.status) + '</span></div>';
        });
        html += '</div>';
      }

      // Section 2 — Prepared by Candidate (card grid, click to open).
      var candDone = candidate.filter(function(d) { return d.status !== 'pending'; }).length;
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Prepared by Candidate</span><span class="ceo-doc-section-count">' + candDone + ' / ' + candidate.length + '</span></div>';
      if (!candidate.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else { html += '<div class="ceo-doc-grid">'; candidate.forEach(function(doc) { html += renderCeoCandidateDocCard(doc, docCaseId); }); html += '</div>'; }
      html += '</div>';

      // Section 3 — Prepared by GP LINK (card grid + CEO actions).
      var gplinkDone = gplink.filter(function(d) { return d.ops_status === 'completed' || d.ops_status === 'ready_for_gp'; }).length;
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Prepared by GP LINK</span><span class="ceo-doc-section-count">' + gplinkDone + ' / ' + gplink.length + '</span></div>';
      if (!gplink.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else { html += '<div class="ceo-doc-grid">'; gplink.forEach(function(doc) { html += renderCeoGpLinkDocCard(doc); }); html += '</div>'; }
      html += '</div>';

      // Section 4 — Other Files (Drive thumbnail grid).
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Other Files</span><span class="ceo-doc-section-count">' + other.length + '</span></div>';
      if (!other.length) html += '<div class="ceo-gp-doc-empty">No files in this category.</div>';
      else {
        html += '<div class="ceo-doc-grid">';
        other.forEach(function(f) {
          var icon = driveFileIcon(f.mimeType);
          var thumb = f.thumbnailLink ? '<img src="' + escAttr(f.thumbnailLink) + '" class="ceo-doc-thumb" alt="" onerror="gpDocThumbError(this)">' : '<div class="ceo-doc-thumb ceo-doc-thumb-icon">' + icon + '</div>';
          var size = f.size ? formatFileSize(Number(f.size)) : '';
          html += '<div class="ceo-doc-card is-clickable" data-drive-preview="' + escAttr(f.id) + '" data-drive-name="' + escAttr(f.name) + '" data-drive-mime="' + escAttr(f.mimeType || '') + '" data-drive-link="' + escAttr(f.webViewLink || '') + '">' + thumb +
            '<div class="ceo-doc-card-info"><div class="ceo-doc-card-label" title="' + escAttr(f.name) + '">' + esc(f.name) + '</div><div class="ceo-doc-card-meta">' + esc(size) + (size ? ' • ' : '') + esc(f.modifiedTime ? relativeTime(f.modifiedTime) : '') + '</div></div></div>';
        });

    // Documents sub-tab: fetch the GP documents once (cached per GP file), normalize
    // into the four sections, and render. Read-only.
    function renderGpDocumentsTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;

        renderGpDocumentsPane(gpDocumentsCache.raw, gpDocumentsCache.driveFolder);
        return;

    // Fetch GET /api/admin/gp-documents?case_id=<caseId>, normalize, cache, render.
    function loadGpDocuments(caseId) {
      apiFetch('/api/admin/gp-documents?case_id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Failed to load documents: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        // /api/admin/gp-documents returns the four category arrays FLAT at the top level
        // ({ ok, country, directToAhpra, preparedByCandidate, preparedByGpLink, otherFiles }).
        // Cache + render the RAW response so the per-category cards keep their full fields
        // (drive_file/thumbnailLink/file_url/referenceNumber/flag_reason/ops_status).
        gpDocumentsCache = { caseId: caseId, raw: d, driveFolder: d.driveFolder || null };
        if (gpDetailTab === 'documents') renderGpDocumentsPane(d, gpDocumentsCache.driveFolder);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // GP Documents action: upload a file for a GP LINK pack document (offer_contract /
    // supervisor_cv). Reuses the unchanged POST /api/admin/va/task/upload-document
    // (super-admin passes its requireAdminSession). file_data is a base64 data URL via
    // FileReader.readAsDataURL, matching how admin.html uploads. Body is passed as an
    // object so apiFetch JSON-stringifies it and sets Content-Type: application/json.
    function ceoDocUpload(taskId, inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        apiFetch('/api/admin/va/task/upload-document', {
          method: 'POST',
          body: { task_id: taskId, file_data: reader.result, file_name: file.name }
        }).then(function(d) {
          if (!d || !d.ok) { showToast((d && d.message) || 'Upload failed', 'error'); return; }
          showToast('Document uploaded', 'success');
          refreshGpDocsAndTasks();
        }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
      };
      reader.readAsDataURL(file);
    }

    // unchanged POST /api/admin/va/task/approve-document.

        method: 'POST',

        showToast('Approved & sent', 'success');

      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });

    // GP Documents action: upload an arbitrary file to this GP's Google Drive folder.

    // POST /api/admin/drive/upload?case_id= (JSON {fileName, fileData(base64), mimeType}).

    function ceoReviewFlaggedDoc(taskId) {

      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>';

      html += '<button class="btn btn-green" id="ceoReviewDocApprove" onclick="submitCeoReviewDoc(\'' + esc(taskId) + '\', \'approve\')">Approve</button></div>';
      openModal(html);
      if (_ceoReviewDocObjUrl) { URL.revokeObjectURL(_ceoReviewDocObjUrl); _ceoReviewDocObjUrl = null; }
      fetch('/api/admin/va/task/preview-document?task_id=' + encodeURIComponent(taskId), { credentials: 'same-origin' }).then(function(resp) {

        return resp.blob().then(function(blob) {

          if ((blob.type || '').indexOf('image/') === 0) box.innerHTML = '<img alt="Document" src="' + _ceoReviewDocObjUrl + '" style="max-width:100%;max-height:50vh;object-fit:contain" />';
          else box.innerHTML = '<iframe title="Document" src="' + _ceoReviewDocObjUrl + '" style="width:100%;height:50vh;border:none;background:#fff"></iframe>';

        if (box) box.innerHTML = '<div style="color:var(--red);font-size:13px;padding:24px">Could not load the document: ' + esc(e.message) + '</div>';
