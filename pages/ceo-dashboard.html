    /* ── 12-week trends chart (Phase 6 H1) ─────────────────────────────
       Hand-rolled inline SVG (no external chart libs — CSP blocks CDNs).
       One selectable series at a time; each series keeps its own fixed color
       (color follows the entity, matching the KPI-card accent language). */
    function trendWeekLabel(ws) {
      try {
        var d = new Date(ws + 'T00:00:00Z');
        if (isNaN(d.getTime())) return ws;
        var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return d.getUTCDate() + ' ' + mo[d.getUTCMonth()];
      } catch (e) { return ws; }
    }
    function trendNiceMax(v) {
      if (!(v > 0)) return 5;
      if (v <= 5) return 5;
      var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
      var norm = v / mag;
      var nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
      return nice * mag;
    }
    function buildTrendChartSvg(weeks, series) {
      var W = 660, H = 230, padL = 42, padR = 18, padT = 16, padB = 26;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var n = weeks.length;
      var vals = weeks.map(function (w) { return Number(w[series.key]) || 0; });
      var maxV = trendNiceMax(Math.max.apply(null, vals));
      function px(i) { return padL + (n === 1 ? plotW / 2 : i * plotW / (n - 1)); }
      function py(v) { return padT + plotH - (v / maxV) * plotH; }

      var svg = '<svg class="trend-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(series.label) + ' per week, last 12 weeks">';

      // Faint gridlines + y labels (0 / half / max) — recessive, data stays dominant.
      var gridVals = [0, maxV / 2, maxV];
      for (var g = 0; g < gridVals.length; g++) {
        var gy = py(gridVals[g]);
        svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>';
        svg += '<text x="' + (padL - 8) + '" y="' + (gy + 3.5) + '" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.3)" font-family="JetBrains Mono, monospace">' + (gridVals[g] % 1 === 0 ? gridVals[g] : gridVals[g].toFixed(1)) + '</text>';
      }

      // Area fill (soft) under a 2px line.
      var linePts = '';
      for (var i = 0; i < n; i++) linePts += (i === 0 ? 'M' : 'L') + px(i).toFixed(1) + ' ' + py(vals[i]).toFixed(1) + ' ';
      var baseline = py(0);
      var areaPath = linePts + 'L' + px(n - 1).toFixed(1) + ' ' + baseline + ' L' + px(0).toFixed(1) + ' ' + baseline + ' Z';
      svg += '<path d="' + areaPath + '" fill="' + series.color + '" fill-opacity="0.12"/>';
      svg += '<path d="' + linePts + '" fill="none" stroke="' + series.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

      // Per-week points + native hover tooltips (title on an enlarged hit circle).
      for (var p = 0; p < n; p++) {
        var isLast = p === n - 1;
        var cx = px(p).toFixed(1), cy = py(vals[p]).toFixed(1);
        if (isLast) {
          // Emphasized latest point: bigger dot ringed with the panel surface.
          svg += '<circle cx="' + cx + '" cy="' + cy + '" r="5.5" fill="' + series.color + '" stroke="#1a1d27" stroke-width="2"/>';
          var lx = Math.min(Number(cx), W - padR - 8);
          svg += '<text x="' + lx + '" y="' + (Number(cy) - 10) + '" text-anchor="end" font-size="12" font-weight="700" fill="#e2e8f0" font-family="JetBrains Mono, monospace">' + vals[p] + '</text>';
        } else {
          svg += '<circle cx="' + cx + '" cy="' + cy + '" r="2.5" fill="' + series.color + '"/>';
        }
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="transparent"><title>Week of ' + esc(weeks[p].week_start) + ' — ' + vals[p] + ' ' + esc(series.label.toLowerCase()) + '</title></circle>';
      }

      // Sparse x labels: first / middle / latest week.
      var xIdx = [0, Math.floor((n - 1) / 2), n - 1];
      for (var x = 0; x < xIdx.length; x++) {
        var xi = xIdx[x];
        if (x > 0 && xi === xIdx[x - 1]) continue;
        var anchor = xi === 0 ? 'start' : (xi === n - 1 ? 'end' : 'middle');
        svg += '<text x="' + px(xi).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" font-size="10" fill="rgba(255,255,255,0.3)">' + esc(trendWeekLabel(weeks[xi].week_start)) + '</text>';
      }

      svg += '</svg>';
      return svg;
    }
    function renderTrendsBodyHtml() {
      var html = '<div class="trend-controls">';
      for (var i = 0; i < TREND_SERIES.length; i++) {
        var s = TREND_SERIES[i];
        var active = s.key === selectedTrendSeries;
        html += '<button class="trend-chip' + (active ? ' active' : '') + '" data-trend-series="' + s.key + '"'
          + (active ? ' style="border-color:' + s.color + ';color:' + s.color + '"' : '')
          + '>' + esc(s.label) + '</button>';
      }
      html += '<button class="digest-now-btn" id="sendDigestBtn" title="Emails the weekly operational digest to the owner inbox right now">&#x2709;&#xFE0F; Send me the digest now</button>';
      html += '</div>';

      var weeks = trendsData && trendsData.weeks;
      if (!weeks || weeks.length < 2) {
        html += '<div class="trend-empty">Trends are still loading&hellip;</div>';
        return html;
      }
      var sel = TREND_SERIES.filter(function (t) { return t.key === selectedTrendSeries; })[0] || TREND_SERIES[0];
      var cur = Number(weeks[weeks.length - 1][sel.key]) || 0;
      var prev = Number(weeks[weeks.length - 2][sel.key]) || 0;
      var diff = cur - prev;
      var moveHtml = diff > 0 ? '<span style="color:var(--green)">&#x25B2; +' + diff + ' vs last week</span>'
        : diff < 0 ? '<span style="color:var(--red)">&#x25BC; ' + diff + ' vs last week</span>'
        : '<span style="color:var(--text-dim)">&#x2014; unchanged vs last week</span>';
      html += '<div class="trend-summary">' + esc(sel.label) + ' this week: <span class="trend-cur">' + cur + '</span> &middot; ' + moveHtml + '</div>';
      html += buildTrendChartSvg(weeks, sel);
      return html;
    }
    function renderTrendsSection() {
      return sectionCard('trends', '&#x1F4C8;', '12-Week Trends', '<div id="trendsBody">' + renderTrendsBodyHtml() + '</div>', true);

    /* ── Conversion funnel + time-to-placement (Phase 6 H2) ─────────────
       Cross-system business funnel from GET /api/ceo/conversion-funnel —

    function funnelStepsHtml(steps, colorSeq) {

        html += '<span class="funnel-count">' + fmtNum(st.count) + '</span>';

    function ttpFigure(stats, label) {

    /* ── "How GPs found us" — lead-source attribution (Phase 6 H2) ── */

    /* ── PEP (Substantially Comparable) waitlist ── */
    // GPs whose specialist qualification predates the expedited cutoff are gated onto
    // the PEP pathway page until we launch that pathway. This section lists them and
    // lets the CEO release anyone the AI misjudged back into the normal pipeline.
    function pepShortDate(iso) {
      if (!iso) return '—';
      try { var d = new Date(iso); if (isNaN(d.getTime())) return '—'; return d.toLocaleDateString(); } catch (e) { return '—'; }
    }
    function renderWaitlistSection() {
      var tabs = '<div class="wl-tabs">'
        + '<button class="wl-tab active" data-wl-tab="pep">PEP pathway <span id="wlPepCount"></span></button>'
        + '<button class="wl-tab" data-wl-tab="onb">Onboarding incomplete <span id="wlOnbCount"></span></button>'
        + '</div>';
      var body = tabs
        + '<div id="pepWaitlistBody" class="wl-pane active"><div class="pep-wl-empty">Loading…</div></div>'
        + '<div id="onbWaitlistBody" class="wl-pane"><div class="pep-wl-empty">Loading…</div></div>';
      return sectionCard('waitlist', '&#x23F3;', 'Waitlist', body, true);
    }
    function renderPepWaitlistBody(data) {
      if (!data || !data.ok) return '<div class="pep-wl-empty">Could not load the waitlist.</div>';
      var items = (data.items || []).filter(function (i) { return !i.released; });
      // Launch button (Phase 6 H1): releases EVERYONE still gated + notifies
      // opt-ins via POST /api/ceo/pep-waitlist/launch (super-admin only).
      var summary = '<div class="pep-wl-summary-row">'
        + '<div class="pep-wl-summary">' + items.length + ' waiting &middot; ' + (data.notifyCount || 0) + ' asked to be notified</div>'
        + '<button class="pep-wl-launch" data-pep-launch="1" title="Releases every waitlisted GP into the app and notifies everyone who asked">&#x1F680; Launch PEP pathway</button>'
        + '</div>';
      if (items.length === 0) return summary + '<div class="pep-wl-empty">No GPs on the PEP waitlist yet.</div>';
      var rows = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var contact = esc(it.email || '—');
        if (it.phone) contact += '<br><span class="pep-wl-dim">' + esc(it.phone) + '</span>';
        var cert = esc(it.certType || '—');
        if (it.dateFound) cert += '<br><span class="pep-wl-dim">dated ' + esc(it.dateFound) + '</span>';
        rows += '<tr>'
          + '<td>' + esc(it.name || '—') + ' <span class="pep-badge">PEP</span></td>'
          + '<td>' + contact + '</td>'
          + '<td>' + esc(it.country || '—') + '</td>'
          + '<td>' + cert + '</td>'
          + '<td>' + esc(it.cutoffLabel || it.cutoffDate || '—') + '</td>'
          + '<td>' + (it.notifyRequested ? 'Yes' : 'No') + '</td>'
          + '<td>' + esc(pepShortDate(it.createdAt)) + '</td>'
          + '<td><button class="pep-wl-release" data-pep-release="' + esc(it.email) + '">Release</button></td>'
          + '</tr>';
      }
      return summary + '<div class="pep-wl-tablewrap"><table class="pep-wl-table"><thead><tr>'
        + '<th>GP</th><th>Contact</th><th>Country</th><th>Certificate</th><th>Cutoff</th><th>Notify?</th><th>Added</th><th></th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
    function loadPepWaitlist() {
      var body = document.getElementById('pepWaitlistBody');
      if (!body) return;
      gpSwr('/api/ceo/pep-waitlist', function (d) {
        var b = document.getElementById('pepWaitlistBody');
        if (b) b.innerHTML = renderPepWaitlistBody(d);
        var c = document.getElementById('wlPepCount');
        if (c && d && d.ok) c.textContent = '(' + (d.waiting || 0) + ')';
      }).catch(function () {
        var b = document.getElementById('pepWaitlistBody');
        if (b) b.innerHTML = '<div class="pep-wl-empty">Could not load the waitlist.</div>';

    function renderOnbWaitlistBody(data) {
      if (!data || !data.ok) return '<div class="pep-wl-empty">Could not load the list.</div>';

      var summary = '<div class="pep-wl-summary">' + items.length + ' GP' + (items.length === 1 ? '' : 's') + ' started but haven’t finished onboarding</div>';
      if (items.length === 0) return summary + '<div class="pep-wl-empty">Everyone who signed up has finished onboarding.</div>';
      var rows = '';

        var it = items[i];

    // Compact live hiring funnel (gp_applications by ats_stage) rendered under
    // the registration funnel, using the same funnel-row visual language.
    function renderHiringFunnelStrip(atsFunnel) {
      if (!atsFunnel || typeof atsFunnel !== 'object') return '';
      var maxCount = 1;
      for (var i = 0; i < ATS_FUNNEL_STAGES.length; i++) {
        var c = Number(atsFunnel[ATS_FUNNEL_STAGES[i].key]) || 0;
        if (c > maxCount) maxCount = c;
      }
      var html = '<div style="margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:8px">Hiring pipeline</div>';
      for (var j = 0; j < ATS_FUNNEL_STAGES.length; j++) {
        var st = ATS_FUNNEL_STAGES[j];
        var count = Number(atsFunnel[st.key]) || 0;
        var pct = count === 0 ? 0 : Math.max(2, Math.round(count / maxCount * 100));
        html += '<div class="funnel-row" style="cursor:default">';
        html += '<span class="funnel-label">' + esc(st.label) + '</span>';
        html += '<div class="funnel-bar-wrap"><div class="funnel-bar ' + st.color + '" style="width:' + pct + '%"></div></div>';
        html += '<span class="funnel-count">' + count + '</span>';
        html += '<span class="funnel-blocked"></span>';
        html += '</div>';
      }
      var notProceeding = Number(atsFunnel.not_proceeding) || 0;
      html += '<div style="font-size:11px;color:var(--text-dim);margin-top:6px">Not proceeding: ' + notProceeding + '</div>';
      return html;
    }

    /* A8b: load + render the per-placement list (GP · practice · role · secured
       · commencement). Commencement is editable inline via a small PATCH-style
       POST to /api/ats/placement (mode:'update'). */
    function fmtPlacementDate(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso).slice(0, 10) || '—';
        return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (e) { return String(iso).slice(0, 10) || '—'; }
    }

    function loadPlacementsList() {
      var body = document.getElementById('placementsListBody');
      if (!body) return;
      apiFetch('/api/ats/placements?limit=50').then(function (d) {
        var b = document.getElementById('placementsListBody');
        if (!b) return;
        var list = (d && d.ok && Array.isArray(d.placements)) ? d.placements : [];
        if (!list.length) { b.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">No placements recorded yet.</div>'; return; }
        var rows = list.map(function (p) {
          var dateIso = p.commencement_date ? String(p.commencement_date).slice(0, 10) : '';
          var canEdit = !!p.application_id;
          var commenceCell = '<span class="pl-commence-view" style="font-size:12px">' + esc(fmtPlacementDate(p.commencement_date)) + '</span>' +
            (canEdit ? ' <button type="button" class="pl-commence-edit" data-app-id="' + esc(p.application_id) + '" data-date="' + esc(dateIso) + '" style="background:none;border:none;color:var(--blue);font-size:11px;text-decoration:underline;cursor:pointer;padding:0">edit</button>' : '');
          return '<tr style="border-top:1px solid var(--panel-border)">' +
            '<td style="padding:6px 8px;font-size:12px">' + esc(p.gp_name || '—') + '</td>' +
            '<td style="padding:6px 8px;font-size:12px">' + esc(p.practice_name || '—') + '</td>' +
            '<td style="padding:6px 8px;font-size:12px;color:var(--text-muted)">' + esc(p.job_title || '—') + '</td>' +
            '<td style="padding:6px 8px;font-size:12px;color:var(--text-muted)">' + esc(fmtPlacementDate(p.secured_at)) + '</td>' +
            '<td style="padding:6px 8px" data-app-id="' + esc(p.application_id || '') + '">' + commenceCell + '</td>' +
          '</tr>';
        }).join('');
        b.innerHTML = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:520px">' +
          '<thead><tr>' +
            '<th style="text-align:left;padding:6px 8px;font-size:10.5px;color:var(--text-dim);font-weight:600">GP</th>' +
            '<th style="text-align:left;padding:6px 8px;font-size:10.5px;color:var(--text-dim);font-weight:600">Practice</th>' +
            '<th style="text-align:left;padding:6px 8px;font-size:10.5px;color:var(--text-dim);font-weight:600">Role</th>' +
            '<th style="text-align:left;padding:6px 8px;font-size:10.5px;color:var(--text-dim);font-weight:600">Secured</th>' +
            '<th style="text-align:left;padding:6px 8px;font-size:10.5px;color:var(--text-dim);font-weight:600">Commencement</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';
      }).catch(function () {
        var b = document.getElementById('placementsListBody');
        if (b) b.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">Could not load placements.</div>';
      });
    }

    // Delegated: inline commencement-date edit for a placement row.
    document.addEventListener('click', function (e) {
      var editBtn = e.target && e.target.closest ? e.target.closest('.pl-commence-edit') : null;
      if (!editBtn) return;
      var appId = editBtn.getAttribute('data-app-id');
      var cell = editBtn.closest('td');
      if (!appId || !cell) return;
      var current = editBtn.getAttribute('data-date') || '';
      cell.innerHTML = '<input type="date" class="pl-commence-input" value="' + esc(current) + '" style="font-size:12px">' +
        ' <button type="button" class="pl-commence-save" data-app-id="' + esc(appId) + '" style="background:none;border:none;color:var(--green);font-size:11px;text-decoration:underline;cursor:pointer;padding:0">save</button>';
    });
    document.addEventListener('click', function (e) {
      var saveBtn = e.target && e.target.closest ? e.target.closest('.pl-commence-save') : null;
      if (!saveBtn) return;
      var appId = saveBtn.getAttribute('data-app-id');
      var cell = saveBtn.closest('td');
      var input = cell ? cell.querySelector('.pl-commence-input') : null;
      if (!appId || !input) return;
      saveBtn.disabled = true; saveBtn.textContent = 'saving…';
      apiFetch('/api/ats/placement', { method: 'POST', body: { applicationId: appId, mode: 'update', commencementDate: input.value || '' } }).then(function (d) {
        if (d && d.ok) { loadPlacementsList(); }
        else { saveBtn.disabled = false; saveBtn.textContent = 'save'; alert((d && d.message) || 'Could not update the commencement date.'); }
      }).catch(function () { saveBtn.disabled = false; saveBtn.textContent = 'save'; });
    });

    /* ── Completions ── */
    function humanizeMilestone(text) {
      if (!text) return 'reached a milestone';
      // Map raw "Stage advanced to amc" / "amc" slugs to friendly stage labels
      var m = String(text).match(/(?:advanced to|reached|stage[:\s]+)\s*([a-z_]+)/i);
      var slug = m ? m[1].toLowerCase() : String(text).trim().toLowerCase();
      if (STAGE_LABELS[slug]) return 'reached ' + STAGE_LABELS[slug];
      if (slug === 'complete') return 'completed registration';
      return text; // already humanized server-side
    }

    function renderCompletionsSection(comp) {
      if (!comp) return '';
      var html = '<div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">';
      html += '<div class="completions-header">';
      html += '<div class="completion-stat"><div class="completion-stat-value">' + fmtNum(comp.this_month) + '</div><div class="completion-stat-label">This Month</div></div>';
      html += '<div class="completion-stat"><div class="completion-stat-value" style="color:var(--text)">' + fmtNum(comp.total) + '</div><div class="completion-stat-label">Total</div></div>';
      html += '</div>';
      html += '<div class="milestones-list" style="flex:1;min-width:200px">';
      var milestones = comp.recent_milestones || [];
      if (milestones.length === 0) {
        html += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No recent milestones</div>';
      }
      for (var i = 0; i < Math.min(milestones.length, 6); i++) {
        var m = milestones[i];
        html += '<div class="milestone-row">';
        html += '<div class="milestone-dot"></div>';
        html += '<div class="milestone-text"><strong>' + esc(m.gp_name) + '</strong> ' + esc(humanizeMilestone(m.milestone)) + '</div>';
        html += '<div class="milestone-ago">' + (m.days_ago != null ? m.days_ago + 'd ago' : relativeTime(m.date)) + '</div>';
        html += '</div>';
      }
      html += '</div></div>';
      return sectionCard('completions', '&#x1F389;', 'Completions & Wins', html, true);
    }

    /* ── Section Card Wrapper ── */
    function sectionCard(section, icon, title, bodyHtml, fullWidth) {
      var cls = fullWidth ? ' full-width' : '';
      return '<div class="section-card' + cls + '" data-section="' + section + '">' +
        '<div class="section-card-header">' +
        '<div class="section-card-title"><span class="icon">' + icon + '</span>' + esc(title) + '</div>' +
        '</div>' +
        '<div class="section-card-body">' + bodyHtml + '</div>' +
        '<div class="drilldown-panel" id="dd-' + section + '"></div>' +

    /* ═══ DRILLDOWN ═══ */
    function handleDrilldownClick(section, param, cardEl, panelId) {
      panelId = panelId || section;
      var panel = document.getElementById('dd-' + panelId);
      if (!panel) return;

      // Toggle off if same drilldown
      if (activeDrilldown && activeDrilldown.section === section && activeDrilldown.param === param) {
        panel.classList.remove('open');
        panel.innerHTML = '';
        activeDrilldown = null;
        return;
      }

      // Close any other open drilldown
      if (activeDrilldown) {
        var oldPanel = document.getElementById('dd-' + (activeDrilldown.panelId || activeDrilldown.section));
        if (oldPanel) { oldPanel.classList.remove('open'); oldPanel.innerHTML = ''; }
      }

      panel.classList.add('open');
      panel.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div><div style="margin-top:8px">Loading details...</div></div>';
      activeDrilldown = { section: section, param: param, cardEl: cardEl, panelId: panelId };

      var periodParam = currentPeriod ? 'period=' + currentPeriod : '';
      var paramStr = [param, periodParam].filter(Boolean).join('&');
      var url = '/api/ceo/drilldown/' + section + (paramStr ? '?' + paramStr : '');
      gpSwr(url, function(d) {
        if (!d.ok) {
          panel.innerHTML = '<div class="drilldown-empty">Failed to load: ' + esc(d.message || 'Unknown error') + '</div>';
          return;
        }
        var items = d.items || [];
        if (items.length === 0) {
          panel.innerHTML = '<div class="drilldown-empty">No items found</div>';
          return;
        }
        panel.innerHTML = renderDrilldownItems(section, items);
      }).catch(function(err) {
        panel.innerHTML = '<div class="drilldown-empty">Error: ' + esc(err.message) + '</div>';
      });
    }

    function renderDrilldownItems(section, items) {
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var caseId = item.case_id || '';
        var userId = item.user_id || '';
        var name = item.gp_name || 'Unknown';
        html += '<div class="dd-row" id="dd-row-' + i + '">';
        html += '<div class="dd-row-summary" onclick="toggleDdRow(' + i + ')">';
        html += '<span class="dd-row-name">' + esc(name) + (item.gp_email ? ' <span style="color:var(--text-dim);font-weight:400">' + esc(item.gp_email) + '</span>' : '') + '</span>';
        html += '<span class="dd-row-pills">';
        if (item.stage) { var ddStage = item.stage === 'visa' ? 'pbs' : item.stage; html += '<span class="pill ' + pillClass(ddStage) + '">' + esc(STAGE_LABELS[ddStage] || ddStage) + '</span> '; }
        if (item.status) html += statusPill(item.status) + ' ';
        if (item.priority) html += priorityPill(item.priority) + ' ';
        if (item.blocker_status) html += '<span class="pill pill-red">' + esc(item.blocker_status.replace(/_/g, ' ')) + '</span> ';
        html += '</span>';
        html += '<span class="dd-row-expand">&#x25BC;</span>';
        html += '</div>';
        html += '<div class="dd-row-detail">';
        html += '<div class="dd-detail-grid">';
        html += ddField(section, item);
        html += '</div>';
        html += '<div class="dd-actions">';
        if (caseId) {
          html += '<button class="btn btn-blue" onclick="openCreateTaskModal(\'' + esc(caseId) + '\', \'' + esc(name) + '\')">Create Task</button>';
          html += '<button class="btn btn-amber" onclick="openReassignModal(\'' + esc(caseId) + '\')">Reassign RSO</button>';
          html += '<button class="btn btn-purple" onclick="openStageChangeModal(\'' + esc(caseId) + '\')">Change Stage</button>';
          html += '<button class="btn" onclick="openBlockerModal(\'' + esc(caseId) + '\')">Set Blocker</button>';
          html += '<button class="btn" onclick="openNoteModal(\'' + esc(caseId) + '\', \'' + esc(item.task_id || '') + '\', \'' + esc(name) + '\')">Add Note</button>';
        }
        if (userId) {
          html += '<button class="btn btn-purple" onclick="openNudgeModal(\'' + esc(userId) + '\', \'' + esc(name) + '\')">Send Nudge</button>';
        }
        html += '</div>';
        html += '</div>';
        html += '</div>';
      }
      return html;
    }

    function ddField(section, item) {
      var fields = [];
      if (item.substage) fields.push(['Substage', item.substage.replace(/_/g, ' ')]);
      if (item.assigned_rso || item.assigned_va) fields.push(['Assigned RSO', item.assigned_rso || item.assigned_va]);
      if (item.days_blocked != null) fields.push(['Days Blocked', item.days_blocked + 'd']);
      else if (item.days_in_stage != null) fields.push(['Days Blocked', item.days_in_stage + 'd']);
      if (item.days_inactive != null) fields.push(['Days Inactive', item.days_inactive + 'd']);
      if (item.days_open != null) fields.push(['Days Open', item.days_open + 'd']);
      if (item.open_task_count != null) fields.push(['Open Tasks', item.open_task_count]);
      if (item.open_tasks != null && item.open_task_count == null) fields.push(['Open Tasks', item.open_tasks]);
      if (item.overdue_tasks != null) fields.push(['Overdue', item.overdue_tasks]);
      if (item.blocker_reason) fields.push(['Blocker', item.blocker_reason]);
      if (item.practice_name) fields.push(['Practice', item.practice_name]);
      if (item.role_title) fields.push(['Role', item.role_title]);
      if (item.location) fields.push(['Location', item.location]);
      if (item.title) fields.push(['Task', item.title]);
      if (item.description) fields.push(['Description', item.description]);
      if (item.due_date) fields.push(['Due', item.due_date]);
      if (item.category) fields.push(['Category', item.category]);
      if (item.total_days != null) fields.push(['Total Days', item.total_days + 'd']);
      if (item.last_gp_activity_at) fields.push(['GP Activity', relativeTime(item.last_gp_activity_at)]);
      if (item.last_va_action_at) fields.push(['RSO Action', relativeTime(item.last_va_action_at)]);
      if (item.last_activity) fields.push(['Last Active', relativeTime(item.last_activity)]);
      if (item.applied_at) fields.push(['Applied', relativeTime(item.applied_at)]);
      if (item.completed_at) fields.push(['Completed', relativeTime(item.completed_at)]);
      if (item.interview_date) fields.push(['Interview', relativeTime(item.interview_date)]);
      if (item.interview_status) fields.push(['Interview Status', item.interview_status]);
      if (item.practice_submission_status) fields.push(['Submission', item.practice_submission_status.replace(/_/g, ' ')]);

      var html = '';
      for (var i = 0; i < fields.length; i++) {
        html += '<div><div class="dd-field-label">' + esc(fields[i][0]) + '</div><div class="dd-field-value">' + esc(fields[i][1]) + '</div></div>';
      }
      return html;
    }

    function toggleDdRow(idx) {
      var row = document.getElementById('dd-row-' + idx);
      if (row) row.classList.toggle('expanded');
    }

    /* ═══ ACTION MODALS ═══ */

    /* Create Task */

      var html = '<div class="modal-title">Create Task for ' + esc(gpName) + '</div>';
      html += '<div class="modal-field"><label class="modal-label">Title</label><input class="modal-input" id="mTaskTitle" placeholder="Task title..." /></div>';
      html += '<div class="modal-field"><label class="modal-label">Priority</label><select class="modal-select" id="mTaskPriority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></div>';

    function submitCreateTask(caseId) {

          case_id: caseId,
          title: title,
          priority: document.getElementById('mTaskPriority').value,
          due_date: document.getElementById('mTaskDue').value || null,
          description: document.getElementById('mTaskDesc').value.trim() || null
        }
      }).then(function(d) {
        if (d.ok) { showToast('Task created', 'success'); closeModal(); refreshDashboard(); refreshGpDetailIfOpen(); }
        else { showToast('Failed: ' + (d.message || 'Unknown error'), 'error'); btn.disabled = false; btn.textContent = 'Create Task'; }

    }

    /* RSO roster cache (from /api/ceo/rsos) — populated lazily, refreshed on dashboard load */
    var rsoRosterCache = null;
    function loadRsoRoster() {
      if (rsoRosterCache) return Promise.resolve(rsoRosterCache);
      // SWR: the cached payload populates rsoRosterCache immediately, but callers
      // still await the network result so they always get the fresh roster.
      return gpSwr('/api/ceo/rsos', function(d) {
        rsoRosterCache = (d && d.ok && Array.isArray(d.rsos)) ? d.rsos : [];
      }).then(function() {
        return rsoRosterCache;
      }).catch(function() { rsoRosterCache = rsoRosterCache || []; return rsoRosterCache; });
    }

    /* Reassign RSO */
    function openReassignModal(caseId) {
      var html = '<div class="modal-title">Reassign RSO</div>';
      html += '<div class="modal-field"><label class="modal-label">RSO</label><select class="modal-select" id="mRsoSelect"><option value="">Loading RSOs...</option></select></div>';
      html += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin:-4px 0 12px">Reassigning transfers the GP\'s email threads to the new RSO\'s mailbox.</div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-amber" id="mReassignSubmit" onclick="submitReassign(\'' + esc(caseId) + '\')">Reassign</button></div>';
      openModal(html);
      loadRsoRoster().then(function(rsos) {
        var sel = document.getElementById('mRsoSelect');
        if (!sel) return;
        if (!rsos.length) { sel.innerHTML = '<option value="">No RSOs available</option>'; return; }
        var opts = '<option value="">— Select RSO —</option>';
        for (var i = 0; i < rsos.length; i++) {
          var r = rsos[i];
          if (r.active === false) continue;
          opts += '<option value="' + esc(r.rso_id) + '">' + esc(r.rso_name) + (r.email ? ' (' + esc(r.email) + ')' : '') + '</option>';
        }
        sel.innerHTML = opts;
      });
    }

    function submitReassign(caseId) {
      var sel = document.getElementById('mRsoSelect');
      var rsoId = sel ? sel.value : '';
      if (!rsoId) { showToast('Select an RSO', 'error'); return; }
      var btn = document.getElementById('mReassignSubmit');
      btn.disabled = true;
      btn.textContent = 'Reassigning...';
      apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId), {
        method: 'PUT',
        body: { assigned_rso: rsoId }
      }).then(function(d) {
        if (d.ok) {
          if (d.email_transferred === false || d.transfer_error) {
            showToast('RSO reassigned, but email transfer failed: ' + (d.transfer_error || 'unknown error'), 'error');
          } else {
            showToast('RSO reassigned & email transferred', 'success');
          }
          closeModal(); refreshDashboard();
        }
        else { showToast('Failed: ' + (d.message || 'Reassign failed'), 'error'); btn.disabled = false; btn.textContent = 'Reassign'; }
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Reassign'; });
    }

      var html = '<div class="modal-title">Send Nudge to ' + esc(gpName) + '</div>';

    /* Add Note */
    function openNoteModal(caseId, taskId, gpName) {
      var html = '<div class="modal-title">Add Note for ' + esc(gpName) + '</div>';
      html += '<div class="modal-field"><label class="modal-label">Note</label><textarea class="modal-textarea" id="mNoteText" placeholder="Write your note..."></textarea></div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-blue" id="mNoteSubmit" onclick="submitNote(\'' + esc(caseId) + '\', \'' + esc(taskId) + '\')">Add Note</button></div>';
      openModal(html);
    }

    function submitNote(caseId, taskId) {
      var text = document.getElementById('mNoteText').value.trim();
      if (!text) { showToast('Note text required', 'error'); return; }
      var btn = document.getElementById('mNoteSubmit');
      btn.disabled = true;
      // Tie the note to the task when a taskId is supplied; otherwise file it on the case (#64).
      var url = taskId
        ? '/api/admin/task/note?id=' + encodeURIComponent(taskId)
        : '/api/admin/case/note?id=' + encodeURIComponent(caseId);
      apiFetch(url, {
        method: 'POST',
        body: { text: text }
      }).then(function(d) {
        if (d.ok) {
          showToast('Note added', 'success');
          closeModal();
          // Case-level note added from the open GP file → surface it in the Notes sub-tab.
          if (!taskId && gpDetailCache && gpDetailCache.caseId === caseId) gpDetailTab = 'notes';
          refreshGpDetailIfOpen();
        }
        else { showToast('Failed: ' + (d.message || ''), 'error'); btn.disabled = false; }
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); btn.disabled = false; });
    }

    // Inline note composer on the GP-file Notes sub-tab. Files a case-level note via the
    // same endpoint as the header Add Note, then refreshes so it appears in the list.
    function ceoAddGpNote() {
      var ta = document.getElementById('ceoNoteAddText');
      var text = ta ? ta.value.trim() : '';
      if (!text) { showToast('Note text required', 'error'); return; }
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) { showToast('No GP file open', 'error'); return; }
      var btn = document.getElementById('ceoNoteAddBtn');
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/case/note?id=' + encodeURIComponent(caseId), { method: 'POST', body: { text: text } }).then(function(d) {
        if (d && d.ok) { showToast('Note added', 'success'); gpDetailTab = 'notes'; refreshGpDetailIfOpen(); }
        else { showToast('Failed: ' + ((d && d.message) || ''), 'error'); if (btn) btn.disabled = false; }
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); if (btn) btn.disabled = false; });
    }

    /* ═══ DATA FETCHING ═══ */
    function refreshDashboard() {
      lastRefreshAt = Date.now();
      var periodParam = currentPeriod ? '?period=' + currentPeriod : '';
      return gpSwr('/api/ceo/dashboard' + periodParam, function(d) {
        if (d.ok) {
          renderDashboard(d);
        } else if (!dashboardData) {
          // Initial load failed — show an honest error instead of an eternal spinner.
          renderLoadError('The dashboard couldn’t be loaded' + (d.message ? ' (' + d.message + ')' : '') + '.');
        } else {
          showToast('Dashboard refresh failed: ' + (d.message || ''), 'error');
        }
      }).catch(function(err) {
        if (!dashboardData) {
          renderLoadError('We couldn’t reach the server (' + (err && err.message ? err.message : 'network error') + ').');
        } else {
          showToast('Network error: ' + (err && err.message ? err.message : 'unknown'), 'error');
        }
      });
    }

    function refreshTrends() {
      return gpSwr('/api/ceo/trends', function(d) {
        if (d.ok) {
          trendsData = d;
          // Re-render if dashboard data exists (to show trend arrows)
          if (dashboardData) renderDashboard(dashboardData);
        }
      }).catch(function() { /* silent */ });
    }

    /* ── Refresh Timer ── */
    function startRefreshLoop() {
      clearInterval(refreshTimerId);
      clearInterval(trendTimerId);
      if (autoRefresh) {
        refreshTimerId = setInterval(function() { if (autoRefresh) refreshDashboard(); }, 30000);
        trendTimerId = setInterval(function() { if (autoRefresh) refreshTrends(); }, 300000);
      }
    }

    /* ── Last Refresh Label ── */
    function updateRefreshLabel() {
      var el = document.getElementById('refreshLabel');
      if (!el || !lastRefreshAt) return;
      var sec = Math.floor((Date.now() - lastRefreshAt) / 1000);
      if (sec < 5) el.textContent = 'just now';
      else if (sec < 60) el.textContent = sec + 's ago';
      else el.textContent = Math.floor(sec / 60) + 'm ago';
    }

    /* ── Event Delegation ── */
    document.addEventListener('click', function(e) {
      // RSO management actions (Add / Edit) — handled BEFORE the card-click so the
      // button doesn't also open the RSO detail view.
      var rsoActionEl = e.target.closest('[data-rso-action]');
      if (rsoActionEl) {
        var rsoAction = rsoActionEl.getAttribute('data-rso-action');
        if (rsoAction === 'add') { openAddRsoModal(); return; }
        if (rsoAction === 'edit') { openEditRsoModal(rsoActionEl.getAttribute('data-rso-id')); return; }
        if (rsoAction === 'bulk') { openBulkReassignModal(rsoActionEl.getAttribute('data-rso-id')); return; }
        if (rsoAction === 'pov') {
          // Open the RSO Command Centre scoped to this RSO in a new tab. Not noopener
          // so the preview tab can close itself when the CEO clicks "Exit RSO view".
          var povEmail = rsoActionEl.getAttribute('data-rso-email') || '';
          var povName = rsoActionEl.getAttribute('data-rso-name') || '';
          if (!povEmail) { showToast('This RSO has no linked email to preview.', 'error'); return; }
          var povUrl = '/pages/admin?pov_rso=' + encodeURIComponent(povEmail)
            + (povName ? '&pov_name=' + encodeURIComponent(povName) : '');
          window.open(povUrl, '_blank');
          return;
        }
      }
      // RSO oversight card -> RSO detail
      var rsoCard = e.target.closest('.rso-card[data-rso-id]');
      if (rsoCard) { openRsoDetail(rsoCard.getAttribute('data-rso-id')); return; }

      // Drilldown clicks on funnel rows, placement cells, activity buckets, RSO rows
      var ddEl = e.target.closest('[data-drilldown]');
      if (ddEl) {
        var section = ddEl.getAttribute('data-drilldown');
        var param = ddEl.getAttribute('data-param') || '';
        var panelId = ddEl.getAttribute('data-panel') || section;
        var cardEl = ddEl.closest('.section-card') || document.querySelector('.section-card[data-section="' + panelId + '"]');
        handleDrilldownClick(section, param, cardEl, panelId);
        // If the click originated on a KPI tile, scroll the target section into view
        if (ddEl.classList.contains('kpi-card') && cardEl) {
          cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      // Section card header click triggers drilldown for entire section
      var cardHeader = e.target.closest('.section-card-header');
      if (cardHeader) {
        var card = cardHeader.closest('.section-card');
        if (card) {
          var sec = card.getAttribute('data-section');
          if (sec && sec !== 'velocity' && sec !== 'completions' && sec !== 'conversion' && sec !== 'sources') {
            handleDrilldownClick(sec, '', card);
          }
        }
        return;
      }
    });

    /* ── Header Escalation Badge Click ── */
    document.getElementById('headerEscBadge').addEventListener('click', function() {
      var banner = document.getElementById('escBanner');
      if (banner) {
        banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (!banner.classList.contains('expanded')) {
          banner.classList.add('expanded');
        }
      }
    });

    /* ── Auto-refresh toggle ── */
    document.getElementById('autoRefreshToggle').addEventListener('change', function() {
      autoRefresh = this.checked;
      var dot = document.getElementById('refreshDot');
      if (autoRefresh) {
        dot.classList.remove('paused');
        startRefreshLoop();
        refreshDashboard();
      } else {
        dot.classList.add('paused');
        clearInterval(refreshTimerId);
        clearInterval(trendTimerId);
      }
    });

    /* ── Visibility change ── */
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && autoRefresh) {
        refreshDashboard();
      }
    });

    /* ── Keyboard shortcut: Escape closes modal ── */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    /* ── Time filter ── */
    document.getElementById('timeFilterBar').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-period]');
      if (!btn) return;
      var p = btn.getAttribute('data-period');
      if (p === currentPeriod) return;
      currentPeriod = p;
      var all = document.querySelectorAll('.time-btn');
      for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].getAttribute('data-period') === p);
      refreshDashboard();
    });

    /* ── RSO + Technical master-tab loaders ──
       RSO Oversight and Technical are now their own top-level master tabs (see
       #masterTabs), not sub-tabs of a standalone top-nav. The shared master-tab
       switcher (js/ceo-ats-shared.js) calls window.load<Name>Tab when a tab opens,
       so bridge those names onto the existing loaders. loadRsoOversight and
       loadTechnical are hoisted declarations defined later in this script. */
    window.loadRsoTab = function () { loadRsoOversight(); ensureRegSubnav(); };

    /* Registration master tab has two sub-views: RSOs (oversight, default) and
       Guides (the CEO-editable how-to library, shared with the RSO dashboard via
       js/guide-panel.js). Wire the sub-nav once; lazy-mount the editable guide the
       first time the Guides sub-tab is opened. The server enforces CEO-only writes
       (requireCeoSession), so canEdit here only controls which buttons render. */
    var _ceoGuideMounted = false;
    function ensureRegSubnav() {
      var nav = document.getElementById('regSubnav');
      if (!nav || nav._wired) return;
      nav._wired = true;
      nav.addEventListener('click', function (e) {
        var btn = e.target.closest('.reg-subtab');
        if (!btn) return;
        var sub = btn.getAttribute('data-regsub');
        Array.prototype.forEach.call(nav.querySelectorAll('.reg-subtab'), function (b) {
          b.classList.toggle('active', b === btn);
        });
        var rsosP = document.getElementById('regSub-rsos');
        var guidesP = document.getElementById('regSub-guides');
        if (rsosP) rsosP.style.display = (sub === 'rsos') ? '' : 'none';
        if (guidesP) guidesP.style.display = (sub === 'guides') ? '' : 'none';
        if (sub === 'guides' && !_ceoGuideMounted && window.GuidePanel) {
          _ceoGuideMounted = true;
          window.GuidePanel.mount('ceoGuidePanel', { canEdit: true });
        }
      });
    }
    window.loadTechnicalTab = function () { if (typeof loadTechnical === 'function') loadTechnical(); };

    /* Deep-link: /pages/ceo-dashboard?tab=rsos opens the RSO master tab on load
       (used by the "RSO Oversight" link from the admin work-list page). The shared
       switcher may still be initialising, so retry briefly until ATS is ready. */
    try {
      if (new URLSearchParams(location.search).get('tab') === 'rsos') {
        (function openRso(tries) {
          if (window.ATS && typeof window.ATS.showMaster === 'function') { window.ATS.showMaster('rso'); return; }
          if (tries > 0) setTimeout(function () { openRso(tries - 1); }, 50);
        })(40);
      }
    } catch (e) {}
    /* Deep-link: /pages/ceo-dashboard?case=<id> opens that candidate on load
       (used by the "interview booked" ops email so hello@ can jump straight to
       the doctor's ATS card). Candidates is the default tab, so we just open
       the drawer once atsOpenCandidate is available. */
    try {
      var _caseParam = new URLSearchParams(location.search).get('case');
      if (_caseParam) {
        var _tries = 0;
        var _openCase = function () {
          if (window.atsOpenCandidate) { window.atsOpenCandidate(_caseParam); return; }
          if (_tries++ < 40) setTimeout(_openCase, 100);
        };
        _openCase();
      }
    } catch (e) {}

    /* ═══ RSO OVERSIGHT (standalone tab) ═══ */
    // Full RSO records (source of truth incl. user_id + calendly_event_url + phone) from
    // GET /api/admin/rsos?include_inactive=1. Used to prefill the Edit modal without refetch.
    var rsoAdminRosterCache = [];
    var rsoAdminLoadFailed = false;
    function loadRsoOversight() {
      var c = document.getElementById('rsoContent');
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading RSOs...</div></div>';
      // Fetch the stats roster (/api/ceo/rsos) and the full management roster
      // (/api/admin/rsos) in parallel. Either can fail independently — we degrade
      // gracefully rather than failing the whole screen.
      // SWR wrinkle: this loader renders from Promise.all (both payloads at once),
      // so the per-call onData callbacks are no-ops — the cached-paint benefit
      // comes from renderRsoOversightFromPayloads below being called twice: once
      // with the cached pair (if both are cached), then with the network pair.
      var cachedCeo = gpSwrRead('/api/ceo/rsos');
      var cachedAdmin = gpSwrRead('/api/admin/rsos?include_inactive=1');
      if (cachedCeo && cachedAdmin) {
        try { renderRsoOversightFromPayloads(cachedCeo, cachedAdmin); } catch (e) {}
      }
      var ceoP = gpSwr('/api/ceo/rsos', function() {}).then(function(d) { return d; }).catch(function() { return null; });
      var adminP = gpSwr('/api/admin/rsos?include_inactive=1', function() {}).then(function(d) { return d; }).catch(function() { return null; });
      Promise.all([ceoP, adminP]).then(function(res) {
        renderRsoOversightFromPayloads(res[0], res[1]);
      });
    }
    // Render the RSO oversight screen from the two roster payloads (either may be
    // null/not-ok — we degrade gracefully rather than failing the whole screen).
    function renderRsoOversightFromPayloads(ceoD, adminD) {
      var c = document.getElementById('rsoContent');
      if (!c) return;
      try {
        if ((!ceoD || !ceoD.ok) && (!adminD || !adminD.ok)) {
          c.innerHTML = '<div class="drilldown-empty">Failed to load RSOs: ' + esc((ceoD && ceoD.message) || (adminD && adminD.message) || 'Unknown error') + '</div>';
          return;
        }
        var ceoRsos = (ceoD && ceoD.ok && Array.isArray(ceoD.rsos)) ? ceoD.rsos : [];
        rsoRosterCache = ceoRsos;
        rsoAdminLoadFailed = !(adminD && adminD.ok && Array.isArray(adminD.rsos));
        rsoAdminRosterCache = rsoAdminLoadFailed ? [] : adminD.rsos;

        // Merge: admin roster (source of truth, has user_id + calendly) is the base.
        // Attach stats from the ceo roster matched by email (case-insensitive). Any
        // ceo-roster RSO with no admin match is still appended so nothing disappears.
        var statsByEmail = {};
        for (var i = 0; i < ceoRsos.length; i++) {
          var e = (ceoRsos[i].email || '').toLowerCase();
          if (e) statsByEmail[e] = ceoRsos[i];
        }
        var merged = [];
        var seenEmails = {};
        if (!rsoAdminLoadFailed) {
          for (var j = 0; j < rsoAdminRosterCache.length; j++) {
            var a = rsoAdminRosterCache[j];
            var ae = (a.email || '').toLowerCase();
            var s = ae ? statsByEmail[ae] : null;
            if (ae) seenEmails[ae] = true;
            merged.push({
              user_id: a.user_id,
              // rso_id is what the existing card-click (openRsoDetail) expects — prefer the
              // ceo roster's id (matched by email), fall back to the admin user_id.
              rso_id: (s && s.rso_id) || a.user_id || '',
              rso_name: a.name || (s && s.rso_name) || '',
              email: a.email || (s && s.email) || '',
              phone: a.phone || '',
              calendly_event_url: a.calendly_event_url || '',
              active: a.active,
              on_leave: !!a.on_leave,
              va_gmail: a.va_gmail || '',
              hasAdminRecord: true,
              case_count: s ? s.case_count : 0,
              open_tasks: s ? s.open_tasks : 0,
              overdue_tasks: s ? s.overdue_tasks : 0
            });
          }
        }
        // Append ceo-only RSOs (no admin match) — kept visible, Edit disabled.
        for (var k = 0; k < ceoRsos.length; k++) {
          var cr = ceoRsos[k];
          var ce = (cr.email || '').toLowerCase();
          if (ce && seenEmails[ce]) continue;
          merged.push({
            user_id: cr.rso_id || '',
            rso_id: cr.rso_id || '',
            rso_name: cr.rso_name || '',
            email: cr.email || '',
            phone: '',
            calendly_event_url: '',
            active: cr.active,
            on_leave: false,
            va_gmail: '',
            hasAdminRecord: false,
            case_count: cr.case_count || 0,
            open_tasks: cr.open_tasks || 0,
            overdue_tasks: cr.overdue_tasks || 0
          });
        }
        renderRsoOversight(merged);
      } catch (e) { c.innerHTML = '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>'; }
    }

    function renderRsoOversight(rsos) {
      var c = document.getElementById('rsoContent');
      // Header with the + Add RSO action (shown even when the list is empty).
      var head = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
        + '<h2 style="font-size:16px;font-weight:700">RSO Oversight</h2>'
        + '<button class="btn btn-blue" data-rso-action="add">+ Add RSO</button>'
        + '</div>';
      if (rsoAdminLoadFailed) {
        head += '<div class="modal-note" style="font-size:11px;color:var(--amber);margin:-6px 0 12px">Couldn&rsquo;t load the full RSO records, so editing is unavailable right now. Showing oversight stats only.</div>';
      }
      if (!rsos.length) { c.innerHTML = head + '<div class="drilldown-empty">No RSOs found.</div>'; return; }
      var html = head + '<div class="rso-grid">';
      for (var i = 0; i < rsos.length; i++) {
        var r = rsos[i];
        html += '<div class="rso-card' + (r.active === false ? ' inactive' : '') + '" data-rso-id="' + esc(r.rso_id) + '">';
        html += '<div class="rso-card-name">' + esc(r.rso_name)
          + (r.active === false ? ' <span style="font-size:10px;color:var(--text-dim)">(inactive)</span>' : '')
          + (r.on_leave ? ' <span style="font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:1px 6px;margin-left:4px">On leave</span>' : '')
          + '</div>';
        if (r.email) html += '<div class="rso-card-email">' + esc(r.email) + '</div>';
        // Mailbox line — the Gmail inbox their GP emails send from / land in.
        if (r.hasAdminRecord) {
          if (r.va_gmail) {
            html += '<div style="font-size:11px;color:var(--text-dim);margin-top:4px">Mailbox: ' + esc(r.va_gmail) + '</div>';
          } else {
            html += '<div style="font-size:11px;color:var(--amber);margin-top:4px">No mailbox linked — emails fall back to the team inbox</div>';
          }
        }
        // Calendly status line — muted when set, amber when missing.
        if (r.calendly_event_url) {
          html += '<div style="font-size:11px;color:var(--text-dim);margin-top:4px">Calendly link set</div>';
        } else {
          html += '<div style="font-size:11px;color:var(--amber);margin-top:4px">No Calendly link yet</div>';
        }
        html += '<div class="rso-card-stats">';
        html += '<div class="rso-card-stat"><span class="rso-card-stat-value">' + (r.case_count || 0) + '</span><span class="rso-card-stat-label">GPs</span></div>';
        html += '<div class="rso-card-stat"><span class="rso-card-stat-value">' + (r.open_tasks || 0) + '</span><span class="rso-card-stat-label">Open</span></div>';
        html += '<div class="rso-card-stat"><span class="rso-card-stat-value" style="color:' + ((r.overdue_tasks || 0) > 0 ? 'var(--red)' : 'var(--text)') + '">' + (r.overdue_tasks || 0) + '</span><span class="rso-card-stat-label">Overdue</span></div>';
        html += '</div>';
        // Action buttons. "View RSO POV" opens the RSO Command Centre scoped exactly
        // as this RSO sees it — available for any roster RSO with a linked email.
        // Edit + bulk-reassign need the full admin record (has user_id).
        var rsoActions = '';
        if (r.email) {
          rsoActions += '<button class="btn" data-rso-action="pov" data-rso-email="' + escAttr(r.email) + '" data-rso-name="' + escAttr(r.rso_name || '') + '">View RSO POV</button>';
        }
        if (r.hasAdminRecord && r.user_id) {
          rsoActions += '<button class="btn" data-rso-action="edit" data-rso-id="' + esc(r.user_id) + '">Edit</button>'
            + '<button class="btn" data-rso-action="bulk" data-rso-id="' + esc(r.user_id) + '">Reassign all cases</button>';
        }
        if (rsoActions) {
          html += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' + rsoActions + '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      c.innerHTML = html;
    }

    /* ── RSO management modals (Add / Edit) ── */
    function rsoModalFields(rec) {
      // escAttr() (not esc()) because these land inside double-quoted value="..." attributes —
      // esc() does not escape the double-quote, which would allow attribute breakout / stored
      // XSS from a malicious RSO name or calendly value.
      var nameV = rec ? escAttr(rec.rso_name || '') : '';
      var emailV = rec ? escAttr(rec.email || '') : '';
      var phoneV = rec ? escAttr(rec.phone || '') : '';
      var calV = rec ? escAttr(rec.calendly_event_url || '') : '';
      var mailboxV = rec ? escAttr(rec.va_gmail || '') : '';
      var activeChecked = (!rec || rec.active !== false) ? ' checked' : '';
      var onLeaveChecked = (rec && rec.on_leave) ? ' checked' : '';
      var h = '';
      h += '<div class="modal-field"><label class="modal-label">Name</label><input class="modal-input" id="mRsoName" value="' + nameV + '"></div>';
      h += '<div class="modal-field"><label class="modal-label">Email</label><input class="modal-input" id="mRsoEmail" type="email" value="' + emailV + '"></div>';
      h += '<div class="modal-field"><label class="modal-label">Mailbox (Gmail)</label><input class="modal-input" id="mRsoMailbox" type="email" placeholder="name@mygplink.com.au" value="' + mailboxV + '">';
      h += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin-top:4px">The @mygplink.com.au inbox their GP emails send from and land in. Leave blank to keep the current mailbox.</div></div>';
      h += '<div class="modal-field"><label class="modal-label">Phone (optional)</label><input class="modal-input" id="mRsoPhone" value="' + phoneV + '"></div>';
      h += '<div class="modal-field"><label class="modal-label">Calendly link</label><input class="modal-input" id="mRsoCalendly" placeholder="https://calendly.com/..." value="' + calV + '">';
      h += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin-top:4px">Leave blank to use the default GP Link Calendly link.</div></div>';
      h += '<div class="modal-field"><label class="modal-label" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="mRsoActive"' + activeChecked + '> Active</label></div>';
      h += '<div class="modal-field"><label class="modal-label" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="mRsoOnLeave"' + onLeaveChecked + '> On leave</label>';
      h += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin-top:4px">On-leave officers can’t be given new cases. Their existing cases stay put — use “Reassign all cases” to hand them over.</div></div>';
      return h;
    }

    function openAddRsoModal() {
      var html = '<div class="modal-title">Add RSO</div>';
      html += rsoModalFields(null);
      html += '<div class="modal-note" style="font-size:11px;color:var(--text-dim);margin:-4px 0 12px">The RSO is matched to their GP Link account by email, so use the email they sign in with.</div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-blue" id="mRsoSubmit" onclick="submitRsoSave()">Add RSO</button></div>';
      openModal(html);
    }

    function openEditRsoModal(userId) {
      var rec = null;
      for (var i = 0; i < rsoAdminRosterCache.length; i++) {
        if (rsoAdminRosterCache[i].user_id === userId) { rec = rsoAdminRosterCache[i]; break; }
      }
      if (!rec) { showToast('RSO record not found — try refreshing', 'error'); return; }
      // The admin cache stores raw /api/admin/rsos records (name, not rso_name) — normalise
      // for the shared field builder.
      var view = {
        rso_name: rec.name || '',
        email: rec.email || '',
        phone: rec.phone || '',
        calendly_event_url: rec.calendly_event_url || '',
        active: rec.active,
        on_leave: !!rec.on_leave,
        va_gmail: rec.va_gmail || ''
      };
      var html = '<div class="modal-title">Edit RSO</div>';
      html += rsoModalFields(view);
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-blue" id="mRsoSubmit" onclick="submitRsoSave(\'' + esc(userId) + '\')">Save Changes</button></div>';
      openModal(html);
    }

    function submitRsoSave(userId) {
      var nameEl = document.getElementById('mRsoName');
      var emailEl = document.getElementById('mRsoEmail');
      var mailboxEl = document.getElementById('mRsoMailbox');
      var phoneEl = document.getElementById('mRsoPhone');
      var calEl = document.getElementById('mRsoCalendly');
      var activeEl = document.getElementById('mRsoActive');
      var onLeaveEl = document.getElementById('mRsoOnLeave');
      var name = nameEl ? nameEl.value.trim() : '';
      var email = emailEl ? emailEl.value.trim() : '';
      var mailbox = mailboxEl ? mailboxEl.value.trim() : '';
      var phone = phoneEl ? phoneEl.value.trim() : '';
      var calendly = calEl ? calEl.value.trim() : '';
      // Client-side validation. Name + email required when adding.
      if (!userId && (!name || !email)) { showToast('Name and email are required', 'error'); return; }
      if (mailbox && !/@mygplink\.com\.au$/i.test(mailbox)) {
        showToast('Mailbox must be an @mygplink.com.au address', 'error');
        return;
      }
      if (calendly && calendly.indexOf('https://calendly.com/') !== 0) {
        showToast('Calendly link must start with https://calendly.com/', 'error');
        return;
      }
      var btn = document.getElementById('mRsoSubmit');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      var body = { name: name, email: email, phone: phone, calendly_event_url: calendly, active: activeEl ? activeEl.checked : true, on_leave: onLeaveEl ? onLeaveEl.checked : false };
      if (mailbox) body.va_gmail = mailbox;
      var req = userId
        ? apiFetch('/api/admin/rsos/' + encodeURIComponent(userId), { method: 'PATCH', body: body })
        : apiFetch('/api/admin/rsos', { method: 'POST', body: body });
      req.then(function(d) {
        if (d && d.ok) {
          if (mailbox && d.mailboxLinked === false) {
            // The RSO record saved but the mailbox link failed — surface why.
            showToast('Saved, but the mailbox wasn’t linked: ' + (d.mailboxError || 'unknown error'), 'error');
          } else if (!userId && d.generatedUserId) {
            // No GP Link account matched this email, so a standalone id was created. Make
            // the silent path visible — case assignment / Gmail routing need a real account.
            showToast('RSO added, but no GP Link account matched this email yet — case assignment and email routing won’t work until they sign in with this email.', 'info');
          } else {
            showToast(userId ? 'RSO updated' : 'RSO added', 'success');
          }
          closeModal();
          loadRsoOversight();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Save failed'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = userId ? 'Save Changes' : 'Add RSO'; }
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = userId ? 'Save Changes' : 'Add RSO'; }
      });

    /* ── Bulk reassignment: move ALL of one RSO's active cases to another RSO ── */
    function openBulkReassignModal(fromUserId) {
      var fromRec = null;
      for (var i = 0; i < rsoAdminRosterCache.length; i++) {
        if (rsoAdminRosterCache[i].user_id === fromUserId) { fromRec = rsoAdminRosterCache[i]; break; }
      }
      if (!fromRec) { showToast('RSO record not found — try refreshing', 'error'); return; }
      var fromName = fromRec.name || fromRec.email || 'this RSO';
      // Confirm step needs the real count — ask the server (dry run) before rendering.
      openModal('<div class="modal-title">Reassign all cases</div><div style="padding:12px 0;font-size:13px;color:var(--text-dim)">Counting ' + esc(fromName) + '&rsquo;s active cases&hellip;</div>');
      apiFetch('/api/admin/rso/bulk-reassign', { method: 'POST', body: { fromRsoId: fromUserId, dryRun: true } }).then(function(d) {
        if (!d || !d.ok) { showToast('Failed: ' + ((d && d.message) || 'count failed'), 'error'); closeModal(); return; }
        var total = d.total || 0;
        var html = '<div class="modal-title">Reassign all cases</div>';
        html += '<div style="font-size:13px;line-height:1.6;margin-bottom:12px"><b>' + total + '</b> active case' + (total === 1 ? '' : 's') + ' currently assigned to <b>' + esc(fromName) + '</b> will move to the officer you pick. Their emails, WhatsApp chats and Gmail folders follow automatically.</div>';
        if (total === 0) {
          html += '<div class="modal-note" style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Nothing to move — you can still close this window.</div>';
          html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
          openModal(html);
          return;
        }
        // Target picker: everyone else on the roster who is active and not on leave.
        var opts = '';
        for (var j = 0; j < rsoAdminRosterCache.length; j++) {
          var t = rsoAdminRosterCache[j];
          if (!t.user_id || t.user_id === fromUserId) continue;
          if (t.active === false || t.on_leave) continue;
          opts += '<option value="' + escAttr(t.user_id) + '">' + esc(t.name || t.email || t.user_id) + (t.va_gmail ? '' : ' (no mailbox)') + '</option>';
        }
        if (!opts) {
          html += '<div class="modal-note" style="font-size:12px;color:var(--amber);margin-bottom:12px">No other active officer is available to take these cases.</div>';
          html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
          openModal(html);
          return;
        }
        html += '<div class="modal-field"><label class="modal-label">Move all ' + total + ' cases to</label><select class="modal-input" id="mBulkTarget">' + opts + '</select></div>';
        html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-blue" id="mBulkSubmit" onclick="submitBulkReassign(\'' + esc(fromUserId) + '\',' + total + ')">Move ' + total + ' case' + (total === 1 ? '' : 's') + '</button></div>';
        openModal(html);
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); closeModal(); });
    }

    function submitBulkReassign(fromUserId, expectedTotal) {
      var sel = document.getElementById('mBulkTarget');
      var toUserId = sel ? sel.value : '';
      if (!toUserId) { showToast('Pick an officer to move the cases to', 'error'); return; }
      var btn = document.getElementById('mBulkSubmit');
      if (btn) { btn.disabled = true; btn.textContent = 'Moving...'; }
      apiFetch('/api/admin/rso/bulk-reassign', { method: 'POST', body: { fromRsoId: fromUserId, toRsoId: toUserId } }).then(function(d) {
        if (d && d.ok) {
          var msg = 'Moved ' + (d.moved || 0) + ' of ' + (d.total != null ? d.total : expectedTotal) + ' cases to ' + ((d.to && d.to.name) || 'the new officer');
          if (d.remaining) msg += ' — ' + d.remaining + ' still to go (run this again)';
          if (d.emailTransfersSkipped) msg += '; ' + d.emailTransfersSkipped + ' Gmail folder move(s) deferred';
          if (d.emailTransfersFailed) msg += '; ' + d.emailTransfersFailed + ' Gmail folder move(s) failed';
          showToast(msg, (d.emailTransfersFailed || d.moveFailed) ? 'info' : 'success');
          closeModal();
          loadRsoOversight();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'bulk reassign failed'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Move cases'; }
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Move cases'; }
      });
    }

    /* ═══ TECHNICAL (read-only integrations + health) ═══ */
    // Cache the integrations payload so re-clicking the Technical tab doesn't
    // refetch (the integrations endpoint runs live external pings, so it is slow).
    var techCache = null;
    var techCheckedAt = null;
    // Re-run the live checks on demand. The cache above is an in-memory
    // variable, so returning to the tab shows the LAST result — which for a
    // health panel is actively misleading: you fix something, come back, and
    // read a verdict from before the fix. That is how these cards give false
    // confidence (owner hit exactly this on 2026-07-29 while verifying the
    // Google Calendar connection). Bypass the cache and re-ping.
    function refreshTechnical() {
      techCache = null;
      techCheckedAt = null;
      loadTechnical();
    }
    function loadTechnical() {
      if (techCache) { renderTechnical(techCache); return; }
      var c = document.getElementById('techContent');
      if (!c) return;
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading integrations (live health checks)...</div></div>';
      // Use a raw fetch (not apiFetch) so we can detect 401/403 by HTTP status and
      // show a re-login message, mirroring admin.html's loadIntegrations.
      fetch('/api/ceo/integrations', { credentials: 'same-origin' }).then(function(r) {
        if (r.status === 401 || r.status === 403) {
          c.innerHTML = '<div class="drilldown-empty">Session expired. <a href="/pages/admin-signin" style="color:var(--blue);text-decoration:underline">Log in again</a></div>';
          return null;
        }
        return r.json();
      }).then(function(d) {
        if (d === null) return; // already handled (re-login)
        if (!d || !d.ok || !Array.isArray(d.integrations)) {
          c.innerHTML = '<div class="drilldown-empty">Failed to load integrations: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        techCache = d.integrations;
        techCheckedAt = new Date();
        renderTechnical(techCache);
      }).catch(function(e) { c.innerHTML = '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>'; });
    }

    // Map an integration/mailbox status to a badge colour class.
    function techStatusClass(status) {
      if (status === 'connected') return 'connected';
      if (status === 'degraded' || status === 'configured') return 'degraded';
      if (status === 'disconnected') return 'disconnected';
      return 'unknown';
    }
    function techStatusLabel(status) {
      if (status === 'degraded') return 'Needs Attention';
      if (status === 'configured') return 'Configured';
      return status;
    }

    // Render one detail value (scalar / boolean / array / object) as readable rows.
    function techDetailRow(label, val) {
      var lbl = esc(label.replace(/_/g, ' '));
      if (val === null || val === undefined) {
        return '<div class="ceo-tech-detail"><b>' + lbl + ':</b> &mdash;</div>';
      }
      if (typeof val === 'boolean') {
        return '<div class="ceo-tech-detail"><b>' + lbl + ':</b> ' + (val ? 'Yes' : 'No') + '</div>';
      }
      if (Array.isArray(val)) {
        var out = '<div class="ceo-tech-detail"><b>' + lbl + ':</b></div>';
        if (!val.length) { out += '<div class="ceo-tech-subrow" style="color:var(--text-dim)">&mdash;</div>'; return out; }
        for (var ai = 0; ai < val.length; ai++) {
          var item = val[ai];
          if (item !== null && typeof item === 'object') {
            // Structured object (e.g. Gmail mailboxes): primary + status badge + error.
            var primary = item.email || item.name || item.label || '';
            var st = (item.status !== undefined && item.status !== null) ? String(item.status) : '';
            var err = (item.client_error !== undefined && item.client_error !== null) ? String(item.client_error) : '';
            var sub = '<div class="ceo-tech-subrow">';
            if (primary) sub += '<b>' + esc(primary) + '</b>';
            if (st) sub += (primary ? ' ' : '') + '<span class="ceo-tech-badge ' + techStatusClass(st) + '">' + esc(techStatusLabel(st)) + '</span>';
            if (err) sub += '<div class="ceo-tech-err">' + esc(err) + '</div>';
            if (!primary && !st && !err) {
              var ikeys = Object.keys(item);
              for (var iki = 0; iki < ikeys.length; iki++) {
                var iv = item[ikeys[iki]];
                sub += '<div class="ceo-tech-subkv">' + esc(ikeys[iki].replace(/_/g, ' ')) + ': ' + esc(iv === null || iv === undefined ? '—' : (typeof iv === 'boolean' ? (iv ? 'Yes' : 'No') : String(iv))) + '</div>';
              }
            }
            sub += '</div>';
            out += sub;
          } else {
            out += '<div class="ceo-tech-subrow">' + esc(String(item)) + '</div>';
          }
        }
        return out;
      }
      if (typeof val === 'object') {
        var ovo = '<div class="ceo-tech-detail"><b>' + lbl + ':</b></div>';
        var okeys = Object.keys(val);
        for (var ok = 0; ok < okeys.length; ok++) {
          var ov = val[okeys[ok]];
          ovo += '<div class="ceo-tech-subkv">' + esc(okeys[ok].replace(/_/g, ' ')) + ': ' + esc(ov === null || ov === undefined ? '—' : (typeof ov === 'boolean' ? (ov ? 'Yes' : 'No') : String(ov))) + '</div>';
        }
        return ovo;
      }
      return '<div class="ceo-tech-detail"><b>' + lbl + ':</b> ' + esc(String(val)) + '</div>';
    }

    function renderTechnical(integrations) {
      var c = document.getElementById('techContent');
      if (!c) return;
      // The timestamp is not decoration. These are point-in-time probe results
      // held in memory, so without it a card read minutes after a change looks
      // identical to one read the instant it was checked.
      var checkedLabel = techCheckedAt
        ? ('Checked ' + techCheckedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }))
        : 'Not yet checked';
      var html = '<div style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'
        + '<h2 style="font-size:16px;font-weight:700">Technical</h2>'
        + '<div style="display:flex;align-items:center;gap:10px">'
        + '<span style="font-size:12px;opacity:0.7">' + esc(checkedLabel) + '</span>'
        + '<button type="button" onclick="refreshTechnical()" style="font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.18);background:transparent;color:inherit;cursor:pointer">Re-run checks</button>'
        + '</div></div>';
      html += '<div class="ceo-tech-cards" style="margin-bottom:14px"><div class="ceo-tech-card" id="gmailWatchCard" style="grid-column:1/-1"><div class="ceo-tech-detail">Loading Gmail watch status…</div></div></div>';
      if (!integrations.length) {
        html += '<div class="drilldown-empty">No integrations reported.</div>';
      } else {
        html += '<div class="ceo-tech-cards">';
        for (var i = 0; i < integrations.length; i++) {
          var it = integrations[i];
          html += '<div class="ceo-tech-card">';
          html += '<div class="ceo-tech-card-head"><span class="ceo-tech-name">' + esc(it.name || it.key || 'Integration') + '</span>'
            + '<span class="ceo-tech-badge ' + techStatusClass(it.status) + '">' + esc(techStatusLabel(it.status)) + '</span></div>';
          var det = it.details || {};
          var dkeys = Object.keys(det);
          for (var k = 0; k < dkeys.length; k++) { html += techDetailRow(dkeys[k], det[dkeys[k]]); }
          // Reconnect / Sync buttons are intentionally NOT rendered here. They trigger
          // live external calls (Gmail watch renewal, Zoho OAuth) and are a DEFERRED
          // follow-up — Phase 5 Technical is read-only display.
          html += '</div>';
        }
        html += '</div>';
      }
      // Health stat strips (system bugs + client errors) are appended below the grid.
      // Both strips are buttons: they open a full, triageable detail view.
      html += '<div class="ceo-tech-health" id="techHealthStrips">'
        + '<div class="ceo-tech-strip clickable" id="techBugsStrip" role="button" tabindex="0" title="Open the bug list"'
        + ' onclick="openSystemBugsView()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openSystemBugsView();}">'
        + '<span class="ceo-tech-strip-label">Open bugs</span> <span class="ceo-tech-strip-val">—</span></div>'
        + '<div class="ceo-tech-strip clickable" id="techErrStrip" role="button" tabindex="0" title="Open the error list"'
        + ' onclick="openClientErrorsView()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openClientErrorsView();}">'
        + '<span class="ceo-tech-strip-label">Client errors</span> <span class="ceo-tech-strip-val">—</span></div>'
        + '<div class="ceo-tech-strip clickable" id="techFixStrip" role="button" tabindex="0" title="Open the fixes waiting for your approval"'
        + ' onclick="openFixProposalsView()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openFixProposalsView();}">'
        + '<span class="ceo-tech-strip-label">Fixes to approve</span> <span class="ceo-tech-strip-val">—</span></div>'
        + '</div>';
      // Phase 6 E1 (audit B4): candidate leads + Zoho archive browser card.
      html += '<div class="ceo-tech-cards" style="margin-top:14px"><div class="ceo-tech-card" id="leadsArchiveCard" style="grid-column:1/-1"><div class="ceo-tech-detail">Loading leads &amp; archive…</div></div></div>';
      c.innerHTML = html;
      loadTechnicalHealth();
      loadGmailWatchCard();
      loadLeadsArchiveCard();
    }

    // ── Phase 6 E1 (audit B4): Candidate leads & Zoho archive card ──
    // Read-only browser over candidate_leads (search + pagination) plus a
    // counts-only roll-up of the zoho_archive capture. No editing — leads are
    // reference data for the future marketing campaign.
    var leadsState = { q: '', offset: 0, limit: 50, total: 0 };
    var leadsSearchTimer = null;
    function loadLeadsArchiveCard() {
      var card = document.getElementById('leadsArchiveCard');
      if (!card) return;
      apiFetch('/api/admin/archive-summary').then(function (d) {
        card = document.getElementById('leadsArchiveCard');

          card.innerHTML = '<div class="ceo-tech-card-head"><span class="ceo-tech-name">📇 Candidate leads &amp; Zoho archive</span></div><div class="ceo-tech-detail">Summary unavailable' + (d && d.message ? ': ' + esc(d.message) : '') + '</div>';
          return;
        }
        var counts = (d.archive && d.archive.counts) || {};

        var lastCap = d.archive && d.archive.last_captured_at ? new Date(d.archive.last_captured_at).toLocaleString() : 'never';
        var h = '<div class="ceo-tech-card-head"><span class="ceo-tech-name">📇 Candidate leads &amp; Zoho archive</span>'

          + '<div class="ceo-tech-detail"><b>Zoho archive (read-only):</b> ' + (countBits.length ? countBits.join(' · ') : 'empty') + ' · last capture ' + esc(lastCap) + '</div>'
          + '<div class="ceo-tech-detail"><b>Leads:</b> <span id="leadsTotalLabel">' + Number(d.leads_total || 0) + '</span> total · ' + Number(d.leads_unsubscribed || 0) + ' unsubscribed</div>'
          + '<div style="margin:10px 0 8px"><input type="text" id="leadsSearchInput" placeholder="Search leads by name or email…" style="width:100%;max-width:340px;background:transparent;border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;color:inherit;font-size:13px" value="' + esc(leadsState.q) + '"></div>'
          + '<div id="leadsTableBody"><div style="font-size:12px;color:var(--text-dim)">Loading leads…</div></div>'

        card.innerHTML = h;

          var v = this.value;

          leadsSearchTimer = setTimeout(function () { leadsState.q = v.trim(); leadsState.offset = 0; loadLeadsTable(); }, 300);

        var cc = document.getElementById('leadsArchiveCard');
