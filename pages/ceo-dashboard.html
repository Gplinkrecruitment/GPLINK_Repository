        loadRsoSupport(rsoId);
      }).catch(function(e) { c.innerHTML = '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>'; });
    }

    /* ═══ GP FILE (read-only) under an RSO ═══ */
    // Cache of the most recently opened GP file: { caseId, rsoId, case, tasks, timeline }.
    // Sub-tabs reuse this without refetching. Later tasks may extend it (timeline/docs/calls caches).
    var gpDetailCache = null;
    var gpDetailTab = 'tasks';
    var gpTasksShowAll = false; // Tasks sub-tab: hide completed/cancelled by default.
    var gpTimelineCache = null; // Timeline sub-tab: { caseId, events:[] } fetched once per GP file.
    var gpDocumentsCache = null; // Documents sub-tab: { caseId, sections:[], driveFolder } fetched once per GP file.
    var gpCallsCache = null; // Calls sub-tab: { caseId, calls:[] } fetched once per GP file.

    // Open a GP's full file (read-only) inside #rsoContent, with a back link to the RSO drill-in.
    function openGpDetail(caseId, rsoId) {
      var c = document.getElementById('rsoContent');
      c.innerHTML = '<div class="drilldown-loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;margin:24px auto"></div><div style="text-align:center">Loading GP file...</div></div>';
      gpDetailTab = 'tasks';
      gpTasksShowAll = false;
      gpTimelineCache = null;
      gpDocumentsCache = null;
      apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) { c.innerHTML = '<div class="drilldown-empty">Failed: ' + esc((d && d.message) || 'Unknown error') + '</div>'; return; }
        gpDetailCache = { caseId: caseId, rsoId: rsoId, case: d.case || {}, tasks: d.tasks || [], timeline: d.timeline || [] };
        var cs = gpDetailCache.case;
        var dispStage = cs.stage === 'visa' ? 'pbs' : cs.stage;

        var html = '<div class="ceo-gp-detail">';
        // Header: back link + profile
        html += '<div class="ceo-gp-detail-head">';
        html += '<span class="rso-detail-back ceo-gp-detail-back" onclick="openRsoDetail(\'' + esc(rsoId) + '\')">&#x2190; Back to RSO</span>';
        html += '</div>';
        html += '<div class="ceo-gp-detail-profile">';
        html += '<div class="ceo-gp-detail-id">';
        html += '<h2 class="ceo-gp-detail-name">' + esc(cs.gp_name || 'Unknown') + '</h2>';
        var contactBits = [];
        if (cs.gp_email) contactBits.push(esc(cs.gp_email));
        if (cs.gp_phone) contactBits.push(esc(cs.gp_phone));
        if (contactBits.length) html += '<div class="ceo-gp-detail-contact">' + contactBits.join(' &middot; ') + '</div>';
        if (cs.practice_name) html += '<div class="ceo-gp-detail-practice">' + esc(cs.practice_name) + '</div>';
        html += '</div>';
        html += '<div class="ceo-gp-detail-pills">';
        if (dispStage) html += '<span class="pill ' + pillClass(dispStage) + '">' + esc(STAGE_LABELS[dispStage] || dispStage) + '</span>';
        if (cs.status) html += statusPill(cs.status);
        html += '</div>';
        html += '</div>';
        if (cs.blocker_status) {
          html += '<div class="ceo-gp-detail-blocker">';
          html += '<span class="ceo-gp-detail-blocker-label">Blocked</span>';
          if (cs.blocker_reason) html += '<span class="ceo-gp-detail-blocker-reason">' + esc(cs.blocker_reason) + '</span>';
          html += '</div>';
        }

        // Header case actions — reuse the existing CEO action modals, passing this GP's
        // caseId/user_id/gp_name. Each modal's submit handler calls refreshGpDetailIfOpen()
        // on success, so the GP file re-fetches + re-renders. Add Note (no taskId) files a
        // case-level note → lands in the Notes sub-tab after the refresh.
        var gpName = cs.gp_name || 'Unknown';
        var gpUserId = cs.user_id || '';
        html += '<div class="ceo-gp-detail-actions">';
        html += '<button class="btn btn-blue" onclick="openCreateTaskModal(\'' + esc(caseId) + '\', \'' + esc(gpName) + '\')">Add Task</button>';
        html += '<button class="btn" onclick="openNoteModal(\'' + esc(caseId) + '\', \'\', \'' + esc(gpName) + '\')">Add Note</button>';
        html += '<button class="btn btn-purple" onclick="openStageChangeModal(\'' + esc(caseId) + '\')">Change Stage</button>';
        html += '<button class="btn btn-red" onclick="openBlockerModal(\'' + esc(caseId) + '\')">Set Blocker / On Hold</button>';
        html += '<button class="btn btn-purple" onclick="openNudgeModal(\'' + esc(gpUserId) + '\', \'' + esc(gpName) + '\')">Send Nudge</button>';
        html += '</div>';

        // Sub-tab nav
        var tabs = [
          { key: 'tasks', label: 'Tasks' },
          { key: 'notes', label: 'Notes' },
          { key: 'timeline', label: 'Timeline' },
          { key: 'documents', label: 'Documents' },
          { key: 'calls', label: 'Calls' }
        ];
        html += '<div class="ceo-gp-detail-tabs" id="gpDetailTabs">';
        for (var ti = 0; ti < tabs.length; ti++) {
          html += '<button class="ceo-gp-detail-tab' + (tabs[ti].key === gpDetailTab ? ' active' : '') + '" data-gp-tab="' + tabs[ti].key + '">' + esc(tabs[ti].label) + '</button>';
        }
        html += '</div>';
        html += '<div class="ceo-gp-detail-pane" id="gpDetailPane"></div>';
        html += '</div>';

        c.innerHTML = html;
        renderGpDetailTab(gpDetailTab);
      }).catch(function(e) { c.innerHTML = '<div class="drilldown-empty">Error: ' + esc(e.message) + '</div>'; });
    }

    // Dispatcher: render the active GP-file sub-tab into #gpDetailPane.
    // 'tasks' is filled by renderGpTasksTab (3a.2); the others show a placeholder
    // that subsequent Phase 3a tasks (3a.3-3a.5) replace.
    function renderGpDetailTab(tab) {
      gpDetailTab = tab;
      var tabsEl = document.getElementById('gpDetailTabs');
      if (tabsEl) {
        var btns = tabsEl.querySelectorAll('.ceo-gp-detail-tab');
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle('active', btns[i].getAttribute('data-gp-tab') === tab);
        }
      }
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      if (tab === 'tasks') { renderGpTasksTab(); return; }
      if (tab === 'notes') { renderGpNotesTab(); return; }
      if (tab === 'timeline') { renderGpTimelineTab(); return; }
      if (tab === 'documents') { renderGpDocumentsTab(); return; }
      if (tab === 'calls') { renderGpCallsTab(); return; }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
    }

    // DB stage progression (mirrors lib/ceo-metrics.js DB_STAGE_ORDER) used to order
    // the Tasks sub-tab groups; visa shares pbs's slot, complete sits above the funnel.
    var GP_TASK_STAGE_ORDER = { myintealth: 0, amc: 1, career: 2, ahpra: 3, pbs: 4, visa: 4, commencement: 5, complete: 6 };
    var GP_TASK_DONE_STATUSES = ['completed', 'cancelled'];

    // Pure mirror of lib/ceo-metrics.js gpTasksByStage (the authoritative, unit-tested
    // contract): filter completed/cancelled unless showAll, group by related_stage in
    // DB stage order (unknown stages after, no-stage bucket '__none__' last), preserving
    // input order within a group, annotating each task with an overdue flag.
    function gpTasksByStage(tasks, showAll) {
      var order = [];
      var groups = {};
      function bucket(key) { if (!groups[key]) { groups[key] = []; order.push(key); } return groups[key]; }
      (tasks || []).forEach(function(t) {
        if (!t) return;
        if (!showAll && GP_TASK_DONE_STATUSES.indexOf(t.status) !== -1) return;
        var key = t.related_stage ? String(t.related_stage) : '__none__';
        var due = opsDueIndicator(t.due_date);
        var isDone = GP_TASK_DONE_STATUSES.indexOf(t.status) !== -1;
        var row = {}; for (var k in t) { if (Object.prototype.hasOwnProperty.call(t, k)) row[k] = t[k]; }
        row.__overdue = !isDone && due.overdue && !!t.due_date;
        row.__dueLabel = due.label;
        bucket(key).push(row);
      });
      function rank(key) {
        if (key === '__none__') return [2, 0];
        if (GP_TASK_STAGE_ORDER[key] !== undefined) return [0, GP_TASK_STAGE_ORDER[key]];
        return [1, order.indexOf(key)];
      }
      return order.slice().sort(function(a, b) {
        var ra = rank(a), rb = rank(b);
        return ra[0] - rb[0] || ra[1] - rb[1];
      }).map(function(key) { return { stage: key, tasks: groups[key] }; });
    }

    function gpTaskStageLabel(stage) {
      if (stage === '__none__') return 'No stage';
      var s = stage === 'visa' ? 'pbs' : stage;
      return STAGE_LABELS[s] || stage;
    }

    // Render the cached tasks[] for the open GP file (read-only). Active tasks only by
    // default, grouped by related_stage, with a toggle to show completed/cancelled too.
    function renderGpTasksTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var all = (gpDetailCache && gpDetailCache.tasks) || [];
      var groups = gpTasksByStage(all, gpTasksShowAll);
      var shownCount = groups.reduce(function(n, g) { return n + g.tasks.length; }, 0);

      var html = '<div class="ceo-ops-section-head">Tasks <span class="count">' + shownCount + '</span>';
      html += '<button class="btn ceo-gp-tasks-toggle" id="gpTasksToggle" style="margin-left:auto">' + (gpTasksShowAll ? 'Hide completed' : 'Show all') + '</button>';
      html += '</div>';

      if (!shownCount) {
        html += '<div class="ceo-ops-empty">' + (gpTasksShowAll ? 'No tasks for this GP.' : 'No active tasks for this GP.') + '</div>';
        pane.innerHTML = html;
        return;
      }

      for (var gi = 0; gi < groups.length; gi++) {
        var grp = groups[gi];
        html += '<div class="ceo-ops-group">';
        html += '<div class="ceo-ops-group-head" onclick="toggleOpsGroup(this)">';
        html += '<span class="ceo-ops-group-caret">&#x25BC;</span>';
        html += '<span class="ceo-ops-group-name">' + esc(gpTaskStageLabel(grp.stage)) + '</span>';
        html += '<span class="ceo-ops-group-count">' + grp.tasks.length + ' task' + (grp.tasks.length === 1 ? '' : 's') + '</span>';
        html += '</div>';
        html += '<div class="ceo-ops-group-body">';
        for (var ti = 0; ti < grp.tasks.length; ti++) {
          var task = grp.tasks[ti];
          html += '<div class="ceo-ops-row">';
          html += '<div class="ceo-ops-row-main">';
          html += '<div class="ceo-ops-row-title">' + esc(task.title || '(untitled task)') + '</div>';
          if (task.task_type) html += '<div class="ceo-ops-row-sub">' + esc(task.task_type.replace(/_/g, ' ')) + '</div>';
          html += '</div>';
          html += '<div class="ceo-gp-task-pills">';
          html += priorityPill(task.priority);
          if (task.status) html += statusPill(task.status);
          html += '</div>';
          html += '<span class="ceo-ops-due' + (task.__overdue ? ' overdue' : '') + '">' + esc(task.__dueLabel) + '</span>';
          // Per-task actions — done/cancelled tasks have no further action.
          var taskDone = GP_TASK_DONE_STATUSES.indexOf(task.status) !== -1;
          if (!taskDone) {
            var tid = esc(task.id);
            html += '<div class="ceo-ops-actions">';
            if (task.status !== 'in_progress') html += '<button class="btn btn-blue" onclick="ceoGpTaskAction(event, \'' + tid + '\', \'in_progress\')">Start</button>';
            if (task.status !== 'waiting') html += '<button class="btn btn-amber" onclick="ceoGpTaskAction(event, \'' + tid + '\', \'waiting\')">Waiting</button>';
            html += '<button class="btn btn-green" onclick="ceoGpTaskAction(event, \'' + tid + '\', \'completed\')">Complete</button>';
            if (task.status !== 'escalated') html += '<button class="btn btn-amber" onclick="ceoGpTaskEscalate(event, \'' + tid + '\')">Escalate to CEO</button>';
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div></div>';
      }
      pane.innerHTML = html;
    }

    // Re-fetch the open GP's case and refresh gpDetailCache, then re-render the Tasks
    // tab. Returns a promise; rejects (via reject in caller) only on hard error. Keeps
    // gpDetailCache.case/tasks/timeline consistent with GET /api/admin/case?id=.
    function refreshGpDetailTasks() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        if (gpDetailTab === 'tasks') renderGpTasksTab();
      });
    }

    // Re-fetch the open GP file (if any) after a header case action and re-render the
    // active sub-tab. Reuses the existing CEO action modals (openCreateTaskModal,
    // openNoteModal, openStageChangeModal, openBlockerModal, openNudgeModal): their
    // submit handlers call this on success so the GP file reflects the change. No-op
    // when no GP file is open (so it never alters the modals' dashboard-refresh path).
    function refreshGpDetailIfOpen() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      // Drop the timeline cache so a newly added note shows up in the Notes/Timeline tabs.
      gpTimelineCache = null;
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        renderGpDetailTab(gpDetailTab);
      });
    }

    // Drop the cached Documents payload so the next render re-fetches /api/admin/gp-documents.
    // If the Documents sub-tab is currently open, re-render it now (renderGpDocumentsTab
    // re-fetches via loadGpDocuments because the cache was just cleared).
    function refreshGpDocuments() {
      gpDocumentsCache = null;
      if (gpDetailTab === 'documents') renderGpDocumentsTab();
    }

    // After a document action (upload/approve/request-revision) the underlying task state
    // changes (attachment_url, gmail_message_id, status), so refresh BOTH the cached task
    // rows (refreshGpDetailTasks) and the cached documents payload (refreshGpDocuments) so
    // the action buttons re-gate correctly on the next render.
    function refreshGpDocsAndTasks() {
      refreshGpDetailTasks();
      refreshGpDocuments();
    }

    // Per-task status action from the GP Tasks sub-tab. Reuses PUT /api/admin/task
    // (super-admin's requireAdminSession). On success: re-fetch case → refresh cache →
    // re-render. Failure shows a toast; checks both res.ok and the parsed { ok }.
    function ceoGpTaskAction(ev, taskId, status) {
      if (ev) { ev.stopPropagation(); }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: status }
      }).then(function(d) {
        if (d && d.ok) {
          var labels = { completed: 'completed', in_progress: 'started', waiting: 'set to waiting' };
          showToast('Task ' + (labels[status] || 'updated'), 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Escalate a GP task to the CEO. No existing CEO-page "escalate to CEO" flow exists
    // (resolveEscalation/respondEscalation handle the inbound direction), so use the
    // documented PUT /api/admin/task escalation shape: status escalated + escalated_to
    // 'CEO' + escalated_reason from a prompt. The server records escalated_by/_at.
    function ceoGpTaskEscalate(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var reason = prompt('Escalate this task to the CEO — reason:');
      if (reason === null) return; // cancelled
      reason = reason.trim();
      if (!reason) { showToast('A reason is required to escalate', 'error'); return; }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: 'escalated', escalated_to: 'CEO', escalated_reason: reason }
      }).then(function(d) {
        if (d && d.ok) {
          showToast('Task escalated to CEO', 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Pure mirrors of lib/ceo-metrics.js (the authoritative, unit-tested contracts).
    // gpNotesFromTimeline: notes = timeline entries with event_type 'note', newest first.
    function gpNotesFromTimeline(timeline) {
      return (timeline || [])
        .filter(function(e) { return e && e.event_type === 'note'; })
        .slice()
        .sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }
    // mergeGpTimeline: timeline events + comms messages into one newest-first stream,
    // each tagged with kind ('event' | 'message') for icon/layout selection.
    function mergeGpTimeline(timeline, messages) {
      var merged = [];
      (timeline || []).forEach(function(e) { if (e) merged.push(Object.assign({}, e, { kind: 'event' })); });
      (messages || []).forEach(function(m) { if (m) merged.push(Object.assign({}, m, { kind: 'message' })); });
      return merged.sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }

    // Render the cached note timeline entries for the open GP file (read-only).
    // Add-note input is deferred to Phase 3b.
    function renderGpNotesTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var notes = gpNotesFromTimeline((gpDetailCache && gpDetailCache.timeline) || []);
      var html = '<div class="ceo-ops-section-head">Notes <span class="count">' + notes.length + '</span></div>';
      if (!notes.length) {
        html += '<div class="ceo-gp-detail-empty">No notes for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var body = n.detail || n.title || '';
        html += '<div class="ceo-gp-note">';
        html += '<div class="ceo-gp-note-body">' + esc(body) + '</div>';
        html += '<div class="ceo-gp-note-meta">';
        if (n.actor) html += '<span class="ceo-gp-note-actor">' + esc(n.actor) + '</span>';
        html += '<span class="ceo-gp-note-time">' + esc(fmtCallTime(n.created_at)) + '</span>';
        html += '</div>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Icon for a merged timeline entry, by message channel or event_type.
    function gpTimelineIcon(e) {
      if (e.kind === 'message') {
        var ch = (e.channel || '').toLowerCase();
        if (ch === 'sms') return '💬';        // speech balloon
        if (ch === 'whatsapp') return '📱';   // mobile phone
        if (ch === 'call' || ch === 'voice') return '📞'; // telephone receiver
        return '✉️';                           // envelope (email/default)
      }
      var et = (e.event_type || '').toLowerCase();
      if (et === 'note') return '📝';          // memo
      if (et === 'stage_change') return '🚩';  // triangular flag
      if (et === 'task_completed') return '✅';      // check mark
      if (et === 'task_created') return '➕';        // heavy plus
      if (et === 'blocker' || et === 'blocked') return '⛔'; // no entry
      return '•';                                   // bullet
    }

    // Render the merged GP timeline (events + comms messages), newest first (read-only).
    function renderGpTimelinePane(events) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var html = '<div class="ceo-ops-section-head">Timeline <span class="count">' + events.length + '</span></div>';
      if (!events.length) {
        html += '<div class="ceo-gp-detail-empty">No timeline activity for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < events.length; i++) {
        var e = events[i];
        var title, sub, who;
        if (e.kind === 'message') {
          var dir = (e.direction === 'inbound') ? 'In' : 'Out';
          title = (e.subject ? esc(e.subject) : esc((e.channel || 'message') + ' ' + dir.toLowerCase()));
          sub = e.body_text ? esc(String(e.body_text).slice(0, 160)) : '';
          who = e.sender || e.recipient || '';
        } else {
          title = esc(e.title || (e.event_type || 'event').replace(/_/g, ' '));
          sub = e.detail ? esc(e.detail) : '';
          who = e.actor || '';
        }
        html += '<div class="ceo-gp-tl-row">';
        html += '<span class="ceo-gp-tl-icon">' + gpTimelineIcon(e) + '</span>';
        html += '<div class="ceo-gp-tl-main">';
        html += '<div class="ceo-gp-tl-title">' + title + '</div>';
        if (sub) html += '<div class="ceo-gp-tl-sub">' + sub + '</div>';
        if (who) html += '<div class="ceo-gp-tl-who">' + esc(who) + '</div>';
        html += '</div>';
        html += '<span class="ceo-gp-tl-time">' + esc(fmtCallTime(e.created_at)) + '</span>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Timeline sub-tab: fetch the full case timeline + comms once (cached per GP file),
    // merge + sort newest-first, and render. Read-only.
    function renderGpTimelineTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpTimelineCache && gpTimelineCache.caseId === caseId) {
        renderGpTimelinePane(gpTimelineCache.events);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpTimeline(caseId);
    }

    // Fetch GET /api/admin/case/timeline?id=<caseId>, merge timeline[]+messages[], cache, render.
    function loadGpTimeline(caseId) {
      apiFetch('/api/admin/case/timeline?id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Failed to load timeline: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var events = mergeGpTimeline(d.timeline || [], d.messages || []);
        gpTimelineCache = { caseId: caseId, events: events };
        if (gpDetailTab === 'timeline') renderGpTimelinePane(events);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Pure mirror of lib/ceo-metrics.js gpDocumentSections (the authoritative,
    // unit-tested contract): normalize the four document categories into a fixed-order
    // list of { key, label, docs }, keeping empty categories, preserving doc order, and
    // normalizing each doc to { label, status, url, fileName, updatedAt } (primary field
    // then admin alias).
    var GP_DOCUMENT_CATEGORIES = [
      { key: 'directToAhpra', label: 'Direct to AHPRA' },
      { key: 'preparedByCandidate', label: 'Prepared by Candidate' },
      { key: 'preparedByGpLink', label: 'Prepared by GP LINK' },
      { key: 'otherFiles', label: 'Other Files' }
    ];
    function gpDocumentSections(documents) {
      var src = documents || {};
      return GP_DOCUMENT_CATEGORIES.map(function(cat) {
        var list = Array.isArray(src[cat.key]) ? src[cat.key] : [];
        var docs = list.filter(function(d) { return !!d; }).map(function(d) {
          return {
            key: (d.key != null && d.key !== '') ? d.key : (d.document_key || ''),
            label: (d.label != null && d.label !== '') ? d.label : (d.document_key || ''),
            status: (d.status != null && d.status !== '') ? d.status : (d.ops_status || null),
            url: d.file_url || d.webViewLink || null,
            fileName: d.file_name || d.name || null,
            updatedAt: d.updated_at || null
          };
        });
        return { key: cat.key, label: cat.label, docs: docs };
      });
    }

    // Inline mirrors of lib/ceo-metrics.js docTaskForKey + docActionsFor (3c.1).
    // The actionable practice-pack task for a document key (most recent non-terminal
    // one), or null. Tasks arrive created_at.desc, so the first non-completed/cancelled
    // match is the newest open task. Used to attach document controls to GP LINK doc rows.
    function docTaskForKey(tasks, docKey) {
      if (!docKey) return null;
      var matches = [];
      for (var i = 0; i < (tasks || []).length; i++) {
        var t = tasks[i];
        if (t && t.task_type === 'practice_pack_child' && t.related_document_key === docKey) matches.push(t);
      }
      if (!matches.length) return null;
      for (var j = 0; j < matches.length; j++) {
        var s = matches[j].status;
        if (s !== 'completed' && s !== 'cancelled') return matches[j];
      }
      return matches[0];
    }

    // Which document actions are available for a task, mirroring admin.html gating
    // (pages/admin.html ~1725). Upload is offered for the two uploadable pack docs;
    // approve when an attachment is present; request-revision for auto-received docs.
    function docActionsFor(task) {
      var key = task && task.related_document_key;
      var canUpload = key === 'offer_contract' || key === 'supervisor_cv';
      var hasAttachment = !!(task && (task.attachment_url || task.zoho_attachment_id));
      var autoReceived = !!(task && task.gmail_message_id && task.attachment_url);
      return { upload: canUpload, approve: hasAttachment, requestRevision: autoReceived };
    }

    // Render the four document categories for the open GP file (read-only). Each doc
    // shows its label, a status pill, the file name, and a View link when a URL is
    // present (opens in a new tab). Upload/approve are deferred to Phase 3b.
    function renderGpDocumentsPane(sections, driveFolder) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var total = sections.reduce(function(n, s) { return n + s.docs.length; }, 0);
      var html = '<div class="ceo-ops-section-head">Documents <span class="count">' + total + '</span>';
      if (driveFolder) html += '<a class="ceo-gp-drive-link" href="' + esc(driveFolder) + '" target="_blank" rel="noopener" style="margin-left:auto">Open Drive folder</a>';
      html += '</div>';
      for (var si = 0; si < sections.length; si++) {
        var sec = sections[si];
        html += '<div class="ceo-gp-doc-section">';
        html += '<div class="ceo-gp-doc-section-head">' + esc(sec.label) + ' <span class="ceo-gp-doc-count">' + sec.docs.length + '</span></div>';
        if (!sec.docs.length) {
          html += '<div class="ceo-gp-doc-empty">No documents.</div>';
        } else {
          for (var di = 0; di < sec.docs.length; di++) {
            var doc = sec.docs[di];
            html += '<div class="ceo-gp-doc-row">';
            html += '<div class="ceo-gp-doc-main">';
            html += '<div class="ceo-gp-doc-label">' + esc(doc.label || '(untitled)') + '</div>';
            if (doc.fileName) html += '<div class="ceo-gp-doc-file">' + esc(doc.fileName) + '</div>';
            html += '</div>';
            if (doc.status) html += statusPill(doc.status);
            if (doc.url) html += '<a class="btn btn-blue ceo-gp-doc-view" href="' + esc(doc.url) + '" target="_blank" rel="noopener">View</a>';
            else html += '<span class="ceo-gp-doc-noview">No file</span>';
            var task = docTaskForKey((gpDetailCache && gpDetailCache.tasks) || [], doc.key);
            if (task) {
              var acts = docActionsFor(task);
              var tid = esc(task.id);
              var actionsHtml = '';
              if (acts.upload) actionsHtml += '<label class="btn ceo-doc-upload-btn">Upload<input type="file" data-ceo-doc-upload="' + tid + '" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic" style="display:none"></label>';
              if (acts.approve) actionsHtml += '<button class="btn btn-green" data-ceo-doc-action="approve" data-task="' + tid + '">Approve &amp; Send to GP</button>';
              if (acts.requestRevision) actionsHtml += '<button class="btn" data-ceo-doc-action="revise" data-task="' + tid + '">Request Revision</button>';
              if (actionsHtml) html += '<div class="ceo-gp-doc-actions">' + actionsHtml + '</div>';
            }
            html += '</div>';
          }
        }
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Documents sub-tab: fetch the GP documents once (cached per GP file), normalize
    // into the four sections, and render. Read-only.
    function renderGpDocumentsTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpDocumentsCache && gpDocumentsCache.caseId === caseId) {
        renderGpDocumentsPane(gpDocumentsCache.sections, gpDocumentsCache.driveFolder);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpDocuments(caseId);
    }

    // Fetch GET /api/admin/gp-documents?case_id=<caseId>, normalize, cache, render.
    function loadGpDocuments(caseId) {
      apiFetch('/api/admin/gp-documents?case_id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Failed to load documents: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        // /api/admin/gp-documents returns the four category arrays FLAT at the top level
        // ({ ok, country, directToAhpra, preparedByCandidate, preparedByGpLink, otherFiles }),
        // not nested under a `documents` key — pass the whole response to the normalizer.
        var sections = gpDocumentSections(d);
        gpDocumentsCache = { caseId: caseId, sections: sections, driveFolder: d.driveFolder || null };
        if (gpDetailTab === 'documents') renderGpDocumentsPane(sections, gpDocumentsCache.driveFolder);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // GP Documents action: upload a file for a GP LINK pack document (offer_contract /
    // supervisor_cv). Reuses the unchanged POST /api/admin/va/task/upload-document
    // (super-admin passes its requireAdminSession). file_data is a base64 data URL via
    // FileReader.readAsDataURL, matching how admin.html uploads. Body is passed as an
    // object so apiFetch JSON-stringifies it and sets Content-Type: application/json.
    function ceoDocUpload(taskId, inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        apiFetch('/api/admin/va/task/upload-document', {
          method: 'POST',
          body: { task_id: taskId, file_data: reader.result, file_name: file.name }
        }).then(function(d) {
          if (!d || !d.ok) { showToast((d && d.message) || 'Upload failed', 'error'); return; }
          showToast('Document uploaded', 'success');
          refreshGpDocsAndTasks();
        }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
      };
      reader.readAsDataURL(file);
    }

    // GP Documents action: approve the document and send it to the GP. Reuses the
    // unchanged POST /api/admin/va/task/approve-document.
    function ceoDocApprove(taskId) {
      if (!confirm('Approve this document and send it to the GP?')) return;
      apiFetch('/api/admin/va/task/approve-document', {
        method: 'POST',
        body: { task_id: taskId }
      }).then(function(d) {
        if (!d || !d.ok) { showToast((d && d.message) || 'Approval failed', 'error'); return; }
        showToast('Approved & sent', 'success');
        refreshGpDocsAndTasks();
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
    }

    // GP Documents action: create a revision-request draft in Gmail (document attached for
    // the practice) and open the draft in a new tab. Reuses the unchanged POST
    // /api/admin/va/task/request-revision.
    function ceoDocRequestRevision(taskId) {
      if (!confirm('Create a revision-request draft in Gmail? The document is attached for the practice.')) return;
      apiFetch('/api/admin/va/task/request-revision', {
        method: 'POST',
        body: { task_id: taskId }
      }).then(function(d) {
        if (d && d.ok && d.draft_url) {
          window.open(d.draft_url, '_blank', 'noopener');
          showToast('Draft created — add your note and send', 'success');
          refreshGpDocsAndTasks();
        } else {
          showToast('Error: ' + ((d && (d.message || d.error)) || 'Unknown error'), 'error');
        }
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
    }

    // Render this GP file's call history newest-first. Each row shows a status pill,
    // scheduled time, assigned RSO, admin notes, a meeting summary for completed calls,
    // a Join link when a zoom_join_url is present, plus per-call actions (resend/cancel/
    // reschedule/no-show) gated by status to match admin.html. The endpoint returns calls
    // already ordered created_at.desc (newest-first).
    function renderGpCallsPane(calls) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var list = calls || [];
      var html = '<div class="ceo-ops-section-head">Calls <span class="count">' + list.length + '</span></div>';
      if (!list.length) {
        html += '<div class="ceo-gp-detail-empty">No calls for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var timeLabel = c.scheduled_at ? fmtCallTime(c.scheduled_at) : 'Not yet booked';
        html += '<div class="ceo-gp-call">';
        html += '<div class="ceo-gp-call-head">';
        html += callStatusPill(c.status);
        html += '<span class="ceo-gp-call-time">' + esc(timeLabel) + '</span>';
        if (c.zoom_join_url) {
          html += '<a class="ceo-gp-call-join" href="' + esc(c.zoom_join_url) + '" target="_blank" rel="noopener">Join</a>';
        }
        html += '</div>';
        if (c.assigned_rso_name) {
          html += '<div class="ceo-gp-call-rso">RSO: ' + esc(c.assigned_rso_name) + '</div>';
        }
        if (c.admin_notes) {
          html += '<div class="ceo-gp-call-notes">' + esc(c.admin_notes) + '</div>';
        }
        if ((c.status || '').toLowerCase() === 'completed' && c.meeting_summary) {
          html += '<div class="ceo-gp-call-summary"><div class="ceo-gp-call-summary-label">Meeting summary</div>' + esc(c.meeting_summary) + '</div>';
        }
        // Per-call actions, gated by status to match admin.html (the backend rejects a
        // cancel unless status is invited/booked; no_show + cancelled are "needs
        // rebooking" states). Resend only for invited; No Show only for booked.
        var cs = (c.status || '').toLowerCase();
        var cid = esc(c.id);
        var actions = '';
        if (cs === 'invited' || cs === 'booked') {
          if (cs === 'invited') actions += '<button class="btn btn-blue" onclick="ceoGpCallResend(event, \'' + cid + '\')">Resend invite</button>';
          actions += '<button class="btn btn-red" onclick="ceoGpCallCancel(event, \'' + cid + '\')">Cancel</button>';
          if (cs === 'booked') {
            actions += '<button class="btn btn-blue" onclick="ceoGpCallReschedule(event, \'' + cid + '\')">Reschedule</button>';
            actions += '<button class="btn btn-amber" onclick="ceoGpCallNoShow(event, \'' + cid + '\')">No Show</button>';
          }
        } else if (cs === 'no_show' || cs === 'cancelled') {
          actions += '<button class="btn btn-blue" onclick="ceoGpCallReschedule(event, \'' + cid + '\')">Reschedule</button>';
        }
        if (actions) html += '<div class="ceo-gp-call-actions">' + actions + '</div>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Calls sub-tab: fetch this GP's calls once (cached per GP file), then render. Read-only.
    function renderGpCallsTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpCallsCache && gpCallsCache.caseId === caseId) {
        renderGpCallsPane(gpCallsCache.calls);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpCalls(caseId);
    }

    // Fetch GET /api/admin/calls?case_id=<caseId>, cache, render. Read-only.
    function loadGpCalls(caseId) {
      apiFetch('/api/admin/calls?case_id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Calls</div><div class="ceo-gp-detail-empty">Failed to load calls: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var calls = d.calls || [];
        gpCallsCache = { caseId: caseId, calls: calls };
        if (gpDetailTab === 'calls') renderGpCallsPane(calls);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Calls</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Bust the per-GP calls cache and re-fetch GET /api/admin/calls?case_id= → re-render.
    // Called after a successful call action so the Calls tab reflects the new status.
    function refreshGpDetailCalls() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return;
      gpCallsCache = null;
      loadGpCalls(caseId);
    }

    // Per-call actions from the GP Calls sub-tab. Reuse the admin call endpoints
    // (super-admin's requireAdminSession) with the exact shapes admin.html sends:
    //   resend     → POST /api/admin/calls/<id>/resend
    //   cancel     → PATCH /api/admin/calls/<id> { status:'cancelled' }
    //   no-show    → PATCH /api/admin/calls/<id> { status:'no_show' }
    //   reschedule → PATCH /api/admin/calls/<id> { action:'reschedule' }
    // On success: re-fetch calls → re-render. Failure shows a toast (checks parsed { ok }).
    function ceoGpCallApiAction(ev, opts) {
      if (ev) { ev.stopPropagation(); }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch(opts.path, opts.fetchOpts).then(function(d) {
        if (d && d.ok) {
          showToast(opts.successMsg, 'success');
          refreshGpDetailCalls();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }
    function ceoGpCallResend(ev, callId) {
      if (!confirm('Resend the Calendly invite to this GP?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId) + '/resend',
        fetchOpts: { method: 'POST' },
        successMsg: 'Invite resent'
      });
    }
    function ceoGpCallCancel(ev, callId) {
      if (!confirm('Cancel this scheduled call?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'cancelled' } },
        successMsg: 'Call cancelled'
      });
    }
    function ceoGpCallNoShow(ev, callId) {
      if (!confirm('Mark this call as a no-show?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'no_show' } },
        successMsg: 'Marked as no-show'
      });
    }
    function ceoGpCallReschedule(ev, callId) {
      if (!confirm('Reschedule this call? A new Calendly invite will be sent to the GP.')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { action: 'reschedule' } },
        successMsg: 'Call rescheduled — new invite sent'
      });
    }

    // Sub-tab click delegation for the GP file (+ Tasks show-all toggle + Documents actions).
    document.addEventListener('click', function(e) {
      var toggleBtn = e.target.closest('#gpTasksToggle');
      if (toggleBtn) { gpTasksShowAll = !gpTasksShowAll; renderGpTasksTab(); return; }
      var docActionBtn = e.target.closest('[data-ceo-doc-action]');
      if (docActionBtn) {
        var taskId = docActionBtn.getAttribute('data-task');
        var action = docActionBtn.getAttribute('data-ceo-doc-action');
        if (action === 'approve') ceoDocApprove(taskId);
        else if (action === 'revise') ceoDocRequestRevision(taskId);
        return;
      }
      // Support board resolve/reopen — delegated so it survives board re-renders.
      var supportBtn = e.target.closest('[data-ceo-support-action]');
      if (supportBtn) {
        var ticketId = supportBtn.getAttribute('data-ticket');
        var supportAction = supportBtn.getAttribute('data-ceo-support-action');
        ceoSupportTicketAction(supportAction, ticketId, supportBtn);
        return;
      }
      var tabBtn = e.target.closest('.ceo-gp-detail-tab[data-gp-tab]');
      if (tabBtn) { renderGpDetailTab(tabBtn.getAttribute('data-gp-tab')); }
    });

    // Documents upload delegation: the hidden file input lives inside a label button that
    // renderGpDocumentsPane re-renders, so delegate the change at document level to survive
    // re-renders. The task id is carried on the input's data-ceo-doc-upload attribute.
    document.addEventListener('change', function(e) {
      var uploadInput = e.target.closest('input[data-ceo-doc-upload]');
      if (uploadInput) ceoDocUpload(uploadInput.getAttribute('data-ceo-doc-upload'), uploadInput);
    });

    // Fetch + render this RSO's open ops tasks into #ceoOpsBoard, grouped by GP.
    function loadRsoOps(rsoId) {
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/ops').then(function(d) {
        var board = document.getElementById('ceoOpsBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-ops-section-head">Open Ops Tasks</div><div class="ceo-ops-empty">Failed to load ops tasks: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var tasks = d.tasks || [];
        var head = '<div class="ceo-ops-section-head">Open Ops Tasks <span class="count">' + tasks.length + '</span></div>';
        if (!tasks.length) { board.innerHTML = head + '<div class="ceo-ops-empty">No open ops tasks for this RSO.</div>'; return; }

        // Group by gp_name, preserving the server's priority/due ordering within each group.
        var order = [];
        var groups = {};
        for (var i = 0; i < tasks.length; i++) {
          var t = tasks[i];
          var gp = t.gp_name || 'Unknown GP';
          if (!groups[gp]) { groups[gp] = { name: gp, gp_user_id: t.gp_user_id || null, items: [] }; order.push(gp); }
          groups[gp].items.push(t);
        }

        var html = head;
        for (var gi = 0; gi < order.length; gi++) {
          var grp = groups[order[gi]];
          html += '<div class="ceo-ops-group">';
          html += '<div class="ceo-ops-group-head" onclick="toggleOpsGroup(this)">';
          html += '<span class="ceo-ops-group-caret">&#x25BC;</span>';
          html += '<span class="ceo-ops-group-name">' + esc(grp.name) + '</span>';
          html += '<span class="ceo-ops-group-count">' + grp.items.length + ' task' + (grp.items.length === 1 ? '' : 's') + '</span>';
          if (grp.gp_user_id) html += '<button class="btn" onclick="ceoOpsOpenGp(event, \'' + esc(grp.gp_user_id) + '\')">Open GP</button>';
          html += '</div>';
          html += '<div class="ceo-ops-group-body">';
          for (var ti = 0; ti < grp.items.length; ti++) {
            var task = grp.items[ti];
            var due = opsDueIndicator(task.due_date);
            html += '<div class="ceo-ops-row" id="ceoOpsRow_' + esc(task.id) + '">';
            html += '<div class="ceo-ops-row-main">';
            html += '<div class="ceo-ops-row-title">' + esc(task.title || '(untitled task)') + '</div>';
            var subBits = [];
            if (task.task_type) subBits.push(esc(task.task_type.replace(/_/g, ' ')));
            if (task.priority && task.priority !== 'normal') subBits.push(esc(task.priority));
            html += '<div class="ceo-ops-row-sub">' + (subBits.length ? subBits.join(' &middot; ') : '&mdash;') + '</div>';
            html += '</div>';
            html += '<span class="ceo-ops-due' + (due.overdue ? ' overdue' : '') + '">' + esc(due.label) + '</span>';
            html += '<div class="ceo-ops-actions">';
            if ((task.task_type || '').indexOf('email') >= 0 && task.gmail_thread_id) {
              html += '<button class="btn btn-blue" onclick="ceoOpsViewEmail(event, \'' + esc(task.gmail_thread_id) + '\')">View email</button>';
            }
            html += '<button class="btn btn-green" onclick="ceoOpsMarkDone(event, \'' + esc(task.id) + '\', \'' + esc(rsoId) + '\')">Mark done</button>';
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoOpsBoard');
        if (board) board.innerHTML = '<div class="ceo-ops-section-head">Open Ops Tasks</div><div class="ceo-ops-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Format a scheduled-call timestamp for display (en-AU). Returns '--' if absent/invalid.
    function fmtCallTime(iso) {
      if (!iso) return '--';
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '--';
      try {
        return new Date(t).toLocaleString('en-AU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return new Date(t).toLocaleString();
      }
    }

    // Status pill for a scheduled call, reusing the dashboard .pill tokens.
    function callStatusPill(status) {
      var s = (status || '').toLowerCase();
      var map = {
        invited: { cls: 'pill-amber', label: 'Invited' },
        booked: { cls: 'pill-blue', label: 'Booked' },
        completed: { cls: 'pill-green', label: 'Completed' },
        cancelled: { cls: 'pill-red', label: 'Cancelled' },
        no_show: { cls: 'pill-red', label: 'No Show' }
      };
      var m = map[s] || { cls: 'pill-muted', label: (status || '').replace(/_/g, ' ') || '--' };
      return '<span class="pill ' + m.cls + '">' + esc(m.label) + '</span>';
    }

    // Fetch + render this RSO's scheduled calls into #ceoCallsBoard, grouped by status.
    function loadRsoCalls(rsoId) {
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/calls').then(function(d) {
        var board = document.getElementById('ceoCallsBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-calls-section-head">Scheduled Calls</div><div class="ceo-calls-empty">Failed to load calls: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var calls = d.calls || [];
        var head = '<div class="ceo-calls-section-head">Scheduled Calls <span class="count">' + calls.length + '</span></div>';
        if (!calls.length) { board.innerHTML = head + '<div class="ceo-calls-empty">No scheduled calls for this RSO.</div>'; return; }

        // Group: Upcoming (booked/invited with a future scheduled_at), Awaiting booking
        // (invited with no scheduled time), Completed (status completed).
        var now = Date.now();
        var groups = { upcoming: [], awaiting: [], completed: [] };
        for (var i = 0; i < calls.length; i++) {
          var call = calls[i];
          var st = (call.status || '').toLowerCase();
          var schedMs = call.scheduled_at ? new Date(call.scheduled_at).getTime() : NaN;
          var hasFuture = !isNaN(schedMs) && schedMs >= now;
          if ((st === 'booked' || st === 'invited') && hasFuture) {
            groups.upcoming.push(call);
          } else if (st === 'invited' && isNaN(schedMs)) {
            groups.awaiting.push(call);
          } else if (st === 'completed') {
            groups.completed.push(call);
          }
        }

        var sections = [
          { key: 'upcoming', title: 'Upcoming', items: groups.upcoming },
          { key: 'awaiting', title: 'Awaiting booking', items: groups.awaiting },
          { key: 'completed', title: 'Completed', items: groups.completed }
        ];

        var html = head;
        var rendered = 0;
        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec.items.length) continue;
          rendered += sec.items.length;
          html += '<div class="ceo-calls-group">';
          html += '<div class="ceo-calls-group-head">';
          html += '<span class="ceo-calls-group-name">' + esc(sec.title) + '</span>';
          html += '<span class="ceo-calls-group-count">' + sec.items.length + ' call' + (sec.items.length === 1 ? '' : 's') + '</span>';
          html += '</div>';
          html += '<div class="ceo-calls-group-body">';
          for (var ci = 0; ci < sec.items.length; ci++) {
            var c2 = sec.items[ci];
            var gpName = c2.invitee_name || c2.gp_name || c2.invitee_email || 'Unknown GP';
            var timeLabel = c2.scheduled_at ? fmtCallTime(c2.scheduled_at) : 'Not yet booked';
            var subBits = [];
            if (c2.stage) subBits.push(esc(c2.stage));
            if (c2.invitee_email && gpName !== c2.invitee_email) subBits.push(esc(c2.invitee_email));
            html += '<div class="ceo-calls-row">';
            html += '<div class="ceo-calls-row-main">';
            html += '<div class="ceo-calls-row-name">' + esc(gpName) + '</div>';
            html += '<div class="ceo-calls-row-sub">' + (subBits.length ? subBits.join(' &middot; ') : '&mdash;') + '</div>';
            html += '</div>';
            html += '<span class="ceo-calls-time">' + esc(timeLabel) + '</span>';
            html += callStatusPill(c2.status);
            html += '<div class="ceo-calls-actions">';
            if (c2.zoom_join_url) {
              html += '<a class="ceo-calls-join" href="' + esc(c2.zoom_join_url) + '" target="_blank" rel="noopener">Join</a>';
            }
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        if (!rendered) { board.innerHTML = head + '<div class="ceo-calls-empty">No upcoming, awaiting, or completed calls for this RSO.</div>'; return; }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoCallsBoard');
        if (board) board.innerHTML = '<div class="ceo-calls-section-head">Scheduled Calls</div><div class="ceo-calls-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Track the RSO whose support board is currently open, so the resolve/reopen
    // delegated handler can re-fetch + re-render the right board after an action.
    var ceoSupportRsoId = null;

    // Status pill for a support ticket (open/closed), reusing the dashboard .pill tokens.
    function supportStatusPill(status) {
      var s = (status || '').toLowerCase();
      if (s === 'open') return '<span class="pill pill-amber">Open</span>';
      if (s === 'closed') return '<span class="pill pill-green">Resolved</span>';
      return '<span class="pill pill-muted">' + esc(status || '--') + '</span>';
    }

    // Category pill for a support ticket.
    function supportCategoryPill(category) {
      if (!category) return '';
      return '<span class="pill pill-muted">' + esc(String(category).replace(/_/g, ' ')) + '</span>';
    }

    // Best-effort one-line snippet for a ticket: prefer the body, else the last
    // thread_json message text. Trimmed to a readable length.
    function supportSnippet(t) {
      var text = '';
      if (t.body && String(t.body).trim()) {
        text = String(t.body).trim();
      } else if (Array.isArray(t.thread_json) && t.thread_json.length) {
        var last = t.thread_json[t.thread_json.length - 1];
        text = (last && last.text) ? String(last.text).trim() : '';
      }
      if (!text) return '';
      if (text.length > 160) text = text.slice(0, 159) + '…';
      return text;
    }

    // Fetch + render this RSO's case-linked support tickets into #ceoSupportBoard,
    // grouped into Open (status open) and Resolved (status closed).
    function loadRsoSupport(rsoId) {
      ceoSupportRsoId = rsoId;
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/support').then(function(d) {
        var board = document.getElementById('ceoSupportBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-support-section-head">Support Tickets</div><div class="ceo-support-empty">Failed to load support tickets: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var tickets = d.tickets || [];
        var head = '<div class="ceo-support-section-head">Support Tickets <span class="count">' + tickets.length + '</span></div>';
        if (!tickets.length) { board.innerHTML = head + '<div class="ceo-support-empty">No case-linked support tickets for this RSO.</div>'; return; }

        var groups = { open: [], closed: [] };
        for (var i = 0; i < tickets.length; i++) {
          var st = (tickets[i].status || '').toLowerCase();
          if (st === 'closed') groups.closed.push(tickets[i]);
          else groups.open.push(tickets[i]);
        }

        var sections = [
          { key: 'open', title: 'Open', items: groups.open },
          { key: 'closed', title: 'Resolved', items: groups.closed }
        ];

        var html = head;
        var rendered = 0;
        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec.items.length) continue;
          rendered += sec.items.length;
          html += '<div class="ceo-support-group">';
          html += '<div class="ceo-support-group-head">';
          html += '<span class="ceo-support-group-name">' + esc(sec.title) + '</span>';
          html += '<span class="ceo-support-group-count">' + sec.items.length + ' ticket' + (sec.items.length === 1 ? '' : 's') + '</span>';
          html += '</div>';
          html += '<div class="ceo-support-group-body">';
          for (var ti = 0; ti < sec.items.length; ti++) {
            var t = sec.items[ti];
            var isOpen = (t.status || '').toLowerCase() !== 'closed';
            var snippet = supportSnippet(t);
            html += '<div class="ceo-support-row">';
            html += '<div class="ceo-support-row-main">';
            html += '<div class="ceo-support-row-title">' + esc(t.title || '(untitled ticket)') + '</div>';
            html += '<div class="ceo-support-row-gp">' + esc(t.gp_name || 'Unknown GP') + (t.practice_name ? ' &middot; ' + esc(t.practice_name) : '') + '</div>';
            if (snippet) html += '<div class="ceo-support-row-snippet">' + esc(snippet) + '</div>';
            html += '<div class="ceo-support-row-pills">';
            html += supportStatusPill(t.status);
            html += supportCategoryPill(t.category);
            if (t.priority) html += priorityPill(t.priority);
            html += '</div>';
            html += '</div>';
            html += '<span class="ceo-support-time">' + esc(fmtCallTime(t.created_at)) + '</span>';
            html += '<div class="ceo-support-actions">';
            if (isOpen) {
              html += '<button class="btn btn-green" data-ceo-support-action="resolve" data-ticket="' + esc(t.id) + '">Resolve</button>';
            } else {
              html += '<button class="btn btn-amber" data-ceo-support-action="reopen" data-ticket="' + esc(t.id) + '">Reopen</button>';
            }
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        if (!rendered) { board.innerHTML = head + '<div class="ceo-support-empty">No open or resolved support tickets for this RSO.</div>'; return; }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoSupportBoard');
        if (board) board.innerHTML = '<div class="ceo-support-section-head">Support Tickets</div><div class="ceo-support-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Resolve/reopen a support ticket via the existing admin ticket-update endpoint
    // (reused, unchanged), then re-fetch + re-render the open RSO's support board.
    function ceoSupportTicketAction(action, ticketId, btn) {
      var newStatus = action === 'resolve' ? 'closed' : 'open';
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/va/ticket/' + encodeURIComponent(ticketId), {
        method: 'PUT',
        body: { status: newStatus }
      }).then(function(d) {
        if (d && d.ok) {
          showToast(action === 'resolve' ? 'Ticket resolved' : 'Ticket reopened', 'success');
          if (ceoSupportRsoId) loadRsoSupport(ceoSupportRsoId);
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Due/overdue indicator for an ops row. Returns { label, overdue }.
    function opsDueIndicator(due) {
      if (!due) return { label: 'No due date', overdue: false };
      var dueMs = new Date(due).getTime();
      if (isNaN(dueMs)) return { label: 'No due date', overdue: false };
      var diffDays = Math.floor((dueMs - Date.now()) / 86400000);
      if (diffDays < 0) return { label: 'Overdue ' + Math.abs(diffDays) + 'd', overdue: true };
      if (diffDays === 0) return { label: 'Due today', overdue: true };
      return { label: 'Due in ' + diffDays + 'd', overdue: false };
    }

    // Collapse/expand a GP ops group.
    function toggleOpsGroup(headEl) {
      var grp = headEl.closest('.ceo-ops-group');
      if (grp) grp.classList.toggle('collapsed');
    }

    // View email: open the Gmail thread in a new tab.
    function ceoOpsViewEmail(ev, threadId) {
      if (ev) ev.stopPropagation();
      if (!threadId) { showToast('No email thread linked to this task.', 'error'); return; }
      window.open('https://mail.google.com/mail/u/0/#all/' + encodeURIComponent(threadId), '_blank');
    }

    // Mark an ops task done via the existing admin task-update endpoint, then refresh the board.
    function ceoOpsMarkDone(ev, taskId, rsoId) {
      if (ev) ev.stopPropagation();
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: 'completed' }
      }).then(function(d) {
        if (d && d.ok) {
          showToast('Task marked done', 'success');
          loadRsoOps(rsoId);
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Open GP detail — placeholder until Phase 3 wires the full GP drill-in.
    function ceoOpsOpenGp(ev, gpUserId) {
      if (ev) ev.stopPropagation();
      showToast('GP detail view arrives in a later phase.', 'info');
    }

    /* ═══ INIT ═══ */
    (function init() {
      checkAuth().then(function(ok) {
        if (!ok) return;
        // Load dashboard + trends in parallel
        Promise.all([
          refreshDashboard(),
          refreshTrends(),
          loadRsoRoster()
        ]).then(function() {
          startRefreshLoop();
          refreshLabelTimerId = setInterval(updateRefreshLabel, 1000);
        });
      });
    })();
  </script>
</body>
</html>
