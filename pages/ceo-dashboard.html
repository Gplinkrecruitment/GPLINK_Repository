<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO Command Centre - GP Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --bg-elevated: #13151e;
      --panel: #1a1d27;
      --panel-hover: #1f2233;
      --panel-border: rgba(255,255,255,0.06);
      --panel-border-hover: rgba(255,255,255,0.12);
      --text: #e2e8f0;
      --text-muted: rgba(255,255,255,0.5);
      --text-dim: rgba(255,255,255,0.3);
      --blue: #60a5fa;
      --blue-dim: rgba(96,165,250,0.15);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.12);
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 40px; }

    /* ═══ HEADER ═══ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(15,17,23,0.98), rgba(15,17,23,0.92));
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: grid; place-items: center;
      font-size: 14px; font-weight: 800; color: #fff;
      letter-spacing: -0.03em;
      box-shadow: 0 0 20px rgba(96,165,250,0.25);
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header-title span { color: var(--text-muted); font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .time-filter-bar { display: flex; align-items: center; gap: 6px; padding: 8px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--panel-border); }
    .time-filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-right: 4px; }
    .time-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--panel-border); background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .time-btn:hover { border-color: var(--blue); color: var(--text); }
    .time-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    /* ═══ STANDALONE TOP NAV ═══ */
    .ceo-topnav { display: flex; align-items: center; gap: 4px; padding: 0 24px; background: var(--bg-elevated); border-bottom: 1px solid var(--panel-border); position: sticky; top: 60px; z-index: 90; }
    .ceo-topnav a, .ceo-topnav .nav-item { padding: 11px 14px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .ceo-topnav .nav-item:hover, .ceo-topnav a:hover { color: var(--text); }
    .ceo-topnav .nav-item.active { color: var(--text); border-bottom-color: var(--blue); }
    .ceo-topnav .nav-spacer { flex: 1; }
    .ceo-topnav .nav-back { color: var(--text-dim); font-weight: 500; }
    /* ═══ REGISTRATION SUB-NAV (RSOs | Guides) ═══ */
    .reg-subnav { display: flex; align-items: center; gap: 4px; padding: 8px 24px 0; background: var(--bg-elevated); border-bottom: 1px solid var(--panel-border); position: sticky; top: 60px; z-index: 89; }
    .reg-subtab { padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .reg-subtab:hover { color: var(--text); }
    .reg-subtab.active { color: var(--text); border-bottom-color: var(--blue); }
    .escalation-badge {
      display: none;
      align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.3);
      font-size: 11px; font-weight: 700; color: var(--red);
      cursor: pointer;
      transition: all 0.15s;
      animation: pulse-red 2s ease-in-out infinite;
    }
    .escalation-badge.visible { display: inline-flex; }
    .escalation-badge:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.5); }
    /* Role chip shown to consultants (ATS-only mode) — matches the header badge shape */
    .role-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(96,165,250,0.12);
      border: 1px solid rgba(96,165,250,0.35);
      font-size: 11px; font-weight: 700; color: #60a5fa;
      letter-spacing: 0.02em;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .refresh-meta {
      font-size: 11px; color: var(--text-dim);
      font-family: var(--mono);
      display: flex; align-items: center; gap: 8px;
    }
    .refresh-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      animation: blink-dot 3s ease-in-out infinite;
    }
    .refresh-dot.paused { background: var(--amber); animation: none; }
    @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .auto-toggle {
      appearance: none; -webkit-appearance: none;
      width: 32px; height: 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      position: relative; cursor: pointer;
      transition: all 0.2s;
    }
    .auto-toggle::after {
      content: '';
      position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%; background: var(--text-muted);
      transition: all 0.2s;
    }
    .auto-toggle:checked { background: var(--blue-dim); border-color: rgba(96,165,250,0.4); }
    .auto-toggle:checked::after { left: 16px; background: var(--blue); }

    /* ═══ CONTENT ═══ */
    .content { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

    /* ═══ KPI STRIP ═══ */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--panel-border);
      transition: background 0.2s;
    }
    .kpi-card:hover { border-color: var(--panel-border-hover); transform: translateY(-1px); }
    .kpi-card.accent-blue::before { background: var(--blue); }
    .kpi-card.accent-green::before { background: var(--green); }
    .kpi-card.accent-red::before { background: var(--red); }
    .kpi-card.accent-amber::before { background: var(--amber); }
    .kpi-card.accent-purple::before { background: var(--purple); }
    .kpi-card.highlight-red { border-color: rgba(239,68,68,0.3); background: linear-gradient(180deg, rgba(239,68,68,0.06), var(--panel)); }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .kpi-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi-trend {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .kpi-trend.up { color: var(--green); }
    .kpi-trend.down { color: var(--red); }
    .kpi-trend.flat { color: var(--text-dim); }

    /* ═══ ESCALATION BANNER ═══ */
    .escalation-banner {
      display: none;
      margin-bottom: 20px;
      background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.04));
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .escalation-banner.visible { display: block; }
    .escalation-banner:hover { border-color: rgba(239,68,68,0.35); background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(239,68,68,0.06)); }
    .escalation-banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .escalation-banner-left { display: flex; align-items: center; gap: 10px; }
    .esc-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--red-dim);
      display: grid; place-items: center;
      font-size: 14px;
    }
    .esc-count {
      font-size: 13px; font-weight: 700; color: var(--red);
    }
    .esc-names {
      font-size: 12px; color: var(--text-muted); font-weight: 500;
      max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .esc-expand-hint {
      font-size: 11px; color: var(--text-dim); font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .esc-expand-hint .arrow { transition: transform 0.2s; }
    .escalation-banner.expanded .esc-expand-hint .arrow { transform: rotate(180deg); }

    /* ═══ ESCALATION PANEL (expanded) ═══ */
    .escalation-panel {
      display: none;
      margin-top: 12px;
      border-top: 1px solid rgba(239,68,68,0.15);
      padding-top: 12px;
    }
    .escalation-banner.expanded .escalation-panel { display: block; }
    /* A doctor's question about a practice reads differently from an overdue
       auto-escalation — blue, not red: it is someone waiting on us, not
       something that has gone wrong. */
    .esc-enq-chip {
      display: inline-flex;
      align-items: center;
      background: rgba(59,130,246,0.16);
      border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 8px;
    }
    .esc-enq-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(59,130,246,0.16);
      border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: middle;
    }
    .esc-enq-question {
      margin: 6px 0 8px;
      padding: 8px 12px;
      border-left: 3px solid rgba(59,130,246,0.55);
      background: rgba(59,130,246,0.07);
      border-radius: 0 6px 6px 0;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text, #e5e7eb);
    }
    .esc-item {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .esc-item:hover { border-color: rgba(255,255,255,0.08); }
    .esc-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .esc-item-info { flex: 1; min-width: 200px; }
    .esc-item-gp { font-size: 13px; font-weight: 700; }
    .esc-item-title { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .esc-item-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
    .esc-item-meta span { display: flex; align-items: center; gap: 4px; }
    .esc-item-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    /* ═══ SECTION GRID ═══ */
    .section-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .section-grid .full-width { grid-column: 1 / -1; }

    /* ═══ SECTION CARD ═══ */
    .section-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.2s;
    }
    .section-card:hover { border-color: var(--panel-border-hover); }
    .section-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 0;
    }
    .section-card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 8px;
    }
    .section-card-title .icon {
      width: 20px; height: 20px;
      border-radius: 5px;
      display: grid; place-items: center;
      font-size: 11px;
    }
    .section-card-body { padding: 14px 18px 18px; }

    /* ═══ PIPELINE FUNNEL ═══ */
    .funnel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: -6px;
      margin-right: -6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .funnel-row:hover { background: rgba(255,255,255,0.03); }
    .funnel-row:last-child { margin-bottom: 0; }
    .funnel-label {
      width: 100px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .funnel-bar-wrap {
      flex: 1;
      height: 22px;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      position: relative;
    }
    .funnel-bar {
      height: 100%;
      border-radius: 4px;
      min-width: 2px;
      transition: width 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
    }
    .funnel-bar.blue { background: linear-gradient(90deg, rgba(96,165,250,0.5), rgba(96,165,250,0.3)); }
    .funnel-bar.purple { background: linear-gradient(90deg, rgba(167,139,250,0.5), rgba(167,139,250,0.3)); }
    .funnel-bar.amber { background: linear-gradient(90deg, rgba(251,191,36,0.5), rgba(251,191,36,0.3)); }
    .funnel-bar.green { background: linear-gradient(90deg, rgba(52,211,153,0.5), rgba(52,211,153,0.3)); }
    .funnel-bar.red { background: linear-gradient(90deg, rgba(239,68,68,0.5), rgba(239,68,68,0.3)); }
    .funnel-count {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }
    .funnel-blocked {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      width: 24px;
      flex-shrink: 0;
    }

    /* ═══ CONVERSION FUNNEL + SOURCE ATTRIBUTION (H2) ═══ */
    .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .cf-grid { grid-template-columns: 1fr; } }
    .cf-side-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .cf-step {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 4px 6px;
      margin-left: -6px;
      margin-right: -6px;
      border-radius: 6px;
    }
    .cf-step:last-child { margin-bottom: 0; }
    .cf-step .funnel-label { width: 116px; }
    .cf-conv {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      width: 52px;
      text-align: right;
      flex-shrink: 0;
    }
    .src-label { text-transform: none; }
    .src-total { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
    .ttp-strip { display: flex; gap: 18px; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
    .ttp-cell { flex: 1; }
    .ttp-num { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); }
    .ttp-unit { font-size: 11px; font-weight: 600; color: var(--text-dim); margin-left: 4px; }
    .ttp-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; line-height: 1.5; }

    /* ═══ PEP WAITLIST ═══ */
    .pep-wl-summary { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    .pep-wl-empty { font-size: 12px; color: var(--text-dim); padding: 8px 0; }
    .pep-wl-tablewrap { overflow-x: auto; }
    .pep-wl-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .pep-wl-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); font-weight: 700; padding: 6px 10px; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
    .pep-wl-table td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); vertical-align: top; }
    .pep-wl-dim { color: var(--text-muted); font-size: 11px; }
    .pep-badge { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; color: var(--amber); background: rgba(251,191,36,0.15); border-radius: 4px; padding: 1px 5px; vertical-align: middle; }
    .pep-wl-release { font-size: 11px; font-weight: 700; color: var(--blue); background: var(--blue-dim); border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .pep-wl-release:hover:not(:disabled) { border-color: var(--blue); }
    .pep-wl-release:disabled { opacity: 0.5; cursor: default; }
    .wl-tabs { display:flex; gap:8px; margin-bottom:10px; }
    .wl-tab { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; }
    .wl-tab.active { background:rgba(99,102,241,0.18); color:var(--text-bright, #fff); border-color:rgba(99,102,241,0.5); }
    .wl-pane { display:none; }
    .wl-pane.active { display:block; }
    .onb-wl-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; background:rgba(59,130,246,0.15); color:#7fb3ff; }
    .onb-wl-badge.muted { background:rgba(255,255,255,0.07); color:var(--text-dim); }
    .pep-wl-summary-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .pep-wl-launch { font-size:11px; font-weight:700; color:var(--amber); background:rgba(251,191,36,0.12); border:1px solid rgba(251,191,36,0.45); border-radius:6px; padding:5px 12px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
    .pep-wl-launch:hover:not(:disabled) { border-color:var(--amber); }
    .pep-wl-launch:disabled { opacity:0.5; cursor:default; }

    /* ═══ 12-WEEK TRENDS CARD (Phase 6 H1) ═══ */
    .trend-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .trend-chip { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:var(--text-muted); border-radius:8px; padding:5px 11px; font-size:12px; cursor:pointer; transition:all 0.15s; }
    .trend-chip.active { background:rgba(255,255,255,0.04); color:#fff; }
    .digest-now-btn { margin-left:auto; font-size:11px; font-weight:700; color:var(--blue); background:var(--blue-dim); border:1px solid transparent; border-radius:6px; padding:6px 12px; cursor:pointer; white-space:nowrap; transition:all 0.15s; }
    .digest-now-btn:hover:not(:disabled) { border-color:var(--blue); }
    .digest-now-btn:disabled { opacity:0.5; cursor:default; }
    .trend-summary { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
    .trend-summary .trend-cur { font-family:var(--mono); font-size:14px; font-weight:700; color:var(--text); }
    .trend-empty { padding:28px 0; text-align:center; font-size:12px; color:var(--text-dim); }
    .trend-chart-svg { width:100%; height:auto; display:block; }

    /* ═══ BLOCKERS LIST ═══ */
    .blocker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--panel-border);
      gap: 8px;
    }
    .blocker-row:last-child { border-bottom: none; }
    .blocker-gp { font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .blocker-stage { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .blocker-days {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
    }
    .blocker-reason {
      font-size: 11px;
      color: var(--text-dim);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ═══ TASK HEALTH 2x2 ═══ */
    .task-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .task-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .task-cell-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .task-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ RSO WORKLOAD ═══ */
    .va-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .va-row:last-child { margin-bottom: 0; }
    .va-name { font-size: 12px; font-weight: 600; width: 80px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .va-bar-wrap {
      flex: 1; height: 18px; border-radius: 4px;
      background: rgba(255,255,255,0.04); overflow: hidden;
    }
    .va-bar {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      transition: width 0.5s;
    }
    .va-stats {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      width: 80px;
      text-align: right;
      flex-shrink: 0;
    }
    .va-stats .overdue { color: var(--red); }

    /* ═══ VELOCITY ═══ */
    .velocity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .velocity-row:last-child { border-bottom: none; }
    .velocity-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .velocity-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }
    .velocity-sample { font-size: 10px; color: var(--text-dim); margin-left: 6px; }

    /* ═══ PLACEMENTS 2x2 ═══ */
    .placements-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .placement-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .placement-cell:hover { border-color: var(--panel-border-hover); background: rgba(255,255,255,0.04); }
    .placement-cell-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .placement-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ GP ACTIVITY ═══ */
    .activity-buckets { display: flex; gap: 8px; }
    .activity-bucket {
      flex: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .activity-bucket:hover { border-color: var(--panel-border-hover); }
    .activity-bucket-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .activity-bucket-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .cold-list { margin-top: 10px; }
    .cold-gp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 11px;
      border-bottom: 1px solid var(--panel-border);
    }
    .cold-gp:last-child { border-bottom: none; }
    .cold-gp-name { font-weight: 600; }
    .cold-gp-days { font-family: var(--mono); font-weight: 700; color: var(--amber); }

    /* ═══ TICKETS ═══ */
    .tickets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ticket-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .ticket-cell-value {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .ticket-cell-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ═══ COMPLETIONS ═══ */
    .completions-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 12px;
    }
    .completion-stat {
      text-align: center;
    }
    .completion-stat-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      color: var(--green);
    }
    .completion-stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
    }
    .milestones-list { flex: 1; }
    .milestone-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .milestone-text { font-size: 12px; font-weight: 500; flex: 1; }
    .milestone-text strong { font-weight: 700; }
    .milestone-ago {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ═══ DRILLDOWN PANEL ═══ */
    .drilldown-panel {
      display: none;
      margin-top: 2px;
      border-top: 1px solid var(--panel-border);
      padding: 14px 18px;
      background: rgba(0,0,0,0.15);
      max-height: 400px;
      overflow-y: auto;
    }
    .drilldown-panel.open { display: block; }
    .drilldown-loading {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .drilldown-empty {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .dd-row {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .dd-row:hover { border-color: var(--panel-border-hover); }
    .dd-row:last-child { margin-bottom: 0; }
    .dd-row-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      gap: 8px;
    }
    .dd-row-name { font-size: 12px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-row-pills { display: flex; gap: 4px; flex-shrink: 0; }
    .dd-row-expand { font-size: 10px; color: var(--text-dim); flex-shrink: 0; transition: transform 0.2s; }
    .dd-row.expanded .dd-row-expand { transform: rotate(180deg); }
    .dd-row-detail {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--panel-border);
    }
    .dd-row.expanded .dd-row-detail { display: block; }
    .dd-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .dd-field-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
    .dd-field-value { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .dd-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    /* ═══ BUTTONS ═══ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--sans);
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
    .btn.btn-blue { color: var(--blue); border-color: rgba(96,165,250,0.3); background: var(--blue-dim); }
    .btn.btn-blue:hover { background: rgba(96,165,250,0.2); }
    .btn.btn-red { color: var(--red); border-color: rgba(239,68,68,0.3); background: var(--red-dim); }
    .btn.btn-red:hover { background: rgba(239,68,68,0.2); }
    .btn.btn-green { color: var(--green); border-color: rgba(52,211,153,0.3); background: var(--green-dim); }
    .btn.btn-green:hover { background: rgba(52,211,153,0.2); }
    .btn.btn-amber { color: var(--amber); border-color: rgba(251,191,36,0.3); background: var(--amber-dim); }
    .btn.btn-amber:hover { background: rgba(251,191,36,0.2); }
    .btn.btn-purple { color: var(--purple); border-color: rgba(167,139,250,0.3); background: var(--purple-dim); }
    .btn.btn-purple:hover { background: rgba(167,139,250,0.2); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ═══ PILL ═══ */
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .pill-blue { background: var(--blue-dim); color: var(--blue); }
    .pill-red { background: var(--red-dim); color: var(--red); }
    .pill-amber { background: var(--amber-dim); color: var(--amber); }
    .pill-green { background: var(--green-dim); color: var(--green); }
    .pill-purple { background: var(--purple-dim); color: var(--purple); }
    .pill-muted { background: rgba(255,255,255,0.06); color: var(--text-muted); }

    /* ═══ MODAL ═══ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      /* Cap the height and scroll inside so a tall modal (e.g. the document-review pop-up with
         a preview + note + action buttons) never pushes its buttons off-screen unreachably. */
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .modal-field { margin-bottom: 12px; }
    .modal-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .modal-input, .modal-select, .modal-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 13px;
      font-family: var(--sans);
      outline: none;
      transition: border-color 0.15s;
    }
    .modal-input:focus, .modal-select:focus, .modal-textarea:focus { border-color: var(--blue); }
    .modal-select { appearance: auto; }
    .modal-textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* ═══ TOAST ═══ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }
    .toast {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toast-in 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      max-width: 320px;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--red); }
    .toast.info { border-left: 3px solid var(--blue); }
    .toast.removing { animation: toast-out 0.25s forwards; }
    @keyframes toast-in { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(40px); opacity: 0; } }

    /* ═══ LOADING STATE ═══ */
    .page-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
    }
    .page-loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-loading .loading-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    /* Honest error / recovery state — replaces an otherwise-eternal spinner. */
    .page-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 12px;
      text-align: center;
      padding: 0 24px;
    }
    .page-error .pe-icon { font-size: 30px; line-height: 1; }
    .page-error .pe-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .page-error .pe-msg { font-size: 13px; color: var(--text-muted); max-width: 460px; line-height: 1.55; }
    .page-error .pe-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    .page-error .pe-actions .btn { padding: 8px 16px; font-size: 12px; }

    /* ═══ RSO OVERSIGHT ═══ */
    .rso-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .rso-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; transition: all 0.15s; }
    .rso-card:hover { border-color: var(--panel-border-hover); transform: translateY(-1px); }
    .rso-card.inactive { opacity: 0.55; }
    .rso-card-name { font-size: 15px; font-weight: 700; }
    .rso-card-email { font-size: 12px; color: var(--text-dim); margin-top: 2px; word-break: break-all; }
    .rso-card-stats { display: flex; gap: 18px; margin-top: 14px; }
    .rso-card-stat { display: flex; flex-direction: column; }
    .rso-card-stat-value { font-size: 20px; font-weight: 700; font-family: var(--mono); }
    .rso-card-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
    .rso-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .rso-detail-back { font-size: 13px; color: var(--text-muted); cursor: pointer; }
    .rso-detail-back:hover { color: var(--text); }
    .rso-gp-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    .rso-gp-row .name { font-weight: 600; flex: 1; }

    /* Medical Centres styles removed — tab deleted (covered by Practices). */

    /* ═══ TECHNICAL (read-only integrations + health) ═══ */
    .ceo-tech-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .ceo-tech-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 18px; transition: border-color 0.15s; }
    .ceo-tech-card:hover { border-color: var(--panel-border-hover); }
    .ceo-tech-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .ceo-tech-name { font-size: 14px; font-weight: 700; }
    .ceo-tech-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .ceo-tech-badge.connected { background: var(--green-dim); color: var(--green); }
    .ceo-tech-badge.degraded { background: var(--amber-dim); color: var(--amber); }
    .ceo-tech-badge.disconnected { background: var(--red-dim); color: var(--red); }
    .ceo-tech-detail { font-size: 12px; color: var(--text-muted); margin-top: 6px; word-break: break-word; line-height: 1.5; }
    .ceo-tech-detail b { color: var(--text); font-weight: 600; }
    .ceo-tech-subrow { font-size: 12px; color: var(--text-muted); margin-top: 4px; padding-left: 12px; word-break: break-word; }
    .ceo-tech-subrow b { color: var(--text); font-weight: 600; }
    .ceo-tech-subkv { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .ceo-tech-err { font-size: 11px; color: var(--red); margin-top: 2px; }
    .ceo-tech-health { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .ceo-tech-strip { background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); padding: 10px 14px; font-size: 12px; color: var(--text-muted); }
    .ceo-tech-strip-label { font-weight: 700; color: var(--text); }
    .ceo-tech-strip-val { font-family: var(--mono); font-weight: 700; color: var(--text); }
    .ceo-tech-strip-sub { color: var(--text-dim); }
    .ceo-tech-strip-na { color: var(--text-dim); font-style: italic; }
    /* Clickable health strips — they now open a full detail view. */
    .ceo-tech-strip.clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .ceo-tech-strip.clickable:hover { border-color: var(--panel-border-hover); background: rgba(255,255,255,0.03); }
    .ceo-tech-strip.clickable:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .ceo-tech-strip-go { color: var(--text-dim); margin-left: 6px; font-size: 11px; }

    /* ═══ ERROR DETAIL VIEW (Technical → Client errors / Open bugs) ═══ */
    .ceo-err-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .ceo-err-filter { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--panel-border); }
    .ceo-err-filter:hover { color: var(--text); border-color: var(--panel-border-hover); }
    .ceo-err-filter.active { background: var(--blue-dim, rgba(59,130,246,0.15)); color: var(--blue); border-color: var(--blue); }

    .ceo-doc-card-upload { align-self: flex-start; margin-top: auto; padding: 4px 10px; font-size: 10px; font-weight: 700; }

    .ceo-gp-call { padding: 12px 14px; border: 1px solid var(--panel-border); border-radius: var(--radius-md, 8px); background: var(--panel); margin-bottom: 8px; }
    .ceo-gp-call-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ceo-gp-call-time { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
    .ceo-gp-call-join { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #2D8CFF; color: #fff; border: 1px solid #2D8CFF; text-decoration: none; white-space: nowrap; }
    .ceo-gp-call-join:hover { background: #1f7ae0; }
    .ceo-gp-call-rso { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    .ceo-gp-call-notes { margin-top: 6px; font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-call-summary { margin-top: 8px; padding: 8px 10px; font-size: 12px; color: var(--text); background: var(--panel-2, rgba(255,255,255,0.03)); border: 1px solid var(--panel-border); border-radius: var(--radius-sm, 6px); white-space: pre-wrap; word-break: break-word; }
    .ceo-gp-call-summary-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .ceo-gp-call-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    /* Nested sub-tab bar inside the Calls pane — lighter than the main GP-detail tabs. */
    .ceo-call-subtabs { display: flex; gap: 4px; margin: 4px 0 14px; }
    .ceo-call-subtab { padding: 5px 12px; font-size: 12px; font-weight: 600; font-family: var(--sans); color: var(--text-muted); background: transparent; border: 1px solid var(--panel-border); border-radius: 999px; cursor: pointer; transition: all 0.15s; }
    .ceo-call-subtab:hover { color: var(--text); border-color: var(--panel-border-hover); }
    .ceo-call-subtab.active { color: #fff; background: var(--blue); border-color: var(--blue); }
    .ceo-call-subtab .count { margin-left: 5px; font-size: 11px; opacity: 0.85; }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 1100px) {
      .section-grid { grid-template-columns: 1fr; }
      .kpi-strip { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 680px) {
      .header { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
      .content { padding: 14px; }
      .kpi-strip { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .section-grid { gap: 12px; }
      .kpi-value { font-size: 22px; }
      .escalation-banner { padding: 10px 14px; }
      .placements-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ═══ GP-DETAIL PARITY (ported from admin.html GP-detail, dark theme) ═══ */
    /* Token-alias trick: re-declare admin's CSS custom-property NAMES to the CEO dark
       palette so admin's ported rules resolve dark automatically. (--panel/--text/--blue/
       --green/--amber/--red/--purple/--radius already exist dark in this page.) */
    .gp-parity { --line: var(--panel-border); --muted: var(--text-muted); --bg2: var(--bg-elevated); --bg3: rgba(255,255,255,0.06); --shadow: var(--shadow-lg); }

    /* ── Profile Bar (admin 855–865) ── */
    .gp-parity .profile-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);margin-bottom:8px}
    .gp-parity .profile-bar .pb-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex-shrink:0}
    .gp-parity .profile-bar .pb-info{flex:1;min-width:0}
    .gp-parity .profile-bar .pb-name{font-size:14px;font-weight:800;letter-spacing:-.01em}
    .gp-parity .profile-bar .pb-meta{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gp-parity .pb-practice-link{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
    .gp-parity .pb-practice-link:hover{text-decoration:underline}
    .gp-parity .profile-bar .pb-pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .gp-parity .profile-bar .pb-pill{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800}
    .gp-parity .pb-expand-toggle{background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:4px}
    .gp-parity .pb-expand-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px;display:none}
    .gp-parity .pb-expand-panel.open{display:block}

    /* ── Stage Groups (admin 922–934) ── */
    .gp-parity .stage-group{margin-bottom:16px}
    .gp-parity .stage-group-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
    .gp-parity .sg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .gp-parity .sg-dot.active{background:var(--blue)}
    .gp-parity .sg-dot.locked{background:var(--bg3)}
    .gp-parity .sg-label{font-size:13px;font-weight:700}
    .gp-parity .sg-label.active{color:var(--text)}
    .gp-parity .sg-label.locked{color:var(--muted)}
    .gp-parity .sg-count{font-size:11px;color:var(--muted);font-weight:500}
    .gp-parity .sg-lock-badge{font-size:10px;color:var(--muted);background:var(--bg2);padding:2px 8px;border-radius:4px;margin-left:auto}
    .gp-parity .stage-group.locked .stage-task{opacity:.35;pointer-events:none}
    .gp-parity .stage-group.locked .stage-task.unlocked-email{opacity:1;pointer-events:auto}

    /* ── Stage Task / Guided Task Card (admin 936–961) ── */
    .gp-parity .stage-task{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);padding:12px;margin-bottom:6px;transition:border-color .15s}
    .gp-parity .stage-task:hover{border-color:var(--panel-border-hover)}
    .gp-parity .stage-task.active-next{border-left:3px solid var(--blue)}
    .gp-parity .stage-task .st-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .gp-parity .stage-task .st-body{flex:1;min-width:0}
    .gp-parity .stage-task .st-title{font-size:13px;font-weight:700}
    .gp-parity .stage-task .st-title .urgent-badge{background:var(--red-dim);color:var(--red);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px}
    .gp-parity .stage-task .st-title .overdue-badge{background:var(--amber-dim);color:var(--amber);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px}
    .gp-parity .stage-task .st-guide{font-size:11px;color:var(--blue);margin-top:4px;background:var(--blue-dim);display:inline-block;padding:2px 8px;border-radius:4px;font-weight:600}
    .gp-parity .stage-task .st-doc-info{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px}
    .gp-parity .stage-task .st-doc-chip{background:var(--bg2);border-radius:4px;padding:2px 8px;color:var(--muted);font-weight:500}
    .gp-parity .stage-task .st-actions{display:flex;gap:4px;flex-shrink:0;margin-left:8px}
    .gp-parity .stage-task .st-primary-btn{padding:5px 14px;border-radius:8px;font-size:11px;font-weight:700;background:var(--blue);color:#fff;border:none;cursor:pointer;font-family:inherit}
    .gp-parity .stage-task .st-primary-btn:hover{background:var(--blue-dim)}
    .gp-parity .stage-task .st-more-btn{padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--bg3);color:var(--muted);border:none;cursor:pointer;font-family:inherit;position:relative}
    .gp-parity .stage-task .st-more-btn:hover{background:var(--panel-border-hover)}
    /* Schedule-call button (admin 9333 inline styles, dark-converted: #eff6ff->--blue-dim, #2563eb->--blue, #bfdbfe->blue border) */
    .gp-parity .st-schedule-call-btn{padding:7px 13px;border-radius:8px;border:1px solid rgba(96,165,250,0.3);background:var(--blue-dim);color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;margin-right:8px;font-family:inherit}
    .gp-parity .st-schedule-call-btn:hover{background:rgba(96,165,250,0.25)}
    .gp-parity .stage-task .st-waiting{font-size:11px;color:var(--amber);margin-top:4px;font-weight:600}
    .gp-parity .stage-task.st-waiting-state{border-left:3px solid var(--amber);background:var(--amber-dim)}
    .gp-parity .stage-task .st-waiting-pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--amber-dim);color:var(--amber);margin-top:4px}
    .gp-parity .stage-task .st-waiting-days{font-size:10px;color:var(--muted);margin-left:6px;font-weight:500}
    .gp-parity .stage-task .st-nudge-reminder{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:6px;font-size:11px;color:var(--red);font-weight:600}
    .gp-parity .stage-task .st-nudge-reminder .st-nudge-btn{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;background:var(--purple);color:#fff;border:none;cursor:pointer;font-family:inherit;margin-left:auto;white-space:nowrap}
    .gp-parity .stage-task .st-nudge-reminder .st-nudge-btn:hover{background:var(--purple-dim)}

    /* ── Email Triage Panel (admin 964–974) ── */
    .gp-parity .et-panel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:8px}
    .gp-parity .et-section{margin-bottom:12px}
    .gp-parity .et-section-title{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
    .gp-parity .et-email-from{font-size:12px;color:var(--text);font-weight:600}
    .gp-parity .et-email-body{font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap;max-height:200px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:6px}
    .gp-parity .et-ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
    .gp-parity .et-ctx-item{padding:6px 8px;background:var(--panel);border-radius:4px}
    .gp-parity .et-ctx-label{font-size:10px;color:var(--muted);text-transform:uppercase}
    .gp-parity .et-reply-area{width:100%;min-height:120px;padding:10px;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);resize:vertical}
    .gp-parity .et-btn-row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
    .gp-parity .et-note{font-size:10px;color:var(--muted);margin-left:8px}
    /* admin .btn.sm / .btn.primary (admin 31–33), scoped under .gp-parity for the email-triage
       panel's buttons; .primary keeps #fff text on the (already-dark) --blue token. */
    .gp-parity .btn.sm{padding:5px 10px;font-size:11px}
    .gp-parity .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .gp-parity .btn.primary:hover{filter:brightness(1.1)}

    /* ── Dropdown Menu (admin 977–981) ── */
    .gp-parity .st-dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:200px;z-index:50;padding:4px 0;display:none}
    .gp-parity .st-dropdown.open{display:block}
    .gp-parity .st-dropdown-item{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit}
    .gp-parity .st-dropdown-item:hover{background:var(--bg2)}
    .gp-parity .st-dropdown-sep{border-top:1px solid var(--line);margin:3px 0}

    /* ── GP Sub-Tabs (admin 984–989) ── */
    .gp-parity .gp-subtabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px}
    .gp-parity .gp-subtab{padding:8px 16px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
    .gp-parity .gp-subtab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .gp-parity .gp-subtab:hover{color:var(--text)}
    .gp-parity .gp-subtab .subtab-count{background:var(--bg3);padding:1px 6px;border-radius:10px;font-size:10px;margin-left:4px}
    .gp-parity .gp-subtab.active .subtab-count{background:var(--blue);color:#fff}

    /* ── Task Detail accordion (admin 327–328) ── */
    .gp-parity .gp-task-detail{border-top:1px solid var(--line);background:var(--bg-elevated);border-radius:0 0 10px 10px}
    .gp-parity .gp-task-detail-inner{padding:2px 0 0}

    /* ── Task-detail "ops" views (port of admin .ops-* 261–319, dark-converted per porting
       rule 1: #fff->--panel, #f8fafc->--bg-elevated, light green/blue/amber/red bg+text ->
       matching dark tokens). Only the read-only display classes used by the CEO's ported
       renderers are included (thread, docs, banners, badges, action-row, description). The
       ops view sits inside .gp-task-detail-inner (admin keeps its padding:2px 0 0; the ops-*
       classes provide their own spacing, identical to admin). ── */
    .gp-parity .ops-expand-section{margin-bottom:14px}
    .gp-parity .ops-expand-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
    .gp-parity .ops-expand-desc{font-size:12px;color:var(--text);line-height:1.5;margin:6px 0 10px;white-space:pre-wrap}
    .gp-parity .ops-loading-detail{text-align:center;padding:20px;color:var(--muted);font-size:12px}
    .gp-parity .ops-response-banner{background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
    .gp-parity .ops-response-title{font-size:12px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px}
    .gp-parity .ops-response-text{font-size:12px;color:var(--text);margin-top:4px;line-height:1.5;white-space:pre-wrap;max-height:120px;overflow:auto}
    .gp-parity .ops-response-meta{font-size:10px;color:var(--muted);margin-top:4px}
    .gp-parity .ops-doc-preview{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
    .gp-parity .ops-doc-thumb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px;min-width:180px}
    .gp-parity .ops-doc-icon{width:28px;height:28px;background:var(--blue-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
    .gp-parity .ops-doc-version-old{opacity:.5}
    .gp-parity .ops-doc-version-old .ops-doc-thumb{border-style:dashed}
    .gp-parity .ops-action-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .gp-parity .ops-btn-green{background:var(--green);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:filter .15s}
    .gp-parity .ops-btn-green:hover{filter:brightness(1.12)}
    .gp-parity .ops-btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
    .gp-parity .ops-btn-secondary:hover{background:var(--bg3)}
    .gp-parity .ops-btn-danger{background:var(--panel);color:var(--red);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
    .gp-parity .ops-btn-danger:hover{background:var(--red-dim)}
    .gp-parity .ops-match-badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10px;font-weight:700;background:var(--green-dim);color:var(--green)}
    .gp-parity .ops-match-badge.low{background:var(--amber-dim);color:var(--amber)}
    .gp-parity .ops-original-email{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
    .gp-parity .ops-email-content{font-size:12px;color:var(--text);line-height:1.6;margin-top:4px;white-space:pre-wrap;max-height:150px;overflow:auto}
    .gp-parity .ops-email-from{font-size:11px;color:var(--muted);margin-bottom:4px}
    .gp-parity .ops-action-link-inline{font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;display:inline-block;margin-top:6px;text-decoration:none}
    .gp-parity .ops-action-link-inline:hover{text-decoration:underline}
    .gp-parity .ops-action-item-box{background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);border-radius:var(--radius);padding:10px 14px;margin:10px 0}
    .gp-parity .ops-conversation-thread{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:10px 0;max-height:260px;overflow:auto}
    .gp-parity .ops-msg{padding:8px 0;border-bottom:1px solid var(--line)}
    .gp-parity .ops-msg:last-child{border-bottom:none}
    .gp-parity .ops-msg-header{display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .gp-parity .ops-msg-dir{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
    .gp-parity .ops-msg-outbound .ops-msg-dir{background:var(--blue-dim);color:var(--blue)}
    .gp-parity .ops-msg-inbound .ops-msg-dir{background:var(--green-dim);color:var(--green)}
    .gp-parity .ops-msg-channel{font-size:10px;color:var(--muted)}
    .gp-parity .ops-msg-time{font-size:10px;color:var(--muted);margin-left:auto}
    .gp-parity .ops-msg-body{font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap;max-height:80px;overflow:auto;margin-top:2px}
    .gp-parity .ops-msg-subject{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px}
    .gp-parity .ops-nudge-indicator{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.3);border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;margin-top:8px;display:inline-block}
    /* ── Email composer (ported from admin .ops-email-* 263–273, dark-converted) ── */
    .gp-parity .ops-email-composer{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:6px}
    .gp-parity .ops-email-field{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .gp-parity .ops-email-label{font-size:11px;font-weight:700;color:var(--muted);min-width:52px;text-align:right}
    .gp-parity .ops-email-field input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text)}
    .gp-parity .ops-email-field input:focus{outline:none;border-color:var(--blue)}
    .gp-parity .ops-cc-row{margin:4px 0;display:flex;align-items:center;gap:6px}
    .gp-parity .ops-cc-row .ops-email-label{min-width:60px}
    /* No max-width — a native <option> cannot wrap or ellipsize, so a cap just CLIPS the
       address mid-word. Match the "To" input beside it (see admin.html .ops-cc-row select). */
    .gp-parity .ops-cc-row select{flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;background:var(--bg);color:var(--text)}
    .gp-parity .ops-email-body{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.6;min-height:80px;max-height:220px;overflow:auto;background:var(--bg);color:var(--text);font-family:inherit}
    .gp-parity .ops-email-body:focus{outline:none;border-color:var(--blue)}
    .gp-parity .ops-email-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}

    /* ── Case stage pill (admin 90) ── */
    .gp-parity .case-stage-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
    /* Case-management form (ported from admin .case-mgmt / .case-field, dark-converted) */
    .gp-parity .case-mgmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:600px){.gp-parity .case-mgmt{grid-template-columns:1fr}}
    .gp-parity .case-field{display:grid;gap:3px}
    .gp-parity .case-field label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
    .gp-parity .case-field select,.gp-parity .case-field input,.gp-parity .case-field textarea{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-family:inherit;background:var(--panel);color:var(--text)}
    .gp-parity .case-field select:focus,.gp-parity .case-field input:focus,.gp-parity .case-field textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(96,165,250,.15)}
    .gp-parity .pb-rso-unassigned{color:var(--red)}

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar { width: 6px; }

  <script>
    /* ═══════════════════════════════════════════════════════════════════
       CEO COMMAND CENTRE — GP Link
       Single-file vanilla JS dashboard
       ═══════════════════════════════════════════════════════════════════ */

    /* ── Globals ── */
    var dashboardData = null;
    var trendsData = null;
    var funnelData = null;   // /api/ceo/conversion-funnel payload (H2); keyed by .period
    var sourceData = null;   // /api/ceo/source-attribution payload (H2); keyed by .period
    var autoRefresh = true;
    var lastRefreshAt = 0;
    var refreshTimerId = null;
    var trendTimerId = null;
    var refreshLabelTimerId = null;
    var activeDrilldown = null; // { section, param, cardEl }
    var currentPeriod = 'all';

    // 12-week trends chart (Phase 6 H1): series keys MUST match the field names
    // /api/ceo/trends returns on each week row (see computeWeeklyTrendSeries).
    var TREND_SERIES = [
      { key: 'applications_submitted', label: 'Applications', color: '#60a5fa' },
      { key: 'stage_transitions', label: 'Stage moves', color: '#a78bfa' },
      { key: 'tasks_completed', label: 'Tasks completed', color: '#34d399' },
      { key: 'placements_secured', label: 'Placements', color: '#fbbf24' },
      { key: 'completions_done', label: 'Completions', color: '#f472b6' },
      { key: 'tickets_opened', label: 'Tickets', color: '#22d3ee' }
    ];
    var selectedTrendSeries = 'applications_submitted';

    var STAGES = ['career', 'myintealth', 'amc', 'ahpra', 'pbs', 'commencement'];
    var STAGE_LABELS = { career: 'Secure Placement', myintealth: 'MyIntealth', amc: 'AMC Portfolio', ahpra: 'AHPRA Registration', pbs: 'PBS & Medicare', commencement: 'Commencement', complete: 'Complete', visa: 'Visa', practice_contact: 'Medical Practice Contact' };
    var STAGE_COLORS = { career: 'amber', myintealth: 'blue', amc: 'purple', ahpra: 'green', pbs: 'blue', commencement: 'purple', complete: 'green', visa: 'red' };

    /* ── Utilities ── */
    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(String(s)));
      return d.innerHTML;
    }

    function fmtNum(n) {
      if (n == null) return '--';
      return String(n);
    }

    function fmtDays(n) {
      if (n == null) return '--';
      return n + 'd';
    }

    function fmtHours(h) {
      if (h == null) return '--';
      if (h < 1) return '<1h';
      return h.toFixed(1) + 'h';
    }

    function relativeTime(iso) {
      if (!iso) return '--';
      var ms = Date.now() - new Date(iso).getTime();
      var days = Math.floor(ms / 86400000);
      if (days > 0) return days + 'd ago';
      var hours = Math.floor(ms / 3600000);
      if (hours > 0) return hours + 'h ago';
      var mins = Math.floor(ms / 60000);
      return mins + 'm ago';
    }

    function pillClass(stage) {
      var map = { myintealth: 'pill-blue', amc: 'pill-purple', career: 'pill-amber', ahpra: 'pill-green', visa: 'pill-red', pbs: 'pill-blue', commencement: 'pill-purple', complete: 'pill-green' };
      return map[stage] || 'pill-muted';
    }

    function priorityPill(p) {
      if (p === 'urgent') return '<span class="pill pill-red">urgent</span>';
      if (p === 'high') return '<span class="pill pill-amber">high</span>';
      if (p === 'low') return '<span class="pill pill-muted">low</span>';
      return '<span class="pill pill-muted">' + esc(p || 'normal') + '</span>';
    }

    function statusPill(s) {
      if (!s) return '';
      var c = 'pill-muted';
      var sl = (s || '').toLowerCase();
      if (sl === 'active' || sl === 'open' || sl === 'in_progress') c = 'pill-blue';
      else if (sl === 'blocked' || sl === 'escalated') c = 'pill-red';
      else if (sl === 'completed' || sl === 'complete' || sl === 'resolved') c = 'pill-green';
      else if (sl.indexOf('waiting') >= 0) c = 'pill-amber';
      return '<span class="pill ' + c + '">' + esc(s.replace(/_/g, ' ')) + '</span>';
    }

    /* ── API Helpers ── */

    /* ── SWR cache (stale-while-revalidate) ──
       Users are in AU, the API in US East — every GET costs ~0.5-1.5s. Paint the
       last-known payload from sessionStorage immediately, then ALWAYS revalidate
       over the network and repaint, so no view ever shows stale data without a
       live refresh in flight (polling loops keep exact freshness).
       sessionStorage on purpose (NOT localStorage): cached PII must die with the
       tab. Only ok:true payloads are cached; entries >400KB are skipped; quota
       errors clear the gpSwr namespace and retry once. */
    var GP_SWR_NS = 'gpSwr1:ceo:';
    function gpSwrRead(path) { try { var raw = sessionStorage.getItem(GP_SWR_NS + path); if (!raw) return null; var e = JSON.parse(raw); if (!e || !e.d || (Date.now() - (e.t || 0)) > 86400000) return null; return e.d; } catch (err) { return null; } }
    function gpSwrWrite(path, data) { try { var raw = JSON.stringify({ t: Date.now(), d: data }); if (raw.length > 400000) { gpSwrDrop(path); return; } try { sessionStorage.setItem(GP_SWR_NS + path, raw); } catch (quotaErr) { gpSwrPurge(); try { sessionStorage.setItem(GP_SWR_NS + path, raw); } catch (err2) {} } } catch (err) {} }
    function gpSwrDrop(path) { try { sessionStorage.removeItem(GP_SWR_NS + path); } catch (err) {} }
    function gpSwrPurge() { try { for (var i = sessionStorage.length - 1; i >= 0; i--) { var k = sessionStorage.key(i); if (k && k.indexOf('gpSwr1:') === 0) sessionStorage.removeItem(k); } } catch (err) {} }
    // gpSwr(path, onData) — onData(payload, fromCache) runs up to twice: once
    // synchronously with the cached payload (if any), then with the network
    // result. Returns the network promise so .then/.catch chains keep working.
    function gpSwr(path, onData) { var cached = gpSwrRead(path); if (cached) { try { onData(cached, true); } catch (err) {} } return apiFetch(path).then(function (d) { if (d && d.ok) gpSwrWrite(path, d); else gpSwrDrop(path); onData(d, false); return d; }); }
    // Expose for the ATS modules (js/ceo-ats-*.js load after this inline script).
    window.__gpSwr = { read: gpSwrRead, write: gpSwrWrite, drop: gpSwrDrop, purge: gpSwrPurge };

    function apiFetch(path, opts) {
      var o = opts || {};
      o.credentials = 'same-origin';
      // Any mutation invalidates the whole SWR namespace — cheap and safe, since
      // every converted view still revalidates over the network on next paint.
      if (o.method && o.method !== 'GET') gpSwrPurge();
      if (o.body && typeof o.body === 'object' && !(o.body instanceof FormData)) {
        o.headers = o.headers || {};
        o.headers['Content-Type'] = 'application/json';
        o.body = JSON.stringify(o.body);
      }
      return fetch(path, o).then(function(r) { return r.json(); });
    }

    /* ── Auth Check ── */
    var isEmbedded = (window.self !== window.top);
    // Client-side check is defence-in-depth only; the server gate in server.js
    // (ceo-dashboard.html block) is authoritative and 302s to /pages/admin-signin.
    function checkAuth() {
      return apiFetch('/api/admin/auth/session').then(function(d) {
        if (!d.ok || !d.authenticated) {
          if (!isEmbedded) window.location.href = '/pages/admin-signin';
          return false;
        }
        var role = (d.profile && (d.profile.role || d.profile.adminRole)) || '';
        // super_admin gets the full dashboard; consultant gets the ATS-only view.
        if (role !== 'super_admin' && role !== 'consultant') {
          if (!isEmbedded) window.location.href = '/pages/admin-signin';
          return false;
        }
        window.__gpAdminRole = role;
        return true;
      }).catch(function() {
        if (!isEmbedded) window.location.href = '/pages/admin-signin';
        return false;
      });
    }

    /* ── Consultant (ATS-only) mode ──
       Consultants share the four ATS master tabs (Candidates / Jobs / Practices /
       Meetings) but must never see the Registration side or team management.
       The server 403s every Registration/CEO endpoint for them anyway — this
       just makes the page honest about what they can use. */
    function applyConsultantMode() {
      document.body.classList.add('gp-consultant');
      // Hide the executive-only master tabs + their panels (Overview/Registration,
      // RSO oversight, Technical, Leads, Contracts) — their data is never loaded
      // for consultants and the server 403s every underlying endpoint.
      // /api/ceo/leads and /api/ceo/contracts are both super-admin only
      // (requireCeoSession), so Leads/Contracts dead-end for consultants; hide them too.
      ['registration', 'rso', 'technical', 'leads', 'contracts', 'social'].forEach(function (mt) {
        var tab = document.querySelector('#masterTabs .ats-master-tab[data-mtab="' + mt + '"]');
        if (tab) tab.style.display = 'none';
        var panel = document.getElementById('panel-' + mt);
        if (panel) panel.style.display = 'none';
      });
      // Registration-only header widgets are meaningless without the CEO feed.
      var escBadge = document.getElementById('headerEscBadge');
      if (escBadge) escBadge.style.display = 'none';
      var refreshMeta = document.querySelector('.header-right .refresh-meta');
      if (refreshMeta) refreshMeta.style.display = 'none';
      var autoLabel = document.querySelector('.header-right label[title="Auto-refresh"]');
      if (autoLabel) autoLabel.style.display = 'none';
      // Small role chip where the header controls live.
      var headerRight = document.querySelector('.header-right');
      if (headerRight && !document.getElementById('roleChipConsultant')) {
        var chip = document.createElement('div');
        chip.id = 'roleChipConsultant';
        chip.className = 'role-chip';
        chip.textContent = 'Consultant';
        headerRight.appendChild(chip);
      }
      // Land on Candidates (the ATS home). ceo-ats-shared.js may still be
      // initialising when the session check resolves, so retry briefly. An ATS
      // deep-link hash (#jobs, #candidate=…) has already moved activeTab off
      // 'registration' — honour it.
      (function goAts(tries) {
        if (window.ATS && typeof window.ATS.showMaster === 'function') {
          if (window.ATS.activeTab === 'registration') window.ATS.showMaster('candidates');
          return;
        }
        if (tries > 0) setTimeout(function() { goAts(tries - 1); }, 50);
      })(40);
    }

    /* ── Load failure / recovery (no eternal spinner) + service-worker self-heal ── */
    function gpClearCachesAndReload() {
      // Force-evict a stale service worker + caches, then reload once. Self-healing
      // for the "stuck on an old cached page after a deploy" case.
      var done = function() {
        try { sessionStorage.setItem('gp_ceo_forced_fresh', '1'); } catch (e) {}
        window.location.reload();
      };
      try {
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).catch(function() {}));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }).catch(function() {}));
        }
        Promise.all(jobs).then(done, done);
        setTimeout(done, 1500); // hard fallback so the button always recovers
      } catch (e) { done(); }
    }

    function renderLoadError(message) {
      var c = document.getElementById('mainContent');
      if (!c) return;
      c.innerHTML =
        '<div class="page-error">' +
          '<div class="pe-icon">&#x26A0;&#xFE0F;</div>' +
          '<div class="pe-title">Dashboard didn’t load</div>' +
          '<div class="pe-msg">' + esc(message || 'Something went wrong while loading the dashboard.') +
            ' This can happen right after an update when your browser is holding an old copy of the page.</div>' +
          '<div class="pe-actions">' +
            '<button class="btn btn-blue" onclick="ceoRetryLoad()">Try again</button>' +
            '<button class="btn" onclick="gpClearCachesAndReload()">Force refresh (clear cache)</button>' +
          '</div>' +
        '</div>';
    }

    function ceoRetryLoad() {
      var c = document.getElementById('mainContent');
      if (c) c.innerHTML =
        '<div class="page-loading"><div class="spinner"></div>' +
        '<div class="loading-text">Loading dashboard…</div></div>';
      refreshDashboard();
      refreshTrends();
    }

    // Proactively pull a newer service worker (no reload) so the next navigation
    // serves the fresh page. Harmless if there is no SW or no update available.
    (function gpRefreshServiceWorker() {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function(reg) {
            if (reg && reg.update) { try { reg.update(); } catch (e) {} }
          }).catch(function() {});
        }
      } catch (e) {}
    })();

    /* ── Toast ── */
    // Toasts stack downward with no bound of their own, so a caller that fires the
    // same message N times paints a column that runs off the screen and hides the
    // page behind it (seen 2026-08-17: a stacked listener in the Social tab fired
    // 16 "Approved" toasts from one click). The stacking bug is fixed at source, but
    // a notification strip must never be able to take the screen over, so: collapse
    // a repeat of the message already on screen into a "xN" counter, and hard-cap
    // how many can be visible at once, dropping the oldest.
    var TOAST_MAX_VISIBLE = 4;
    function showToast(msg, type) {
      var c = document.getElementById('toastContainer');
      if (!c) return;
      var text = String(msg == null ? '' : msg);

      var live = c.querySelectorAll('.toast:not(.removing)');
      var last = live.length ? live[live.length - 1] : null;
      if (last && last.getAttribute('data-toast-msg') === text) {
        var n = (Number(last.getAttribute('data-toast-count')) || 1) + 1;
        last.setAttribute('data-toast-count', String(n));
        last.textContent = text + ' ×' + n;
        return;
      }

      while (live.length >= TOAST_MAX_VISIBLE) {
        var oldest = live[0];
        if (oldest && oldest.parentNode) oldest.parentNode.removeChild(oldest);
        live = c.querySelectorAll('.toast:not(.removing)');
      }

      var t = document.createElement('div');
      t.className = 'toast ' + (type || 'info');
      t.setAttribute('data-toast-msg', text);
      t.setAttribute('data-toast-count', '1');
      t.textContent = text;
      c.appendChild(t);
      setTimeout(function() {
        t.classList.add('removing');
        setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
      }, 3000);
    }
