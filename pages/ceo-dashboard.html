      if (ev) { ev.stopPropagation(); }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: status }
      }).then(function(d) {
        if (d && d.ok) {
          var labels = { completed: 'completed', in_progress: 'started', waiting: 'set to waiting', waiting_on_external: 'set to waiting on external', waiting_on_gp: 'set to waiting on GP', waiting_on_practice: 'set to waiting on practice' };
          showToast('Task ' + (labels[status] || 'updated'), 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Escalate a GP task to the CEO. No existing CEO-page "escalate to CEO" flow exists
    // (resolveEscalation/respondEscalation handle the inbound direction), so use the
    // documented PUT /api/admin/task escalation shape: status escalated + escalated_to
    // 'CEO' + escalated_reason from a prompt. The server records escalated_by/_at.
    function ceoGpTaskEscalate(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var reason = prompt('Escalate this task to the CEO — reason:');
      if (reason === null) return; // cancelled
      reason = reason.trim();
      if (!reason) { showToast('A reason is required to escalate', 'error'); return; }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: 'escalated', escalated_to: 'CEO', escalated_reason: reason }
      }).then(function(d) {
        if (d && d.ok) {
          showToast('Task escalated to CEO', 'success');
          refreshGpDetailTasks();
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Resolve an email-triage task (port of admin's data-resolve-email handler, 6029–6056).
    // Checks for a Gmail reply first via POST /api/admin/email-triage/check-reply; only marks
    // the task complete when the GP/RSO has actually replied, otherwise surfaces the inline
    // "reply via Gmail before resolving" error. Reuses ceoGpTaskAction for the completion so the
    // refresh/re-render path is identical to every other task action. NO email is sent here.
    function ceoResolveEmailTask(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      // Either the et-panel "✓ Mark Resolved" button or the dropdown "✓ Mark Complete" item can
      // start this flow; capture whichever was clicked so its original label restores on failure.
      var resolveBtn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-resolve-email],[data-complete-task]') : null;
      var origText = resolveBtn ? resolveBtn.textContent : '';
      var errorEl = document.getElementById('et-error-' + taskId);
      if (resolveBtn) { resolveBtn.disabled = true; resolveBtn.textContent = 'Checking…'; }
      if (errorEl) errorEl.style.display = 'none';
      apiFetch('/api/admin/email-triage/check-reply', {
        method: 'POST',
        body: { taskId: taskId }
      }).then(function(d) {
        if (d && d.ok && d.replied) {
          // Replied — complete the task. ceoGpTaskAction handles toast + refresh/re-render.
          ceoGpTaskAction(ev, taskId, 'completed');
        } else {
          if (errorEl) errorEl.style.display = 'inline-block';
          if (resolveBtn) { resolveBtn.textContent = origText; resolveBtn.disabled = false; }
        }
      }).catch(function(e) {
        if (errorEl) errorEl.style.display = 'inline-block';
        if (resolveBtn) { resolveBtn.textContent = origText; resolveBtn.disabled = false; }
      });
    }

    // Generate an AI-suggested reply for an email-triage task (port of admin's data-generate-reply
    // handler, 5995–6026) via POST /api/admin/email-triage/suggest-reply. On success reveals the
    // reply textarea, fills it, and persists open+reply state in gpEmailPanels so a Tasks re-render
    // keeps the panel open with the generated text. NO email is sent — this only drafts a reply.
    // Mirrors admin.html's renderRsoNotes: what the AI flagged for the RSO renders beside the
    // composer, never inside it — a doctor once received "[RSO: please check the cc field…]"
    // because the draft wrote it into the email body.
    function ceoRenderRsoNotes(box, notes) {
      if (!box) return;
      var list = (Array.isArray(notes) ? notes : (notes ? [notes] : [])).map(function(n) { return String(n || '').trim(); }).filter(Boolean);
      if (!list.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
      box.innerHTML = '<div style="font-weight:700;margin-bottom:4px">Check before sending — not part of the email</div>'
        + '<ul style="margin:0;padding-left:16px">' + list.map(function(n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
      box.style.display = 'block';
    }

    function ceoGenerateEmailReply(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var btn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-generate-reply]') : null;
      if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
      apiFetch('/api/admin/email-triage/suggest-reply', {
        method: 'POST',
        body: { taskId: taskId }
      }).then(function(d) {
        if (d && d.ok && d.suggestedReply) {
          var replyWrap = document.getElementById('et-reply-wrap-' + taskId);
          var replyArea = document.getElementById('et-reply-' + taskId);
          if (replyWrap) replyWrap.style.display = 'block';
          if (replyArea) replyArea.value = d.suggestedReply;
          ceoRenderRsoNotes(document.getElementById('et-rso-notes-' + taskId), d.rsoNotes);
          if (btn) btn.textContent = '✓ Reply Generated';
          if (!gpEmailPanels[taskId]) gpEmailPanels[taskId] = {};
          gpEmailPanels[taskId].open = true;
          gpEmailPanels[taskId].reply = d.suggestedReply;
        } else {
          if (btn) { btn.textContent = 'Failed — try again'; btn.disabled = false; }
        }
      }).catch(function(e) {
        if (btn) { btn.textContent = 'Error — try again'; btn.disabled = false; }
      });
    }

    // Copy the generated reply to the clipboard (port of admin's data-copy-reply handler,
    // 6059–6069). Flashes "✓ Copied!" on the button, then restores its label.
    function ceoCopyEmailReply(ev, taskId) {
      if (ev) { ev.stopPropagation(); }
      var copyArea = document.getElementById('et-reply-' + taskId);
      var btn = (ev && ev.target && ev.target.closest) ? ev.target.closest('[data-copy-reply]') : null;
      if (copyArea && copyArea.value && navigator.clipboard) {
        navigator.clipboard.writeText(copyArea.value).then(function() {
          if (btn) { btn.textContent = '✓ Copied!'; setTimeout(function() { btn.textContent = 'Copy to Clipboard'; }, 2000); }
        });
      }
    }

    // Pure mirrors of lib/ceo-metrics.js (the authoritative, unit-tested contracts).
    // gpNotesFromTimeline: notes = timeline entries with event_type 'note', newest first.
    function gpNotesFromTimeline(timeline) {
      return (timeline || [])
        .filter(function(e) { return e && e.event_type === 'note'; })
        .slice()
        .sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }
    // mergeGpTimeline: timeline events + comms messages into one newest-first stream,
    // each tagged with kind ('event' | 'message') for icon/layout selection.
    function mergeGpTimeline(timeline, messages) {
      var merged = [];
      (timeline || []).forEach(function(e) { if (e) merged.push(Object.assign({}, e, { kind: 'event' })); });
      (messages || []).forEach(function(m) { if (m) merged.push(Object.assign({}, m, { kind: 'message' })); });
      return merged.sort(function(a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
    }

    // Render the open GP file's notes: an inline add-note composer (ceoAddGpNote →
    // POST /api/admin/case/note?id=, same endpoint as admin's addCaseNote) followed
    // by the cached note timeline entries, newest first.
    function renderGpNotesTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var notes = gpNotesFromTimeline((gpDetailCache && gpDetailCache.timeline) || []);
      var html = '<div class="ceo-ops-section-head">Notes <span class="count">' + notes.length + '</span></div>';
      // Inline "add a note" composer (files a case-level note via the same path as the
      // header Add Note button) — admin parity, so the CEO can jot a note in context.
      html += '<div style="display:flex;gap:8px;margin:10px 0 16px;align-items:flex-start">';
      html += '<textarea id="ceoNoteAddText" rows="2" placeholder="Add a note about this GP…" style="flex:1;background:var(--bg-elevated);border:1px solid var(--panel-border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;box-sizing:border-box;font-family:inherit"></textarea>';
      html += '<button class="btn btn-blue" id="ceoNoteAddBtn" onclick="ceoAddGpNote()">Add note</button>';
      html += '</div>';
      if (!notes.length) {
        html += '<div class="ceo-gp-detail-empty">No notes for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        var body = n.detail || n.title || '';
        html += '<div class="ceo-gp-note">';
        html += '<div class="ceo-gp-note-body">' + esc(body) + '</div>';
        html += '<div class="ceo-gp-note-meta">';
        if (n.actor) html += '<span class="ceo-gp-note-actor">' + esc(n.actor) + '</span>';
        html += '<span class="ceo-gp-note-time">' + esc(fmtCallTime(n.created_at)) + '</span>';
        html += '</div>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Icon for a merged timeline entry, by message channel or event_type.
    function gpTimelineIcon(e) {
      if (e.kind === 'message') {
        var ch = (e.channel || '').toLowerCase();
        if (ch === 'sms') return '💬';        // speech balloon
        if (ch === 'whatsapp') return '📱';   // mobile phone
        if (ch === 'call' || ch === 'voice') return '📞'; // telephone receiver
        return '✉️';                           // envelope (email/default)
      }
      var et = (e.event_type || '').toLowerCase();
      if (et === 'note') return '📝';          // memo
      if (et === 'stage_change') return '🚩';  // triangular flag
      if (et === 'task_completed') return '✅';      // check mark
      if (et === 'task_created') return '➕';        // heavy plus
      if (et === 'blocker' || et === 'blocked') return '⛔'; // no entry
      return '•';                                   // bullet
    }

    // Render the merged GP timeline (events + comms messages), newest first (read-only).
    function renderGpTimelinePane(events) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var html = '<div class="ceo-ops-section-head">Timeline <span class="count">' + events.length + '</span></div>';
      if (!events.length) {
        html += '<div class="ceo-gp-detail-empty">No timeline activity for this GP yet.</div>';
        pane.innerHTML = html;
        return;
      }
      for (var i = 0; i < events.length; i++) {
        var e = events[i];
        var title, sub, who;
        if (e.kind === 'message') {
          var dir = (e.direction === 'inbound') ? 'In' : 'Out';
          title = (e.subject ? esc(e.subject) : esc((e.channel || 'message') + ' ' + dir.toLowerCase()));
          sub = e.body_text ? esc(String(e.body_text).slice(0, 160)) : '';
          who = e.sender || e.recipient || '';
        } else {
          title = esc(e.title || (e.event_type || 'event').replace(/_/g, ' '));
          sub = e.detail ? esc(e.detail) : '';
          who = e.actor || '';
        }
        html += '<div class="ceo-gp-tl-row">';
        html += '<span class="ceo-gp-tl-icon">' + gpTimelineIcon(e) + '</span>';
        html += '<div class="ceo-gp-tl-main">';
        html += '<div class="ceo-gp-tl-title">' + title + '</div>';
        if (sub) html += '<div class="ceo-gp-tl-sub">' + sub + '</div>';
        if (who) html += '<div class="ceo-gp-tl-who">' + esc(who) + '</div>';
        html += '</div>';
        html += '<span class="ceo-gp-tl-time">' + esc(fmtCallTime(e.created_at)) + '</span>';
        html += '</div>';
      }
      pane.innerHTML = html;
    }

    // Timeline sub-tab: fetch the full case timeline + comms once (cached per GP file),
    // merge + sort newest-first, and render. Read-only.
    function renderGpTimelineTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpTimelineCache && gpTimelineCache.caseId === caseId) {
        renderGpTimelinePane(gpTimelineCache.events);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpTimeline(caseId);
    }

    // Fetch GET /api/admin/case/timeline?id=<caseId>, merge timeline[]+messages[], cache, render.
    function loadGpTimeline(caseId) {
      apiFetch('/api/admin/case/timeline?id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Failed to load timeline: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var events = mergeGpTimeline(d.timeline || [], d.messages || []);
        gpTimelineCache = { caseId: caseId, events: events };
        if (gpDetailTab === 'timeline') renderGpTimelinePane(events);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Timeline</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Pure mirror of lib/ceo-metrics.js gpDocumentSections (the authoritative,
    // unit-tested contract): normalize the four document categories into a fixed-order
    // list of { key, label, docs }, keeping empty categories, preserving doc order, and
    // normalizing each doc to { label, status, url, fileName, updatedAt } (primary field
    // then admin alias).
    var GP_DOCUMENT_CATEGORIES = [
      { key: 'directToAhpra', label: 'Direct to AHPRA' },
      { key: 'preparedByCandidate', label: 'Prepared by Candidate' },
      { key: 'preparedByGpLink', label: 'Prepared by GP LINK' },
      { key: 'otherFiles', label: 'Other Files' }
    ];
    function gpDocumentSections(documents) {
      var src = documents || {};
      return GP_DOCUMENT_CATEGORIES.map(function(cat) {
        var list = Array.isArray(src[cat.key]) ? src[cat.key] : [];
        var docs = list.filter(function(d) { return !!d; }).map(function(d) {
          return {
            key: (d.key != null && d.key !== '') ? d.key : (d.document_key || ''),
            label: (d.label != null && d.label !== '') ? d.label : (d.document_key || ''),
            status: (d.status != null && d.status !== '') ? d.status : (d.ops_status || null),
            url: d.file_url || d.webViewLink || null,
            fileName: d.file_name || d.name || null,
            updatedAt: d.updated_at || null
          };
        });
        return { key: cat.key, label: cat.label, docs: docs };
      });
    }

    // Inline mirrors of lib/ceo-metrics.js docTaskForKey + docActionsFor (3c.1).
    // The actionable practice-pack task for a document key (most recent non-terminal
    // one), or null. Tasks arrive created_at.desc, so the first non-completed/cancelled
    // match is the newest open task. Used to attach document controls to GP LINK doc rows.
    function docTaskForKey(tasks, docKey) {
      if (!docKey) return null;
      var matches = [];
      for (var i = 0; i < (tasks || []).length; i++) {
        var t = tasks[i];
        if (t && t.task_type === 'practice_pack_child' && t.related_document_key === docKey) matches.push(t);
      }
      if (!matches.length) return null;
      for (var j = 0; j < matches.length; j++) {
        var s = matches[j].status;
        if (s !== 'completed' && s !== 'cancelled') return matches[j];
      }
      return matches[0];
    }

    // Which document actions are available for a task, mirroring admin.html gating
    // (pages/admin.html ~1725). Upload is offered for the two uploadable pack docs;
    // approve when an attachment is present; request-revision for auto-received docs.
    function docActionsFor(task) {
      var key = task && task.related_document_key;
      var canUpload = key === 'offer_contract' || key === 'supervisor_cv';
      var hasAttachment = !!(task && (task.attachment_url || task.zoho_attachment_id));
      var autoReceived = !!(task && task.gmail_message_id && task.attachment_url);
      return { upload: canUpload, approve: hasAttachment, requestRevision: autoReceived };
    }

    // Attribute-safe escape (CEO esc() doesn't escape quotes; attribute values need it).
    function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
    // Document status label + small helpers (port of admin.html docStatusLabel/driveFileIcon/
    // formatFileSize/gpDocThumbError) so the CEO Documents tab matches the RSO/admin view.
    function docStatusLabel(status) {
      var map = { pending: 'Pending', requested: 'Requested', uploaded: 'Uploaded', under_review: 'Under Review', approved: 'Approved', accepted: 'Accepted', rejected: 'Rejected', action_required: 'Action Required', not_requested: 'Not Requested', awaiting_practice: 'Awaiting Practice', awaiting_gp: 'Awaiting GP', received: 'Received', needs_correction: 'Needs Correction', ready_for_gp: 'Ready', completed: 'Completed' };
      return map[status] || status || 'Pending';
    }
    function driveFileIcon(mime) {
      if (!mime) return '📄';
      if (mime.indexOf('pdf') > -1) return '📄';
      if (mime.indexOf('image') > -1) return '🖼️';
      if (mime.indexOf('spreadsheet') > -1 || mime.indexOf('excel') > -1 || mime.indexOf('csv') > -1) return '📊';
      if (mime.indexOf('document') > -1 || mime.indexOf('word') > -1) return '📃';
      return '📄';
    }
    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '';
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1048576) return Math.round(bytes / 1024) + 'KB';
      return (bytes / 1048576).toFixed(1) + 'MB';
    }
    // Thumbnail load failed (e.g. PDF has no inline image) → swap to a file icon.
    function gpDocThumbError(img) {
      if (!img || !img.parentNode) return;
      var d = document.createElement('div');
      d.className = 'ceo-doc-thumb ceo-doc-thumb-icon';
      d.textContent = '📄';
      img.parentNode.replaceChild(d, img);
    }

    // In-app document viewer (blob → modal), reusing the CEO modal. Used by clickable
    // candidate-document cards (data-doc-view-url).
    var _ceoDocViewerObjUrl = null;
    function ceoOpenDocViewer(fetchUrl, title) {
      if (!fetchUrl) return;
      var html = '<div class="modal-title">' + esc(title || 'Document') + '</div>';
      html += '<div id="ceoDocViewerBox" style="min-height:140px;max-height:62vh;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;padding:8px"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div></div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
      openModal(html);
      if (_ceoDocViewerObjUrl) { URL.revokeObjectURL(_ceoDocViewerObjUrl); _ceoDocViewerObjUrl = null; }
      fetch(fetchUrl, { credentials: 'same-origin' }).then(function(resp) {
        var box = document.getElementById('ceoDocViewerBox');
        if (!box) return;
        if (!resp.ok) { return resp.json().catch(function() { return {}; }).then(function(dj) { box.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:24px">' + esc(dj.message || 'No document is stored for this slot yet.') + '</div>'; }); }
        return resp.blob().then(function(blob) {
          _ceoDocViewerObjUrl = URL.createObjectURL(blob);
          if ((blob.type || '').indexOf('image/') === 0) box.innerHTML = '<img alt="Document" src="' + _ceoDocViewerObjUrl + '" style="max-width:100%;max-height:58vh;object-fit:contain">';
          else box.innerHTML = '<iframe title="Document" src="' + _ceoDocViewerObjUrl + '" style="width:100%;height:58vh;border:none;background:#fff"></iframe>';
        });
      }).catch(function(e) { var box = document.getElementById('ceoDocViewerBox'); if (box) box.innerHTML = '<div style="color:var(--red);font-size:13px;padding:24px">Could not load the document: ' + esc(e.message) + '</div>'; });
    }
    // Drive file preview (Drive embed in the CEO modal). Used by Drive-backed cards
    // (data-drive-preview) — GP LINK pack docs + Other Files.
    function ceoOpenDrivePreview(fileId, name, mime, link) {
      if (!fileId) return;
      var previewUrl = 'https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/preview';
      var safeLink = link ? ceoSafeUrl(link) : '';
      var body;
      if ((mime || '').indexOf('image') > -1 && safeLink && safeLink !== '#') body = '<img src="' + escAttr(safeLink) + '" alt="' + escAttr(name) + '" style="max-width:100%;max-height:62vh;object-fit:contain">';
      else body = '<iframe src="' + escAttr(previewUrl) + '" style="width:100%;height:62vh;border:none;background:#fff" allow="autoplay"></iframe>';
      var html = '<div class="modal-title" style="display:flex;align-items:center;gap:10px">' + esc(name || 'Document');
      if (safeLink && safeLink !== '#') html += '<a href="' + escAttr(safeLink) + '" target="_blank" rel="noopener" style="margin-left:auto;font-size:12px;color:var(--blue)">Open in Drive</a>';
      html += '</div><div style="margin-top:8px">' + body + '</div>';
      html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>';
      openModal(html);
    }

    // A "Prepared by Candidate" document card: thumbnail + status/flag badge, clickable to
    // open the uploaded file in-app (port of admin renderDocPlaceholderCard).
    function renderCeoCandidateDocCard(doc, caseId) {
      var status = doc.status;
      var viewable = caseId && (!!doc.file_url || ['approved', 'uploaded', 'under_review', 'rejected', 'accepted', 'received', 'needs_correction'].indexOf(status) >= 0);
      var previewUrl = viewable ? ('/api/admin/gp-document-preview?case_id=' + encodeURIComponent(caseId) + '&key=' + encodeURIComponent(doc.key)) : '';
      var viewAttrs = viewable ? (' data-doc-view-url="' + escAttr(previewUrl) + '" data-doc-view-label="' + escAttr(doc.label || 'Document') + '"') : '';
      var thumb = viewable ? ('<img src="' + escAttr(previewUrl) + '" class="ceo-doc-thumb" alt="" onerror="gpDocThumbError(this)">') : '<div class="ceo-doc-thumb ceo-doc-thumb-icon">📄</div>';
      var meta = '';
      if (doc.file_name) meta += '<div class="ceo-doc-card-meta">' + esc(doc.file_name) + '</div>';
      if (doc.updated_at) meta += '<div class="ceo-doc-card-meta">' + esc(relativeTime(doc.updated_at)) + '</div>';
      var badge;
      if (doc.flag_reason === 'name_change' || doc.flag_reason === 'name_mismatch') badge = '<span class="ceo-doc-status s-under_review">Name change</span>';
      else if (doc.flag_reason === 'failed_verification') badge = '<span class="ceo-doc-status s-under_review">Needs review</span>';
      else badge = '<span class="ceo-doc-status s-' + (status || 'pending') + '">' + docStatusLabel(status) + '</span>';
      // File a document the doctor sent by email/WhatsApp straight into its slot, instead
      // of asking them to re-upload — same control (and same endpoints) as the RSO console.
      // A REJECTED slot is not a dead end: uploading over it clears the rejection.
      var hasFile = !!doc.file_name || !!doc.file_url;
      var upTitle = (status === 'rejected' || status === 'needs_correction')
        ? 'Upload a replacement for the candidate — this clears the rejection and marks the document approved'
        : (hasFile ? 'Replace this document for the candidate' : 'Upload this document for the candidate');
      var upHtml = caseId
        ? ('<label class="btn ceo-doc-upload-btn ceo-doc-card-upload" title="' + escAttr(upTitle) + '">' + (hasFile ? '↑ Replace' : '+ Upload')
          + '<input type="file" data-ceo-candidate-doc-upload="' + escAttr(doc.key || '') + '" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic" style="display:none"></label>')
        : '';
      return '<div class="ceo-doc-card' + (viewable ? ' is-clickable' : '') + '"' + viewAttrs + '>' + thumb +
        '<div class="ceo-doc-card-info"><div class="ceo-doc-card-label" title="' + escAttr(doc.label || '') + '">' + esc(doc.label || '(untitled)') + '</div>' + badge + meta + upHtml + '</div></div>';
    }

    // A "Prepared by GP LINK" document card: Drive thumbnail + status, clickable to preview,
    // PLUS the CEO upload/approve/request-revision actions (gated on a matching task).
    function renderCeoGpLinkDocCard(doc) {
      var df = doc.drive_file;
      var status = doc.ops_status || 'not_requested';
      var thumb;
      if (df && df.thumbnailLink) thumb = '<img src="' + escAttr(df.thumbnailLink) + '" class="ceo-doc-thumb" alt="" onerror="gpDocThumbError(this)">';
      else if (df) thumb = '<div class="ceo-doc-thumb ceo-doc-thumb-icon">' + driveFileIcon(df.mimeType) + '</div>';
      else thumb = '<div class="ceo-doc-thumb ceo-doc-thumb-icon">📄</div>';
      var meta = '';
      if (df) { var size = df.size ? formatFileSize(Number(df.size)) : ''; meta = '<div class="ceo-doc-card-meta">' + esc(size) + (size ? ' • ' : '') + esc(df.modifiedTime ? relativeTime(df.modifiedTime) : '') + '</div>'; }
      var driveAttrs = df ? (' data-drive-preview="' + escAttr(df.id) + '" data-drive-name="' + escAttr(df.name) + '" data-drive-mime="' + escAttr(df.mimeType || '') + '" data-drive-link="' + escAttr(df.webViewLink || '') + '"') : '';
      var task = docTaskForKey((gpDetailCache && gpDetailCache.tasks) || [], doc.key);
      var actionsHtml = '';
      if (task) {
        var acts = docActionsFor(task);
        var tid = escAttr(task.id);
        if (acts.upload) actionsHtml += '<label class="btn ceo-doc-upload-btn">Upload<input type="file" data-ceo-doc-upload="' + tid + '" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.heic" style="display:none"></label>';
        if (acts.approve) actionsHtml += '<button class="btn btn-green" data-ceo-doc-action="approve" data-task="' + tid + '">Approve</button>';
        if (acts.requestRevision) actionsHtml += '<button class="btn" data-ceo-doc-action="revise" data-task="' + tid + '">Revision</button>';
      }
      var actionsBlock = actionsHtml ? '<div class="ceo-doc-card-actions">' + actionsHtml + '</div>' : '';
      return '<div class="ceo-doc-card' + (df ? ' is-clickable' : '') + '"' + driveAttrs + '>' + thumb +
        '<div class="ceo-doc-card-info"><div class="ceo-doc-card-label" title="' + escAttr(doc.label || '') + '">' + esc(doc.label || '') + '</div><span class="ceo-doc-status s-' + status + '">' + docStatusLabel(status) + '</span>' + meta + actionsBlock + '</div></div>';
    }

    // Render the four document categories for the open GP file, matching the admin/RSO view:
    // AHPRA as a done/total checklist (with reference numbers), Candidate + GP LINK as
    // thumbnail card grids (click to open in-app), Other Files as a Drive thumbnail grid.
    // Renders from the RAW /api/admin/gp-documents response (the four category arrays).
    function renderGpDocumentsPane(gpDocs, driveFolder) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      gpDocs = gpDocs || {};
      var docCaseId = gpDetailCache && gpDetailCache.caseId;
      var ahpra = gpDocs.directToAhpra || [];
      var candidate = gpDocs.preparedByCandidate || [];
      var gplink = gpDocs.preparedByGpLink || [];
      var other = gpDocs.otherFiles || [];
      var total = ahpra.length + candidate.length + gplink.length + other.length;

      var html = '<div class="ceo-ops-section-head">Documents <span class="count">' + total + '</span>';
      if (docCaseId) html += '<label class="btn ceo-doc-upload-btn" style="margin-left:auto">Upload file…<input type="file" data-ceo-drive-upload="' + escAttr(docCaseId) + '" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.heic,.txt,.csv" style="display:none"></label>';
      if (driveFolder) html += '<a class="ceo-gp-drive-link" href="' + escAttr(driveFolder) + '" target="_blank" rel="noopener" style="margin-left:' + (docCaseId ? '12px' : 'auto') + '">Open Drive folder</a>';
      html += '</div>';

      // Section 0 — Identity document (CEO-only; server omits this field entirely
      // for RSOs/staff, so this section simply never renders for them).
      if (gpDocs.identityDocument) {
        var idDoc = gpDocs.identityDocument;
        var idGpUserId = (gpDetailCache && gpDetailCache.case && gpDetailCache.case.user_id) || '';
        html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Identity document</span></div>';
        html += '<div class="ceo-doc-checklist"><div class="ceo-doc-check-item">';
        html += '<span class="ceo-doc-check-label" style="flex:1">' + esc(idDoc.file_name || 'Identity document') + '</span>';
        html += '<a class="ceo-gp-drive-link" href="' + escAttr(idDoc.view_url) + '" target="_blank" rel="noopener">View</a>';
        if (idGpUserId) html += '<button type="button" class="btn btn-red" style="margin-left:8px" onclick="ceoDeleteIdentityDoc(event, \'' + esc(idGpUserId) + '\')">Delete ID</button>';
        html += '</div></div></div>';
      }

      // Section 1 — Direct to AHPRA (checklist).
      var ahpraDone = ahpra.filter(function(d) { return d.status !== 'pending'; }).length;
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Direct to AHPRA</span><span class="ceo-doc-section-count">' + ahpraDone + ' / ' + ahpra.length + '</span></div>';
      if (!ahpra.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else {
        html += '<div class="ceo-doc-checklist">';
        ahpra.forEach(function(doc) {
          var done = doc.status !== 'pending';
          html += '<div class="ceo-doc-check-item"><div class="ceo-doc-check' + (done ? ' checked' : '') + '">✓</div>';
          html += '<span class="ceo-doc-check-label">' + esc(doc.label || doc.document_key || '');
          if (doc.key === 'criminal_history' && doc.referenceNumber) html += '<span class="ceo-doc-refno">' + esc(doc.referenceNumber) + '</span>';
          html += '</span>';
          if (docCaseId && (doc.file_url || doc.file_name)) {
            var dtaPrev = '/api/admin/gp-document-preview?case_id=' + encodeURIComponent(docCaseId) + '&key=' + encodeURIComponent(doc.key);
            html += '<button type="button" data-doc-view-url="' + escAttr(dtaPrev) + '" data-doc-view-label="' + escAttr(doc.label || 'Document') + '" style="margin-right:8px;font-size:11px;padding:2px 8px;border:1px solid var(--border,#e2e8f0);border-radius:4px;background:#fff;cursor:pointer">View</button>';
          }
          html += '<span class="ceo-doc-status s-' + (doc.status || 'pending') + '">' + docStatusLabel(doc.status) + '</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      // Section 2 — Prepared by Candidate (card grid, click to open).
      var candDone = candidate.filter(function(d) { return d.status !== 'pending'; }).length;
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Prepared by Candidate</span><span class="ceo-doc-section-count">' + candDone + ' / ' + candidate.length + '</span></div>';
      if (!candidate.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else { html += '<div class="ceo-doc-grid">'; candidate.forEach(function(doc) { html += renderCeoCandidateDocCard(doc, docCaseId); }); html += '</div>'; }
      html += '</div>';

      // Section 3 — Prepared by GP LINK (card grid + CEO actions).
      var gplinkDone = gplink.filter(function(d) { return d.ops_status === 'completed' || d.ops_status === 'ready_for_gp'; }).length;
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Prepared by GP LINK</span><span class="ceo-doc-section-count">' + gplinkDone + ' / ' + gplink.length + '</span></div>';
      if (!gplink.length) html += '<div class="ceo-gp-doc-empty">No documents in this category.</div>';
      else { html += '<div class="ceo-doc-grid">'; gplink.forEach(function(doc) { html += renderCeoGpLinkDocCard(doc); }); html += '</div>'; }
      html += '</div>';

      // Section 4 — Other Files (Drive thumbnail grid).
      html += '<div class="ceo-doc-section"><div class="ceo-doc-section-head"><span class="ceo-doc-section-title">Other Files</span><span class="ceo-doc-section-count">' + other.length + '</span></div>';
      if (!other.length) html += '<div class="ceo-gp-doc-empty">No files in this category.</div>';
      else {
        html += '<div class="ceo-doc-grid">';
        other.forEach(function(f) {
          var icon = driveFileIcon(f.mimeType);
          var thumb = f.thumbnailLink ? '<img src="' + escAttr(f.thumbnailLink) + '" class="ceo-doc-thumb" alt="" onerror="gpDocThumbError(this)">' : '<div class="ceo-doc-thumb ceo-doc-thumb-icon">' + icon + '</div>';
          var size = f.size ? formatFileSize(Number(f.size)) : '';
          html += '<div class="ceo-doc-card is-clickable" data-drive-preview="' + escAttr(f.id) + '" data-drive-name="' + escAttr(f.name) + '" data-drive-mime="' + escAttr(f.mimeType || '') + '" data-drive-link="' + escAttr(f.webViewLink || '') + '">' + thumb +
            '<div class="ceo-doc-card-info"><div class="ceo-doc-card-label" title="' + escAttr(f.name) + '">' + esc(f.name) + '</div><div class="ceo-doc-card-meta">' + esc(size) + (size ? ' • ' : '') + esc(f.modifiedTime ? relativeTime(f.modifiedTime) : '') + '</div></div></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      pane.innerHTML = html;
    }

    // Documents sub-tab: fetch the GP documents once (cached per GP file), normalize
    // into the four sections, and render. Read-only.
    function renderGpDocumentsTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpDocumentsCache && gpDocumentsCache.caseId === caseId) {
        renderGpDocumentsPane(gpDocumentsCache.raw, gpDocumentsCache.driveFolder);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpDocuments(caseId);
    }

    // Fetch GET /api/admin/gp-documents?case_id=<caseId>, normalize, cache, render.
    function loadGpDocuments(caseId) {
      gpSwr('/api/admin/gp-documents?case_id=' + encodeURIComponent(caseId), function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Failed to load documents: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        // /api/admin/gp-documents returns the four category arrays FLAT at the top level
        // ({ ok, country, directToAhpra, preparedByCandidate, preparedByGpLink, otherFiles }).
        // Cache + render the RAW response so the per-category cards keep their full fields
        // (drive_file/thumbnailLink/file_url/referenceNumber/flag_reason/ops_status).
        gpDocumentsCache = { caseId: caseId, raw: d, driveFolder: d.driveFolder || null };
        if (gpDetailTab === 'documents') renderGpDocumentsPane(d, gpDocumentsCache.driveFolder);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Documents</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // GP Documents action: upload a file for a GP LINK pack document (offer_contract /
    // supervisor_cv). Reuses the unchanged POST /api/admin/va/task/upload-document
    // (super-admin passes its requireAdminSession). file_data is a base64 data URL via
    // FileReader.readAsDataURL, matching how admin.html uploads. Body is passed as an
    // object so apiFetch JSON-stringifies it and sets Content-Type: application/json.
    function ceoDocUpload(taskId, inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        apiFetch('/api/admin/va/task/upload-document', {
          method: 'POST',
          body: { task_id: taskId, file_data: reader.result, file_name: file.name }
        }).then(function(d) {
          if (!d || !d.ok) { showToast((d && d.message) || 'Upload failed', 'error'); return; }
          showToast('Document uploaded', 'success');
          refreshGpDocsAndTasks();
        }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
      };
      reader.readAsDataURL(file);
    }

    // GP Documents action: approve the document and send it to the GP. Reuses the
    // unchanged POST /api/admin/va/task/approve-document.
    function ceoDocApprove(taskId) {
      if (!confirm('Approve this document and send it to the GP?')) return;
      apiFetch('/api/admin/va/task/approve-document', {
        method: 'POST',
        body: { task_id: taskId }
      }).then(function(d) {
        if (!d || !d.ok) { showToast((d && d.message) || 'Approval failed', 'error'); return; }
        showToast('Approved & sent', 'success');
        refreshGpDocsAndTasks();
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
    }

    // GP Documents action: create a revision-request draft in Gmail (document attached for
    // the practice) and open the draft in a new tab. Reuses the unchanged POST
    // /api/admin/va/task/request-revision.
    function ceoDocRequestRevision(taskId) {
      if (!confirm('Create a revision-request draft in Gmail? The document is attached for the practice.')) return;
      apiFetch('/api/admin/va/task/request-revision', {
        method: 'POST',
        body: { task_id: taskId }
      }).then(function(d) {
        if (d && d.ok && d.draft_url) {
          window.open(d.draft_url, '_blank', 'noopener');
          showToast('Draft created — add your note and send', 'success');
          refreshGpDocsAndTasks();
        } else {
          showToast('Error: ' + ((d && (d.message || d.error)) || 'Unknown error'), 'error');
        }
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
    }

    // GP Documents action: on-request deletion of the onboarding identity document
    // (CEO-only card, so no extra client-side role check needed — the server gate
    // is authoritative). Removes every stored copy: Supabase storage object, the
    // "identity" user_documents row, the Drive "ID — " file(s), and the legacy
    // user_profiles fields. Reuses POST /api/admin/gp-identity-delete { user_id }.
    function ceoDeleteIdentityDoc(event, gpUserId) {
      if (event) event.stopPropagation();
      if (!gpUserId) return;
      if (!confirm('Permanently delete this GP\'s stored ID document? This removes it from storage and Google Drive and cannot be undone.')) return;
      apiFetch('/api/admin/gp-identity-delete', {
        method: 'POST',
        body: { user_id: gpUserId }
      }).then(function(d) {
        if (!d || !d.ok) { showToast((d && d.message) || 'Delete failed', 'error'); return; }
        showToast('ID document deleted', 'success');
        refreshGpDocuments();
      }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
    }

    // GP Documents action: upload an arbitrary file to this GP's Google Drive folder.
    // Works for any case, independent of practice-pack tasks. Reuses the unchanged
    // POST /api/admin/drive/upload?case_id= (JSON {fileName, fileData(base64), mimeType}).
    // The uploaded file appears in the documents payload, so refresh the documents cache.
    function ceoDriveUpload(caseId, inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      if (!file || !caseId) return;
      var reader = new FileReader();
      reader.onload = function() {
        apiFetch('/api/admin/drive/upload?case_id=' + encodeURIComponent(caseId), {
          method: 'POST',
          body: { fileName: file.name, fileData: reader.result, mimeType: file.type || 'application/octet-stream' }
        }).then(function(d) {
          if (!d || !d.ok) { showToast((d && d.message) || 'Upload failed', 'error'); return; }
          showToast('File uploaded to Drive', 'success');
          if (inputEl) inputEl.value = '';
          refreshGpDocuments();
        }).catch(function(e) { showToast('Error: ' + e.message, 'error'); });
      };
      reader.readAsDataURL(file);
    }

    // File a CANDIDATE-prepared document on the doctor's behalf (staff receive these by
    // email/WhatsApp). Direct-to-Storage via a signed URL, NOT base64 in the body: these are
    // scans and a multi-MB certificate exceeds the serverless request-body limit before the
    // function runs. Same two endpoints the RSO console uses, so the two paths can't drift.
    function ceoCandidateDocUpload(docKey, inputEl) {
      var file = inputEl && inputEl.files && inputEl.files[0];
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!file || !docKey || !caseId) return;
      var label = inputEl.closest('.ceo-doc-upload-btn');
      var original = label ? label.firstChild : null;
      var originalText = original && original.nodeType === 3 ? original.nodeValue : '';
      if (original && original.nodeType === 3) original.nodeValue = 'Uploading…';
      function done(msg, kind) {
        if (original && original.nodeType === 3) original.nodeValue = originalText;
        if (inputEl) inputEl.value = '';
        if (msg) showToast(msg, kind || 'error');
      }
      // Raw fetch (not apiFetch) for the two API legs: apiFetch returns only the parsed
      // body, and the HTTP status is exactly what a useful error message needs — the
      // admin 401 body carries no message at all. gpSwrPurge is called by hand for the
      // cache invalidation apiFetch would otherwise have done on a mutation.
      function postJson(path, body) {
        gpSwrPurge();
        return fetch(path, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        }).then(function(r) {
          return r.json().catch(function() { return {}; }).then(function(d) { return { status: r.status, body: d || {} }; });
        });
      }
      function stageError(stage, res) {
        if (res.status === 401) return 'Your admin sign-in has expired — please sign in again.';
        if (res.body && res.body.message) return res.body.message;
        return stage + (res.status ? ' (' + res.status + ')' : '') + ' — please try again';
      }
      // The transfer goes straight to Storage over the open internet, and prod proxies
      // Supabase through a custom domain (~2x slower), so a big scan is a long single
      // request a flaky link can drop — which throws rather than returning a status.
      // Retry the transfer; only a 4xx is a real rejection worth surfacing immediately.
      async function putFile(uploadUrl) {
        var last = 'Upload failed';
        for (var i = 0; i < 3; i++) {
          try {
            var r = await fetch(uploadUrl, {
              method: 'PUT',
              headers: { 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'true' },
              body: file
            });
            if (r.ok) return { ok: true };
            if (r.status < 500) return { ok: false, message: 'Storage rejected the file (' + r.status + ')' };
            last = 'Storage error (' + r.status + ')';
          } catch (err) {
            console.error('[CEO] candidate doc transfer attempt ' + (i + 1) + ' failed:', err);
            last = 'The file transfer was interrupted';
          }
          if (i < 2) await new Promise(function(d) { setTimeout(d, 1500 * (i + 1)); });
        }
        return { ok: false, message: last + ' — please check your connection and try again' };
      }
      (async function() {
        try {
          var signed = await postJson('/api/admin/candidate-doc/sign-upload', { case_id: caseId, document_key: docKey });
          if (!signed.body.ok || !signed.body.uploadUrl) { done(stageError("Couldn't start the upload", signed)); return; }
          var put = await putFile(signed.body.uploadUrl);
          if (!put.ok) { done(put.message); return; }
          var fin = await postJson('/api/admin/candidate-doc/finalize', {
            case_id: caseId, document_key: docKey, file_name: file.name, mime_type: file.type || '', file_size: file.size
          });
          if (!fin.body.ok) { done(stageError("Couldn't save the document", fin)); return; }
          done('Document uploaded', 'success');
          refreshGpDocuments();
        } catch (err) {
          console.error('[CEO] candidate doc upload failed:', err);
          done('Upload failed: ' + ((err && err.message) || 'connection problem') + ' — please try again');
        }
      })();
    }

    // GP Tasks action: review a flagged / qualification-review document. Dark port of admin's
    // openReviewDocModal + submitReviewDoc — previews the uploaded doc, then Approve or Reject
    // (reject requires a note; the GP is emailed). Reuses the unchanged GET
    // /api/admin/va/task/preview-document and POST /api/admin/va/task/review-flagged-doc.
    // Look up a task in the loaded GP-detail cache by id. Defined at top-level script scope
    // so BOTH the top-level review handlers (e.g. ceoReviewFlaggedDoc) and the delegated
    // document click handler can call it. It used to be nested inside the click handler, so
    // ceoReviewFlaggedDoc threw "ReferenceError: findCeoTask is not defined" and the
    // "Review Document" button silently failed to open its modal.
    function findCeoTask(id) {
      var list = (gpDetailCache && gpDetailCache.tasks) || [];
      for (var k = 0; k < list.length; k++) { if (list[k] && list[k].id === id) return list[k]; }
      return null;
    }
    var _ceoReviewDocObjUrl = null;
    var _ceoReviewDocBlob = null; // the loaded image, for the crop sheet
    var _ceoReviewSuggested = ''; // the AI-derived note pre-filled into the box (for the reject-confirm check)

    /* Crop a document already on file. Mirrors cropReviewDocImage() in admin.html:
     * same shared crop sheet (force mode — staff can see background the detector may
     * think is fine), same endpoint, which overwrites the stored object, keeps one
     * copy of the original and updates the Drive mirror. The review decision is
     * untouched; this only changes the picture. */
    function ceoCropReviewDoc(taskId) {
      if (!taskId || !_ceoReviewDocBlob) return;
      var btn = document.getElementById('ceoReviewDocCropBtn');
      var note = document.getElementById('ceoReviewDocCropNote');
      if (!window.DocCrop) { if (note) note.textContent = 'The crop tool did not load — please refresh this page and try again.'; return; }
      var type = _ceoReviewDocBlob.type || 'image/jpeg';
      var file;
      try { file = new File([_ceoReviewDocBlob], 'document' + (/png/i.test(type) ? '.png' : '.jpg'), { type: type }); }
      catch (e) { file = _ceoReviewDocBlob; }
      window.DocCrop.prepare(file, { label: 'document', origin: 'file', force: true }).then(function (out) {
        // null = cancelled; the same object back = "Use whole photo".
        if (!out || out === file) return null;
        if (btn) btn.disabled = true;
        if (note) note.textContent = 'Saving the cropped image…';
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () { resolve({ dataUrl: String(fr.result || ''), blob: out }); };
          fr.onerror = function () { reject(new Error('could not read the cropped image')); };
          fr.readAsDataURL(out);
        });
      }).then(function (payload) {
        if (!payload) return null;
        return apiFetch('/api/admin/va/task/crop-document', {
          method: 'POST',
          body: { task_id: taskId, fileDataUrl: payload.dataUrl }
        }).then(function (d) {
          if (!d || !d.ok) throw new Error((d && d.message) || 'Could not save the crop.');
          if (_ceoReviewDocObjUrl) URL.revokeObjectURL(_ceoReviewDocObjUrl);

    // Mirrors admin.html: a task reason that describes a BROKEN automatic check ("Image

    // verbatim. Never pre-fill it with one; say plainly that the check did not run instead.

    function ceoIsTechnicalReviewReason(text) {

    function ceoReviewFlaggedDoc(taskId) {

      html += '<div id="ceoReviewDocCropBar" style="display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px">'
        + '<button type="button" class="btn" id="ceoReviewDocCropBtn" onclick="ceoCropReviewDoc(\'' + esc(taskId) + '\')" style="font-size:12px;padding:6px 12px">✂️ Crop out the background</button>'
        + '<span id="ceoReviewDocCropNote" style="font-size:11px;color:var(--text-muted)">Trims this photo down to the document and replaces the stored copy — the doctor is not asked to re-upload.</span></div>';
      html += '<div style="margin-top:10px"><label style="font-size:11px;color:var(--text-muted)">Note to GP — only sent if you reject; the email sends exactly what you type. Approve sends none.</label>';
      // Formatting toolbar: same [data-fmt] delegation pattern as admin.html — the email
      // keeps line breaks, renders **text** bold and "- " lines as dot points.
      var fmtBtn = 'background:var(--bg-elevated);border:1px solid var(--panel-border);border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--text);font-family:inherit';
      html += '<div class="fmt-toolbar" data-fmt-target="ceoReviewDocNote" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0">'
        + '<button type="button" data-fmt="bold" title="Bold the selected text" style="' + fmtBtn + ';font-weight:800">B</button>'
        + '<button type="button" data-fmt="bullet" title="Turn the selected lines into dot points" style="' + fmtBtn + '">• Dot point</button>'
        + '<span style="font-size:11px;color:var(--text-muted)">Line breaks are kept · **text** = bold · start a line with "- " for a dot point</span></div>';
      // Starts EMPTY — see _ceoReviewSuggested above. The doctor reads whatever is in here
      // verbatim, so it is written to them, not copied from the internal flag reason.
      html += '<textarea id="ceoReviewDocNote" rows="5" placeholder="Write this to the doctor: what is wrong with the document, and exactly what they need to do next. Sent as the email body, as typed. Ignored if you Approve." style="width:100%;background:var(--bg-elevated);border:1px solid var(--panel-border);border-radius:8px;color:var(--text);padding:8px;font-size:13px;resize:vertical;box-sizing:border-box"></textarea></div>';
      html += '<div id="ceoReviewDocError" style="display:none;color:var(--red);font-size:12px;margin-top:6px"></div>';

      html += '<button class="btn btn-red" id="ceoReviewDocReject" onclick="submitCeoReviewDoc(\'' + esc(taskId) + '\', \'reject\')">Reject — request re-upload</button>';

      openModal(html);
      if (_ceoReviewDocObjUrl) { URL.revokeObjectURL(_ceoReviewDocObjUrl); _ceoReviewDocObjUrl = null; }
      fetch('/api/admin/va/task/preview-document?task_id=' + encodeURIComponent(taskId), { credentials: 'same-origin' }).then(function(resp) {
        var box = document.getElementById('ceoReviewDocPreview');
        if (!box) return;
        if (!resp.ok) { return resp.json().catch(function() { return {}; }).then(function(dj) { box.innerHTML = '<div style="color:var(--red);font-size:13px;padding:24px">' + esc(dj.message || 'No document is stored for this task.') + '</div>'; }); }
        return resp.blob().then(function(blob) {

    function submitCeoReviewDoc(taskId, decision) {
      var noteEl = document.getElementById('ceoReviewDocNote');
      var err = document.getElementById('ceoReviewDocError');
      var note = noteEl ? noteEl.value.trim() : '';
      if (decision === 'reject' && !note) { if (err) { err.textContent = 'A reason is required to reject — the GP will see it.'; err.style.display = 'block'; } return; }
      if (err) err.style.display = 'none';
      // When rejecting while STILL using the suggested (AI-derived) message unedited, confirm —
      // the AI can be wrong, and the GP receives exactly this text.
      if (decision === 'reject' && _ceoReviewSuggested && note === String(_ceoReviewSuggested).trim()) {
        if (!confirm('You’re about to email the GP this suggested message and reject the document.\n\nThe AI can make mistakes — please double-check the message reads correctly and that its findings are actually right. The GP receives EXACTLY what is in the box.\n\nSend this message and reject?')) return;
      }
      var ap = document.getElementById('ceoReviewDocApprove'), rj = document.getElementById('ceoReviewDocReject');
      if (ap) ap.disabled = true; if (rj) rj.disabled = true;
      apiFetch('/api/admin/va/task/review-flagged-doc', {
        method: 'POST',
        // Approve sends NO note — the "verified" email stays clean (also enforced server-side).
        body: { task_id: taskId, decision: decision, note: decision === 'approve' ? '' : note }
      }).then(function(d) {
        if (!d || !d.ok) { if (err) { err.textContent = (d && d.message) || 'Action failed.'; err.style.display = 'block'; } if (ap) ap.disabled = false; if (rj) rj.disabled = false; return; }
        if (_ceoReviewDocObjUrl) { URL.revokeObjectURL(_ceoReviewDocObjUrl); _ceoReviewDocObjUrl = null; }
        closeModal();
        showToast(d.message || (decision === 'approve' ? 'Document approved' : 'Re-upload requested'), 'success');
        refreshGpDetailTasks();
      }).catch(function(e) { if (err) { err.textContent = 'Network error: ' + e.message; err.style.display = 'block'; } if (ap) ap.disabled = false; if (rj) rj.disabled = false; });
    }

    // Formatting-toolbar clicks (the .fmt-toolbar above the reject-note box). B wraps the
    // selection in **…**; • Dot point prefixes the selected lines with "- ". The server
    // renders that syntax in the outgoing email (bold / dot points / kept line breaks).
    document.addEventListener('click', function(e) {
      var b = e.target && e.target.closest && e.target.closest('.fmt-toolbar [data-fmt]');
      if (!b) return;
      var bar = b.closest('.fmt-toolbar');
      var ta = bar.getAttribute('data-fmt-target') ? document.getElementById(bar.getAttribute('data-fmt-target')) : null;
      if (!ta || ta.disabled) return;
      var v = ta.value, s = ta.selectionStart || 0, en = ta.selectionEnd || 0;
      if (b.getAttribute('data-fmt') === 'bold') {
        var selTxt = v.slice(s, en) || 'bold text';
        ta.value = v.slice(0, s) + '**' + selTxt + '**' + v.slice(en);
        ta.focus(); ta.setSelectionRange(s + 2, s + 2 + selTxt.length);
      } else {
        var ls = v.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
        var end = Math.max(en, ls);
        var lines = v.slice(ls, end).split('\n').map(function(l) { return /^\s*[-*•]\s/.test(l) ? l : ('- ' + l); });
        var repl = lines.join('\n');
        ta.value = v.slice(0, ls) + repl + v.slice(end);
        var caret = ls + repl.length;
        ta.focus(); ta.setSelectionRange(caret, caret);
      }
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    });

    // Render this GP file's call history newest-first. Each card shows a status pill,
    // scheduled time, assigned RSO, admin notes, a meeting summary for completed calls,
    // a Join link when a zoom_join_url is present, plus per-call actions (resend/cancel/
    // reschedule/no-show) gated by status to match admin.html. The endpoint returns calls
    // already ordered created_at.desc (newest-first).
    // Render a single call card using the existing per-call markup. Reused by both the
    // Upcoming and Past sub-tabs so the field displays + status-gated actions stay identical.
    function renderGpCallCard(c) {
      var html = '';
      var timeLabel = c.scheduled_at ? fmtCallTime(c.scheduled_at) : 'Not yet booked';
      html += '<div class="ceo-gp-call">';
      html += '<div class="ceo-gp-call-head">';

      html += '<span class="ceo-gp-call-time">' + esc(timeLabel) + '</span>';
      // F8 (audit 2026-07-20): booked-only, matching admin.html's per-GP calls
      // card. A zoom_join_url only ever exists once the Calendly webhook flips
      // the row to 'booked' (the same PATCH writes both), and a reschedule back
      // to 'invited' nulls it — so the old 'invited' branch could never fire.
      if (c.zoom_join_url && (c.status || '').toLowerCase() === 'booked') {
        html += '<a class="ceo-gp-call-join" href="' + esc(c.zoom_join_url) + '" target="_blank" rel="noopener">Join</a>';
      }
      html += '</div>';
      if (c.assigned_rso_name) {
        html += '<div class="ceo-gp-call-rso">RSO: ' + esc(c.assigned_rso_name) + '</div>';
      }
      if (c.invitee_notes) {
        html += '<div class="ceo-gp-call-notes"><span style="color:var(--text-muted);font-weight:600">GP&rsquo;s booking notes:</span> ' + esc(c.invitee_notes) + '</div>';
      }
      // GP-VISIBLE reason for the meeting — distinct tinted box, shown before the
      // internal admin notes so the two are never confused.
      if (c.meeting_reason) {
        html += '<div class="ceo-gp-call-notes" style="margin-top:8px;padding:8px 10px;background:rgba(56,139,253,0.10);border:1px solid rgba(56,139,253,0.30);border-radius:var(--radius-sm,6px)"><span style="color:var(--blue,#388bfd);font-weight:600">Reason for meeting:</span> ' + esc(c.meeting_reason) + '</div>';
      }

      }
      if (c.origin_task_id) {
        var _ot = (gpDetailCache && Array.isArray(gpDetailCache.tasks)) ? gpDetailCache.tasks.find(function(t){ return t.id === c.origin_task_id; }) : null;
        html += '<div class="ceo-gp-call-notes" style="color:var(--text-muted)">📎 Scheduled from: ' + esc(_ot && _ot.title ? _ot.title : 'GP request') + '</div>';
      }
      if ((c.status || '').toLowerCase() === 'completed' && c.meeting_summary) {
        html += '<div class="ceo-gp-call-summary"><div class="ceo-gp-call-summary-label">Meeting summary</div>' + esc(c.meeting_summary) + '</div>';
      }
      // Per-call actions, gated by status to match admin.html (the backend rejects a
      // cancel unless status is invited/booked; no_show + cancelled are "needs
      // rebooking" states). Resend only for invited; No Show only for booked.
      var cs = (c.status || '').toLowerCase();
      var cid = esc(c.id);

      if (cs === 'invited' || cs === 'booked') {
        if (cs === 'invited') actions += '<button class="btn btn-blue" onclick="ceoGpCallResend(event, \'' + cid + '\')">Resend invite</button>';
        actions += '<button class="btn btn-red" onclick="ceoGpCallCancel(event, \'' + cid + '\')">Cancel</button>';

        actions += '<button class="btn btn-blue" onclick="ceoGpCallReschedule(event, \'' + cid + '\')">Reschedule</button>';
        // Server now permits cancelling a no_show row (already-cancelled rows skip it).
        if (cs === 'no_show') actions += '<button class="btn btn-red" onclick="ceoGpCallCancel(event, \'' + cid + '\')">Cancel</button>';
      } else if (cs === 'completed' && !c.meeting_summary) {
        // Completed call with no summary yet — same gate as admin (10733–10736):
        // pull the Zoom AI meeting summary on demand.
        actions += '<button class="btn btn-blue" onclick="ceoGpCallFetchSummary(event, \'' + cid + '\')">Fetch Summary</button>';
      }
      if (actions) html += '<div class="ceo-gp-call-actions">' + actions + '</div>';
      html += '</div>';
      return html;
    }

    // Classify cached calls into the three sub-tab groups (shared classification):
    //   Upcoming = invited | booked
    //   Past     = completed | no_show | cancelled (excluding abandoned drafts)
    //   Summary  = completed AND has a non-empty meeting_summary
    // An abandoned booking draft = a cancelled call that was never scheduled and
    // never booked (no date, never confirmed) — skipped so it never clutters Past.
    function classifyGpCalls(calls) {
      var groups = { upcoming: [], past: [], summary: [] };
      var list = calls || [];
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var st = (c.status || '').toLowerCase();
        if (st === 'cancelled' && !c.scheduled_at && !c.booked_at) continue;
        if (st === 'invited' || st === 'booked') groups.upcoming.push(c);
        else if (st === 'completed' || st === 'no_show' || st === 'cancelled') groups.past.push(c);
        if (st === 'completed' && c.meeting_summary && String(c.meeting_summary).trim()) groups.summary.push(c);
      }
      // Order by meeting time: upcoming soonest-first, past/summary most-recent-first.
      var callTime = function(c) { return new Date(c.scheduled_at || c.booked_at || c.created_at || 0).getTime() || 0; };
      groups.upcoming.sort(function(a, b) { return callTime(a) - callTime(b); });
      groups.past.sort(function(a, b) { return callTime(b) - callTime(a); });
      groups.summary.sort(function(a, b) { return callTime(b) - callTime(a); });
      return groups;
    }

    // Per-call actions from the GP Calls sub-tab. Reuse the admin call endpoints

    function ceoGpCallApiAction(ev, opts) {

        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'cancelled' } },
        successMsg: 'Call cancelled'
      });
    }
    function ceoGpCallNoShow(ev, callId) {
      if (!confirm('Mark this call as a no-show?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'no_show' } },
        successMsg: 'Marked as no-show'
      });
    }
    function ceoGpCallReschedule(ev, callId) {
      if (!confirm('Reschedule this call? A new Zoom invite will be sent to the GP.')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
