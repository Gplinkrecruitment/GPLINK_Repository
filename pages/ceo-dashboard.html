    /* ════════════════════════════════════════════════════════════════════════════
       Task-detail accordion (Task 3d.6) — dark port of admin.html's renderOps* views.

       The detail panel opens beneath document/AHPRA/SPPA/alt-supervisor-CV task rows.
       PARITY SCOPE (porting rule 2 + Task 3d.6 NOTE): admin's renderOps* renderers embed
       interactive composers (data-ops-send-email / data-ops-send-revision / data-ops-send-
       ahpra-email / data-ops-send-gp-email / data-ops-submit-drive / data-ops-upload-own,
       and SPPA state-machine buttons: openSppaReview, sppaOverrideQ7, sppaMarkReturned,
       openPdfEditor, _viewSppaDoc, _isPrereqDone, altCvSubmit, ahpraAcknowledge/Escalate,
       loadCcContacts). Those depend on admin-only handlers/state the CEO page does not have
       and that Phase 3d does NOT wire. So the CEO ports the cleanly-portable READ-ONLY views
       faithfully — original email / AHPRA request, response-type badge, conflict banner,
       practice-response banner, the message thread, the documents list, descriptions — and
       REUSES the CEO's existing document controls (Approve & send / Request revision / Upload
       new version) where they overlap, via the already-wired data-ceo-doc-* delegation. The
       send/compose/SPPA-edit actions are intentionally surfaced as a read-only note pointing
       to the RSO admin tooling rather than faked. Each gap is recorded in the task report.
       ──────────────────────────────────────────────────────────────────────────── */

    // Read-only display helpers — verbatim ports of admin opsSnippet/opsFormatDate/
    // opsRelativeTime/opsRenderThread/opsRenderDocs (admin 4723–4794), using esc + ceoSafeUrl.
    function ceoOpsSnippet(text, max) {
      if (!text) return '';
      var t = (text || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      return t.length > max ? t.slice(0, max) + '…' : t;
    }
    function ceoOpsFormatDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    }
    function ceoOpsRelativeTime(iso) {
      if (!iso) return '';
      var diff = Date.now() - new Date(iso).getTime();
      var days = Math.floor(diff / 86400000);
      if (days > 0) return days + 'd ago';
      var hrs = Math.floor(diff / 3600000);
      if (hrs > 0) return hrs + 'h ago';
      var mins = Math.floor(diff / 60000);
      return (mins > 0 ? mins + 'm ago' : 'just now');
    }
    // Conversation thread (port of admin opsRenderThread 4743–4764): newest-first, in/out
    // direction badge, channel, sender, relative time, optional "Open in Gmail" link.
    /* CC control for the task composers. `preselect` ticks every offered contact once
       loadCcContacts fills the box — used on the practice chase (nudge), where an email
       that reaches one person is the bug. Port of admin.html opsCcRow; see the comment
       there for why ticking cannot over-share. */
    function ceoCcRow(taskId, preselect, never) {
      var bad = (never || []).map(function (a) { return String(a || '').trim().toLowerCase(); }).filter(Boolean);
      return '<div class="ops-cc-row"><span class="ops-email-label">CC:</span>'
        + '<select data-email-cc="' + esc(taskId) + '"' + (preselect ? ' data-email-cc-preselect="1"' : '')
        + (bad.length ? ' data-email-cc-exclude="' + esc(bad.join(',')) + '"' : '')
        + ' multiple style="min-height:28px"><option value="">Loading contacts…</option></select></div>'
        + '<div data-email-cc-note="' + esc(taskId) + '" style="font-size:11px;color:var(--muted);margin:-4px 0 6px 0"></div>';
    }

    function ceoOpsRenderThread(msgs) {
      if (!msgs || !msgs.length) return '';
      var sorted = msgs.slice().sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      var h = '<div class="ops-conversation-thread">';
      sorted.forEach(function(m) {
        var dirCls = m.direction === 'outbound' ? 'ops-msg-outbound' : 'ops-msg-inbound';
        var dirLabel = m.direction === 'outbound' ? 'Sent' : 'Received';
        var chLabel = (m.channel === 'whatsapp' ? 'WhatsApp' : 'Email');
        var gmailLink = m.gmail_message_id ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(m.gmail_message_id) : (m.gmail_thread_id ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(m.gmail_thread_id) : '');
        h += '<div class="ops-msg ' + dirCls + '">'
          + '<div class="ops-msg-header"><span class="ops-msg-dir">' + dirLabel + '</span><span class="ops-msg-channel">' + esc(chLabel) + '</span>';
        if (m.sender) h += '<span class="ops-msg-channel">· ' + esc(m.sender) + '</span>';
        h += '<span class="ops-msg-time">' + ceoOpsRelativeTime(m.created_at) + '</span>';
        if (gmailLink) h += '<a href="' + ceoSafeUrl(gmailLink) + '" target="_blank" rel="noopener" style="margin-left:auto;font-size:10px;color:var(--blue);font-weight:600;text-decoration:none">Open in Gmail ↗</a>';
        h += '</div>';
        if (m.subject) h += '<div class="ops-msg-subject">' + esc(m.subject) + '</div>';
        h += '<div class="ops-msg-body">' + esc(ceoOpsSnippet(m.body_text || m.body_html || '', 400)) + '</div>';
        h += '</div>';
      });
      h += '</div>';
      return h;
    }
    // Documents list (port of admin opsRenderDocs 4765–4794): icon, filename, size, current/
    // previous-version state, "View →" link. Inline data: URLs (no signed-preview flow on the
    // CEO page) are surfaced as a plain note rather than a broken preview button (porting rule 2).
    function ceoOpsRenderDocs(docs) {
      if (!docs || !docs.length) return '';
      var h = '<div class="ops-doc-preview">';
      docs.forEach(function(d) {
        var isCurrent = d.is_current !== false;
        var cls = isCurrent ? '' : 'ops-doc-version-old';
        var sizeStr = d.size_bytes ? (Math.round(d.size_bytes / 1024) + 'KB') : '';
        var icon = '📄';
        if (d.mime_type && d.mime_type.indexOf('pdf') > -1) icon = '📄';
        else if (d.mime_type && d.mime_type.indexOf('image') > -1) icon = '🖼';
        var previewUrl = d.google_drive_url || d.attachment_url || '';
        h += '<div class="' + cls + '">';
        h += '<div class="ops-doc-thumb">';
        h += '<div class="ops-doc-icon">' + icon + '</div>';
        h += '<div><div style="font-weight:700">' + esc(d.filename || 'Document') + '</div>';
        if (sizeStr) h += '<div style="font-size:10px;color:var(--muted)">' + sizeStr + '</div>';
        if (!isCurrent) h += '<div style="font-size:10px;color:var(--muted)">Previous version</div>';
        h += '</div>';
        if (previewUrl && !previewUrl.startsWith('data:')) {
          h += '<a href="' + ceoSafeUrl(previewUrl) + '" target="_blank" rel="noopener" style="margin-left:auto;font-size:10px;color:var(--blue);font-weight:700;text-decoration:none">View →</a>';
        } else if (previewUrl) {
          h += '<span style="margin-left:auto;font-size:10px;color:var(--muted)">stored file</span>';
        }
        h += '</div></div>';
      });
      h += '</div>';
      return h;
    }

    // Read-only note pointing the reviewer to the RSO admin tools for the interactive
    // compose/send/edit actions that the CEO page does not (yet) port. Keeps parity honest.
    function ceoOpsRsoToolNote(text) {
      return '<div style="font-size:11px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-top:10px">'
        + 'ℹ️ ' + esc(text || 'This send/compose action is performed from the RSO’s admin tools.')
        + '</div>';
    }

    // The CEO document controls (Approve & send / Request revision / Upload new version) reuse
    // the already-wired data-ceo-doc-* delegation (ceoDocApprove/ceoDocRequestRevision/
    // ceoDocUpload). Render them for a document task when there is a current uploaded doc.
    function ceoOpsDocControls(task, currentDocs) {
      if (!task || !task.id) return '';
      var h = '<div class="ops-action-row">';
      if (currentDocs && currentDocs.length) {
        h += '<button class="ops-btn-green" data-ceo-doc-action="approve" data-task="' + esc(task.id) + '">Approve &amp; Send to GP</button>';
        h += '<button class="ops-btn-danger" data-ceo-doc-action="revise" data-task="' + esc(task.id) + '">Request Revision</button>';
      }
      h += '<label class="ops-btn-secondary" style="display:inline-flex;align-items:center;cursor:pointer">Upload New Version'
        + '<input type="file" data-ceo-doc-upload="' + esc(task.id) + '" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" style="display:none"></label>';
      h += '</div>';
      return h;
    }

    // ── Practice Pack Child (read-only port of admin renderOpsPracticePackChild 5100) ──
    // Shows the practice response banner (+ AI match badge), the current document(s), the
    // thread, and the CEO document controls. Admin's send/revision email composers depend on
    // admin-only data-ops-send-* handlers and are surfaced as an RSO-tool note (Task 3d.6 NOTE).
    // Plain-text draft -> composer HTML. Escapes FIRST (the draft quotes practice-supplied
    // text, so it must never inject markup). Mirrors admin.html opsPlainTextToHtml and
    // plainTextToHtml in lib/practice-reply-followup.js.
    function ceoPlainTextToHtml(text) {
      var raw = String(text == null ? '' : text).replace(/\r\n/g, '\n').trim();
      if (!raw) return '';
      return raw.split(/\n{2,}/).map(function (p) { return esc(p).replace(/\n/g, '<br>'); }).join('<br><br>');
    }
    // Plain-English gloss of what a no-document practice reply amounted to.
    // Mirrors admin.html opsPracticeReplyGuidance and outcomeGuidance in the lib.
    function ceoPracticeReplyGuidance(outcome) {
      if (outcome === 'delegated') return 'They passed it to someone else — nothing has arrived yet, so this still needs chasing.';
      if (outcome === 'content_in_body') return 'They put the content in the email itself instead of attaching a file — we still need it as a document.';
      if (outcome === 'will_send_later') return 'They said they will send it — no document has arrived yet.';
      if (outcome === 'question_for_us') return 'They asked us something before they can send it — answer them to unblock it.';
      if (outcome === 'cannot_provide') return 'They said they cannot provide it — this may need a different route.';
      return 'No document was attached to this reply — read it and decide what to send back.';
    }

    function renderCeoOpsPracticePackChild(task, msgs, docs) {
      var hasInbound = msgs.some(function(m) { return m.direction === 'inbound'; });
      var currentDocs = docs.filter(function(d) { return d.is_current !== false; });
      var hasDoc = currentDocs.length > 0;
      var lastInbound = msgs.filter(function(m) { return m.direction === 'inbound'; }).pop();
      var h = '<div class="ops-expand-section">';
      // Document-specific signing requirement (kept in sync with admin renderOpsPracticePackChild
      // signReq + the server suggest-reply prompt): supervisor CV must be dated and signed by the
      // supervisor; position description must be signed by the practice owner/employer.
      var signReq = task.related_document_key === 'supervisor_cv' ? 'Please make sure the CV is dated and signed by the supervisor.'
                  : task.related_document_key === 'position_description' ? 'Please make sure the position description is signed by the practice owner/employer.'
                  : '';

      // State B: practice responded with a document — response banner + doc + controls.
      if (hasInbound && hasDoc) {
        var conf = lastInbound && typeof lastInbound.ai_match_confidence === 'number' ? Math.round(lastInbound.ai_match_confidence * 100) : '';
        var confCls = conf && conf < 70 ? 'low' : '';
        h += '<div class="ops-response-banner">';
        h += '<div class="ops-response-title">Practice Response';
        if (conf) h += ' <span class="ops-match-badge ' + confCls + '">' + conf + '% match</span>';
        h += '</div>';
        if (lastInbound) h += '<div class="ops-response-text">' + esc(ceoOpsSnippet(lastInbound.body_text || lastInbound.body_html || '', 300)) + '</div>';
        if (lastInbound) h += '<div class="ops-response-meta">From: ' + esc(lastInbound.sender || '—') + ' · ' + ceoOpsFormatDate(lastInbound.created_at) + '</div>';
        h += '</div>';
        h += ceoOpsRenderDocs(currentDocs);
        var diffNote = task.ai_match_reasoning || '';
        if (task.related_document_key === 'offer_contract' && diffNote) {
          h += '<div style="background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:var(--text)">';
          h += '<strong>⚠️ Contract analysis:</strong> ' + esc(diffNote);
          h += '</div>';
        }
        h += ceoOpsDocControls(task, currentDocs);
        if (msgs.length > 1) h += ceoOpsRenderThread(msgs);
        h += '</div>';
        return h;
      }

      // State D: the practice replied but sent no document. Show what they said, the AI's read
      // of it, and a follow-up draft that answers it — never the original request composer
      // (State A below), which would re-ask for something they have already responded about.

    // and are surfaced as an RSO-tool note (Task 3d.6 NOTE).
    // AI completeness verdict panel (port of admin renderSppaCompletenessPanel ~5181),
    // dark-converted. Reads meta.completeness_check. Returns '' when never checked.
    function ceoRenderSppaCompletenessPanel(meta) {
      var cc = meta && meta.completeness_check;
      if (!cc) {
        return '<div style="background:var(--panel);border:1px dashed var(--border, rgba(255,255,255,0.12));border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--muted)">AI completeness check not run yet — re-check below before submitting.</div>';
      }
      var checkedAt = cc.checked_at ? new Date(cc.checked_at).toLocaleString() : '';
      if (cc.error) {
        return '<div style="background:var(--amber-dim);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">'
          + '<div style="font-weight:700;color:var(--amber)">⚠ AI completeness check could not run</div>'
          + '<div style="color:var(--amber);margin-top:2px">' + esc(cc.summary || 'Please review the form manually.') + '</div>'
          + '</div>';
      }
      if (cc.is_complete) {
        var hc = '<div style="background:var(--green-dim);border:1px solid rgba(52,211,153,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        hc += '<div style="font-weight:700;color:var(--green)">✓ AI completeness check: ready to submit' + (cc.confidence ? ' (' + esc(cc.confidence) + ' confidence)' : '') + '</div>';
        if (cc.summary) hc += '<div style="color:var(--green);margin-top:2px">' + esc(cc.summary) + '</div>';
        if (cc.issues && cc.issues.length) hc += '<div style="color:var(--green);margin-top:4px;font-size:10px">' + cc.issues.map(function (x) { return '• ' + esc(x); }).join('<br>') + '</div>';
        if (meta.completeness_override) hc += '<div style="color:var(--muted);margin-top:4px;font-size:10px">Overridden by ' + esc(meta.completeness_override.by || 'RSO') + '</div>';
        if (checkedAt) hc += '<div style="color:var(--muted);margin-top:4px;font-size:10px">Checked ' + esc(checkedAt) + '</div>';
        hc += '</div>';
        return hc;
      }
      // Reminder (NOT a blocker): form complete + signed and the only outstanding item is the
      // alternate supervisor's CV, which has its own task. (Mirrors admin renderSppaCompletenessPanel.)
      function _ccOnlyAltCv(c){
        function a(v){return Array.isArray(v)?v.filter(function(x){return x&&String(x).trim();}):[];}
        if(a(c.missing_fields).length||a(c.missing_signatures).length||a(c.issues).length)return false;
        var d=a(c.missing_documents); if(!d.length)return false;
        return d.every(function(x){return /alternate\s+supervisor/i.test(String(x));});
      }
      if(!cc.is_complete && (cc.only_alt_cv_outstanding===true || _ccOnlyAltCv(cc))){
        var altn=(cc.alternate_supervisors_on_form&&cc.alternate_supervisors_on_form.length)?cc.alternate_supervisors_on_form.join(', '):'';
        var hr='<div style="background:var(--amber-dim);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">';
        hr+='<div style="font-weight:700;color:var(--amber)">✓ SPPA-00 form complete &amp; signed — one item to collect</div>';
        hr+='<div style="color:var(--amber);margin-top:2px">The form is fully completed and all declarations are signed. The only outstanding item is the alternate supervisor’s signed CV'+(altn?' ('+esc(altn)+')':'')+'. Complete the <strong>"Request alternate supervisor CV from practice"</strong> task to collect it — the SPPA-00 can be submitted now; the CV is delivered to the GP separately.</div>';
        if(checkedAt) hr+='<div style="color:var(--muted);margin-top:4px;font-size:10px">Checked '+esc(checkedAt)+'</div>';
        hr+='</div>';
        return hr;
      }
      var lists = '';
      function addList(label, arr) {
        if (arr && arr.length) lists += '<div style="margin-top:4px"><span style="font-weight:600">' + esc(label) + ':</span><ul style="margin:2px 0 0 16px;padding:0">' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      }
      addList('Missing or blank fields', cc.missing_fields);
      addList('Missing signatures', cc.missing_signatures);
      addList('Missing documents', cc.missing_documents);
      addList('Other issues', cc.issues);
      var hp = '<div style="background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">';
      hp += '<div style="font-weight:700;color:var(--red)">⚠ AI completeness check: not ready to submit' + (cc.confidence ? ' (' + esc(cc.confidence) + ' confidence)' : '') + '</div>';
      if (cc.summary) hp += '<div style="color:var(--red);margin-top:2px">' + esc(cc.summary) + '</div>';
      hp += '<div style="color:var(--text);margin-top:4px">' + lists + '</div>';
      if (checkedAt) hp += '<div style="color:var(--muted);margin-top:4px;font-size:10px">Checked ' + esc(checkedAt) + '</div>';
      hp += '</div>';
      return hp;
    }

    function renderCeoOpsSppa00(task, msgs, docs) {
      var meta = task.metadata || {};
      if (typeof meta === 'string') try { meta = JSON.parse(meta); } catch (e) { meta = {}; }
      var sppaState = meta.sppa_state || '';
      var currentDocs = docs.filter(function(d) { return d.is_current !== false; });
      var h = '<div class="ops-expand-section">';

      if (!sppaState) {
        // Locked: prerequisite states are computed admin-side; show the gate read-only.
        h += '<div class="ops-expand-label">Waiting for prerequisites</div>';
        h += '<div style="font-size:12px;color:var(--muted);padding:8px 0">Supervisor CV and Offer / Contract must be on file before the SPPA-00 can be prepared.</div>';
        h += '</div>';
        return h;
      }

      // Human-readable state labels (parity with admin's per-state copy).
      var stateLabel = {
        ready_to_send: 'Ready to send to candidate',
        sent_to_candidate: 'Sent to candidate — awaiting return',
        gp_returned: 'Returned by candidate — review and send to practice',
        gp_corrections_requested: 'Awaiting candidate corrections',
        sent_to_practice: 'Sent to practice — awaiting return',
        practice_returned: 'Returned by practice — final review',
        corrections_requested: 'Awaiting practice corrections',
        completed: 'Completed — delivered to GP'
      };
      h += '<div class="ops-expand-label">' + esc(stateLabel[sppaState] || sppaState) + '</div>';

      // GP-section completeness banner (gp_returned): did the candidate fill Section A Q1 and
      // sign Section I? Result comes from the AI scan stored in meta.gp_section_scan. Port of
      // admin gpSectionBanner() (admin.html ~5265), dark-converted.
      function ceoGpSectionBanner() {
        var scan = meta.gp_section_scan;
        var rescanBtn = '<button class="ops-btn-secondary" style="margin-top:6px;font-size:11px" data-ceo-act="sppa_scan_sections" data-task="' + esc(task.id) + '">' + (scan ? 'Re-scan sections' : 'Run section check') + '</button>';
        if (!scan) {
          return '<div style="background:var(--blue-dim);border:1px solid rgba(96,165,250,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">'
            + '<b style="color:var(--blue)">ℹ Section check</b> — the AI is verifying the candidate completed their sections. Reload in a moment, or run it now.<br>' + rescanBtn
            + '</div>';
        }
        var bg, bd, fg, head;
        if (scan.overall === 'complete') { bg = 'var(--green-dim)'; bd = 'rgba(52,211,153,0.3)'; fg = 'var(--green)'; head = '✓ Candidate sections complete'; }
        else if (scan.overall === 'incomplete') { bg = 'var(--red-dim)'; bd = 'rgba(239,68,68,0.3)'; fg = 'var(--red)'; head = '⚠ Candidate sections look incomplete'; }
        else { bg = 'var(--amber-dim)'; bd = 'rgba(251,191,36,0.3)'; fg = 'var(--amber)'; head = '⚠ Could not confirm — review the form manually'; }
        var aMark = scan.section_a_filled ? '✓' : '✗';
        var iMark = scan.section_i_signed ? '✓' : '✗';
        var b = '<div style="background:' + bg + ';border:1px solid ' + bd + ';border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">';
        b += '<b style="color:' + fg + '">' + head + '</b>';
        if (scan.summary) b += '<div style="margin-top:3px;color:var(--muted)">' + esc(scan.summary) + '</div>';
        b += '<div style="margin-top:6px;color:var(--muted)">';
        b += '<div>' + aMark + ' <b>Section A (Q1 — personal details)</b>' + (scan.section_a_notes ? ' — ' + esc(scan.section_a_notes) : '') + '</div>';
        b += '<div>' + iMark + ' <b>Section I (Supervisee\'s signature)</b>' + (scan.section_i_notes ? ' — ' + esc(scan.section_i_notes) : '') + '</div>';
        b += '</div>';
        b += '<div style="margin-top:4px;color:var(--muted);font-size:10px">AI confidence: ' + esc(scan.confidence || 'low')
          + (scan.candidate_name_detected ? ' · name on form: ' + esc(scan.candidate_name_detected) : '')
          + (scan.scanned_at ? ' · ' + new Date(scan.scanned_at).toLocaleString('en-AU') : '') + '</div>';
        b += rescanBtn;
        b += '</div>';
        return b;
      }
      if (sppaState === 'gp_returned') h += ceoGpSectionBanner();

      // AI completeness verdict (practice_returned): the CEO must SEE this before Submit. Port of
      // admin renderSppaCompletenessPanel(meta) (admin.html ~5181), dark-converted.
      if (sppaState === 'practice_returned') h += ceoRenderSppaCompletenessPanel(meta);

      // Corrections-requested states: human-readable status + the corrections note so the CEO can
      // act on a failing case (admin gp_corrections_requested / corrections_requested branches).
      if (sppaState === 'gp_corrections_requested' || sppaState === 'corrections_requested') {
        var isGpCorr = sppaState === 'gp_corrections_requested';
        var corrNote = isGpCorr ? meta.gp_corrections_note : meta.corrections_note;
        var corrAt = isGpCorr ? meta.gp_corrections_requested_at : meta.corrections_requested_at;
        var corrWho = isGpCorr ? 'candidate' : 'practice';
        h += '<div style="background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        h += '<span style="color:var(--red)">Corrections requested from ' + corrWho + ' — awaiting revised SPPA</span>';
        h += '</div>';
        if (corrAt) {
          var corrDays = Math.floor((Date.now() - new Date(corrAt).getTime()) / 86400000);
          h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Requested ' + corrDays + ' day' + (corrDays === 1 ? '' : 's') + ' ago</div>';
          if (corrDays >= 7) h += '<div class="ops-nudge-indicator">⏰ ' + corrDays + ' days since corrections requested — consider a follow-up</div>';
        }
        if (corrNote) {
          h += '<div style="background:var(--panel);border:1px solid var(--border, rgba(255,255,255,0.08));border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:var(--text)"><strong>Corrections requested:</strong> ' + esc(corrNote) + '</div>';
        }
      }

      // Conflict banner (port of admin conflictBanner 4821–4838), dark-converted.
      if (meta.is_conflict && meta.confidence !== 'low') {
        h += '<div style="background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--text)">';
        h += '<b style="color:var(--amber)">⚠ AI detected conflict of interest:</b> Supervisor <b>' + esc(meta.supervisor_name || '') + '</b> is the practice owner/director. Q7 marked <b>YES</b>.';
        if (meta.reasoning) h += '<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--amber)">AI reasoning</summary><p style="margin:4px 0 0;color:var(--muted)">' + esc(meta.reasoning) + '</p></details>';
        h += '</div>';
      } else if (!meta.is_conflict && meta.confidence !== 'low') {
        h += '<div style="background:var(--green-dim);border:1px solid rgba(34,197,94,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        h += '<span style="color:var(--green)">✓ No conflict of interest detected. Q7 marked <b>NO</b>.</span>';
        h += '</div>';
      } else {
        h += '<div style="background:var(--red-dim);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px">';
        h += '<b style="color:var(--red)">⚠ AI could not determine with confidence. Manual review required.</b>';
        h += '</div>';
      }
      if (sppaState === 'sent_to_candidate' && meta.sent_to_candidate_at) {
        var days = Math.floor((Date.now() - new Date(meta.sent_to_candidate_at).getTime()) / 86400000);
        h += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Sent ' + days + ' day' + (days === 1 ? '' : 's') + ' ago to ' + esc(meta.sent_to_candidate_email || '') + '</div>';
        if (days >= 7) h += '<div class="ops-nudge-indicator">⏰ ' + days + ' days since sent — consider a follow-up</div>';
      }
      h += ceoOpsRenderThread(msgs);
      if (currentDocs.length) h += ceoOpsRenderDocs(currentDocs);
      var cs = (gpDetailCache && gpDetailCache.case) || {};
      var gpEmail = cs.gp_email || '';
      var gpNm = cs.gp_name || task.gp_name || '';
      var practiceEmail = task.practice_contact_email || '';
      var pcName = task.practice_contact_name || '';
      h += '<div class="ops-action-row">';
      if (sppaState === 'ready_to_send') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_send_candidate" data-task="' + esc(task.id) + '">Send to Candidate</button>';
        h += '<button class="ops-btn-secondary" data-ceo-act="sppa_q7" data-task="' + esc(task.id) + '" data-conflict="' + (meta.is_conflict ? '1' : '0') + '">Override Q7</button>';
      } else if (sppaState === 'sent_to_candidate') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_returned_candidate" data-task="' + esc(task.id) + '">Upload GP Return</button>';
      } else if (sppaState === 'gp_returned') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_send_practice" data-task="' + esc(task.id) + '">Send to Practice</button>';
        h += '<button class="ops-btn-danger" data-ceo-act="sppa_correct_gp" data-task="' + esc(task.id) + '" data-email="' + escAttr(gpEmail) + '" data-gp="' + escAttr(gpNm) + '">Request GP Corrections</button>';
      } else if (sppaState === 'sent_to_practice') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_returned_practice" data-task="' + esc(task.id) + '">Upload Practice Return</button>';
      } else if (sppaState === 'practice_returned') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_submit" data-task="' + esc(task.id) + '">Submit — Deliver to GP</button>';
        h += '<button class="ops-btn-secondary" data-ceo-act="sppa_recheck" data-task="' + esc(task.id) + '">Re-check with AI</button>';
        h += '<button class="ops-btn-danger" data-ceo-act="sppa_correct_practice" data-task="' + esc(task.id) + '" data-email="' + escAttr(practiceEmail) + '" data-name="' + escAttr(pcName) + '" data-gp="' + escAttr(gpNm) + '">Request Corrections</button>';
      } else if (sppaState === 'gp_corrections_requested') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_returned_candidate" data-task="' + esc(task.id) + '">Upload Corrected Return</button>';
      } else if (sppaState === 'corrections_requested') {
        h += '<button class="ops-btn-green" data-ceo-act="sppa_returned_practice" data-task="' + esc(task.id) + '">Upload Corrected Return</button>';
      }
      h += '<button class="ops-btn-secondary" data-ceo-act="open_pdf" data-task="' + esc(task.id) + '">Preview PDF</button>';
      h += '</div>';
      h += '</div>';
      return h;
    }

    // ── Generic fallback (read-only port of admin renderOpsGeneric 5597) ──
    function renderCeoOpsGeneric(task, msgs, docs) {
      var h = '<div class="ops-expand-section">';
      if (task.description) h += '<div class="ops-expand-desc">' + esc(task.description) + '</div>';
      if (msgs.length) h += ceoOpsRenderThread(msgs);
      if (docs.length) h += ceoOpsRenderDocs(docs);
      var gmailMsgId = task.source_gmail_message_id || '';
      var gmailLink = gmailMsgId ? 'https://mail.google.com/mail/u/0/#inbox/' + encodeURIComponent(gmailMsgId) : '';
      if (gmailLink) h += '<a class="ops-action-link-inline" href="' + ceoSafeUrl(gmailLink) + '" target="_blank">Open email thread →</a>';
      h += '</div>';
      return h;
    }

    // loadGpTaskDetail (port of admin 5762): fetch task messages + documents, then dispatch by
    // task_type to the dark renderOps* renderers. Mirrors admin's dispatch exactly: sppa_00
    // practice_pack_child -> SPPA; ahpra_correspondence/ahpra_action_item -> AHPRA;
    // alt_supervisor_cv_review -> alt-CV; everything else with a detail panel -> practice pack.
    // Populate the CC <select multiple> in any open email composer from the case's detected
    // email contacts (port of admin.html loadCcContacts 5959). Excludes whoever is already in
    // the matching "To" field. No-ops when no composer is open. Same
    // /api/admin/va/case/{caseId}/email-contacts endpoint the RSO view uses.
    function loadCcContacts(caseId) {
      var selects = document.querySelectorAll('[data-email-cc]');
      if (!selects.length || !caseId) return;
      apiFetch('/api/admin/va/case/' + encodeURIComponent(caseId) + '/email-contacts').then(function(data) {
        selects.forEach(function(sel) {
          var tid = sel.getAttribute('data-email-cc');
          var toInput = document.querySelector('[data-email-to="' + tid + '"]');
          var toVal = toInput ? String(toInput.value || '').trim().toLowerCase() : '';
          // Chase composers tick their contacts by default — see ceoCcRow.
          var preselect = sel.hasAttribute('data-email-cc-preselect');
          var never = (sel.getAttribute('data-email-cc-exclude') || '').split(',').filter(Boolean);
          var note = document.querySelector('[data-email-cc-note="' + tid + '"]');
          sel.innerHTML = '';
          var contacts = (data && data.ok && Array.isArray(data.contacts)) ? data.contacts : [];
          var listc = contacts.filter(function(c) {
            var addr = String(c.email_address || '').trim().toLowerCase();
            return addr !== toVal && never.indexOf(addr) === -1;
          });
          if (listc.length) {
            listc.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c.email_address;
              // Name + address only — see admin.html: "(seen Nx)" clipped the real address.
              opt.textContent = (c.display_name ? c.display_name + ' <' + c.email_address + '>' : c.email_address);
              opt.title = c.email_address + ' — seen ' + c.seen_count + 'x on this case';
              if (preselect) opt.selected = true;
              sel.appendChild(opt);
            });
          } else {
            var opt0 = document.createElement('option');
            opt0.value = ''; opt0.textContent = 'No additional contacts detected'; opt0.disabled = true;
            sel.appendChild(opt0);
          }
          if (note) {
            if (preselect && listc.length) {
              note.textContent = 'Copying ' + listc.map(function(c) { return c.display_name || c.email_address; }).join(', ')
                + '. Deselect above to leave anyone off.';
            } else if (preselect) {
              note.textContent = 'No one else on file for this practice to copy.';
            } else {
              note.textContent = '';
            }
          }
        });
      }).catch(function() {});
    }

    // Send the practice-request / nudge email composed in a task-detail panel. Posts to
    // /api/admin/email/send (a super-admin/CEO session passes its requireAdminSession — these
    // endpoints are not RSO-assignment gated), optionally flips the task status (e.g.
    // waiting_on_practice), then refreshes the GP file. Port of admin's data-ops-send-email
    // handler (admin.html 6865).
    function ceoSendComposerEmail(btn) {
      var tid = btn.getAttribute('data-ops-send-email');
      var caseId = btn.getAttribute('data-ops-case') || '';
      var flipStatus = btn.getAttribute('data-ops-flip-status') || '';
      var toEl = document.querySelector('[data-email-to="' + tid + '"]');
      var subEl = document.querySelector('[data-email-subject="' + tid + '"]');
      var bodyEl = document.querySelector('[data-email-body="' + tid + '"]');
      var ccEl = document.querySelector('[data-email-cc="' + tid + '"]');
      var toVal = toEl ? toEl.value.trim() : '';
      var subVal = subEl ? subEl.value.trim() : '';
      var bodyHtml = bodyEl ? bodyEl.innerHTML : '';
      var ccVal = ccEl ? Array.prototype.slice.call(ccEl.selectedOptions).map(function(o) { return o.value; }).filter(Boolean).join(', ') : '';
      if (!toVal) { showToast('Recipient email required', 'error'); return; }
      if (!subVal) { showToast('Subject required', 'error'); return; }
      var origText = btn.textContent;
      btn.disabled = true; btn.textContent = 'Sending…';
      var payload = { to: toVal, subject: subVal, bodyHtml: bodyHtml, taskId: tid, caseId: caseId, cc: ccVal };
      var threadId = btn.getAttribute('data-ops-thread') || '';
      if (threadId) payload.threadId = threadId;
      if (btn.hasAttribute('data-ops-auto-attach')) {
        var aUrl = btn.getAttribute('data-ops-attach-url') || '';
        var aName = btn.getAttribute('data-ops-attach-name') || 'attachment';
        if (aUrl) payload.attachments = [{ url: aUrl, filename: aName }];
      }
      apiFetch('/api/admin/email/send', { method: 'POST', body: payload }).then(function(d) {
        if (!d || !d.ok) { showToast((d && d.message) || 'Email failed', 'error'); btn.disabled = false; btn.textContent = origText; return; }
        var after = flipStatus
          ? apiFetch('/api/admin/task?id=' + encodeURIComponent(tid), { method: 'PUT', body: { status: flipStatus } }).catch(function() {})
          : Promise.resolve();
        after.then(function() { showToast('Email sent', 'success'); refreshGpDetailTasks(); });
      }).catch(function(e) { showToast('Error: ' + ((e && e.message) || 'network'), 'error'); btn.disabled = false; btn.textContent = origText; });
    }

    // ── GP-file task actions ported from admin (alt-CV / AHPRA / SPPA). All hit the same
    // /api/admin/va/task/* (or /api/admin/task) endpoints the RSO uses — a super-admin/CEO
    // session passes their requireAdminSession guard (not RSO-assignment gated) — then refresh
    // the GP file. Mirrors admin's altCvSubmit/ahpra*/sppa* handlers (admin.html 8350–8423).
    function ceoTaskPost(url, okMsg) {
      return apiFetch(url, { method: 'POST' }).then(function(d) {
        if (d && d.ok) { showToast(okMsg, 'success'); refreshGpDetailTasks(); return true; }
        showToast((d && (d.error || d.message)) || 'Action failed', 'error'); return false;
      }).catch(function(e) { showToast('Error: ' + ((e && e.message) || 'network'), 'error'); return false; });
    }
    function ceoAltCvSubmit(taskId) {
      if (!confirm('Submit alternate supervisor CV(s) and deliver to the GP?')) return;
      ceoTaskPost('/api/admin/va/task/' + encodeURIComponent(taskId) + '/alt-cv-submit', 'Alternate CV(s) delivered to GP');
    }
    function ceoAhpraAcknowledge(taskId) {
      if (!confirm('Acknowledge this AHPRA update?')) return;
      ceoTaskPost('/api/admin/va/task/' + encodeURIComponent(taskId) + '/ahpra-acknowledge', 'AHPRA update acknowledged');
    }

    function loadGpTaskDetail(taskId) {
      var container = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
      if (!container) return;
      container.innerHTML = '<div class="ops-loading-detail">Loading…</div>';
      var list = (gpDetailCache && gpDetailCache.tasks) || [];
      var task = null;
      for (var i = 0; i < list.length; i++) { if (list[i] && list[i].id === taskId) { task = list[i]; break; } }
      if (!task) { container.innerHTML = '<div style="padding:12px;color:var(--red)">Task not found</div>'; return; }
      var pc = task.practice_contact || {};
      var md = task.metadata || {};
      if (typeof md === 'string') try { md = JSON.parse(md); } catch (e) { md = {}; }
      var adapted = Object.assign({}, task, {
        practice_contact_email: pc.contactEmail || pc.email || task.practice_contact_email || '',
        practice_contact_name: pc.contactName || pc.name || task.practice_contact_name || '',
        practice_name: pc.practiceName || task.practice_name || '',
        ahpra_officer_name: task.ahpra_officer_name || md.ahpra_officer_name || '',
        ahpra_officer_email: task.ahpra_officer_email || md.ahpra_officer_email || '',
        response_type: task.response_type || md.response_type || 'request_from_gp',
        amend_target: task.amend_target || md.amend_target || null,
        on_file_documents: task.on_file_documents || md.on_file_documents || [],
        draft_response: task.draft_response || md.draft_response || null,
        source_gmail_message_id: task.source_gmail_message_id || md.source_gmail_message_id || ''
      });
      // Live-fetch the case's authoritative practice contact alongside messages/documents so a
      // blank/stale "To" can be filled before render (RSO parity, 823ec3b). Without this the
      // composer "To" stays empty when the cached task has no practice_contact — and an empty
      // "To" then lets the practice person wrongly appear as a CC option instead.
      var ccCaseId = adapted.case_id || (gpDetailCache && gpDetailCache.caseId) || '';
      Promise.all([
        apiFetch('/api/admin/task/messages?taskId=' + encodeURIComponent(taskId)).catch(function() { return {}; }),
        apiFetch('/api/admin/task/documents?taskId=' + encodeURIComponent(taskId)).catch(function() { return {}; }),
        ccCaseId ? apiFetch('/api/admin/va/case/' + encodeURIComponent(ccCaseId) + '/email-contacts').catch(function() { return {}; }) : Promise.resolve({})
      ]).then(function(res) {
        var mRes = res[0] || {}, dRes = res[1] || {}, ecRes = res[2] || {};
        var msgs = (mRes.ok && Array.isArray(mRes.messages)) ? mRes.messages : [];
        var docs = (dRes.ok && Array.isArray(dRes.documents)) ? dRes.documents : [];
        // Bulletproof the practice "To"/greeting: if cached enrichment had no contact, use the
        // authoritative practice contact (hired gp_applications row) from the live response.
        if (!adapted.practice_contact_email && ecRes && ecRes.practiceContact && ecRes.practiceContact.email) {
          adapted.practice_contact_email = ecRes.practiceContact.email;
          if (!adapted.practice_contact_name) adapted.practice_contact_name = ecRes.practiceContact.name || '';
        }
        // Re-resolve the container in case the panel was re-rendered while fetching.
        var c2 = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
        if (!c2) return;
        var tt = adapted.task_type || '';
        if (adapted.related_document_key === 'sppa_00' && tt === 'practice_pack_child') {
          c2.innerHTML = renderCeoOpsSppa00(adapted, msgs, docs);
        } else if (tt === 'ahpra_correspondence' || tt === 'ahpra_action_item') {
          c2.innerHTML = renderCeoOpsAhpraActionItem(adapted, msgs, docs);
        } else if (tt === 'alt_supervisor_cv_review') {
          c2.innerHTML = renderCeoOpsAltSupervisorCvReview(adapted, msgs, docs);
        } else if (tt === 'alt_supervisor_cv_request') {
          c2.innerHTML = renderCeoOpsAltSupervisorCvRequest(adapted);
        } else if (tt === 'ahpra_conflict_letter') {
          c2.innerHTML = renderCeoOpsAhpraConflictLetter(adapted);
        } else if (tt === 'practice_pack_child') {
          c2.innerHTML = renderCeoOpsPracticePackChild(adapted, msgs, docs);
        } else {
          c2.innerHTML = renderCeoOpsGeneric(adapted, msgs, docs);
        }
        // Populate any email composer's CC dropdown from the case's detected contacts (RSO parity).
        loadCcContacts(gpDetailCache && gpDetailCache.caseId);
      }).catch(function(e) {
        var c3 = document.querySelector('[data-gp-task-detail="' + taskId + '"] .gp-task-detail-inner');
        if (c3) c3.innerHTML = '<div style="padding:12px;color:var(--red)">Failed to load detail: ' + esc((e && e.message) || 'Unknown error') + '</div>';
      });

    // Re-fetch the open GP's case and refresh gpDetailCache, then re-render the Tasks
    // tab. Returns a promise; rejects (via reject in caller) only on hard error. Keeps
    // gpDetailCache.case/tasks/timeline consistent with GET /api/admin/case?id=.
    function refreshGpDetailTasks() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        if (gpDetailTab === 'tasks') renderGpTasksTab();
      });
    }

    // Re-fetch the open GP file (if any) after a header case action and re-render the
    // active sub-tab. Reuses the existing CEO action modals (openCreateTaskModal,
    // openNoteModal, openStageChangeModal, openBlockerModal, openNudgeModal): their
    // submit handlers call this on success so the GP file reflects the change. No-op
    // when no GP file is open (so it never alters the modals' dashboard-refresh path).
    function refreshGpDetailIfOpen() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return Promise.resolve();
      // Drop the timeline cache so a newly added note shows up in the Notes/Timeline tabs.
      gpTimelineCache = null;
      return apiFetch('/api/admin/case?id=' + encodeURIComponent(caseId)).then(function(d) {
        if (!d || !d.ok) return;
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return; // GP file changed mid-flight
        gpDetailCache.case = d.case || gpDetailCache.case;
        gpDetailCache.tasks = d.tasks || [];
        gpDetailCache.timeline = d.timeline || [];
        renderGpDetailTab(gpDetailTab);
      });

    function refreshGpDocuments() {
      gpDocumentsCache = null;
      // Also drop the SWR copy of the exact URL loadGpDocuments fetches, so a doc

    // optional admin_notes. Sends a Zoom invite to the GP (no live send during build — this

    var CEO_ZOOM_STAGES = ['myintealth', 'amc', 'ahpra'];
    function openCeoZoomModal(caseId, userId, currentStage, opts) {

        var curEmail = (cs.assigned_rso_email || '').toLowerCase();
