    function submitCeoReviewDoc(taskId, decision) {
      var noteEl = document.getElementById('ceoReviewDocNote');
      var err = document.getElementById('ceoReviewDocError');
      var note = noteEl ? noteEl.value.trim() : '';
      if (decision === 'reject' && !note) { if (err) { err.textContent = 'A reason is required to reject — the GP will see it.'; err.style.display = 'block'; } return; }
      if (err) err.style.display = 'none';
      var ap = document.getElementById('ceoReviewDocApprove'), rj = document.getElementById('ceoReviewDocReject');
      if (ap) ap.disabled = true; if (rj) rj.disabled = true;
      apiFetch('/api/admin/va/task/review-flagged-doc', {
        method: 'POST',
        body: { task_id: taskId, decision: decision, note: note }
      }).then(function(d) {
        if (!d || !d.ok) { if (err) { err.textContent = (d && d.message) || 'Action failed.'; err.style.display = 'block'; } if (ap) ap.disabled = false; if (rj) rj.disabled = false; return; }
        if (_ceoReviewDocObjUrl) { URL.revokeObjectURL(_ceoReviewDocObjUrl); _ceoReviewDocObjUrl = null; }
        closeModal();
        showToast(d.message || (decision === 'approve' ? 'Document approved' : 'Re-upload requested'), 'success');
        refreshGpDetailTasks();
      }).catch(function(e) { if (err) { err.textContent = 'Network error: ' + e.message; err.style.display = 'block'; } if (ap) ap.disabled = false; if (rj) rj.disabled = false; });
    }

    // Render this GP file's call history newest-first. Each card shows a status pill,
    // scheduled time, assigned RSO, admin notes, a meeting summary for completed calls,
    // a Join link when a zoom_join_url is present, plus per-call actions (resend/cancel/
    // reschedule/no-show) gated by status to match admin.html. The endpoint returns calls
    // already ordered created_at.desc (newest-first).
    // Render a single call card using the existing per-call markup. Reused by both the
    // Upcoming and Past sub-tabs so the field displays + status-gated actions stay identical.
    function renderGpCallCard(c) {
      var html = '';
      var timeLabel = c.scheduled_at ? fmtCallTime(c.scheduled_at) : 'Not yet booked';
      html += '<div class="ceo-gp-call">';
      html += '<div class="ceo-gp-call-head">';
      html += callStatusPill(c.status);
      if (c.stage) html += '<span class="pill pill-muted">' + esc(STAGE_LABELS[c.stage] || c.stage) + '</span>';
      html += '<span class="ceo-gp-call-time">' + esc(timeLabel) + '</span>';
      if (c.zoom_join_url && ['booked', 'invited'].indexOf((c.status || '').toLowerCase()) !== -1) {
        html += '<a class="ceo-gp-call-join" href="' + esc(c.zoom_join_url) + '" target="_blank" rel="noopener">Join</a>';
      }
      html += '</div>';
      if (c.assigned_rso_name) {
        html += '<div class="ceo-gp-call-rso">RSO: ' + esc(c.assigned_rso_name) + '</div>';
      }
      if (c.invitee_notes) {
        html += '<div class="ceo-gp-call-notes"><span style="color:var(--text-muted);font-weight:600">GP&rsquo;s booking notes:</span> ' + esc(c.invitee_notes) + '</div>';
      }
      // GP-VISIBLE reason for the meeting — distinct tinted box, shown before the
      // internal admin notes so the two are never confused.
      if (c.meeting_reason) {
        html += '<div class="ceo-gp-call-notes" style="margin-top:8px;padding:8px 10px;background:rgba(56,139,253,0.10);border:1px solid rgba(56,139,253,0.30);border-radius:var(--radius-sm,6px)"><span style="color:var(--blue,#388bfd);font-weight:600">Reason for meeting:</span> ' + esc(c.meeting_reason) + '</div>';
      }
      if (c.admin_notes) {
        html += '<div class="ceo-gp-call-notes"><span class="pill pill-muted" style="font-size:9px;margin-right:6px;vertical-align:middle">INTERNAL</span>' + esc(c.admin_notes) + '</div>';
      }
      if ((c.status || '').toLowerCase() === 'completed' && c.meeting_summary) {
        html += '<div class="ceo-gp-call-summary"><div class="ceo-gp-call-summary-label">Meeting summary</div>' + esc(c.meeting_summary) + '</div>';
      }
      // Per-call actions, gated by status to match admin.html (the backend rejects a
      // cancel unless status is invited/booked; no_show + cancelled are "needs
      // rebooking" states). Resend only for invited; No Show only for booked.
      var cs = (c.status || '').toLowerCase();
      var cid = esc(c.id);
      var actions = '';
      if (cs === 'invited' || cs === 'booked') {
        if (cs === 'invited') actions += '<button class="btn btn-blue" onclick="ceoGpCallResend(event, \'' + cid + '\')">Resend invite</button>';
        actions += '<button class="btn btn-red" onclick="ceoGpCallCancel(event, \'' + cid + '\')">Cancel</button>';
        if (cs === 'booked') {
          actions += '<button class="btn btn-blue" onclick="ceoGpCallReschedule(event, \'' + cid + '\')">Reschedule</button>';
          actions += '<button class="btn btn-amber" onclick="ceoGpCallNoShow(event, \'' + cid + '\')">No Show</button>';
        }
      } else if (cs === 'no_show' || cs === 'cancelled') {
        actions += '<button class="btn btn-blue" onclick="ceoGpCallReschedule(event, \'' + cid + '\')">Reschedule</button>';
        // Server now permits cancelling a no_show row (already-cancelled rows skip it).
        if (cs === 'no_show') actions += '<button class="btn btn-red" onclick="ceoGpCallCancel(event, \'' + cid + '\')">Cancel</button>';
      }
      if (actions) html += '<div class="ceo-gp-call-actions">' + actions + '</div>';
      html += '</div>';
      return html;
    }

    // Classify cached calls into the three sub-tab groups (shared classification):
    //   Upcoming = invited | booked
    //   Past     = completed | no_show | cancelled (excluding abandoned drafts)
    //   Summary  = completed AND has a non-empty meeting_summary
    // An abandoned booking draft = a cancelled call that was never scheduled and
    // never booked (no date, never confirmed) — skipped so it never clutters Past.
    function classifyGpCalls(calls) {
      var groups = { upcoming: [], past: [], summary: [] };
      var list = calls || [];
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        var st = (c.status || '').toLowerCase();
        if (st === 'cancelled' && !c.scheduled_at && !c.booked_at) continue;
        if (st === 'invited' || st === 'booked') groups.upcoming.push(c);
        else if (st === 'completed' || st === 'no_show' || st === 'cancelled') groups.past.push(c);
        if (st === 'completed' && c.meeting_summary && String(c.meeting_summary).trim()) groups.summary.push(c);
      }
      // Order by meeting time: upcoming soonest-first, past/summary most-recent-first.
      var callTime = function(c) { return new Date(c.scheduled_at || c.booked_at || c.created_at || 0).getTime() || 0; };
      groups.upcoming.sort(function(a, b) { return callTime(a) - callTime(b); });
      groups.past.sort(function(a, b) { return callTime(b) - callTime(a); });
      groups.summary.sort(function(a, b) { return callTime(b) - callTime(a); });
      return groups;
    }

    function renderGpCallsPane(calls) {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var groups = classifyGpCalls(calls);
      if (gpCallsSubTab !== 'upcoming' && gpCallsSubTab !== 'past' && gpCallsSubTab !== 'summary') gpCallsSubTab = 'upcoming';
      var active = groups[gpCallsSubTab] || [];

      var html = '<div class="ceo-ops-section-head">Calls</div>';
      // Nested sub-tab bar (CEO override RSO picker is unaffected and lives elsewhere).
      var subtabs = [
        { key: 'upcoming', label: 'Upcoming', count: groups.upcoming.length },
        { key: 'past', label: 'Past', count: groups.past.length },
        { key: 'summary', label: 'Summary', count: groups.summary.length }
      ];
      html += '<div class="ceo-call-subtabs">';
      for (var t = 0; t < subtabs.length; t++) {
        html += '<button class="ceo-call-subtab' + (subtabs[t].key === gpCallsSubTab ? ' active' : '') + '" data-call-subtab="' + subtabs[t].key + '">' + esc(subtabs[t].label) + '<span class="count">' + subtabs[t].count + '</span></button>';
      }
      html += '</div>';

      if (gpCallsSubTab === 'summary') {
        if (!active.length) {
          html += '<div class="ceo-gp-detail-empty">No meeting summaries yet.</div>';
        } else {
          for (var s = 0; s < active.length; s++) {
            var sc = active[s];
            var sTime = sc.scheduled_at ? fmtCallTime(sc.scheduled_at) : 'Not yet booked';
            html += '<div class="ceo-gp-call">';
            html += '<div class="ceo-gp-call-head">';
            if (sc.stage) html += '<span class="pill pill-muted">' + esc(STAGE_LABELS[sc.stage] || sc.stage) + '</span>';
            html += '<span class="ceo-gp-call-time">' + esc(sTime) + '</span>';
            html += '</div>';
            html += '<div class="ceo-gp-call-summary"><div class="ceo-gp-call-summary-label">Meeting summary</div>' + esc(sc.meeting_summary) + '</div>';
            html += '</div>';
          }
        }
      } else if (!active.length) {
        html += '<div class="ceo-gp-detail-empty">' + (gpCallsSubTab === 'past' ? 'No past calls for this GP yet.' : 'No upcoming calls for this GP.') + '</div>';
      } else {
        for (var i = 0; i < active.length; i++) {
          html += renderGpCallCard(active[i]);
        }
      }
      pane.innerHTML = html;
    }

    // Calls sub-tab: fetch this GP's calls once (cached per GP file), then render. Read-only.
    function renderGpCallsTab() {
      var pane = document.getElementById('gpDetailPane');
      if (!pane) return;
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (gpCallsCache && gpCallsCache.caseId === caseId) {
        renderGpCallsPane(gpCallsCache.calls);
        return;
      }
      pane.innerHTML = '<div class="ceo-gp-detail-placeholder"><div class="spinner" style="width:18px;height:18px;border-width:2px;margin:16px auto"></div></div>';
      loadGpCalls(caseId);
    }

    // Fetch GET /api/admin/calls?case_id=<caseId>, cache, render. Read-only.
    function loadGpCalls(caseId) {
      apiFetch('/api/admin/calls?case_id=' + encodeURIComponent(caseId)).then(function(d) {
        // Guard against a stale response after the user switched GP files.
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        if (!d || !d.ok) {
          var pane = document.getElementById('gpDetailPane');
          if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Calls</div><div class="ceo-gp-detail-empty">Failed to load calls: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var calls = d.calls || [];
        gpCallsCache = { caseId: caseId, calls: calls };
        if (gpDetailTab === 'calls') renderGpCallsPane(calls);
      }).catch(function(e) {
        if (!gpDetailCache || gpDetailCache.caseId !== caseId) return;
        var pane = document.getElementById('gpDetailPane');
        if (pane) pane.innerHTML = '<div class="ceo-ops-section-head">Calls</div><div class="ceo-gp-detail-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Bust the per-GP calls cache and re-fetch GET /api/admin/calls?case_id= → re-render.
    // Called after a successful call action so the Calls tab reflects the new status.
    function refreshGpDetailCalls() {
      var caseId = gpDetailCache && gpDetailCache.caseId;
      if (!caseId) return;
      gpCallsCache = null;
      loadGpCalls(caseId);
    }

    // Per-call actions from the GP Calls sub-tab. Reuse the admin call endpoints
    // (super-admin's requireAdminSession) with the exact shapes admin.html sends:
    //   resend     → POST /api/admin/calls/<id>/resend
    //   cancel     → PATCH /api/admin/calls/<id> { status:'cancelled' }
    //   no-show    → PATCH /api/admin/calls/<id> { status:'no_show' }
    //   reschedule → PATCH /api/admin/calls/<id> { action:'reschedule' }
    // On success: re-fetch calls → re-render. Failure shows a toast (checks parsed { ok }).
    function ceoGpCallApiAction(ev, opts) {
      if (ev) { ev.stopPropagation(); }
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch(opts.path, opts.fetchOpts).then(function(d) {
        if (d && d.ok) {
          showToast(opts.successMsg, 'success');
          // Refresh whichever pane is showing — the call card lives on both the Calls tab
          // and (as a zoom_call task) the Tasks tab.
          if (gpDetailTab === 'tasks') { refreshGpDetailTasks(); } else { refreshGpDetailCalls(); }
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }
    function ceoGpCallResend(ev, callId) {
      if (!confirm('Resend the Calendly invite to this GP?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId) + '/resend',
        fetchOpts: { method: 'POST' },
        successMsg: 'Invite resent'
      });
    }
    function ceoGpCallCancel(ev, callId) {
      if (!confirm('Cancel this scheduled call?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'cancelled' } },
        successMsg: 'Call cancelled'
      });
    }
    function ceoGpCallNoShow(ev, callId) {
      if (!confirm('Mark this call as a no-show?')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { status: 'no_show' } },
        successMsg: 'Marked as no-show'
      });
    }
    function ceoGpCallReschedule(ev, callId) {
      if (!confirm('Reschedule this call? A new Calendly invite will be sent to the GP.')) return;
      ceoGpCallApiAction(ev, {
        path: '/api/admin/calls/' + encodeURIComponent(callId),
        fetchOpts: { method: 'PATCH', body: { action: 'reschedule' } },
        successMsg: 'Call rescheduled — new invite sent'
      });
    }

    // Sub-tab click delegation for the GP file (+ Tasks show-all toggle + Documents actions
    // + the per-task ••• menu and its controls — port of admin renderGpTasksPane wiring).
    document.addEventListener('click', function(e) {
      // ── Per-task ••• dropdown (admin parity) ────────────────────────────────
      // Close any open dropdown when the click is outside both a dropdown and a ••• button.
      if (!e.target.closest('.st-dropdown') && !e.target.closest('[data-more-menu]')) {
        var openDds = document.querySelectorAll('.st-dropdown.open');
        for (var oi = 0; oi < openDds.length; oi++) openDds[oi].classList.remove('open');
      }
      // ••• toggle: open this task's dropdown, closing any other open one.
      var moreBtn = e.target.closest('[data-more-menu]');
      if (moreBtn) {
        e.stopPropagation();
        var ddId = 'dropdown-' + moreBtn.getAttribute('data-more-menu');
        var dd = document.getElementById(ddId);
        if (dd) {
          var others = document.querySelectorAll('.st-dropdown.open');
          for (var di = 0; di < others.length; di++) { if (others[di] !== dd) others[di].classList.remove('open'); }
          dd.classList.toggle('open');
        }
        return;
      }
      // Email-triage panel item controls (port of admin 5995–6069). Handle these BEFORE the
      // row-click toggle so a click inside the panel acts on the control, not the row.
      var genReplyBtn = e.target.closest('[data-generate-reply]');
      if (genReplyBtn) { ceoGenerateEmailReply(e, genReplyBtn.getAttribute('data-generate-reply')); return; }
      var copyReplyBtn = e.target.closest('[data-copy-reply]');
      if (copyReplyBtn) { ceoCopyEmailReply(e, copyReplyBtn.getAttribute('data-copy-reply')); return; }
      var resolveEmailBtn = e.target.closest('[data-resolve-email]');
      if (resolveEmailBtn) { ceoResolveEmailTask(e, resolveEmailBtn.getAttribute('data-resolve-email')); return; }

      // Document controls inside a task-detail panel (Approve & send / Request revision). These
      // reuse ceoDocApprove/ceoDocRequestRevision. Handle them BEFORE the expand toggle so the
      // expand handler's "interactive element" early-return doesn't swallow the click. (The
      // matching data-ceo-doc-action handler further below covers the Documents tab as well.)
      var detailDocBtn = e.target.closest('.gp-task-detail [data-ceo-doc-action]');
      if (detailDocBtn) {
        e.stopPropagation();
        var ddAction = detailDocBtn.getAttribute('data-ceo-doc-action');
        var ddTaskId = detailDocBtn.getAttribute('data-task');
        if (ddAction === 'approve') ceoDocApprove(ddTaskId);
        else if (ddAction === 'revise') ceoDocRequestRevision(ddTaskId);
        return;
      }

      // ── Expand/collapse the task-detail accordion (Task 3d.6; port of admin 6237–6255) ──
      // Only for rows carrying data-gp-expand-task (document/AHPRA/SPPA/alt-CV tasks). Ignore
      // clicks inside the detail panel or on interactive elements so the row stays usable.
      var gpExpBtn = e.target.closest('[data-gp-expand-task]');
      if (gpExpBtn) {
        if (e.target.closest('.gp-task-detail') || e.target.closest('button') || e.target.closest('a') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('[contenteditable]') || e.target.closest('label') || e.target.closest('.ops-action-row')) return;
        var tid = gpExpBtn.getAttribute('data-gp-expand-task');
        var panel = document.getElementById('gpTaskDetail_' + tid);
        if (!panel) return;
        // Accordion: close any other open detail panel first.
        var openPanels = document.querySelectorAll('.gp-task-detail');
        for (var pi = 0; pi < openPanels.length; pi++) {
          if (openPanels[pi].id !== 'gpTaskDetail_' + tid && openPanels[pi].style.display === 'block') openPanels[pi].style.display = 'none';
        }
        if (panel.style.display === 'none') {
          panel.style.display = 'block';
          loadGpTaskDetail(tid);
        } else {
          panel.style.display = 'none';
        }
        return;
      }

      // Toggle the email-triage panel on row click (port of admin 5981–5992): only when the
      // click isn't on a button/anchor/dropdown/the panel itself/a task-detail panel/a textarea,
      // so the row stays interactive. Persists open state in gpEmailPanels across re-renders.
      var etRow = e.target.closest('[data-task-row]');
      if (etRow && !e.target.closest('button') && !e.target.closest('a') && !e.target.closest('.st-dropdown') && !e.target.closest('.et-panel') && !e.target.closest('.gp-task-detail') && !e.target.closest('textarea')) {
        var etTaskId = etRow.getAttribute('data-task-row');
        var etPanel = document.getElementById('et-panel-' + etTaskId);
        if (etPanel) {
          var etNowOpen = etPanel.style.display === 'none';
          etPanel.style.display = etNowOpen ? 'block' : 'none';
          if (!gpEmailPanels[etTaskId]) gpEmailPanels[etTaskId] = {};
          gpEmailPanels[etTaskId].open = etNowOpen;
          return;
        }
      }

      // Dropdown / guided-action items. Each closes the menu first, then dispatches.
      function closeAllDropdowns() {
        var dds = document.querySelectorAll('.st-dropdown.open');
        for (var k = 0; k < dds.length; k++) dds[k].classList.remove('open');
      }
      function findCeoTask(id) {
        var list = (gpDetailCache && gpDetailCache.tasks) || [];
        for (var k = 0; k < list.length; k++) { if (list[k] && list[k].id === id) return list[k]; }
        return null;
      }
      // ✓ Mark Complete — email_triage routes to the resolve flow (Task 3d.5) when available,
      // mirroring admin's data-complete-task handler; otherwise mark the task completed.
      var completeBtn = e.target.closest('[data-complete-task]');
      if (completeBtn) {
        var ctId = completeBtn.getAttribute('data-complete-task');
        var ctTask = findCeoTask(ctId);
        closeAllDropdowns();
        if (ctTask && ctTask.task_type === 'email_triage' && typeof ceoResolveEmailTask === 'function') {
          ceoResolveEmailTask(e, ctId);
        } else {
          ceoGpTaskAction(e, ctId, 'completed');
        }
        return;
      }
      // ▶ Start / In Progress
      var startBtn = e.target.closest('[data-start-task]');
      if (startBtn) { closeAllDropdowns(); ceoGpTaskAction(e, startBtn.getAttribute('data-start-task'), 'in_progress'); return; }
      // ⏳ Waiting on External (data-waiting carries the exact status)
      var waitBtn = e.target.closest('[data-set-waiting]');
      if (waitBtn) { closeAllDropdowns(); ceoGpTaskAction(e, waitBtn.getAttribute('data-set-waiting'), waitBtn.getAttribute('data-waiting') || 'waiting_on_external'); return; }
      // 💌 Send Nudge — reuse the existing CEO nudge modal (user id + GP name).
      var nudgeItem = e.target.closest('[data-case-nudge]');
      if (nudgeItem) { closeAllDropdowns(); openNudgeModal(nudgeItem.getAttribute('data-case-nudge') || '', nudgeItem.getAttribute('data-nudge-name') || ''); return; }
      // 🚨 Escalate to CEO — reuse the existing CEO escalate handler.
      var escBtn = e.target.closest('[data-escalate-ceo]');
      if (escBtn) { closeAllDropdowns(); ceoGpTaskEscalate(e, escBtn.getAttribute('data-escalate-ceo')); return; }
      // Primary guided-action button (port of admin's data-guided-action dispatch). Maps the
      // getGuidedAction action to the reusable CEO handler; doc-review/SPPA/practice actions
      // whose dedicated views land in Tasks 3d.5/3d.6 are dispatched via typeof guards and
      // otherwise direct the reviewer to the Documents tab rather than fabricating behaviour.
      var guidedBtn = e.target.closest('[data-guided-action]');
      if (guidedBtn) {
        var gAction = guidedBtn.getAttribute('data-guided-action');
        var gTaskId = guidedBtn.getAttribute('data-task-id');
        var gTask = findCeoTask(gTaskId);
        if (gAction === 'completeTask') { ceoGpTaskAction(e, gTaskId, 'completed'); return; }
        if (gAction === 'resolveEmail') {
          if (typeof ceoResolveEmailTask === 'function') ceoResolveEmailTask(e, gTaskId);
          else ceoGpTaskAction(e, gTaskId, 'completed');
          return;
        }
        if (gAction === 'openWhatsApp') {
          var waUrl = gTask ? (gTask.doubletick_conversation_url || gTask.whatsapp_link || '') : '';
          if (ceoIsDtUrl(waUrl)) window.open(waUrl, '_blank', 'noopener');
          else showToast('No WhatsApp conversation link for this GP', 'error');
          return;
        }
        if (gAction === 'reviewFlaggedDoc') { ceoReviewFlaggedDoc(gTaskId); return; }
        if (gAction === 'previewDoc' || gAction === 'editPD') {
          showToast('This document is reviewed from the RSO admin tools', 'info');
          return;
        }
        if (gAction === 'sendSppa') {
          if (typeof ceoSendSppa === 'function') ceoSendSppa(gTaskId);
          else showToast('Open the Documents tab to send the SPPA-00', 'info');
          return;
        }
        if (gAction === 'checkSppaStatus') {
          if (typeof ceoCheckSppaStatus === 'function') ceoCheckSppaStatus(gTaskId);
          else showToast('Open the Documents tab to check Zoho Sign status', 'info');
          return;
        }
        if (gAction === 'emailPractice') {
          if (typeof ceoEmailPractice === 'function') ceoEmailPractice(gTaskId, guidedBtn.getAttribute('data-doc-key') || '');
          else showToast('Open the Documents tab to email the practice', 'info');
          return;
        }
        // Unknown action: fall back to marking the task complete.
        ceoGpTaskAction(e, gTaskId, 'completed');
        return;
      }
      // ── End ••• dropdown wiring ──────────────────────────────────────────────
      var toggleBtn = e.target.closest('#gpTasksToggle');
      if (toggleBtn) { gpTasksShowAll = !gpTasksShowAll; renderGpTasksTab(); return; }
      var docActionBtn = e.target.closest('[data-ceo-doc-action]');
      if (docActionBtn) {
        var taskId = docActionBtn.getAttribute('data-task');
        var action = docActionBtn.getAttribute('data-ceo-doc-action');
        if (action === 'approve') ceoDocApprove(taskId);
        else if (action === 'revise') ceoDocRequestRevision(taskId);
        return;
      }
      // Document preview: clicking a candidate-doc card opens the file in-app; clicking a
      // Drive-backed card (GP LINK / Other Files) opens a Drive preview. Skip when the click
      // is on an upload label / file input (the doc-action buttons return above).
      if (!e.target.closest('.ceo-doc-upload-btn') && !e.target.closest('input[type="file"]')) {
        var docViewEl = e.target.closest('[data-doc-view-url]');
        if (docViewEl) { ceoOpenDocViewer(docViewEl.getAttribute('data-doc-view-url') || '', docViewEl.getAttribute('data-doc-view-label') || 'Document'); return; }
        var drivePrevEl = e.target.closest('[data-drive-preview]');
        if (drivePrevEl) { ceoOpenDrivePreview(drivePrevEl.getAttribute('data-drive-preview') || '', drivePrevEl.getAttribute('data-drive-name') || 'Document', drivePrevEl.getAttribute('data-drive-mime') || '', drivePrevEl.getAttribute('data-drive-link') || ''); return; }
      }
      // Support board resolve/reopen — delegated so it survives board re-renders.
      var supportBtn = e.target.closest('[data-ceo-support-action]');
      if (supportBtn) {
        var ticketId = supportBtn.getAttribute('data-ticket');
        var supportAction = supportBtn.getAttribute('data-ceo-support-action');
        ceoSupportTicketAction(supportAction, ticketId, supportBtn);
        return;
      }
      var tabBtn = e.target.closest('.ceo-gp-detail-tab[data-gp-tab]');
      if (tabBtn) { renderGpDetailTab(tabBtn.getAttribute('data-gp-tab')); return; }
      // Nested Calls sub-tab switch — re-render from the cache, no re-fetch, stay on Calls.
      var callSubBtn = e.target.closest('[data-call-subtab]');
      if (callSubBtn) {
        gpCallsSubTab = callSubBtn.getAttribute('data-call-subtab');
        if (gpCallsCache) renderGpCallsPane(gpCallsCache.calls);
        return;
      }
    });

    // Documents upload delegation: the hidden file input lives inside a label button that
    // renderGpDocumentsPane re-renders, so delegate the change at document level to survive
    // re-renders. The task id is carried on the input's data-ceo-doc-upload attribute.
    document.addEventListener('change', function(e) {
      var uploadInput = e.target.closest('input[data-ceo-doc-upload]');
      if (uploadInput) { ceoDocUpload(uploadInput.getAttribute('data-ceo-doc-upload'), uploadInput); return; }
      var driveInput = e.target.closest('input[data-ceo-drive-upload]');
      if (driveInput) ceoDriveUpload(driveInput.getAttribute('data-ceo-drive-upload'), driveInput);
    });

    // Fetch + render this RSO's open ops tasks into #ceoOpsBoard, grouped by GP.
    function loadRsoOps(rsoId) {
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/ops').then(function(d) {
        var board = document.getElementById('ceoOpsBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-ops-section-head">Open Ops Tasks</div><div class="ceo-ops-empty">Failed to load ops tasks: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var tasks = d.tasks || [];
        var head = '<div class="ceo-ops-section-head">Open Ops Tasks <span class="count">' + tasks.length + '</span></div>';
        if (!tasks.length) { board.innerHTML = head + '<div class="ceo-ops-empty">No open ops tasks for this RSO.</div>'; return; }

        // Group by gp_name, preserving the server's priority/due ordering within each group.
        var order = [];
        var groups = {};
        for (var i = 0; i < tasks.length; i++) {
          var t = tasks[i];
          var gp = t.gp_name || 'Unknown GP';
          if (!groups[gp]) { groups[gp] = { name: gp, gp_user_id: t.gp_user_id || null, case_id: t.case_id || null, items: [] }; order.push(gp); }
          groups[gp].items.push(t);
        }

        var html = head;
        for (var gi = 0; gi < order.length; gi++) {
          var grp = groups[order[gi]];
          html += '<div class="ceo-ops-group">';
          html += '<div class="ceo-ops-group-head" onclick="toggleOpsGroup(this)">';
          html += '<span class="ceo-ops-group-caret">&#x25BC;</span>';
          html += '<span class="ceo-ops-group-name">' + esc(grp.name) + '</span>';
          html += '<span class="ceo-ops-group-count">' + grp.items.length + ' task' + (grp.items.length === 1 ? '' : 's') + '</span>';
          if (grp.case_id) html += '<button class="btn" onclick="ceoOpsOpenGp(event, \'' + esc(grp.case_id) + '\', \'' + esc(rsoId) + '\')">Open GP</button>';
          html += '</div>';
          html += '<div class="ceo-ops-group-body">';
          for (var ti = 0; ti < grp.items.length; ti++) {
            var task = grp.items[ti];
            var due = opsDueIndicator(task.due_date);
            html += '<div class="ceo-ops-row" id="ceoOpsRow_' + esc(task.id) + '">';
            html += '<div class="ceo-ops-row-main">';
            html += '<div class="ceo-ops-row-title">' + esc(task.title || '(untitled task)') + '</div>';
            var subBits = [];
            if (task.task_type) subBits.push(esc(task.task_type.replace(/_/g, ' ')));
            if (task.priority && task.priority !== 'normal') subBits.push(esc(task.priority));
            html += '<div class="ceo-ops-row-sub">' + (subBits.length ? subBits.join(' &middot; ') : '&mdash;') + '</div>';
            html += '</div>';
            html += '<span class="ceo-ops-due' + (due.overdue ? ' overdue' : '') + '">' + esc(due.label) + '</span>';
            html += '<div class="ceo-ops-actions">';
            if ((task.task_type || '').indexOf('email') >= 0 && task.gmail_thread_id) {
              html += '<button class="btn btn-blue" onclick="ceoOpsViewEmail(event, \'' + esc(task.gmail_thread_id) + '\')">View email</button>';
            }
            // Doc-review tasks get a real "Review Document" action (preview + approve/reject),
            // not just a blind "Mark done" — matches the admin ops queue.
            if (task.task_type === 'flagged_doc' || isQualDocReviewTask(task)) {
              html += '<button class="btn btn-blue" onclick="event.stopPropagation();ceoReviewFlaggedDoc(\'' + esc(task.id) + '\')">Review Document</button>';
            }
            html += '<button class="btn btn-green" onclick="ceoOpsMarkDone(event, \'' + esc(task.id) + '\', \'' + esc(rsoId) + '\')">Mark done</button>';
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoOpsBoard');
        if (board) board.innerHTML = '<div class="ceo-ops-section-head">Open Ops Tasks</div><div class="ceo-ops-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Format a scheduled-call timestamp for display (en-AU). Returns '--' if absent/invalid.
    function fmtCallTime(iso) {
      if (!iso) return '--';
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '--';
      try {
        return new Date(t).toLocaleString('en-AU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return new Date(t).toLocaleString();
      }
    }

    // Status pill for a scheduled call, reusing the dashboard .pill tokens.
    function callStatusPill(status) {
      var s = (status || '').toLowerCase();
      var map = {
        invited: { cls: 'pill-amber', label: 'Invited' },
        booked: { cls: 'pill-blue', label: 'Booked' },
        completed: { cls: 'pill-green', label: 'Completed' },
        cancelled: { cls: 'pill-red', label: 'Cancelled' },
        no_show: { cls: 'pill-red', label: 'No Show' }
      };
      var m = map[s] || { cls: 'pill-muted', label: (status || '').replace(/_/g, ' ') || '--' };
      return '<span class="pill ' + m.cls + '">' + esc(m.label) + '</span>';
    }

    // Fetch + render this RSO's scheduled calls into #ceoCallsBoard, grouped by status.
    function loadRsoCalls(rsoId) {
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/calls').then(function(d) {
        var board = document.getElementById('ceoCallsBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-calls-section-head">Scheduled Calls</div><div class="ceo-calls-empty">Failed to load calls: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        // Hide abandoned booking drafts (cancelled, never scheduled, never booked) — the same
        // cleanup applied to the per-GP Calls tab (3e7e72c). They have no name/date/email and
        // only surface here as junk "Unknown GP / Past & other" rows. Filter BEFORE the header
        // count so the count keeps matching the rows shown.
        var calls = (d.calls || []).filter(function(call) {
          return !((call.status || '').toLowerCase() === 'cancelled' && !call.scheduled_at && !call.booked_at);
        });
        var head = '<div class="ceo-calls-section-head">Scheduled Calls <span class="count">' + calls.length + '</span></div>';
        if (!calls.length) { board.innerHTML = head + '<div class="ceo-calls-empty">No scheduled calls for this RSO.</div>'; return; }

        // Group calls by state. This board is an "ops / what-needs-doing" view, so it renders
        // only the actionable groups (Upcoming + Awaiting booking) and the header count matches
        // exactly those shown. Completed/cancelled/no-show are computed but NOT rendered here —
        // they're history and live on the per-GP file's Calls tab.
        var now = Date.now();
        var groups = { upcoming: [], awaiting: [], completed: [], other: [] };
        for (var i = 0; i < calls.length; i++) {
          var call = calls[i];
          var st = (call.status || '').toLowerCase();
          var schedMs = call.scheduled_at ? new Date(call.scheduled_at).getTime() : NaN;
          var hasFuture = !isNaN(schedMs) && schedMs >= now;
          if ((st === 'booked' || st === 'invited') && hasFuture) {
            groups.upcoming.push(call);
          } else if (st === 'invited' && isNaN(schedMs)) {
            groups.awaiting.push(call);
          } else if (st === 'completed') {
            groups.completed.push(call);
          } else {
            groups.other.push(call);
          }
        }

        var sections = [
          { key: 'upcoming', title: 'Upcoming', items: groups.upcoming },
          { key: 'awaiting', title: 'Awaiting booking', items: groups.awaiting }
        ];
        // Header count reflects only the actionable calls actually shown.
        var shownCount = groups.upcoming.length + groups.awaiting.length;
        head = '<div class="ceo-calls-section-head">Scheduled Calls <span class="count">' + shownCount + '</span></div>';

        var html = head;
        var rendered = 0;
        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec.items.length) continue;
          rendered += sec.items.length;
          html += '<div class="ceo-calls-group">';
          html += '<div class="ceo-calls-group-head">';
          html += '<span class="ceo-calls-group-name">' + esc(sec.title) + '</span>';
          html += '<span class="ceo-calls-group-count">' + sec.items.length + ' call' + (sec.items.length === 1 ? '' : 's') + '</span>';
          html += '</div>';
          html += '<div class="ceo-calls-group-body">';
          for (var ci = 0; ci < sec.items.length; ci++) {
            var c2 = sec.items[ci];
            var gpName = c2.invitee_name || c2.gp_name || c2.invitee_email || 'Unknown GP';
            var timeLabel = c2.scheduled_at ? fmtCallTime(c2.scheduled_at) : 'Not yet booked';
            var subBits = [];
            if (c2.stage) subBits.push(esc(c2.stage));
            if (c2.invitee_email && gpName !== c2.invitee_email) subBits.push(esc(c2.invitee_email));
            html += '<div class="ceo-calls-row">';
            html += '<div class="ceo-calls-row-main">';
            html += '<div class="ceo-calls-row-name">' + esc(gpName) + '</div>';
            html += '<div class="ceo-calls-row-sub">' + (subBits.length ? subBits.join(' &middot; ') : '&mdash;') + '</div>';
            html += '</div>';
            html += '<span class="ceo-calls-time">' + esc(timeLabel) + '</span>';
            html += callStatusPill(c2.status);
            html += '<div class="ceo-calls-actions">';
            // Only offer "Join" for calls that are still joinable (upcoming/booked or
            // awaiting booking) — a completed/cancelled/no-show call keeps its link but
            // can't be joined.
            if (c2.zoom_join_url && ['booked', 'invited'].indexOf((c2.status || '').toLowerCase()) !== -1) {
              html += '<a class="ceo-calls-join" href="' + esc(c2.zoom_join_url) + '" target="_blank" rel="noopener">Join</a>';
            }
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        if (!rendered) { board.innerHTML = head + '<div class="ceo-calls-empty">No upcoming or awaiting calls for this RSO.</div>'; return; }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoCallsBoard');
        if (board) board.innerHTML = '<div class="ceo-calls-section-head">Scheduled Calls</div><div class="ceo-calls-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Track the RSO whose support board is currently open, so the resolve/reopen
    // delegated handler can re-fetch + re-render the right board after an action.
    var ceoSupportRsoId = null;

    // Status pill for a support ticket (open/closed), reusing the dashboard .pill tokens.
    function supportStatusPill(status) {
      var s = (status || '').toLowerCase();
      if (s === 'open') return '<span class="pill pill-amber">Open</span>';
      if (s === 'closed') return '<span class="pill pill-green">Resolved</span>';
      return '<span class="pill pill-muted">' + esc(status || '--') + '</span>';
    }

    // Category pill for a support ticket.
    function supportCategoryPill(category) {
      if (!category) return '';
      return '<span class="pill pill-muted">' + esc(String(category).replace(/_/g, ' ')) + '</span>';
    }

    // Best-effort one-line snippet for a ticket: prefer the body, else the last
    // thread_json message text. Trimmed to a readable length.
    function supportSnippet(t) {
      var text = '';
      if (t.body && String(t.body).trim()) {
        text = String(t.body).trim();
      } else if (Array.isArray(t.thread_json) && t.thread_json.length) {
        var last = t.thread_json[t.thread_json.length - 1];
        text = (last && last.text) ? String(last.text).trim() : '';
      }
      if (!text) return '';
      if (text.length > 160) text = text.slice(0, 159) + '…';
      return text;
    }

    // Fetch + render this RSO's case-linked support tickets into #ceoSupportBoard,
    // grouped into Open (status open) and Resolved (status closed).
    function loadRsoSupport(rsoId) {
      ceoSupportRsoId = rsoId;
      apiFetch('/api/ceo/rso/' + encodeURIComponent(rsoId) + '/support').then(function(d) {
        var board = document.getElementById('ceoSupportBoard');
        if (!board) return;
        if (!d || !d.ok) {
          board.innerHTML = '<div class="ceo-support-section-head">Support Tickets</div><div class="ceo-support-empty">Failed to load support tickets: ' + esc((d && d.message) || 'Unknown error') + '</div>';
          return;
        }
        var tickets = d.tickets || [];
        var head = '<div class="ceo-support-section-head">Support Tickets <span class="count">' + tickets.length + '</span></div>';
        if (!tickets.length) { board.innerHTML = head + '<div class="ceo-support-empty">No case-linked support tickets for this RSO.</div>'; return; }

        var groups = { open: [], closed: [] };
        for (var i = 0; i < tickets.length; i++) {
          var st = (tickets[i].status || '').toLowerCase();
          if (st === 'closed') groups.closed.push(tickets[i]);
          else groups.open.push(tickets[i]);
        }

        var sections = [
          { key: 'open', title: 'Open', items: groups.open },
          { key: 'closed', title: 'Resolved', items: groups.closed }
        ];

        var html = head;
        var rendered = 0;
        for (var si = 0; si < sections.length; si++) {
          var sec = sections[si];
          if (!sec.items.length) continue;
          rendered += sec.items.length;
          html += '<div class="ceo-support-group">';
          html += '<div class="ceo-support-group-head">';
          html += '<span class="ceo-support-group-name">' + esc(sec.title) + '</span>';
          html += '<span class="ceo-support-group-count">' + sec.items.length + ' ticket' + (sec.items.length === 1 ? '' : 's') + '</span>';
          html += '</div>';
          html += '<div class="ceo-support-group-body">';
          for (var ti = 0; ti < sec.items.length; ti++) {
            var t = sec.items[ti];
            var isOpen = (t.status || '').toLowerCase() !== 'closed';
            var snippet = supportSnippet(t);
            html += '<div class="ceo-support-row">';
            html += '<div class="ceo-support-row-main">';
            html += '<div class="ceo-support-row-title">' + esc(t.title || '(untitled ticket)') + '</div>';
            html += '<div class="ceo-support-row-gp">' + esc(t.gp_name || 'Unknown GP') + (t.practice_name ? ' &middot; ' + esc(t.practice_name) : '') + '</div>';
            if (snippet) html += '<div class="ceo-support-row-snippet">' + esc(snippet) + '</div>';
            html += '<div class="ceo-support-row-pills">';
            html += supportStatusPill(t.status);
            html += supportCategoryPill(t.category);
            if (t.priority) html += priorityPill(t.priority);
            html += '</div>';
            html += '</div>';
            html += '<span class="ceo-support-time">' + esc(fmtCallTime(t.created_at)) + '</span>';
            html += '<div class="ceo-support-actions">';
            if (isOpen) {
              html += '<button class="btn btn-green" data-ceo-support-action="resolve" data-ticket="' + esc(t.id) + '">Resolve</button>';
            } else {
              html += '<button class="btn btn-amber" data-ceo-support-action="reopen" data-ticket="' + esc(t.id) + '">Reopen</button>';
            }
            html += '</div>';
            html += '</div>';
          }
          html += '</div></div>';
        }
        if (!rendered) { board.innerHTML = head + '<div class="ceo-support-empty">No open or resolved support tickets for this RSO.</div>'; return; }
        board.innerHTML = html;
      }).catch(function(e) {
        var board = document.getElementById('ceoSupportBoard');
        if (board) board.innerHTML = '<div class="ceo-support-section-head">Support Tickets</div><div class="ceo-support-empty">Error: ' + esc(e.message) + '</div>';
      });
    }

    // Resolve/reopen a support ticket via the existing admin ticket-update endpoint
    // (reused, unchanged), then re-fetch + re-render the open RSO's support board.
    function ceoSupportTicketAction(action, ticketId, btn) {
      var newStatus = action === 'resolve' ? 'closed' : 'open';
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/va/ticket/' + encodeURIComponent(ticketId), {
        method: 'PUT',
        body: { status: newStatus }
      }).then(function(d) {
        if (d && d.ok) {
          showToast(action === 'resolve' ? 'Ticket resolved' : 'Ticket reopened', 'success');
          if (ceoSupportRsoId) loadRsoSupport(ceoSupportRsoId);
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Due/overdue indicator for an ops row. Returns { label, overdue }.
    function opsDueIndicator(due) {
      if (!due) return { label: 'No due date', overdue: false };
      var dueMs = new Date(due).getTime();
      if (isNaN(dueMs)) return { label: 'No due date', overdue: false };
      var diffDays = Math.floor((dueMs - Date.now()) / 86400000);
      if (diffDays < 0) return { label: 'Overdue ' + Math.abs(diffDays) + 'd', overdue: true };
      if (diffDays === 0) return { label: 'Due today', overdue: true };
      return { label: 'Due in ' + diffDays + 'd', overdue: false };
    }

    // Collapse/expand a GP ops group.
    function toggleOpsGroup(headEl) {
      var grp = headEl.closest('.ceo-ops-group');
      if (grp) grp.classList.toggle('collapsed');
    }

    // View email: open the Gmail thread in a new tab.
    function ceoOpsViewEmail(ev, threadId) {
      if (ev) ev.stopPropagation();
      if (!threadId) { showToast('No email thread linked to this task.', 'error'); return; }
      window.open('https://mail.google.com/mail/u/0/#all/' + encodeURIComponent(threadId), '_blank');
    }

    // Mark an ops task done via the existing admin task-update endpoint, then refresh the board.
    function ceoOpsMarkDone(ev, taskId, rsoId) {
      if (ev) ev.stopPropagation();
      var btn = ev && ev.target ? ev.target : null;
      if (btn) btn.disabled = true;
      apiFetch('/api/admin/task?id=' + encodeURIComponent(taskId), {
        method: 'PUT',
        body: { status: 'completed' }
      }).then(function(d) {
        if (d && d.ok) {
          showToast('Task marked done', 'success');
          loadRsoOps(rsoId);
        } else {
          showToast('Failed: ' + ((d && d.message) || 'Unknown error'), 'error');
          if (btn) btn.disabled = false;
        }
      }).catch(function(e) {
        showToast('Error: ' + e.message, 'error');
        if (btn) btn.disabled = false;
      });
    }

    // Open this GP's full file (defaults to the Tasks sub-tab, where every task has its
    // full guided actions + Review Document flow + detail panels).
    function ceoOpsOpenGp(ev, caseId, rsoId) {
      if (ev) ev.stopPropagation();
      if (!caseId) { showToast('No case linked to this GP.', 'error'); return; }
      gpDetailTab = 'tasks';
      openGpDetail(caseId, rsoId);
    }

    /* ═══ INIT ═══ */
    (function init() {
      // Watchdog: if the dashboard still hasn't rendered after 12s, replace the
      // spinner with an honest error + recovery actions (never hang forever).
      var loadWatchdog = setTimeout(function() {
        if (!dashboardData && document.getElementById('pageLoading')) {
          renderLoadError('The dashboard is taking longer than expected to load.');
        }
      }, 12000);
      function startLoops() {
        clearTimeout(loadWatchdog);
        startRefreshLoop();
        refreshLabelTimerId = setInterval(updateRefreshLabel, 1000);
      }
      checkAuth().then(function(ok) {
        if (!ok) {
          // Not authorised. Non-embedded already redirects to sign-in inside
          // checkAuth; embedded can't redirect, so surface why instead of spinning.
          clearTimeout(loadWatchdog);
          if (isEmbedded) renderLoadError('Your admin session has expired. Please sign in again.');
          return;
        }
        // Load dashboard + trends in parallel. loadRsoRoster is guarded so a roster
        // hiccup can never block the loop from starting.
        Promise.all([
          refreshDashboard(),
          refreshTrends(),
          Promise.resolve(loadRsoRoster()).catch(function() {})
        ]).then(startLoops, startLoops);
      }).catch(function() {
        clearTimeout(loadWatchdog);
        if (isEmbedded) renderLoadError('Couldn’t verify your session.');
      });
    })();
  </script>
