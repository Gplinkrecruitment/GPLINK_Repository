  <style>
    :root {
      --bg: var(--gp-canvas);
      --text: var(--gp-ink);
      --muted: var(--gp-muted);
      --blue: var(--gp-blue);
      --blue2: var(--gp-blue-deep);
      --shadow-soft: var(--gp-shadow-sm);
      --glass-bg: var(--gp-glass-bg);
      --glass-border: var(--gp-glass-border);
      --glass-shadow: var(--gp-shadow-sm);
      --radius-lg: 20px;
      --app-shell-top-offset: 0px;
      --app-shell-frame-top: 0px;
      --gp-frame-top: 87px;
      --app-shell-bottom-offset: 0px;
      --app-shell-nav-clearance: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--gp-font-body);
      background:
        radial-gradient(880px 520px at 10% -10%, rgba(37, 99, 235, 0.10), transparent 56%),
        radial-gradient(760px 460px at 100% 0%, rgba(29, 78, 216, 0.10), transparent 58%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app-shell-desktop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1200;
      padding: 4px 24px 0;
      pointer-events: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .app-shell-desktop-inner {
      pointer-events: auto;
    }

    .topbar {
      margin: 0;
      padding: 8px 16px;
      border-radius: var(--radius-lg);
      border: 1px solid;
      border-color: var(--gp-glass-border);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      background: var(--gp-glass-bg);
      backdrop-filter: var(--gp-glass-blur);
      -webkit-backdrop-filter: var(--gp-glass-blur);
      box-shadow: var(--gp-shadow-sm);
      isolation: isolate;
      will-change: transform;
    }

    .topbar-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      min-height: 44px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo img {
      display: block;
      width: 178px;
      height: auto;
    }

    .nav-menu {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px;
      border-radius: 14px;
    }

    .nav-item {
      position: relative;
      z-index: 2;
      transition: color var(--gp-dur) var(--gp-ease);
    }

    .nav-item:focus-visible,
    .mobile-tab:focus-visible,
    .mobile-reg-close:focus-visible,
    .mobile-step-head:focus-visible {
      outline: none;
      box-shadow: var(--gp-focus-ring);
    }


    .nav-link,
    .account-pill {
      min-width: 92px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--gp-text);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.15;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }


    .nav-link.active,
    .account-pill.active {
      color: var(--gp-blue-deep);
      font-weight: 700;
    }

    .nav-icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      color: var(--gp-muted);
      transition: color var(--gp-dur) var(--gp-ease);
    }

    .nav-link.active .nav-icon,
    .account-pill.active .nav-icon {
      color: var(--gp-blue-deep);
    }

    .nav-icon-wrap {
      position: relative;
      display: inline-grid;
      place-items: center;
      line-height: 1;
    }

    .nav-alert,
    .mobile-tab-alert {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      background: var(--gp-red);
      box-shadow: 0 6px 12px -10px rgba(220, 38, 38, 0.95);
      pointer-events: none;
      z-index: 2;
    }

    .nav-glass {
      position: absolute;
      top: 0;
      left: 0;
      width: 96px;
      height: 44px;
      opacity: 0;
      border-radius: 12px;
      background: var(--gp-glass-bg);
      border: 1px solid;
      border-color: var(--gp-glass-border);
      box-shadow: var(--gp-shadow-sm);
      backdrop-filter: var(--gp-glass-blur);
      -webkit-backdrop-filter: var(--gp-glass-blur);
      pointer-events: none;
      transition: left var(--gp-dur) var(--gp-ease), top var(--gp-dur) var(--gp-ease), width var(--gp-dur) var(--gp-ease), height var(--gp-dur) var(--gp-ease), opacity var(--gp-dur-fast) var(--gp-ease);
      z-index: 1;
    }

    .app-shell-frame-stack {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--gp-frame-top);
      bottom: 0;
      width: 100%;
      height: calc(100dvh - var(--gp-frame-top));
      overflow: hidden;
      z-index: 1;
      background: var(--gp-canvas);
    }

    .app-shell-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--gp-canvas);
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease;
      z-index: 1;
    }

    .app-shell-frame.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .app-shell-frame.is-leaving {
      opacity: 0;
      z-index: 1;
    }

    .app-shell-loading .app-shell-frame {
      visibility: hidden !important;
      opacity: 0 !important;
    }

    .mobile-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      display: none;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      overflow: hidden;
      isolation: isolate;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      background: var(--gp-glass-bg);
      backdrop-filter: var(--gp-glass-blur);
      -webkit-backdrop-filter: var(--gp-glass-blur);
      box-shadow: var(--gp-shadow-sm);
      z-index: 1200;
    }

    .mobile-reg-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 1240;
    }

    .mobile-reg-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-reg-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 74vh;
      overflow: auto;
      padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--gp-border);
      border-radius: 20px 20px 0 0;
      background: var(--gp-surface);
      box-shadow: var(--gp-shadow-lg);
      opacity: 0;
      transform: translate3d(0, calc(100% + 18px), 0);
      transition: transform .32s var(--gp-ease), opacity .22s ease;
      touch-action: pan-y;
      will-change: transform, opacity;
      z-index: 1241;
    }

    .mobile-reg-sheet.show {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .mobile-reg-grab {
      width: 40px;
      height: 4px;
      margin: 4px auto 10px;
      border-radius: 999px;
      background: var(--gp-border-strong);
    }

    .mobile-reg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .mobile-reg-title {
      margin: 0;
      font-family: var(--gp-font-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--gp-ink);
      text-transform: none;
    }

    .mobile-reg-close {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--gp-surface-sunken);
      color: var(--gp-muted);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .mobile-reg-table {
      display: grid;
      gap: 6px;
    }

    .mobile-reg-table .reg-row {
      grid-template-columns: 1fr auto;
    }

    .mobile-reg-table .reg-btn,
    .mobile-step-body .reg-btn {
      grid-column: 1 / -1;
      width: 100%;
      margin-top: 0;
      padding: 7px 12px;
      font-size: 11px;
      text-align: center;
    }

    .mobile-step-card {
      overflow: hidden;
      border: 1px solid var(--gp-border);
      border-radius: 12px;
      background: var(--gp-surface);
    }

    .mobile-step-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .mobile-step-title {
      font-size: 13px;
      font-weight: 700;
    }

    .mobile-step-caret {
      color: var(--gp-faint);
      font-size: 12px;
      font-weight: 800;
      transition: transform .2s ease;
    }

    .mobile-step-card.open .mobile-step-caret {
      transform: rotate(180deg);
    }

    .mobile-step-body {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid var(--gp-border);
    }

    .mobile-step-copy {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--gp-text);
    }

    .mobile-step-status {
      font-size: 12px;
      font-weight: 500;
      color: var(--gp-text);
    }

    .mobile-nav-glass {
      position: absolute;
      top: 10px;
      left: 14px;
      width: 0;
      height: 0;
      opacity: 0;
      border-radius: 16px;
      background: var(--gp-glass-bg);
      border: 1px solid;
      border-color: var(--gp-glass-border);
      box-shadow: var(--gp-shadow-sm);
      backdrop-filter: var(--gp-glass-blur);
      -webkit-backdrop-filter: var(--gp-glass-blur);
      pointer-events: none;
      transition:
        left var(--gp-dur) var(--gp-ease),
        top var(--gp-dur) var(--gp-ease),
        width var(--gp-dur) var(--gp-ease),
        height var(--gp-dur) var(--gp-ease),
        opacity var(--gp-dur-fast) var(--gp-ease);
      z-index: 1;
    }

    .mobile-tab {
      position: relative;
      z-index: 2;
      border: 0;
      background: transparent;
      color: var(--gp-muted);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 62px;
      border-radius: 16px;
      text-decoration: none;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 4px;
      line-height: 1.1;
      cursor: pointer;
      transition: color var(--gp-dur) var(--gp-ease), transform var(--gp-dur) var(--gp-ease);
    }

    .mobile-tab-icon {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 12px;
      color: currentColor;
      transition: color var(--gp-dur) var(--gp-ease), transform var(--gp-dur) var(--gp-ease);
    }

    .mobile-tab-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mobile-tab-label {
      display: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .mobile-tab-active {
      color: var(--gp-blue-deep);
      transform: translateY(-1px);
    }

    .mobile-tab-active .mobile-tab-icon {
      color: var(--gp-blue-deep);
      transform: translateY(-1px);
    }

    .mobile-tab-active .mobile-tab-label {
      display: block;
    }

    .mobile-tab-scan {
      color: #ffffff;
      background: var(--gp-grad-brand);
      width: 58px;
      min-width: 58px;
      height: 58px;
      min-height: 58px;
      padding: 0;
      gap: 0;
      border-radius: 999px;
      justify-self: center;
      align-self: center;
      box-shadow: 0 8px 20px -10px rgba(29, 78, 216, .55);
      animation: scanPulse 2.6s ease-out infinite;
    }

    .mobile-tab-scan .mobile-tab-icon {
      width: 58px;
      height: 58px;
      border-radius: inherit;
      color: #ffffff;
    }

    .mobile-tab-scan .mobile-tab-icon svg {
      width: 22px;
      height: 22px;
    }

    .mobile-tab-scan .mobile-tab-label {
      display: none !important;
    }

    @keyframes scanPulse {
      0% {
        transform: scale(1);
        box-shadow:
          0 0 0 0 rgba(37, 99, 235, 0.22),
          0 8px 20px -10px rgba(29, 78, 216, .55);
      }
      65% {
        transform: scale(1.02);
        box-shadow:
          0 0 0 10px rgba(37, 99, 235, 0),
          0 10px 22px -10px rgba(29, 78, 216, .6);
      }
      100% {
        transform: scale(1);
        box-shadow:
          0 0 0 0 rgba(37, 99, 235, 0),
          0 8px 20px -10px rgba(29, 78, 216, .55);
      }
    }

    @media (max-width: 859px) {
      .app-shell-desktop {
        display: none;
      }

      .mobile-nav {
        display: grid;
      }
    }

    @media (min-width: 860px) {
      .mobile-nav {
        display: none !important;
      }
    }

/* ── Skeleton screen ── */
.gp-skeleton-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: var(--gp-canvas);
  overflow: hidden;
}
.gp-skeleton-overlay .sk-hero {
  height: 120px;
  background: var(--gp-grad-hero);
  border-radius: 0 0 20px 20px;
  position: relative;
  overflow: hidden;
  padding: 24px 20px;
}
.gp-skeleton-overlay .sk-hero::before {
  content: "";
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-size: 200px; opacity: 0.5; pointer-events: none;
}
.gp-skeleton-overlay .sk-hero-row { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.gp-skeleton-overlay .sk-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.gp-skeleton-overlay .sk-lines { display: flex; flex-direction: column; gap: 6px; }
.gp-skeleton-overlay .sk-line { height: 12px; border-radius: 6px; }
.gp-skeleton-overlay .sk-line-dark { background: rgba(255,255,255,0.12); }
.gp-skeleton-overlay .sk-line-light { background: var(--gp-border); }
.gp-skeleton-overlay .sk-w1 { width: 120px; }
.gp-skeleton-overlay .sk-w2 { width: 80px; }
.gp-skeleton-overlay .sk-w3 { width: 55%; }
.gp-skeleton-overlay .sk-w4 { width: 85%; }
.gp-skeleton-overlay .sk-w5 { width: 60%; }
.gp-skeleton-overlay .sk-w6 { width: 70%; }
.gp-skeleton-overlay .sk-w7 { width: 50%; }
.gp-skeleton-overlay .sk-progress { margin-top: 16px; position: relative; z-index: 1; }
.gp-skeleton-overlay .sk-progress-bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.08); width: 100%; }
.gp-skeleton-overlay .sk-progress-fill { height: 10px; border-radius: 5px; background: rgba(37,99,235,0.5); width: 40%; margin-top: -10px; }
.gp-skeleton-overlay .sk-tabs { display: flex; border-bottom: 1px solid var(--gp-border); }
.gp-skeleton-overlay .sk-tab { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; }
.gp-skeleton-overlay .sk-tab-inner { width: 60px; height: 12px; border-radius: 6px; background: var(--gp-border); }
.gp-skeleton-overlay .sk-tab.active { border-bottom: 2px solid var(--gp-blue-deep); }
.gp-skeleton-overlay .sk-tab.active .sk-tab-inner { background: rgba(37,99,235,0.3); }
.gp-skeleton-overlay .sk-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.gp-skeleton-overlay .sk-block { border-radius: 12px; background: var(--gp-border); height: 14px; }
.gp-skeleton-overlay .sk-card {
  background: var(--gp-surface); border: 1px solid var(--gp-border); border-radius: 14px;
  padding: 18px; display: flex; align-items: center; gap: 10px;
}
.gp-skeleton-overlay .sk-card-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--gp-surface-sunken); flex-shrink: 0; }
.gp-skeleton-overlay .sk-card-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.gp-skeleton-overlay .sk-card-line { height: 10px; border-radius: 5px; background: var(--gp-surface-sunken); }
.gp-skeleton-overlay .sk-btn { width: 100%; height: 44px; border-radius: 10px; background: rgba(37,99,235,0.15); }
@keyframes gp-shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.sk-shimmer {
  background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
  background-size: 400px 100%; background-repeat: no-repeat;
  animation: gp-shimmer 1.6s ease-in-out infinite;
}
.sk-shimmer-dark {
  background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  background-size: 400px 100%; background-repeat: no-repeat;
  animation: gp-shimmer 1.6s ease-in-out infinite;
}
/* ── Mobile slide-in ── */
@keyframes gp-slide-in {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.gp-frame-slide-in {
  animation: gp-slide-in 250ms ease-out forwards;
}

      <header class="topbar">
