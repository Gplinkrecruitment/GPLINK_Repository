  <style>
    :root {
      --ink: var(--gp-ink);
      --ink-soft: var(--gp-text);
      --ink-muted: var(--gp-muted);
      --surface: var(--gp-canvas);
      --surface-raised: var(--gp-surface);
      --border: var(--gp-border);
      --border-light: var(--gp-surface-sunken);
      --accent: var(--gp-blue);
      --success: var(--gp-green);
      --warn-border: var(--gp-amber-border);
      --warn-text: var(--gp-amber);
      --hero-from: var(--gp-hero-ink);
      --sp-1: var(--gp-sp-1); --sp-2: var(--gp-sp-2); --sp-3: var(--gp-sp-3); --sp-4: var(--gp-sp-4);
      --sp-5: var(--gp-sp-5); --sp-6: var(--gp-sp-6); --sp-7: 28px; --sp-8: var(--gp-sp-8);
      --sp-10: var(--gp-sp-10); --sp-12: 48px;
      --font-heading: var(--gp-font-display);
      --font-body: var(--gp-font-body);
      --radius: var(--gp-r-lg);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    h1, h2, h3, h4, p { overflow-wrap: anywhere; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--gp-ink);
      background: var(--gp-canvas);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- COMPACT DARK HEADER ---- */
    .hero-compact {
      background: var(--gp-grad-hero);
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      position: relative;
    }
    .hero-compact::before {
      content: "";
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px;
      opacity: 0.5;
      pointer-events: none;
    }
    .hero-compact-pad {
      position: relative;
      z-index: 1;
      padding: var(--sp-5) var(--sp-7) var(--sp-5);
    }

    /* ---- HEADER ROW ---- */
    .hero-header {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .hero-left { display: flex; align-items: center; gap: var(--sp-3); }
    .hero-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--gp-grad-brand);
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px -2px rgba(29, 78, 216, 0.45);
    }
    .hero-name {
      font-family: var(--gp-font-body);
      font-size: 15px; font-weight: 700; color: #fff;
    }
    .hero-sub-text {
      font-family: var(--gp-font-body);
      font-size: 12px; color: rgba(255,255,255,0.78);
      font-weight: 500; margin-top: 2px;
    }
    .hero-icons { display: flex; gap: var(--sp-2); }
    .hero-icon-btn {
      width: 36px; height: 36px; border-radius: var(--gp-r-sm);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      display: grid; place-items: center;
      cursor: pointer; position: relative;
      transition: transform var(--gp-dur) var(--gp-ease), box-shadow var(--gp-dur) var(--gp-ease), background-color var(--gp-dur) var(--gp-ease), color var(--gp-dur) var(--gp-ease), border-color var(--gp-dur) var(--gp-ease);
      color: rgba(255,255,255,0.5);
    }
    .hero-icon-btn:hover { background: rgba(255,255,255,0.1); }
    .hero-icon-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.85);
      outline-offset: 2px;
    }
    .hero-icon-btn svg {
      width: 18px; height: 18px; stroke: currentColor;
      fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-badge {
      position: absolute; top: -4px; right: -4px;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--gp-red); color: #fff;
      font-size: 9px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid var(--gp-hero-ink);
    }

    /* ---- CENTERED CONTENT ---- */
    .reg-intro-content {
      background: var(--gp-canvas);
      min-height: calc(100dvh - 120px);
      display: grid;
      place-items: center;
      padding: 0 20px 40px;
    }
    .reg-intro-inner {
      text-align: center;
      max-width: 400px;
    }
    .reg-intro-title {
      font-family: var(--gp-font-display);
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 600;
      color: var(--gp-ink);
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: var(--sp-4);
      text-wrap: balance;
    }
    .reg-intro-lead {
      font-family: var(--gp-font-body);
      font-size: 1.1rem;
      color: var(--gp-muted);
      line-height: 1.4;
      max-width: 280px;
      margin: 0 auto;
    }
    .start-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: var(--gp-r-md);
      background: var(--gp-grad-brand);
      color: #fff;
      font-family: var(--gp-font-body);
      font-size: 15px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 8px 20px -10px rgba(29, 78, 216, 0.55);
      transition: transform var(--gp-dur) var(--gp-ease), box-shadow var(--gp-dur) var(--gp-ease), background-color var(--gp-dur) var(--gp-ease), color var(--gp-dur) var(--gp-ease), border-color var(--gp-dur) var(--gp-ease);
    }
    .start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -10px rgba(29, 78, 216, 0.65);
    }
    .start-btn:focus-visible {
      outline: none;
      box-shadow: 0 8px 20px -10px rgba(29, 78, 216, 0.55), var(--gp-focus-ring);
    }
    .start-btn:active {
      transform: translateY(0) scale(0.99);
    }
    .start-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .reg-intro-note {
      font-family: var(--gp-font-body);
      font-size: 13px;
      color: var(--gp-muted);
      margin-top: var(--sp-4);
      line-height: 1.45;
    }

    /* ---- RESPONSIVE ---- */
    @media (min-width: 861px) {
      .hero-compact { display: none; }
    }
    @media (max-width: 860px) {
      .hero-compact {
        position: sticky; top: 0; z-index: 100;
        border-radius: 0 0 16px 16px;
      }
      .hero-compact-pad {
        padding: var(--gp-sp-4) var(--gp-sp-5) var(--gp-sp-4);
      }
      .hero-avatar { width: 34px; height: 34px; font-size: 12px; }
      .hero-name { font-size: 14px; }
      .hero-sub-text { font-size: 11px; }
      .hero-icon-btn {
        min-width: 44px; min-height: 44px;
        border-radius: 8px; font-size: 12px;
      }
      .reg-intro-content {
        min-height: calc(100dvh - 90px);
        padding-bottom: calc(40px + var(--gp-shell-bottom-clearance, 0px));
      }
      .reg-intro-title {
        font-size: clamp(1.8rem, 7vw, 2.4rem);
      }
    }
  </style>

<body>
<script src="/js/error-reporter.js?v=20260527a"></script>
  <div class="hero-compact gp-reveal gp-reveal-1">
    <div class="hero-compact-pad">
      <div class="hero-header">
        <div class="hero-left">
          <div class="hero-avatar" id="headerAvatar">GP</div>
          <div>
            <div class="hero-name" id="heroName">Welcome</div>
            <div class="hero-sub-text">Registration pathway</div>
          </div>
        </div>
        <div class="hero-icons">
          <button class="hero-icon-btn" type="button" aria-label="Notifications" data-alert-trigger>
            <span data-inbox-alert hidden class="header-badge" aria-hidden="true">!</span>
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="reg-intro-content">
    <div class="reg-intro-inner">
      <h1 class="reg-intro-title gp-reveal gp-reveal-2">Your Registration Pathway</h1>
      <p class="reg-intro-lead gp-reveal gp-reveal-3">Complete each step to begin practising in Australia</p>
      <div style="margin-top: 32px;" class="gp-reveal gp-reveal-4">
        <button class="start-btn" id="startRegistrationBtn" type="button">Begin Registration &rarr;</button>
      </div>
      <p class="reg-intro-note gp-reveal gp-reveal-5">Already started? Your progress is saved automatically.</p>
    </div>
  </div>

  <script>
    (function () {
      var INTRO_SEEN_KEY = "gp_registration_intro_seen";
      var INTRO_BYPASS_KEY = "gp_registration_intro_bypass_once";
      var TARGET_ROUTE = "/registration/myintealth/account";
      var button = document.getElementById("startRegistrationBtn");

      function navigateToRegistration() {
        if (window.parent && window.parent !== window && typeof window.parent.gpShellNavigate === "function") {
          window.parent.gpShellNavigate(TARGET_ROUTE, { replace: true });
          return;
        }
        if (typeof window.gpShellNavigate === "function") {
          window.gpShellNavigate(TARGET_ROUTE, { replace: true });
          return;
        }
        window.location.assign(TARGET_ROUTE);
      }

      function markSeenAndContinue() {
        if (!button) return;

        try {
          localStorage.setItem(INTRO_SEEN_KEY, new Date().toISOString());
        } catch (err) {}

        try {
          sessionStorage.setItem(INTRO_BYPASS_KEY, "1");
        } catch (err) {}

        try {
          localStorage.setItem(INTRO_BYPASS_KEY, "1");
        } catch (err) {}

        navigateToRegistration();
      }

      if (button) {
        button.addEventListener("click", function () {
          markSeenAndContinue();
        });
      }

      /* Populate avatar initials from session if available */
      try {
        var session = JSON.parse(localStorage.getItem("gp_session") || "{}");
        if (session.first_name) {
          var initials = (session.first_name || "").charAt(0) + (session.last_name || "").charAt(0);
          var avatarEl = document.getElementById("headerAvatar");
          var nameEl = document.getElementById("heroName");
          if (avatarEl && initials) avatarEl.textContent = initials.toUpperCase();
          if (nameEl && session.first_name) nameEl.textContent = session.first_name;
        }
      } catch (e) {}
    })();
  </script>
</body>
