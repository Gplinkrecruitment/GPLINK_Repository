  <style>
    :root {
      --bg: var(--gp-canvas);
      --panel: var(--gp-surface);
      --panel-soft: var(--gp-surface-sunken);
      --panel-muted: var(--gp-surface-sunken);
      --text: var(--gp-ink);
      --muted: var(--gp-muted);
      --ink: var(--gp-ink);
      --charcoal: var(--gp-text);
      --line: var(--gp-border);
      --line-strong: var(--gp-border-strong);
      --blue: var(--gp-blue);
      --blue2: var(--gp-blue-deep);
      --blue3: var(--gp-blue-ink);
      --success: var(--gp-green);
      --success-soft: var(--gp-green-soft);
      --warning: var(--gp-amber);
      --warning-soft: var(--gp-amber-soft);
      --shadow-soft: var(--gp-shadow-sm);
      --shadow-card: var(--gp-shadow-lg);
      --radius-lg: var(--gp-r-lg);
      --radius-md: var(--gp-r-md);
      --radius-sm: var(--gp-r-sm);
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--gp-focus-ring);
    }
    button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--gp-font-body);
      background:
        radial-gradient(720px 360px at 50% -10%, rgba(46, 107, 240, 0.09), transparent 55%),
        linear-gradient(180deg, #eef4fb 0%, #f4f6fb 45%, var(--gp-canvas) 100%);
      color: var(--text);
      padding: 0;
    }

    button, input { font: inherit; }

    /* ── Back bar ── */
    .back-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--gp-glass-bg);
      backdrop-filter: var(--gp-glass-blur);
      -webkit-backdrop-filter: var(--gp-glass-blur);
      border-bottom: 1px solid rgba(227, 233, 244, 0.6);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: var(--gp-r-md);
      background: rgba(15, 23, 42, 0.06);
      color: var(--text);
      font-size: var(--gp-fs-sm);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--gp-dur-fast) var(--gp-ease);
    }
    .back-btn:hover { background: rgba(15, 23, 42, 0.1); }
    .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .back-bar-title {
      font-size: var(--gp-fs-base);
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Shell ── */
    .shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 80px);
    }

    /* ── Loading state ── */
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      color: var(--muted);
      font-size: var(--gp-fs-sm);
      font-weight: 600;
    }

    /* ── Application header ── */
    .app-header-section {
      padding: 28px 16px 18px;
      text-align: center;
    }

    .app-practice-name {
      font-family: var(--gp-font-display);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 5px;
      color: var(--gp-ink);
    }

    .app-location {
      font-size: var(--gp-fs-sm);
      color: var(--muted);
      margin: 0 0 12px;
    }

    /* ── Status pill ── */
    .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--gp-r-pill);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: var(--gp-tracking-label);
      text-transform: uppercase;
      margin-top: 12px;
    }
    .status-pill.review {
      background: var(--gp-surface-sunken);
      color: var(--gp-muted);
      border: 1px solid var(--gp-border);
    }
    .status-pill.interview {
      background: var(--gp-info-soft);
      color: var(--gp-blue-ink);
      border: 1px solid var(--gp-info-border);
    }
    .status-pill.offer {
      background: var(--gp-amber-soft);
      color: var(--gp-amber-ink);
      border: 1px solid var(--gp-amber-border);
    }
    .status-pill.secured {
      background: var(--gp-green-soft);
      color: var(--gp-green-ink);
      border: 1px solid var(--gp-green-border);
    }
    .status-pill.withdrawn {
      background: var(--gp-red-soft);
      color: var(--gp-red-ink);
      border: 1px solid var(--gp-red-border);
    }

    /* ── Status timeline ── */
    .status-timeline {
      padding: 24px 20px;
    }

    .timeline-step { display: flex; gap: 16px; position: relative; padding-bottom: 32px; }
    .timeline-step:last-child { padding-bottom: 0; }

    .timeline-indicator { flex-shrink: 0; width: 24px; display: flex; flex-direction: column; align-items: center; }
    .timeline-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid var(--gp-border-strong);
      background: var(--gp-surface);
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--gp-dur-fast) var(--gp-ease),
                  background var(--gp-dur-fast) var(--gp-ease),
                  box-shadow var(--gp-dur-fast) var(--gp-ease);
    }
    .timeline-line {
      flex: 1;
      width: 3px;
      background: var(--gp-border);
      margin-top: 4px;
      border-radius: 2px;
      transition: background var(--gp-dur-fast) var(--gp-ease);
    }

    .timeline-step.step-completed .timeline-dot {
      background: var(--gp-blue);
      border-color: var(--gp-blue);
    }
    .timeline-step.step-completed .timeline-line {
      background: var(--gp-blue);
    }
    .timeline-step.step-active .timeline-dot {
      border-color: var(--gp-blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }
    .timeline-step.step-active .timeline-dot::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gp-blue);
      animation: activePulse 1.8s ease-in-out infinite;
    }
    .timeline-step.step-pending .timeline-dot {
      border-color: var(--gp-border-strong);
    }

    .timeline-content { flex: 1; padding-top: 2px; }
    .timeline-label { font-weight: 700; font-size: var(--gp-fs-base); color: var(--text); }
    .timeline-date { font-size: var(--gp-fs-sm); color: var(--muted); margin-top: 2px; }
    .timeline-detail { font-size: var(--gp-fs-sm); color: var(--muted); margin-top: 4px; }

    @keyframes activePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ── Interview card ── */
    .interview-card {
      background: var(--gp-surface);
      border-radius: var(--gp-r-lg);
      border: 1.5px solid var(--gp-blue);
      padding: 20px;
      margin: 0 16px 16px;
      box-shadow: var(--gp-shadow-sm);
    }
    .interview-card-title {
      font-family: var(--gp-font-display);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--gp-ink);
    }
    .interview-meta { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .interview-meta-row { display: flex; justify-content: space-between; font-size: var(--gp-fs-sm); }
    .interview-meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: var(--gp-tracking-label);
    }
    .interview-meta-value { font-weight: 600; color: var(--text); }

    .btn-join-interview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--gp-r-md);
      background: var(--gp-grad-brand);
      color: #fff;
      font-weight: 700;
      font-size: var(--gp-fs-base);
      cursor: pointer;
      box-shadow: 0 8px 20px -10px rgba(29, 78, 216, 0.55);
      transition: transform var(--gp-dur-fast) var(--gp-ease),
                  box-shadow var(--gp-dur-fast) var(--gp-ease);
    }
    .btn-join-interview:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -10px rgba(29, 78, 216, 0.65);
    }

    .btn-add-calendar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--gp-border-strong);
      border-radius: var(--gp-r-md);
      background: var(--gp-surface);
      color: var(--text);
      font-weight: 700;
      font-size: var(--gp-fs-sm);
      cursor: pointer;
      margin-top: 10px;
      transition: background var(--gp-dur-fast) var(--gp-ease),
                  border-color var(--gp-dur-fast) var(--gp-ease);
    }
    .btn-add-calendar:hover {
      background: var(--gp-surface-sunken);
      border-color: var(--gp-blue);
    }

    .interview-strategy-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--gp-r-sm);
      background: var(--gp-info-soft);
      border: 1px solid var(--gp-info-border);
      color: var(--gp-blue-ink);
      font-family: inherit;
      font-size: var(--gp-fs-sm);
      font-weight: 700;
      text-decoration: none;
      transition: background var(--gp-dur-fast) var(--gp-ease);
      margin-top: 8px;
    }
    .interview-strategy-btn:hover {
      background: var(--gp-blue-border);
    }

    /* ── Offer card ── */
    .offer-card {
      margin-top: 16px;
      padding: 20px;
      border-radius: var(--gp-r-lg);
      background: var(--gp-amber-soft);
      border: 1px solid var(--gp-amber-border);
      margin-left: 16px;
      margin-right: 16px;
    }
    .offer-card-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--gp-r-sm);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: var(--gp-tracking-label);
      text-transform: uppercase;
      background: rgba(217, 119, 6, 0.12);
      color: var(--gp-amber-ink);
      border: 1px solid var(--gp-amber-border);
      margin-bottom: 8px;
    }
    .offer-card-title {
      font-size: var(--gp-fs-sm);
      font-weight: 700;
      color: var(--gp-ink);
      margin-bottom: 12px;
    }
    .offer-review-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--gp-r-sm);
      background: var(--gp-amber);
      color: #fff;
      font-family: inherit;
      font-size: var(--gp-fs-sm);
      font-weight: 700;
      text-decoration: none;
      transition: background var(--gp-dur-fast) var(--gp-ease);
    }
    .offer-review-btn:hover { background: #b45309; }

    /* ── Detail rows ── */
    .detail-section {
      padding: 0 16px 16px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--gp-border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: var(--gp-tracking-label);
      color: var(--gp-muted);
    }
    .detail-value {
      font-size: var(--gp-fs-sm);
      font-weight: 600;
      color: var(--text);
    }

    /* ── Role preview + actions ── */
    .role-preview {
      padding: 16px;
      text-align: center;
    }
    .role-preview-title {
      font-size: var(--gp-fs-sm);
      font-weight: 600;
      color: var(--muted);
      margin: 0;
    }
    .role-preview-location {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .action-bar { display: flex; flex-direction: column; gap: 0; padding: 16px; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--gp-r-md);
      background: var(--gp-grad-brand);
      color: #fff;
      font-weight: 600;
      font-size: var(--gp-fs-sm);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: 0 8px 20px -10px rgba(29, 78, 216, 0.55);
      transition: transform var(--gp-dur-fast) var(--gp-ease),
                  box-shadow var(--gp-dur-fast) var(--gp-ease);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -10px rgba(29, 78, 216, 0.65);
    }

    .btn-withdraw {
      padding: 10px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: var(--gp-fs-sm);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: 100%;
      margin-top: 4px;
      transition: color var(--gp-dur-fast) var(--gp-ease);
    }
    .btn-withdraw:hover { color: var(--gp-red); }
    .btn-withdraw:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Reveal animations on key sections ── */
    .app-header-section { animation: gpFadeUp var(--gp-dur-slow) var(--gp-ease) both; animation-delay: 0.05s; }
    .status-timeline     { animation: gpFadeUp var(--gp-dur-slow) var(--gp-ease) both; animation-delay: 0.12s; }
    .detail-section      { animation: gpFadeUp var(--gp-dur-slow) var(--gp-ease) both; animation-delay: 0.26s; }
    .action-bar          { animation: gpFadeUp var(--gp-dur-slow) var(--gp-ease) both; animation-delay: 0.33s; }

    @media (prefers-reduced-motion: reduce) {
      .app-header-section, .status-timeline,
      .detail-section, .action-bar {
        animation: none;
      }
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .shell {
        padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 80px);
      }
      .app-header-section {
        padding: 20px 14px 14px;
      }
      .app-practice-name {
        font-size: 20px;
      }
      .status-timeline {
        padding: 20px 16px;
      }
      .timeline-step {
        padding-bottom: 26px;
      }
      .detail-section {
        padding: 0 14px 14px;
      }
      .interview-card {
        margin-left: 14px;
        margin-right: 14px;
      }
      .action-bar {
        padding: 14px;
      }
    }

    /* ── Dark mode ── */
    html.dark-mode {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-soft: #1a2332;
      --panel-muted: #162031;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --ink: #e2e8f0;
      --charcoal: #cbd5e1;
      --line: #334155;
      --line-strong: #475569;
      --blue: #3b82f6;
      --blue2: #2563eb;
      --blue3: #1e40af;
      --success: #22c55e;
      --success-soft: #052e16;
      --warning: #f59e0b;
      --warning-soft: #422006;
      --shadow-soft: 0 4px 16px -8px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 12px 32px -16px rgba(0, 0, 0, 0.5);
    }

    /* gp-token dark overrides (gp-tokens.css ships light values only) */
    html.dark-mode {
      --gp-canvas: #0f172a;
      --gp-surface: #1e293b;
      --gp-surface-sunken: #1a2332;
      --gp-ink: #e2e8f0;
      --gp-text: #cbd5e1;
      --gp-muted: #94a3b8;
      --gp-faint: #64748b;
      --gp-border: #334155;
      --gp-border-strong: #475569;
      --gp-blue: #3b82f6;
      --gp-blue-deep: #2563eb;
      --gp-blue-ink: #93c5fd;
      --gp-blue-soft: rgba(59, 130, 246, 0.12);
      --gp-blue-border: rgba(59, 130, 246, 0.25);
      --gp-green: #22c55e;
      --gp-green-soft: #052e16;
      --gp-green-border: rgba(34, 197, 94, 0.25);
      --gp-green-ink: #4ade80;
      --gp-amber: #f59e0b;
      --gp-amber-soft: #422006;
      --gp-amber-border: rgba(245, 158, 11, 0.25);
      --gp-amber-ink: #fbbf24;
      --gp-red: #f87171;
      --gp-red-soft: #450a0a;
      --gp-red-border: rgba(248, 113, 113, 0.3);
      --gp-red-ink: #fca5a5;
      --gp-glass-bg: rgba(30, 41, 59, 0.88);
      --gp-shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 2px 10px -4px rgba(0,0,0,0.4);
      --gp-shadow-md: 0 10px 30px -18px rgba(0,0,0,0.55);
      --gp-shadow-lg: 0 24px 55px -24px rgba(0,0,0,0.65);
    }

    html.dark-mode body {
      background: var(--bg);
      color: var(--text);
    }

    html.dark-mode .interview-strategy-btn {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }
    html.dark-mode .offer-card {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.12);
    }
    html.dark-mode .offer-card-badge {
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
    }
  </style>
</head>
<body>
<script src="/js/error-reporter.js?v=20260527a"></script>
  <div class="back-bar">
    <a class="back-btn" id="backBtn" href="career#applications">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      Back
    </a>
    <span class="back-bar-title" id="backBarTitle">Application</span>
  </div>

  <div class="shell">
    <!-- Loading state -->
    <div class="loading-state" id="loadingState">
      <p>Loading application details...</p>
    </div>

    <!-- Content (hidden until loaded) -->
    <div id="appContent" hidden>
      <!-- Header -->
      <div class="app-header-section">
        <h2 class="app-practice-name" id="practiceName">Medical Centre</h2>
        <p class="app-location" id="appLocation">Location</p>
        <span class="status-pill" id="statusPill">Status</span>
      </div>

      <!-- Status Timeline -->
      <div class="status-timeline" id="statusTimeline"></div>

      <!-- Interview Card (shown conditionally) -->
      <div class="interview-card" id="interviewCard" hidden>
        <h3 class="interview-card-title">Upcoming Interview</h3>
        <div class="interview-meta" id="interviewMeta"></div>
        <button class="btn-join-interview" id="joinInterviewBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Join Video Call
        </button>
        <button class="btn-add-calendar" id="addCalendarBtn" type="button" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Add to Calendar
        </button>
      </div>

      <!-- Offer Card (shown when status is offer-related) -->
      <div class="offer-card" id="offerCard" style="display:none;">
        <div class="offer-card-header">
          <div class="offer-card-badge">Offer Received</div>
          <div class="offer-card-title">You have an offer from this practice</div>
        </div>
        <a href="#" class="offer-review-link offer-review-btn" id="offerReviewLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><polyline points="20 6 9 17 4 12"/></svg>
          Review Offer
        </a>
      </div>

      <!-- Meta Cards -->
      <div class="detail-section" id="metaGrid"></div>

      <!-- Role Preview -->
      <div class="role-preview" id="rolePreview">
        <p class="role-preview-title" id="roleTitle">General Practitioner</p>
        <p class="role-preview-location" id="roleLocation">Location</p>
      </div>

      <!-- Actions -->
      <div class="action-bar">
        <a class="btn-primary" id="viewRoleBtn" href="career">View Practice</a>
        <button class="btn-withdraw" id="withdrawBtn" type="button" hidden>Withdraw Application</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var appId = params.get("id") || "";
      var roleId = params.get("role") || "";

      var TIMELINE_STEPS = [
        { key: "applied", label: "Applied" },
        { key: "under_review", label: "Under Review" },
        { key: "interview", label: "Interview" },
        { key: "offer", label: "Offer Pending" },
        { key: "secured", label: "Practice Secured" }
      ];

      var STATUS_ORDER = {
        applied: 0, review: 0,
        under_review: 1, submitted: 1,
        interview: 2, interview_scheduled: 2, shortlisted: 2,
        offer: 3, offer_pending: 3, offered: 3,
        hired: 4, secured: 4, placed: 4, placement_secured: 4, offer_accepted: 4, contract_signed: 4
      };

      function normalizeStatusKey(val) {
        return String(val || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
      }

      function getStatusIndex(rawStatus) {
        var key = normalizeStatusKey(rawStatus);
        return STATUS_ORDER[key] !== undefined ? STATUS_ORDER[key] : 0;
      }

      function esc(str) {
        var d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      /** Validate URL is safe to open — only allow https: and zoomus: schemes for interview links */
      function safeUrl(url) {
        if (!url || typeof url !== "string") return "";
        var trimmed = url.trim();
        if (!trimmed) return "";
        try {
          var parsed = new URL(trimmed);
          if (parsed.protocol === "https:" || parsed.protocol === "zoomus:") return trimmed;
          return "";
        } catch (e) { return ""; }
      }

      // Load from sessionStorage cache first, then fetch from API
      var appData = null;
      try {
        var cached = sessionStorage.getItem("gp_application_preview");
        if (cached) appData = JSON.parse(cached);
      } catch (e) { /* ignore */ }

      if (appData) {
        renderApplication(appData);
      }

      // Fetch fresh data from API
      fetch("/api/career/application?id=" + encodeURIComponent(appId || roleId), { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) {
          if (data && data.ok && data.application) {
            appData = data.application;
            renderApplication(appData);
          } else if (!appData) {
            document.getElementById("loadingState").innerHTML = '<p>Application not found.</p>';
          }
        })
        .catch(function () {
          if (!appData) {
            document.getElementById("loadingState").innerHTML = '<p>Could not load application details.</p>';
          }
        });

      function renderApplication(app) {
        document.getElementById("loadingState").hidden = true;
        document.getElementById("appContent").hidden = false;

        // Header
        document.getElementById("practiceName").textContent = app.practiceName || "Medical Centre";
        document.getElementById("appLocation").textContent = app.location || "";
        var pillEl = document.getElementById("statusPill");
        pillEl.textContent = app.status || "Applied";
        pillEl.className = "status-pill " + (app.tone || "review");

        // Back bar title
        document.getElementById("backBarTitle").textContent = app.practiceName || "Application";

        // Timeline
        var statusIdx = getStatusIndex(app.rawStatus || app.status);
        var timelineEl = document.getElementById("statusTimeline");
        timelineEl.innerHTML = TIMELINE_STEPS.map(function (step, i) {
          var stepClass = i < statusIdx ? "step-completed" : i === statusIdx ? "step-active" : "step-pending";
          var meta = (app.meta || []).find(function (m) { return m && m.label && m.label.toLowerCase() === step.label.toLowerCase(); });
          var dateLine = meta ? '<p class="timeline-date">' + esc(meta.value) + '</p>' : '';
          var checkSvg = i < statusIdx
            ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polyline points="20 6 9 17 4 12"/></svg>'
            : '';
          var linePart = i < TIMELINE_STEPS.length - 1 ? '<div class="timeline-line"></div>' : '';
          return '<div class="timeline-step ' + stepClass + '">'
            + '<div class="timeline-indicator"><div class="timeline-dot">' + checkSvg + '</div>' + linePart + '</div>'
            + '<div class="timeline-content"><p class="timeline-label">' + esc(step.label) + '</p>' + dateLine + '</div>'
            + '</div>';
        }).join("");

        // Interview card — use structured interview object from API when available
        var isInterview = normalizeStatusKey(app.rawStatus || app.status).indexOf("interview") !== -1;
        var interviewCard = document.getElementById("interviewCard");
        var interviewObj = app.interview || null;
        if (isInterview || interviewObj) {
          interviewCard.hidden = false;
          var interviewRows = [];

          if (interviewObj && interviewObj.scheduled_at) {
            var d = new Date(interviewObj.scheduled_at);
            if (!isNaN(d.getTime())) {
              interviewRows.push({ label: "Date", value: d.toLocaleDateString("en-AU", { weekday: "long", month: "long", day: "numeric" }) });
              interviewRows.push({ label: "Time", value: d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" }) });
            }
            if (interviewObj.duration_minutes) {
              interviewRows.push({ label: "Duration", value: interviewObj.duration_minutes + " minutes" });
            }
            if (interviewObj.format) {
              var formatLabels = { video: "Video Call", phone: "Phone Call", in_person: "In Person" };
              interviewRows.push({ label: "Format", value: formatLabels[interviewObj.format] || interviewObj.format });
            }
            if (interviewObj.interviewer_name) {
              interviewRows.push({ label: "Interviewer", value: interviewObj.interviewer_name + (interviewObj.interviewer_role ? " (" + interviewObj.interviewer_role + ")" : "") });
            }
          } else {
            // Fallback to meta items
            var metaLabels = ["Interview", "Format", "Lead"];
            (app.meta || []).forEach(function (m) {
              if (metaLabels.indexOf(m.label) !== -1) interviewRows.push(m);
            });
          }

          document.getElementById("interviewMeta").innerHTML = interviewRows.map(function (m) {
            return '<div class="interview-meta-row"><span class="interview-meta-label">' + esc(m.label) + '</span><span class="interview-meta-value">' + esc(m.value) + '</span></div>';
          }).join("");

          // Show/hide join button based on format
          var joinBtn = document.getElementById("joinInterviewBtn");
          if (interviewObj && interviewObj.format && interviewObj.format !== "video") {
            joinBtn.hidden = true;
          }

          // Interview Strategy link
          var strategyLink = document.createElement('a');
          strategyLink.href = 'interview-prep.html?id=' + encodeURIComponent(appId);
          strategyLink.className = 'interview-strategy-btn';
          strategyLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><line x1="9" y1="22" x2="15" y2="22"/></svg> Interview Strategy';
          interviewCard.appendChild(strategyLink);
        }

        // Meta cards (exclude interview-specific labels)
        var metaGrid = document.getElementById("metaGrid");
        var displayMeta = (app.meta || []).filter(function (m) {
          return ["Interview", "Format", "Lead"].indexOf(m.label) === -1;
        });
        metaGrid.innerHTML = displayMeta.map(function (m) {
          return '<div class="detail-row"><span class="detail-label">' + esc(m.label) + '</span><span class="detail-value">' + esc(m.value) + '</span></div>';
        }).join("");

        // Role preview
        document.getElementById("roleTitle").textContent = app.roleTitle || "General Practitioner";
        document.getElementById("roleLocation").textContent = app.location || "";

        // Action links
        if (app.roleId) {
          document.getElementById("viewRoleBtn").href = "career.html";
        }

        // Join interview button — validate URL scheme before opening
        document.getElementById("joinInterviewBtn").addEventListener("click", function () {
          var joinUrl = (interviewObj && interviewObj.zoom_join_url) || app.interviewJoinUrl || "";
          var validUrl = safeUrl(joinUrl);
          if (validUrl) {
            if (window.gpOpenExternal) {
              window.gpOpenExternal(validUrl);
            } else {
              window.open(validUrl, "_blank", "noopener");
            }
          } else {
            alert("Interview link not yet available. GP Link will send you the link before your interview.");
          }
        });

        // Add to Calendar
        var calendarBtn = document.getElementById("addCalendarBtn");
        if (interviewObj && interviewObj.scheduled_at) {
          calendarBtn.hidden = false;
          calendarBtn.addEventListener("click", function () {
            var start = new Date(interviewObj.scheduled_at);
            var durationMin = interviewObj.duration_minutes || 30;
            var end = new Date(start.getTime() + durationMin * 60000);

            function pad(n) { return n < 10 ? "0" + n : String(n); }
            function icsDate(d) {
              return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
            }

            var title = "GP Link Interview" + (app.practiceName ? " \u2014 " + app.practiceName : "");
            var description = "Interview for your GP Link application.";
            if (interviewObj.interviewer_name) description += "\\nInterviewer: " + interviewObj.interviewer_name;
            if (interviewObj.zoom_join_url) description += "\\nZoom Link: " + interviewObj.zoom_join_url;

            var location = interviewObj.zoom_join_url || "Video Call";

            var ics = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//GP Link//Interview//EN",
              "BEGIN:VEVENT",
              "UID:" + (interviewObj.id || Date.now()) + "@mygplink.com.au",
              "DTSTART:" + icsDate(start),
              "DTEND:" + icsDate(end),
              "SUMMARY:" + title,
              "DESCRIPTION:" + description,
              "LOCATION:" + location,
              "STATUS:CONFIRMED",
              "BEGIN:VALARM",
              "TRIGGER:-PT15M",
              "ACTION:DISPLAY",
              "DESCRIPTION:Interview in 15 minutes",
              "END:VALARM",
              "END:VEVENT",
              "END:VCALENDAR"
            ].join("\r\n");

            var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "gp-link-interview.ics";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          });
        }

        // Offer card — show when status is offer-related
        var offerStatuses = ['offer', 'offer_pending', 'offered'];
        if (offerStatuses.indexOf(normalizeStatusKey(app.rawStatus || app.status)) !== -1) {
          var offerCard = document.getElementById('offerCard');
          if (offerCard) {
            offerCard.style.display = 'block';
            var offerLink = document.getElementById('offerReviewLink');
            if (offerLink) {
              offerLink.href = 'offer-review.html?id=' + encodeURIComponent(appId);
            }
          }
        }

        // Withdrawal
        var withdrawBtn = document.getElementById("withdrawBtn");
        var statusKey = normalizeStatusKey(app.rawStatus || app.status);
        var isSecured = ["hired", "secured", "placed", "placement_secured", "offer_accepted", "contract_signed"].indexOf(statusKey) !== -1;
        var isWithdrawn = statusKey === "withdrawn";

        if (!isSecured && !isWithdrawn) {
          withdrawBtn.hidden = false;
          withdrawBtn.addEventListener("click", function () {
            if (!confirm("Are you sure you want to withdraw this application? This cannot be undone.")) return;
            withdrawBtn.disabled = true;
            withdrawBtn.textContent = "Withdrawing...";
            fetch("/api/career/application/withdraw", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ applicationId: app.id || appId })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.ok) {
                withdrawBtn.textContent = "Application Withdrawn";
                var pillEl = document.getElementById("statusPill");
                pillEl.textContent = "Withdrawn";
                pillEl.className = "status-pill withdrawn";
                if (interviewCard) interviewCard.hidden = true;
              } else {
                withdrawBtn.disabled = false;
                withdrawBtn.textContent = "Withdraw Application";
                alert(data.message || "Could not withdraw application.");
              }
            })
            .catch(function () {
              withdrawBtn.disabled = false;
              withdrawBtn.textContent = "Withdraw Application";
              alert("Network error. Please try again.");
            });
          });
        } else if (isWithdrawn) {
          withdrawBtn.hidden = false;
          withdrawBtn.disabled = true;
          withdrawBtn.textContent = "Application Withdrawn";
          withdrawBtn.style.borderColor = "var(--line)";
          withdrawBtn.style.color = "var(--muted)";
        }
      }
    })();
  </script>
</body>
</html>
