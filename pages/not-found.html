<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found - GP Link</title>
  <!--
    Friendly 404 (2026-07-20 audit). Served by server.js sendNotFound() at the
    typo'd URL itself, so every href/src below MUST be absolute. Deliberately
    self-contained: inline CSS only, no JS, no cache-busted assets. Colors
    mirror css/gp-tokens.css (gp-canvas / gp-surface / gp-blue-*).
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background:
        radial-gradient(880px 520px at 10% -10%, rgba(46, 107, 240, 0.1), transparent 56%),
        radial-gradient(760px 460px at 100% 0%, rgba(29, 78, 216, 0.1), transparent 58%),
        #f4f6fb;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e3e9f4;
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 10px -4px rgba(15, 23, 42, 0.08);
      padding: 32px 28px;
      text-align: center;
    }
    .logo img { width: 168px; max-width: 70%; display: block; margin: 0 auto 20px; }
    .code {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #173da6;
      background: #eff4ff;
      border: 1px solid #d6e2fb;
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 14px;
    }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    p.lead { font-size: 14px; color: #64748b; font-weight: 500; line-height: 1.6; margin: 0 0 22px; }
    .actions { display: grid; gap: 10px; }
    .btn {
      display: block;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 16px;
      transition: filter 0.15s ease;
    }
    .btn:hover { filter: brightness(0.96); }
    .btn-primary { background: #1d4ed8; color: #ffffff; }
    .btn-secondary {
      background: #eff4ff;
      color: #173da6;
      border: 1px solid #d6e2fb;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="logo"><img src="/media/images/gp-link-logo.png" alt="GP Link" /></span>
    <span class="code">404</span>
    <h1>This page doesn't exist</h1>
    <p class="lead">The link you followed may be out of date, or the address may have been typed incorrectly.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/pages/index">Go to my dashboard</a>
      <a class="btn btn-secondary" href="/pages/signin">Sign in</a>
    </div>
  </main>
</body>
</html>
